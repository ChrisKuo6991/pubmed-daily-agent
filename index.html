    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42668932", "title": "Ureaplasma parvum meningitis in neonates: A retrospective case study and literature review.", "journal": "Pakistan journal of medical sciences", "impact_factor": "1.7", "tech_types": "metagenomics", "sample_size": "1 例新生兒病例與文獻回顧之 16 例（共計 17 例）", "has_fulltext": false, "abstract": "To investigate the clinical characteristics and advances in diagnosis and treatment of neonatal Ureaplasma parvum (U. parvum) meningitis. Clinical manifestations, diagnosis, treatment, and follow-up data of a neonate with persistent fever, normal blood routine, but persistently abnormal cerebrospinal fluid (CSF) results due to U. parvum meningitis were retrospectively analyzed. A literature review was conducted to identify relevant studies reporting on neonatal U. parvum meningitis published until May 2025. A male infant born at 35+2 weeks of gestation with eight hours of premature rupture of membranes (PROM) was admitted at 17 days of age with persistent fever. The routine blood test was normal, while the CSF suggested purulent meningitis. Empirical treatment was ineffective, and metagenomic next-generation sequencing (mNGS) of CSF confirmed U. parvum meningitis. The infant recovered after three weeks of azithromycin treatment, but a language delay was found at two-year follow-up. The literature review identified 16 previously reported cases of U. parvum meningitis, which were combined with the current case, totaling 17 cases. Main manifestations included fever and convulsions, or initial circulatory and respiratory symptoms. CSF in the included studies showed leukocytosis, decreased glucose, and elevated protein. Diagnosis was mainly based on mNGS, and the predominant treatment consisted of macrolides, sometimes combined with quinolones, for 3-10 weeks. Two patients relapsed after drug withdrawal, and one had elevated liver enzymes. Major neurological complications included lateral ventricular dilatation and hydrocephalus, cerebral hemorrhage, infarction, malacia, and herniation. Most cases had a favorable prognosis, with rare developmental delay. Clinical manifestations of neonatal U. parvum meningitis are nonspecific. Some patients present with normal blood routine but purulent CSF. U. parvum meningitis should be suspected in patients with poor response to empirical antibiotics and confirmed by CSF mNGS. Macrolides are biologically rational and commonly used for neonatal U. parvum meningitis; however, the optimal regimen and duration remain unclear due to limited and heterogeneous case-based evidence.", "zh_summary": "本研究旨在探討新生兒微小脲原體（*Ureaplasma parvum*）腦膜炎的臨床特徵、診斷與治療。研究分析了一例經腦脊髓液宏基因組定序（mNGS）確診的男嬰病例，並結合文獻回顧，共納入17例。結果顯示，該病臨床表現缺乏特異性，主要為發燒與抽搐，部分患兒血常規正常但腦脊髓液呈化膿性改變，常規治療效果不佳，診斷高度依賴mNGS。治療以大環內酯類藥物為主，多數預後良好。本研究的臨床意義在於，強調對於經驗性抗生素治療無效的新生兒腦膜炎，應及早進行腦脊髓液mNGS檢測以明確病因，並指導抗生素的精準使用。", "date": "2026-08-30", "url": "https://pubmed.ncbi.nlm.nih.gov/42668932/"}, {"pmid": "42669365", "title": "In situ fermentation-coupled symbiosis of polyphosphate-accumulating organisms and microalgae for efficient nutrient removal and sludge reduction in low carbon-to-nitrogen ratios wastewater.", "journal": "Bioresource technology", "impact_factor": "9.0", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Microalgae-bacteria consortia (MBC) integrated with polyphosphate-accumulating organisms (PAOs) treat wastewater sustainably, but face excess sludge and light-dark mismatch issues. This study developed in situ fermentation-coupled photo simultaneous nitrification-denitrification phosphorus removal (F/P-SNDPR) systems by incorporating fermentative PAOs into MBC for low carbon-to-nitrogen ratios (C/N) wastewater. The effects of light-dark cycles on nutrient removal, sludge fermentation, and microbial dynamics were investigated. Under an optimal 16 h dark/8h light cycle, the F/P-SNDPR system achieved > 83% nitrogen and > 95% phosphorus removal, with low sludge production (312.21 mgVSS/d) and low net CO2 emissions. Prolonged light and dark phases promoted early microbial apoptosis and subsequent cell lysis, respectively, thereby facilitating fermentation. Combined dark duration and photoinhibition suppress nitrite-oxidizing bacteria, enabling stable partial nitrification. Flow cytometry and metagenomic results identified Candidatus Phosphoribacter as the primary fermentative microorganism. Its fermentation-associated genes, including LivFGHMK and Pta, facilitated volatile fatty acid (VFA) production during the dark phase. The generated VFA supported Candidatus Accumulibacter/Candidatus Competibacter to enhance nutrient removal, driven by key functional genes for polyphosphate metabolism (Ppk and Ppx) and denitrification (NirS, NirK, and NosZ). Overall, The F/P-SNDPR system offers a low-carbon strategy for efficient low C/N wastewater treatment without mechanical aeration or external carbon addition, while reducing sludge production.", "zh_summary": "本研究開發了一種結合原位發酵與光照同步硝化反硝化除磷（F/P-SNDPR）的系統，旨在解決低碳氮比（C/N）廢水處理中剩餘污泥過多與光暗不匹配的問題。在最佳的16小時黑暗/8小時光照循環下，該系統實現了超過83%的氮和95%的磷去除率，並顯著降低污泥產量與二氧化碳排放。總體基因體學分析顯示，*Candidatus* Phosphoribacter 為主要發酵微生物，其發酵相關基因在暗期產生揮發性脂肪酸（VFA），進而支持 *Candidatus* Accumulibacter 等菌群進行高效脫氮除磷。此系統為低碳氮比廢水處理提供了一種無需機械曝氣或外加碳源、且能減少污泥的低碳高效新策略。", "date": "2026-08-30", "url": "https://pubmed.ncbi.nlm.nih.gov/42669365/"}, {"pmid": "42666020", "title": "Decadal Resampling Reveals Widespread Increases in Soil Microbial Diversity Associated With Nitrogen Deposition.", "journal": "Global change biology", "impact_factor": "12.0", "tech_types": "metagenomics", "sample_size": "38 個森林與草原生態系的土壤檢體（分別於 2009 年與 2019 年進行兩次重現採樣）", "has_fulltext": false, "abstract": "Simulated manipulation experiments, such as nitrogen addition to mimic atmospheric nitrogen deposition, are widely used in global change research. However, experimental manipulations may differ from real-world environmental change in their intensity, duration, and co-occurrence, leaving long-term changes in soil microbial communities and soil health insufficiently understood. To address this gap, we resampled soils from 38 forest and grassland ecosystems across eastern China in 2009 and 2019 and assessed microbial taxonomic and functional diversity using shotgun metagenomics. Microbial diversity increased by 17% over the decade, accompanied by clear shifts in community composition. Among the environmental variables considered, nitrogen deposition (~19 kg nitrogen ha-1 year-1 across ecosystems) was the strongest predictor of changes in seven of 12 microbial community metrics. Larger nitrogen deposition was also associated with increased relative abundances of nitrogen-cycling genes and reduced spatial turnover in microbial community composition. These effects were consistent with a potential alleviation of nitrogen limitation and weakening of deterministic community assembly, although these mechanisms could not be directly established. In addition, increases in genes associated with carbon degradation and phosphorus cycling, together with declines in the relative abundances of pathogens, antibiotic resistance genes, and DNA viruses, coincided with the raise of the composite soil health index. Our findings demonstrate widespread decadal increases in soil microbial diversity and soil health across eastern China, with nitrogen deposition emerging as their strongest environmental factor. These results highlight that microbial responses to long-term ambient environmental change can differ markedly from responses inferred from short-term or high-intensity manipulation experiments.", "zh_summary": "本研究旨在探討真實世界中長期環境變化（如大氣氮沉降）對土壤微生物群落及土壤健康的影響。研究團隊於 2009 年與 2019 年，對中國東部 38 個森林和草原生態系的土壤進行重新採樣，並透過總體基因體學（shotgun metagenomics）分析其分類與功能多樣性。\n\n結果顯示，十年間土壤微生物多樣性顯著提升了 17%。在眾多環境因子中，氮沉降是預測群落變化的最強因子，其不僅促進了氮、碳、磷循環相關基因的豐度，更伴隨病原體、抗藥性基因及 DNA 病毒的減少，從而提升了綜合土壤健康指數。此研究證實了真實世界長期、低強度的環境變遷對生態系統的正面影響，並強調其微生物反應與短期高強度的人工模擬實驗結果存在顯著差異，對全球變遷研究具有重要科學價值。", "date": "2026-08-29", "url": "https://pubmed.ncbi.nlm.nih.gov/42666020/"}, {"pmid": "42667585", "title": "Gut Microbiota from Patients with Long COVID Persisting for 2 Years Result in Alterations in Mice that Resemble Post-COVID Symptoms.", "journal": "Probiotics and antimicrobial proteins", "impact_factor": "4.4", "tech_types": "16S, metagenomics, metabolomics", "sample_size": "11位健康對照組受試者與11位長期新冠（LCOVID）患者（共22個糞便檢體），以及接受糞菌移植的抗生素處理（ABx）小鼠（具體小鼠數量未提及）。", "has_fulltext": false, "abstract": "Human gut microbiota (GM) has been identified as a potentially important factor influencing the development of long COVID (LCOVID). The aim of this study was to understand the GM of LCOVID, which lasted for two years, in order to improve public awareness. Human gut microbiota and its metabolites were assessed in a healthy control group (n = 11) (HC) unexposed to SARS-CoV-2 and an LCOVID group (n = 11) in Hainan, China, using Shotgun metagenomics and liquid chromatography-mass spectrometry (LC-MS) of feces. The causal role of the microbiota in LCOVID was further validated by transplanting feces from the subjects into ABx mice using Histopathology and 16 S rRNA sequencing. Fecal microbial diversity was lower in patients with LCOVID compared with that in HC. Pro-inflammatory bacteria such as Streptococcus_salivarius and Streptococcus_parasanguinis increased, whereas anti-inflammatory bacteria such as Faecalibacterium_SGB15346 and Alistipes_onderdonkii decreased. Fecal metabolites from LCOVID were impaired in carbohydrate degradation, indole production, SCFA production, and fatty acid degradation. Transplantation of feces from patients with LCOVID into mice results in lung inflammation, intestinal inflammation, and anxiety. In addition, transplanted mice showed worse outcomes during Klebsiella_pneumoniae infections. Transplanted mice and the key bacteria Streptococcus_salivarius had the same worse outcomes in the D-IBS model by limb binding. GM from patients with LCOVID was altered significantly and sufficiently to promote LCOVID symptoms in mice, suggesting that it may be a potential therapeutic target.", "zh_summary": "本研究旨在探討持續兩年之新冠後遺症（LCOVID）患者的腸道菌群特徵及其致病機制。研究結合宏基因組與代謝組學分析，發現LCOVID患者的腸道菌相多樣性降低，促炎菌（如唾液鏈球菌）增加，而抗炎菌減少，且碳水化合物與短鏈脂肪酸等代謝路徑受損。將患者糞便移植至小鼠後，成功誘發肺部與腸道發炎、焦慮行為，並加劇肺炎克雷伯菌感染與腸躁症症狀。此結果證實腸道菌群失衡是驅動LCOVID症狀的關鍵因子，具備作為潛在治療靶點的臨床科學價值。", "date": "2026-08-29", "url": "https://pubmed.ncbi.nlm.nih.gov/42667585/"}, {"pmid": "42667435", "title": "From traditional retting to precision bioprocessing: microbial ecology, enzymatic selectivity, and systems biology of jute retting.", "journal": "Antonie van Leeuwenhoek", "impact_factor": "N/A", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Jute is one of the world's most important lignocellulosic fibre crops, yet its commercial value remains highly dependent on retting, a biologically mediated fibre extraction process still largely governed by empirical practices and variable environmental conditions. Recent advances in microbial ecology, enzymology, molecular biology, and bioprocess engineering have transformed retting from a traditional post-harvest operation into a controllable lignocellulosic bioconversion process. This review synthesizes current understanding of the structural organization of jute bast fibres, selective degradation of plant cell-wall polymers, microbial succession, extracellular enzyme networks, and physicochemical factors regulating fibre liberation. It highlights the coordinated interactions among cell-wall architecture, microbial communities, enzyme specificity, and environmental conditions that collectively determine retting efficiency and fibre quality. Emerging precision retting strategies, including defined microbial consortia, enzyme-assisted retting, ribbon retting, controlled processing systems, and water-efficient technologies, are critically evaluated for their potential to improve process reproducibility, fibre quality, and environmental sustainability. The review also examines metagenomics, metatranscriptomics, metaproteomics, metabolomics, systems biology, and artificial intelligence as enabling technologies for microbiome-guided process monitoring, predictive modelling, and digital decision support. Furthermore, this review discusses the integration of precision retting within circular bioeconomy frameworks through resource recovery, pollution mitigation, climate-resilient processing, and lignocellulosic biorefineries. Key knowledge gaps, including limited understanding of microbial interactions, lack of standardized microbial consortia, insufficient process-monitoring tools, fragmented multi-omics datasets, and challenges in industrial scale-up, are identified. Overall, this review presents a systems-level framework for advancing jute retting toward standardized, predictive, and environmentally sustainable precision bioprocessing.", "zh_summary": "本綜述探討黃麻漚麻（retting）技術從傳統經驗法轉向精準生物加工的最新進展。文章系統性整合了黃麻韌皮纖維結構、微生物群落演替、胞外酶網絡及物理化學調控因子的研究，並評估了特定微生物菌群、酶輔助漚麻及控溫系統等精準策略。同時，探討了多體學技術（如總體基因體學、代謝組學等）與人工智慧在過程監測與預測模型中的應用潛力。最後，文章指出了微生物相互作用不明、缺乏標準化菌群及產業化放大等關鍵知識空白，為實現標準化、可預測且環保的精準黃麻生物加工提供了系統性框架，對促進循環生物經濟具有重要科學意義。", "date": "2026-08-29", "url": "https://pubmed.ncbi.nlm.nih.gov/42667435/"}, {"pmid": "42664954", "title": "Lactobacillus salivarius potentiates gastrointestinal cancer immunotherapy through its metabolite chenodeoxycholic acid.", "journal": "Cell reports. Medicine", "impact_factor": NaN, "tech_types": "metagenomics, metabolomics", "sample_size": "278 位胃腸道癌症患者及同基因腫瘤小鼠模型", "has_fulltext": false, "abstract": "Immune checkpoint inhibitor therapy has improved gastrointestinal (GI) cancer management; however, many patients exhibit resistance. Although gut microbiota influences immunotherapeutic responses, the underlying mechanisms remain unclear. Metagenomic analysis of 278 GI cancer patients reveals that Lactobacillus salivarius (L. salivarius) is enriched in responders and enhances anti-PD-1 efficacy in syngeneic tumor models by increasing the infiltration of antitumor M1-like macrophages and CD8+ T cells and enhancing CD8+ T cell effector function. L. salivarius-associated chenodeoxycholic acid (CDCA) is identified as a functional metabolite. CDCA recapitulates the antitumor effects of L. salivarius and significantly improves anti-PD-1 efficacy in vivo, an effect attenuated by depleting macrophages or CD8+ T cells. Mechanistically, CDCA-induced reactive oxygen species triggers immunogenic cell death in tumor cells and polarizes macrophages toward antitumor M1 phenotype, activating CD8+ T cell antitumor immunity. These findings identify L. salivarius and its associated metabolite CDCA as a promising adjuvant for potentiating immunotherapy in GI cancers.", "zh_summary": "本研究旨在探討腸道菌群影響胃腸道（GI）癌症免疫治療反應的具體機制。透過對 278 位 GI 癌症患者的總體基因體分析，發現唾液乳桿菌（*Lactobacillus salivarius*）在治療有反應的患者體內顯著富集。於小鼠模型中，該菌能增加抗腫瘤 M1 型巨噬細胞與 CD8+ T 細胞的浸潤，顯著提升抗 PD-1 療效。研究進一步證實，該菌的代謝物鵝去氧膽酸（CDCA）為關鍵功能分子，能透過誘導活性氧（ROS）引發腫瘤細胞的免疫原性死亡，並促進巨噬細胞向 M1 型極化，從而激活 CD8+ T 細胞的抗腫瘤免疫反應。本研究揭示了唾液乳桿菌及其代謝物 CDCA 作為增強 GI 癌症免疫治療活性佐劑的臨床潛力。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42664954/"}, {"pmid": "42664608", "title": "Application-dependent effects of tea waste biochar on PFAS mobility and N2O and CH4 emissions in agricultural soil.", "journal": "Waste management (New York, N.Y.)", "impact_factor": NaN, "tech_types": "metagenomics", "sample_size": "未提及（僅說明使用盆栽模擬系統「per pot」，未提及具體樣本或盆栽數量）", "has_fulltext": false, "abstract": "Per- and polyfluoroalkyl substances (PFAS) in agricultural soils can migrate into crops and may alter soil greenhouse gas emissions, yet remediation strategies rarely address these risks simultaneously. This study evaluated tea waste biochar (TWB) produced at 400, 500, and 600 °C and applied at 5-20 g per pot by whole-soil mixing or surface-layer placement in a simulated PFAS-contaminated soil-leachate-plant system. Perfluorooctane sulfonate (PFOS) and perfluorooctanoic acid (PFOA) distributions, nitrous oxide (N2O) and methane (CH4) fluxes, and microbial responses were examined. TWB produced at 500 °C showed the most favorable combination of pore accessibility, surface hydrophobicity, and interfacial charge, with material-associated PFOS and PFOA enrichments of 0.12 and 0.57 μg/g, respectively. Whole-soil mixing with TWB-500 lowered soil and leachate PFAS levels and reduced PFAS concentrations in plant shoots by approximately 36% relative to the contaminated control. TWB treatments also reduced cumulative N2O emissions and enhanced net CH4 uptake. Metagenomic analysis showed lower relative abundances of genes associated with nitrogen fixation, ammonia oxidation, and several N2O-producing pathways, whereas CH4-cycling genes responded differently to the two application methods. Organic fluorine transformation genes were not enriched, indicating that PFAS control mainly resulted from physicochemical retention rather than enhanced microbial defluorination. Overall, TWB-500 can integrate PFAS stabilization with greenhouse gas management, but the optimal placement depends on the remediation objective: whole-soil mixing favors PFAS immobilization, whereas surface-layer application provides greater greenhouse gas mitigation.", "zh_summary": "本研究旨在評估茶渣生物炭（TWB）在模擬的PFAS污染土壤-滲濾液-植物系統中，對於抑制全氟和多氟烷基物質（PFAS）遷移及減少溫室氣體（N2O和CH4）排放的雙重效應。研究發現，在500 °C下製備的TWB-500效果最佳。若將其均勻混合於全土中，可使植物地上部的PFAS濃度降低約36%，並顯著降低土壤和滲濾液中的PFAS含量。此外，TWB處理還減少了N2O累積排放並促進CH4淨吸收。總體基因體學分析顯示，與氮循環相關的基因豐度有所下降，解釋了N2O排放減少的機制；而有機氟降解基因並未富集，證實PFAS的控制主要源於物理化學阻控而非微生物去氟作用。此研究證明TWB-500能有效整合PFAS固化與溫室氣體管理，且施用方式（全土混合或表層施作）可依環境整治優先目標進行客製化調整。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42664608/"}, {"pmid": "42663459", "title": "Clinical application of BALF-mNGS in immunocompromised and immunocompetent patients with suspected invasive pulmonary aspergillosis: differentiating infection from colonization, microbiome features, and clinical impact.", "journal": "Microbiology spectrum", "impact_factor": 3.8, "tech_types": "metagenomics", "sample_size": "178位疑似侵襲性肺麴菌病（IPA）患者（包含77位免疫功能低下患者與101位免疫功能正常患者）", "has_fulltext": false, "abstract": "Invasive pulmonary aspergillosis (IPA) not only causes high morbidity and mortality, especially in immunocompromised patients, but also occurs in immunocompetent individuals. Differentiating infection from colonization is challenging, and bronchoalveolar lavage fluid metagenomic next-generation sequencing (BALF-mNGS) may aid diagnosis, microbiome profiling, and clinical assessment. We retrospectively analyzed patients with suspected IPA who underwent BALF-mNGS between December 2021 and March 2025. Patients were classified by immune status. IPA diagnosis was based on EORTC/MSGERC 2020 criteria in immunocompromised patients, while immunocompetent cases were adjudicated using an integrated clinical, radiological, and microbiological assessment. A total of 178 patients were finally included and classified according to immune status into an immunocompromised group (n = 77) and an immunocompetent group (n = 101). Aspergillus_ reads per ten million (RPTM) values were significantly higher in infection versus colonization cases in both groups, with optimal cut-offs of 24 (gray zone: 22-60) for the immunocompromised group and 33 (gray zone: 17-48) for the immunocompetent group. Microbiome analysis revealed distinct community structures between infection and colonization groups, with Aspergillus remaining significantly enriched after false discovery rate (FDR) correction in immunocompromised patients, while no taxa remained significant after FDR correction in immunocompetent patients. BALF-mNGS guided antifungal therapy, avoiding unnecessary treatment in colonized patients, and higher Aspergillus_RPTM was associated with increased 90-day mortality in immunocompromised patients. BALF-mNGS may accurately distinguish Aspergillus infection from colonization and reveal microbial shifts, particularly in immunocompromised patients. It can guide targeted antifungal therapy, avoid unnecessary treatment, and higher Aspergillus_RPTM was associated with 90-day mortality in immunocompromised patients, suggesting its potential value for risk stratification.IMPORTANCEBALF-mNGS with quantitative thresholds improves differentiation between Aspergillus infection and colonization. It reveals distinct lung microbiome patterns under different immune statuses, extending beyond simple pathogen detection. Higher Aspergillus burden is associated with worse outcomes in immunocompromised patients, suggesting its potential value for risk stratification.", "zh_summary": "本研究旨在評估支氣管肺泡灌洗液總體基因體次世代定序（BALF-mNGS）在區分疑似侵襲性肺麴菌病（IPA）患者「感染」與「定植」的臨床價值，並探討其肺部微生態特徵。研究納入178位患者，發現感染者的麴菌相對豐度（RPTM）顯著高於定植者，並針對免疫功能低下與正常組分別訂定出24與33的最佳臨界值。微生態分析顯示兩組具有不同的菌群結構。臨床上，BALF-mNGS能有效引導抗真菌治療，避免定植患者過度治療；而在免疫功能低下組中，高麴菌RPTM值與90天高死亡率顯著相關。此技術不僅能精準診斷，更具備患者預後風險分層的潛力。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42663459/"}, {"pmid": "42663694", "title": "Comparative Analysis of Different Anodic Inoculum in Microbial Fuel Cell for Efficient Methylene Blue Dye Degradation.", "journal": "Current microbiology", "impact_factor": 2.6, "tech_types": "metagenomics", "sample_size": "3種不同的接種源（海洋沉積物、河口沉積物、厭氧污泥）", "has_fulltext": false, "abstract": "This study investigates three different inoculum sources in dual-chamber microbial fuel cells (MFCs), such as Marine Sediment (MFC-MS), Estuary Sediment (MFC-ES), and Anaerobic Sludge (MFC-AS), to compare the efficacy for Methylene Blue (MB) dye degradation and electricity generation. All the MFCs were operated under identical conditions in batch mode using synthetic wastewater containing 3000 mg/L COD made using sodium acetate. The electrochemical study reveals that MFC inoculated with marine sediment achieved maximum power density of 35 mW/m² followed by anaerobic sludge (31 mW/m²) and estuary sediment (25 mW/m²). Statistical analysis was employed to evaluate performance differences among the systems and to support result interpretation. Maximum COD removal efficiency of 75% was obtained by MFC-AS, and coulombic efficiency (CE) was higher for MFC-MS with 25%. Maximum decolorization efficiency was noted in MFC with anaerobic sludge, which obtained 96% decolorization over 96 h. Comparative and trend-based statistical evaluation confirmed the superior treatment performance of MFC-assisted systems. The phytotoxicity study revealed that the toxicity effect of dye wastewater was reduced to its maximum after treatment in the MFC system. The dominant performance of MFC-MS is due to the efficiency of the major electrogenic bacteria concentrated in the inoculum. The functional annotation using the data obtained from metagenomics reveals the presence and role of various enzymes and pathways involved.", "zh_summary": "本研究旨在比較雙腔式微生物燃料電池（MFC）中，三種不同接種源（海洋沉積物、河口沉積物、厭氧污泥）在降解亞甲藍染料與產電的效率。結果顯示，海洋沉積物系統具最高的功率密度（35 mW/m²）與庫倫效率（25%）；厭氧污泥系統則有最佳的化學需氧量去除率（75%）與脫色率（96%）。處理後廢水的植物毒性顯著降低。宏基因組學分析揭示了關鍵產電菌的分布及參與降解與發電的酶和代謝途徑。本研究證實了不同接種源在 MFC 污水處理與生物發電的潛力，並闡明了其微生物學機制。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42663694/"}, {"pmid": "42664252", "title": "Proteobacteria with chemosynthetic potential are highly prevalent in the gills of Hypoplectrus reef fishes.", "journal": "PLoS genetics", "impact_factor": 3.7, "tech_types": "metagenomics", "sample_size": "353 個魚鰓檢體", "has_fulltext": false, "abstract": "Fishes host a diverse microbiome in their gills, but a broad characterization of this microbiome at the metagenomic level is lacking. Here, we apply genome-resolved metagenomics to the gills of the hamlets (Hypoplectrus spp), a group of reef fishes from the Greater Caribbean. The analysis of 353 gill samples from 15 hamlet species collected at eight locations over 13 years revealed a stark contrast between the gill microbiota and reef water microbial communities, indicating a distinct and specific gill microbiome. A total of 70 gill-associated metagenome-assembled genomes (MAGs) were recovered. These MAGs belong to 17 lineages, most of which are novel. They relate to known fish gill pathogens, fish gut microbes, free-living and biofilm-associated taxa, indicating that the gill microbiome was assembled from a collection of distinct eco-evolutionary trajectories. The MAGs harbor diverse metabolic modules, involved notably in nitrogen cycling, antibiotic production and biofilm formation, revealing a highly dynamic microbial ecosystem. One lineage in the Burkholderiaceae family was outstandingly prevalent across fish host species, sampling locations and years. Its genome encoded complete metabolic modules for carbon fixation and sulfur oxidation, indicating chemosynthetic potential. To the best of our knowledge, this is the first line of evidence that fishes may host sulfur-oxidizing chemosynthetic bacteria in their gills. The functional significance of this chemosynthetic potential for the fish host or other members of the gill microbiome remains to be established. The high prevalence of this lineage allowed to build a pangenome. It revealed large-scale geographic structure (western Caribbean, eastern Caribbean and Gulf of Mexico), which parallels the phylogenomic pattern observed in the hamlets. Overall, our findings point to complex fish host-microbe and microbe-microbe eco-evolutionary interactions in the gills that may influence fish physiology, homeostasis and immune response.", "zh_summary": "本研究針對加勒比海地區 15 種「蝴蝶魚」（Hypoplectrus spp.）進行了大規模的宏基因組研究。透過分析 353 個魚鰓檢體並重建 70 個宏基因組組裝基因組（MAGs），研究發現魚鰓微生物群落與周圍海水環境顯著不同，具有獨特的演化軌跡。最重大的發現是鑑定出一種具高度普遍性的 Burkholderiaceae 細菌，該菌株擁有完整的固碳與硫氧化代謝路徑，顯示其具備化能合成潛力，這是科學界首次在魚類鰓部發現此類共生菌。此外，該菌株的基因體結構與宿主魚類的地理分布呈現高度一致性。此研究揭示了魚鰓微生物生態系統的複雜性，並為魚類生理、恆定性及免疫反應與微生物間的交互作用提供了重要的演化科學基礎。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42664252/"}, {"pmid": "42665998", "title": "Agathobacter rectalis suppresses colorectal tumorigenesis via an epigallocatechin-SREBF2 axis controlling cholesterol metabolism.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "metagenomics, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Beneficial effects of the gut commensal Agathobacter rectalis (Ar) are reported in diseases, yet its role in colorectal cancer (CRC) remains unclear. Here, metagenomic analysis revealed consistent fecal Ar depletion across CRC cohorts. In Apc min/+ mice, Ar inhibited colon tumorigenesis, reducing tumor number and volume versus E. coli and PBS controls. LC-MS/MS metabolomics showed decreased fecal cholesterol and altered lipid/cholesterol pathways after Ar treatment. In vitro, Ar-conditioned medium suppressed CRC cell growth, clonogenicity, migration, and cell cycle progression. LC-MS/MS identified (-)-epigallocatechin (EGC) as an Ar-derived metabolite absent in control bacteria. EGC recapitulated Ar-mediated anti-CRC effects in vitro and in vivo, with metabolic changes linked to lipid/cholesterol pathways. Transcriptomics showed that EGC suppressed SREBP signaling, cholesterol metabolism, and MAPK pathways. Mechanistically, EGC reduced nuclear SREBF2 and its transcriptional activity, downregulated cholesterol synthesis/metabolism genes, including FDPS and PCSK9, and suppressed MAPK signaling. Molecular docking suggested that EGC may bind pSREBF2 or SCAP. Cellular thermal shift assay revealed that EGC interacts with and stabilizes pSREBF2, but not SCAP. Co-immunoprecipitation demonstrated that EGC reduces pSREBF2-SCAP interaction, thereby inhibiting SCAP-mediated SREBF2 cleavage activation. Together, these findings define an Ar-EGC microbe-metabolite axis and support Ar/EGC-based interventions targeting cholesterol metabolism in CRC.", "zh_summary": "本研究探討腸道共生菌 *Agathobacter rectalis* (Ar) 在大腸直腸癌 (CRC) 中的作用機制。宏基因組分析顯示 CRC 患者體內 Ar 顯著減少；小鼠實驗證實 Ar 能抑制腫瘤生長。代謝組學分析發現 Ar 能產生特定代謝物表沒食子兒茶素 (EGC)。體內外實驗顯示，EGC 可抑制 CRC 細胞生長與膽固醇代謝。機制上，EGC 透過與 pSREBF2 結合並穩定之，阻斷其與 SCAP 的交互作用，進而抑制 SREBF2 活化及下游膽固醇合成基因（如 FDPS、PCSK9）的表達，並抑制 MAPK 訊號。此研究確立了 Ar-EGC 微生物-代謝物軸，為靶向膽固醇代謝的 CRC 防治提供了新策略。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42665998/"}, {"pmid": "42665077", "title": "Metagenomic Characterization of Potential Exposure to Genetic Hazards at the Interface Between Grazing Livestock and Przewalski's Gazelle.", "journal": "Environmental pollution (Barking, Essex : 1987)", "impact_factor": NaN, "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Livestock and endangered wildlife increasingly share grazing landscapes, yet the sources, mobility-associated contexts, and bacterial hosts of livestock-associated genetic hazards in wildlife microbiomes remain poorly resolved. We analyzed metagenomes from yak, Tibetan sheep, Przewalski's gazelle, and local topsoil within an Acquired Genetic Risk (AGR) conceptual framework integrating genetic hazard burden, compositional source attribution, mobility-associated evidence, and bacterial genomic context. MRGs and Rank I and Rank III ARGs were more abundant in livestock than in Przewalski's gazelle, whereas VF abundance was highest in yak. FEAST attributed approximately 64% of the Przewalski's gazelle resistome composition to the two livestock source profiles, less than 1% to sampled topsoil, and approximately 36% remained unassigned. MGE profiles were associated with ARGs, MRGs, and VFs, while tnpA ranked highest in random forest models and was associated with total ARG abundance (R2 = 0.618). Short-read contigs containing hazard genes and MGE markers provided localized mobility-associated sequence context. Genome-resolved analysis identified distinct bacterial contexts: TS.Bin143, an Escherichia coli MAG from Tibetan sheep, contained ARGs, MRGs, VFs, tnpA, and IS91, whereas PG.Bin275, a Hylemonella sp. MAG from Przewalski's gazelle, contained tnpA. These findings extend wildlife resistome assessment beyond abundance profiling toward source attribution, mobility-associated sequence context, and bacterial host resolution, supporting multilevel surveillance of genetic hazard exposure at livestock-wildlife interfaces.", "zh_summary": "本研究旨在評估放牧家畜與瀕危野生普氏原羚接觸介面上的遺傳危害（如抗藥性基因 ARG、金屬耐受基因 MRG 與毒力因子 VF）暴露風險。研究利用總體基因體學分析氛牛、藏羊、普氏原羚及當地表土，結果顯示家畜體內的 MRG 和高風險 ARG 豐度顯著高於普氏原羚。來源追蹤分析（FEAST）指出，普氏原羚約 64% 的抗藥組組成可歸因於這兩種家畜，僅不到 1% 來自土壤。此外，研究透過基因組解析定位了攜帶危害基因與移動遺傳因子的細菌宿主。本研究不僅闡明了遺傳危害的來源與傳播關聯，也為野生動物與家畜接觸介面的多層級生物安全監測提供了重要科學依據。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42665077/"}, {"pmid": "42663468", "title": "Genomes of cressdnaviricots and phixviricots in a freshwater lake sample from Arizona, USA.", "journal": "Microbiology resource announcements", "impact_factor": 0.6, "tech_types": "metagenomics, small genome", "sample_size": "1 個 40 ml 的淡水湖泊水樣", "has_fulltext": false, "abstract": "A viral metagenomic analysis of a 40 ml water sample from a small freshwater lake near Flagstaff, Arizona, USA, resulted in the identification of 295 circular viral genome sequences. Of these, 126 are members of Cressdnaviricota and 169 of Phixviricota phyla.", "zh_summary": "本研究旨在探討美國亞利桑那州 Flagstaff 附近一處小型淡水湖泊中的病毒多樣性。研究團隊對 40 毫升的水樣進行病毒總體基因體學（viral metagenomics）分析，成功鑑定並組裝出 295 個環狀病毒基因體序列。在這些病毒中，有 126 個屬於 Cressdnaviricota 門（環狀單鏈 DNA 病毒），另有 169 個屬於 Phixviricota 門（微小噬菌體相關病毒）。此研究的科學意義在於顯著擴充了淡水生態系統中這兩大病毒門的基因體數據，並證實即使在極少量的環境水樣中，也蘊藏著極高多樣性且未知的病毒資源，有助於深化對淡水微生態系統及病毒演化多樣性的理解。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42663468/"}, {"pmid": "42665338", "title": "PREVENT 1, a nationwide Swedish infant cohort for longitudinal gut microbiome profiling and early-life health outcomes: cohort profile.", "journal": "BMJ open", "impact_factor": 2.3, "tech_types": "metagenomics", "sample_size": "253 位嬰兒（收集 253 份基線糞便檢體，其中 250 位提供至少 2 次檢體，241 位提供全部 3 次檢體）", "has_fulltext": false, "abstract": "PREVENT 1 is a nationwide, prospective Swedish infant cohort established to characterise gut microbiome development during the first 2 years of life and to relate microbial trajectories to feeding, infections, growth and everyday well-being. The study integrates repeated infant stool sampling with shotgun metagenomics analysis with aligned parental questionnaires, stool photographs and infant cry recordings collected at three approximately 3-month intervals for each infant. Families were recruited nationwide in Sweden from September 2023 through targeted digital channels. Eligible participants were term-born infants residing in Sweden and aged <1 year at enrolment. Baseline questionnaire data and stool samples were collected from 253 infants. Parents completed questionnaires covering socio-demographic characteristics and health, pregnancy and delivery, postnatal factors, infant environment, feeding and growth, infections and other health outcomes, gastrointestinal symptoms and everyday well-being. Retention was high, with 248 families completing at least one follow-up questionnaire at Phase 2 and 243 at Phase 3. For stool samples, 250 infants provided at least two samples and 241 provided all three. At enrolment, 42.3% of infants were older than 7 months, 73.9% had weight-for-length z-scores in the normal range and exclusive breastfeeding at 4 months was reported for 58.9%. Three-phase sample and questionnaire data collection was completed in December 2024. Future analyses will examine microbiome features, resistome profiles and functional pathways in relation to antibiotic exposure, feeding, growth and infant health outcomes. Subject to ethical approval and participant consent, follow-up may include further stool collection and Swedish register linkage. NCT06285630.", "zh_summary": "本研究建立瑞典全國性嬰兒追蹤世代「PREVENT 1」，旨在透過縱向總體基因體學分析，描繪嬰兒出生後前兩年的腸道菌相發育軌跡，並探討其與餵養、生長及感染等健康指標的關聯。研究成功招募253名足月嬰兒，並在三個時間點重複收集糞便檢體與問卷，受試者維持率極高（241名嬰兒提供全部三次檢體）。此世代研究提供高質量的臨床與多體學數據，未來將深入分析抗生素暴露與飲食如何形塑嬰兒腸道菌群、抗藥性基因組及代謝途徑，對理解早期生命健康極具臨床與科學價值。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42665338/"}, {"pmid": "42666033", "title": "Gut Microbiota-Isoallolithocholic Acid Crosstalk Promotes Calcium Oxalate Kidney Stone Formation via PARP1-Mediated Parthanatos.", "journal": "Advanced science (Weinheim, Baden-Wurttemberg, Germany)", "impact_factor": "N/A", "tech_types": "16S, metagenomics, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Bile acids have been implicated in calcium oxalate (CaOx) nephrolithiasis. Here, we employ multi-omics approaches to identify isoallolithocholic acid (isoalloLCA) as the key bile acid elevated in the feces, serum, kidney, and urine of CaOx rats, confirmed by spatial metabolomics. 16S sequencing and metagenomic analyses indicate that elevated isoalloLCA levels in CaOx rats or individuals are likely of microbial origin. Mechanistically, isoalloLCA binds to PARP1 via specific molecular interactions validated by surface plasmon resonance and cellular thermal shift assays. Knockdown of PARP1 by adeno-associated virus microinjection or pharmacological inhibition with PARP1 inhibitor AZD5305 significantly attenuates isoalloLCA-mediated crystal deposition, renal tubular injury, and mitochondrial functional impairment in both the CaOx rat and mouse models. Furthermore, the antibiotic-mediated depletion of the gut microbiota in mice markedly reduced isoalloLCA levels, whereas fecal microbiota transplantationut contributes to isoalloLCA-mediated CaOx stone formation, demonstrating a causal link between gut microbiota and isoalloLCA. In vitro, isoalloLCA promoted oxalate-induced renal tubular epithelial cell injury and parthanatos via targeting PARP1, including DNA damage, excessive PARP1 activation, PAR accumulation, mitochondrial damage, nuclear translocation of AIF and MIF. These findings establish the microbiota-isoalloLCA-PARP1-parthanatos axis in CaOx nephrolithiasis and identify PARP1 as a promising therapeutic target for kidney stone management.", "zh_summary": "本研究旨在探討腸道菌群及其代謝物異別石膽酸（isoalloLCA）在草酸鈣（CaOx）腎結石形成中的作用與分子機制。透過整合16S定序、宏基因組學與空間代謝組學，研究發現 CaOx 大鼠及患者體內的腸道菌源 isoalloLCA 顯著升高。機制上，isoalloLCA 能直接結合並激活 PARP1 蛋白，誘導腎小管上皮細胞發生 PARP1 介導的細胞凋亡樣壞死（parthanatos），導致 DNA 與線粒體受損。於動物模型中，敲低或抑制 PARP1，或利用抗生素清除腸道菌群，皆能顯著減輕結晶沉積與腎損傷。本研究揭示了「腸道菌群-isoalloLCA-PARP1-parthanatos」軸在腎結石病理中的關鍵角色，並指出 PARP1 為臨床治療腎結石的具潛力靶點。", "date": "2026-08-28", "url": "https://pubmed.ncbi.nlm.nih.gov/42666033/"}, {"pmid": "42657522", "title": "Resistant starch alleviates intestinal fibrosis involving an acetate-mediated HDAC2-H3K27ac axis in fibroblasts.", "journal": "Food & function", "impact_factor": 5.4, "tech_types": "metagenomics, metabolomics", "sample_size": "未提及（研究使用 DSS 誘導的小鼠模型以及人類與小鼠的原代纖維母細胞，但未具體說明樣本數）", "has_fulltext": false, "abstract": "Dietary fibre-based interventions are of growing interest for the prevention and treatment of digestive diseases. In this study, we investigated the effect of resistant starch (RS) on intestinal fibrosis, a stricturing condition driven by excessive extracellular matrix (ECM) accumulation. RS was found to alleviate intestinal fibrosis in a dextran sulfate sodium (DSS)-induced chronic colitis mouse model, as evidenced by restored colon length, reduced ECM deposition (fibronectin and collagen I), and decreased levels of α-smooth muscle actin. Given that RS is fermented by the gut microbiota in the colon, metagenomic sequencing revealed that RS reshaped the composition of the gut microbiota and increased the abundance of beneficial gut bacteria, including Bacteroides acidifaciens, Faecalibaculum rodentium, and Bifidobacterium pseudolongum, which are known to enhance the production of short-chain fatty acids. Targeted metabolomic analysis further showed a marked increase in acetate levels, which was associated with reduced intestinal fibrosis. However, direct in vivo evidence that acetate is required for the anti-fibrotic effect of RS remains lacking. Using human (CCD-18Co) and primary mouse intestinal fibroblasts, the major ECM-producing cells that drive fibrosis progression, we demonstrated that acetate inhibited TGF-β-induced fibroblast activation by inhibiting histone deacetylase 2, thereby enhancing the acetylation level of histone H3 at lysine 27. Collectively, these results suggest a potential microbial-metabolic-epigenetic axis linking RS and acetate to fibrosis attenuation, which awaits causal validation in vivo. This axis holds promise as a therapeutic target for fibrotic diseases.", "zh_summary": "本研究探討抗性澱粉（RS）對腸道纖維化的改善作用及其潛在機制。透過 DSS 誘導的小鼠結腸炎模型，研究發現 RS 可有效減輕腸道纖維化並減少細胞外基質堆積。宏基因體定序顯示 RS 能重塑腸道菌群，增加如 *Bacteroides acidifaciens* 等短鏈脂肪酸產生菌的豐度；代謝體分析進一步證實乙酸（acetate）水平顯著上升。機制研究揭示，乙酸能抑制纖維母細胞中 HDAC2 的活性，進而提升組蛋白 H3K27 的乙醯化水平，抑制 TGF-β 誘導的纖維母細胞活化。本研究提出了一條「微生物-代謝-表觀遺傳」軸線，指出 RS 可藉由促進乙酸生成來對抗腸道纖維化，為治療纖維化相關疾病提供了新的科學依據與潛在治療靶點。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42657522/"}, {"pmid": "42660108", "title": "Group C Orthobunyavirus Infection in a Patient from the Amazon Putumayo Region of Colombia During an Oropouche Fever Epidemic.", "journal": "The American journal of tropical medicine and hygiene", "impact_factor": NaN, "tech_types": "metagenomics", "sample_size": "1位急性發熱疾病患者（單一病例）", "has_fulltext": false, "abstract": "Orthobunyaviruses, one of the largest and most diverse genera of viruses, include numerous reassortant viruses and present diagnostic challenges due to similar clinical presentations with other arboviral infections. The detection and isolation of a group C orthobunyavirus from a patient with acute febrile illness from Puerto Ospina, Putumayo Department, Colombia during the 2023-2024 Latin American Oropouche fever regional outbreaks are reported in the present study. Using a vertebrate virus-focused metagenomics sequencing approach with VirCapSeq-VERT, a virus related to the Caraparu complex was identified, and a virus isolate was obtained. Although limited to a single case and without serological or longitudinal clinical confirmation, these findings underscore the value of unbiased molecular approaches for unresolved febrile illness diagnosis in endemic settings such as the Amazon basin.", "zh_summary": "本研究旨在調查2023-2024年拉丁美洲奧羅普切熱（Oropouche fever）疫情期間，哥倫比亞亞馬遜地區一名急性發熱患者的病因。研究團隊採用針對脊椎動物病毒的總體基因體學（宏基因組）定序技術（VirCapSeq-VERT），成功鑑定並分離出一種與Caraparu複合體相關的C群正布尼亞病毒（Group C Orthobunyavirus）。由於此類病毒臨床表現與其他蟲媒病毒相似，診斷極具挑戰。本研究雖僅基於單一病例，但其結果強調了在亞馬遜盆地等流行病疫區，使用無偏向性分子檢測技術對於診斷不明原因發熱疾病的重要臨床與科學價值。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42660108/"}, {"pmid": "42656127", "title": "Development and Validation of Mock Communities as Quality Control Materials for Clinical Metagenomic Next-Generation Sequencing.", "journal": "Annals of laboratory medicine", "impact_factor": 3.9, "tech_types": "metagenomics", "sample_size": "25 次重複分析（針對開發出的四種模擬群落進行評估）", "has_fulltext": false, "abstract": "Metagenomic next-generation sequencing (NGS) enables comprehensive detection of a broad spectrum of microorganisms. However, its clinical application faces two major challenges: the development of appropriate microbiome-based biomarkers and the need to ensure the reproducibility and quality of the microbiome analytical workflow. Therefore, we developed four types of bead-based mock communities as standard materials for microbiome analysis and evaluated potential experimental biases arising from nucleic acid extraction and sequence analysis. Mock communities were assembled from strains isolated from clinical specimens and selected considering Gram reaction, taxonomic phylogeny, and prevalence, and processed into frozen beads. The communities were analyzed using shotgun whole-metagenome sequencing. The effect of DNA extraction kit choice was evaluated using the Thermo Fisher Scientific MagMAX Microbiome Ultra Nucleic Acid Isolation Kit and Qiagen PowerSoil Kit. Four types of mock communities comprising 26 species commonly found in the gastrointestinal tract, respiratory tract, skin, and genital tract plus cerebrospinal fluid were developed considering Gram reaction, GC content, and phylogenetic distribution. Across 25 repeated analyses, the median repeatability of each taxon was 18.97% (range, 2.87%-107.38%), while within-laboratory imprecision was 26.22% (range, 9.26%-153.83%). Repeatability remained below 10% for most dominant taxa with relative abundances >20%. The choice of DNA extraction kit had a significant effect on taxonomic distributions. Microbial mock communities are essential QC materials for clinical metagenomic NGS. Further studies are needed to minimize variability and establish a standardized protocol for clinical implementation.", "zh_summary": "本研究旨在解決臨床宏基因組次世代定序（mNGS）在品質控制與再現性上的挑戰，開發了四種基於珠粒的「模擬微生物群落」（mock communities）作為標準品。這些群落涵蓋了腸道、呼吸道、皮膚、生殖道及腦脊髓液中常見的 26 種菌株。研究透過鳥槍法全宏基因體定序（shotgun metagenomics）評估了不同 DNA 萃取試劑盒（MagMAX 與 PowerSoil）及實驗流程對結果的偏誤影響。結果顯示，微生物的檢測豐度會顯著受到萃取試劑盒選擇的干擾，且在 25 次重複實驗中，群落組成存在一定的實驗室內誤差。此研究確立了模擬群落作為臨床 mNGS 品質控制材料的重要性，對於推動微生物組檢測的標準化流程與臨床應用具有關鍵價值。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42656127/"}, {"pmid": "42660365", "title": "Enhancing Cr(VI) bioreduction via Na+-stimulated intracellular energy metabolism and electron transfer using methane as electron donor.", "journal": "Bioresource technology", "impact_factor": 9.0, "tech_types": "16S, metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Anaerobic oxidation of methane (AOM) coupled with Cr(VI) bioreduction process offers a cost-effective pathway to simultaneously mitigate methane emissions and remediate Cr(VI) contamination. However, its practical application is limited by insufficient intracellular energy generation and low electron transfer efficiency. This study elucidated the regulatory role and mechanism of Na+, a transmembrane electrochemical gradient driver, on the metabolic activity and electron transfer of this coupled system. Batch experiments demonstrated that NaCl addition significantly improved Cr(VI) reduction efficiency, achieving complete removal in the treatment group by the end of the first cycle compared to only 79.8 % in the control. Microbial community analysis showed that Na+ enriched AOM-capable Methanobacterium and extracellular electron transfer (EET)-capable electroactive bacterium unclassified_o_DTU014, which likely formed a syntrophic consortium to mediate Cr(VI) reduction. Electrochemical measurements and 3D-EEM spectroscopy revealed that Na+ enhanced microbial aggregate electron storage capacity, reduced electron transfer resistance, and promoted extracellular polymeric substance (EPS) secretion of tyrosine-like proteins and humic acid-like substances, thereby strengthening extracellular electron transfer. Key metabolic indicators showed 26.2 % higher coenzyme F420 and 37.4 % higher intracellular ATP levels in Na+-treated groups. Metagenomic analysis confirmed that Na+ upregulated genes encoding reverse methanogenesis enzymes (Mcr, Mtr) and membrane-bound electron transfer complexes (Fpo, HdrDE), while downregulating intracellular chromate reductase (ChrR) genes, indicating that EET-mediated extracellular Cr(VI) reduction played a critical role under Na+ stimulation. This study first reveals the mechanism of Na+-promoted AOM-coupled Cr(VI) reduction via enhanced energy metabolism and electron transfer, providing a crucial theoretical basis for methane-driven Cr(VI) remediation.", "zh_summary": "本研究旨在探討跨膜電化學梯度驅動者——鈉離子（Na+），如何調控「甲烷厭氧氧化（AOM）耦合六價鉻 [Cr(VI)] 生物還原系統」的代謝活性與電子傳遞機制。研究發現，添加 NaCl 能顯著提升 Cr(VI) 的去除效率。微生物分析顯示，Na+ 富集了具 AOM 能力的 *Methanobacterium* 與具胞外電子傳遞（EET）能力的電活性細菌，形成協同共生關係。此外，Na+ 提高了微生物的胞內 ATP 與輔酶 F420 水平，並促進胞外聚合物（EPS）分泌以降低電子傳遞阻力。總體基因體學分析進一步證實，Na+ 上調了逆向產甲烷及膜結合電子傳遞複合物的關鍵基因。本研究首次審視並揭示了 Na+ 促進 AOM 耦合 Cr(VI) 還原的生物能量學機制，為利用甲烷進行重金屬生物整治提供了重要理論基礎。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42660365/"}, {"pmid": "42660466", "title": "Polystyrene nanoplastics exposure induces reproductive toxicity in male mice associated with the gut-liver/testis axis.", "journal": "Toxicology and applied pharmacology", "impact_factor": 3.4, "tech_types": "metagenomics, others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Environmental nanoplastics are increasingly prevalent in global environments and represent an emerging systemic health risk, yet the mechanistic links between nanoplastic exposure and multi-organ dysfunction in mammals remain incompletely characterized. We integrated phenotypic assessments, gut shotgun metagenomics, and dual-organ transcriptomics to investigate the toxic effects of 28-day oral exposure to polystyrene nanoplastics (PS-NPs) in male CD-1 mice. PS-NPs induced a non-monotonic dose-dependent response, characterized by significant body weight loss at high doses, severe impairment of sperm motility, and progressive epididymal histopathological lesions. Gut metagenomics revealed significant microbiota dysbiosis, including an elevated Firmicutes/Bacteroidota ratio and marked depletion of beneficial commensal bacteria such as Ligilactobacillus murinus. Hepatic transcriptomics identified dysregulation of metabolic, detoxification, and circadian rhythm pathways, while testicular transcriptomics identified sustained transcriptional downregulation of genes annotated to steroid hormone biosynthesis and alterations in FoxO and apoptosis-related signaling. Spearman correlation network analysis identified associations between specific microbial shifts and organ-specific transcriptional alterations, providing a hypothesis-generating framework for the proposed gut-liver/testis axis. Together, these findings indicate that, under the present experimental conditions, oral PS-NPs exposure was associated with gut microbial dysbiosis, hepatic transcriptional perturbations, reduced sperm motility, and epididymal histopathological alterations, while the mechanistic relationships among these changes require further experimental validation.", "zh_summary": "本研究探討口服聚苯乙烯奈米塑料（PS-NPs）28天對雄性CD-1小鼠的毒性效應及其作用機制。研究發現，PS-NPs暴露會引發非單調劑量依賴性反應，導致小鼠體重顯著減輕、精子活力嚴重受損及附睾病理病變。腸道總體基因體學分析顯示，PS-NPs引起腸道菌群失調（厚壁菌門/擬桿菌門比例升高，有益菌如鼠乳桿菌顯著減少）。雙器官轉錄組學分析進一步證實，肝臟中代謝、解毒與晝夜節律途徑失調，而睾丸中類固醇激素合成基因持續下調且凋亡信號改變。本研究首次揭示了奈米塑料誘導生殖毒性與「腸-肝/睾丸軸」的關聯，為環境微塑料的哺乳動物多器官毒性機制提供了重要科學依據。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42660466/"}, {"pmid": "42658871", "title": "Breastmilk microbiota and its association with infant iron deficiency anaemia: A 16S rRNA metagenomic study in Peruvian mothers cohort.", "journal": "PloS one", "impact_factor": 2.6, "tech_types": "16S", "sample_size": "46 對母嬰（46 個母乳檢體）", "has_fulltext": false, "abstract": "Anaemia is one of the most important public health challenges in developing countries. The global burden is estimated at 1.8 billion people, affecting approximately 30% of all children. Despite the implementation of multiple strategies over several decades, up to 42.5% of children under 3 years of age suffer anaemia in rural areas of Peru. We studied the microbiota of breastmilk (hBM) from mothers with children under the age of 1 and analysed its association with their iron deficiency anaemia. 46 mother-child pairs were recruited from Talara, a town on the northern coast of Peru and classified according to the clinical status of the children. Children with anaemia were also tested for ferritin level to classify them as iron deficiency anaemia (IDA) or non-iron deficiency anaemia (non-IDA). hBM samples were taken from the mothers after careful instruction to reduce the risk of sample contamination and the microbiome was analyzed using 16S rRNA sequencing. Streptococcus and Staphylococcus were the predominant genera, with 90% of bacterial abundance being explained by 14 genera. Alpha diversity analysis showed that hBM from mothers of children with non-IDA had higher levels of bacterial richness than hBM from healthy (p < 0.01) and IDA (p < 0.05) participants. Principal coordinates analysis did not yield differential clusters but showed a disparity in the spread of samples for non-IDA group when compared with the other groups. IDA group showed higher burden of Corynebacterium, Acinetobacter, Paludibacter and Nitrospira, while exhibiting a trend towards a lower burden of Streptococcus. No statistically significant differences were identified on demographic characteristics. This study suggests that hBM microbiota may differ in mothers of children with IDA and non-IDA, highlighting the necessity of further in-depth research to elucidate potential factors associated with its pathogenesis.", "zh_summary": "本研究探討祕魯農村地區嬰兒缺鐵性貧血（IDA）與母親母乳（hBM）菌相之間的關聯。研究對象為 46 對母嬰，透過 16S rRNA 定序分析母乳微生物群落，發現母乳菌相以鏈球菌屬（Streptococcus）與葡萄球菌屬（Staphylococcus）為優勢菌群。研究結果顯示，非貧血組嬰兒的母親，其母乳具備較高的細菌豐富度。此外，IDA 組嬰兒母親的母乳中，棒狀桿菌屬（Corynebacterium）與不動桿菌屬（Acinetobacter）等細菌豐度較高，而鏈球菌屬則呈現下降趨勢。此研究發現母乳微生物群組成可能與嬰兒貧血狀態相關，雖無法直接證實因果關係，但為後續探討嬰兒貧血的致病機制提供了重要的微生物學線索。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42658871/"}, {"pmid": "42658844", "title": "Enrichment and Characterization of a Haloalkaline-tolerant Anammox Bacterium.", "journal": "The ISME journal", "impact_factor": NaN, "tech_types": "metagenomics, small genome, others (transcriptional profiling)", "sample_size": "未提及（研究基於特定實驗室富集培養物之實驗與分析）", "has_fulltext": false, "abstract": "Metagenomic surveys have substantially expanded the known diversity of anaerobic ammonium-oxidizing (anammox) bacteria. However, the physiological traits of newly proposed anammox genera remain largely hypothetical due to the lack of cultured representatives. Although niche differentiation driven by salinity, organic substrates, and oxygen is well documented in anammox bacteria, adaptations to alkaline environments remain uncharacterized. Moreover, no anammox lineage has been identified as an alkaline specialist. Herein, we report the enrichment (>80% relative abundance) of an anammox bacterium, provisionally named Candidatus Loosdrechtia alkalitolerans, which represents the cultured member of the genus Ca. Loosdrechtia. Ca. L. alkalitolerans exhibits marked haloalkaline tolerance, outcompeting other freshwater anammox genera under long-term saline-alkaline stress conditions (0.5% NaCl; pH~9.13). Comparative genomics revealed that among freshwater anammox lineages, only Ca. L. alkalitolerans encodes a complete multiple resistance and pH adaptation (Mrp) cation/proton antiporter operon. Batch assays with transcriptional profiling demonstrated that sodium addition upregulated mrp expression and recovered anammox activity under alkaline stress, suggesting that Mrp-mediated cation/proton exchange may contribute to pH homeostasis in Ca. L. alkalitolerans. Furthermore, database mining revealed that the habitat of Ca. L. alkalitolerans is not restricted to haloalkaline environments, but extends to diverse freshwater and wastewater ecosystems. These findings provide mechanistic insight into saline-alkaline tolerance in anammox bacteria, expanding understanding of their physiological plasticity and ecological roles.", "zh_summary": "本研究成功富集並鑑定出一種耐鹽鹼的厭氧氨氧化（Anammox）細菌，命名為 *Candidatus Loosdrechtia alkalitolerans*。該菌株在長期高鹽、高鹼（0.5% NaCl，pH 9.13）環境下表現出強大的競爭優勢。透過基因體比較分析，研究發現該菌株含有特殊的 Mrp 陽離子/質子反向轉運蛋白操縱子，這是其適應鹼性環境的關鍵機制；轉錄組分析進一步證實，在鹼性壓力下，補充鈉離子可上調 Mrp 表現並恢復其代謝活性。此發現不僅揭示了厭氧氨氧化菌應對鹽鹼逆境的生理分子機制，證明了該菌在廣泛的淡水與廢水生態系統中具有潛在的生態地位，更為未來工業廢水處理中的脫氮技術應用提供了理論基礎與科學見解。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42658844/"}, {"pmid": "42660360", "title": "Elucidating the aromatic formation of humus via quorum sensing and redox function of thermophilic microbiota in compost.", "journal": "Bioresource technology", "impact_factor": 9.0, "tech_types": "metagenomics, others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Quorum sensing (QS) modulates bacterial metabolism to regulate humus formation. However, the functional interaction modes of signal molecules, QS-related proteins, and microbial humification function during composting remain unclear. This study aimed to clarify the role of QS-related gene expression in regulating humification via applying metagenomics and metaproteomics. Combined addition of MnSO4 and Fe0 (CMF) significantly raised humic acid (HA) content (33.53 mg g-1) and polymerization degree (2.60) compared with other treatments. Multi-dimensional results revealed that CMF-derived HA and its products exhibited greater thermal stability, high aromaticity, and practical applicability. CMF increased the relative abundances of most QS-related and humification-related oxidoreductase genes throughout composting, especially during the thermophilic stage. Metaproteomic profiles verified that both QS expression and humification metabolism were hyperactivated during the thermophilic stage of CMF. Correlation analysis showed that QS gene expression potentially and preferentially influenced lignin-protein and polyphenol pathways during humification. Overall, CMF enriched thermophiles (Bacillota, Chloroflexota, and Myxococcota), further up-regulated the expression of major QS-related genes [K02035 (ABC.PE.S), K13075 (ahlD), K14645, K15580 (oppA), and K02055 (ABC.SP.S)], elevated levels of signal molecules, and promoted QS effects. Network analysis, qPCR, and simulated in vitro validation experiments confirmed that the response of key QS modules [K13075 (ahlD) and 3-OXO-C8-HSL] potentially facilitated interspecies communication and cooperation among bacteria, which concurrently enhanced downstream microbial metabolic behaviors (microbial redox activities and the metabolism of carbohydrates and amino acids) that aid in driving HA aromatization. This work provides new insight into the ecological roles of QS-related microbes and their precise regulation of compost humification.", "zh_summary": "本研究旨在利用總體基因體學與總體蛋白質組學技術，探討群體感應（QS）相關基因表達在堆肥腐植化過程中的調節機制。研究發現，聯合添加硫酸錳與零價鐵（CMF）能顯著提高腐植酸（HA）的含量、熱穩定性與芳香度。CMF顯著富集了高溫微生物（如Bacillota、Chloroflexota和Myxococcota），並在高溫期上調關鍵QS相關基因（如ahlD）的表達與訊號分子水平。網路分析與體外實驗進一步證實，關鍵QS模組促進了菌群間的交流合作，進而增強下游的微生物氧化還原活性及碳水化合物與氨基酸代謝，共同驅動腐植酸的芳香化。本研究為QS微生物在堆肥腐植化中的生態角色與精準調控提供了全新見解。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42660360/"}, {"pmid": "42660482", "title": "Artificial light pollution alters epilithic microbial communities and functional biodeterioration-related functional potentials in subterranean sandstone environments.", "journal": "Environmental pollution (Barking, Essex : 1987)", "impact_factor": NaN, "tech_types": "16S, metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Artificial light pollution represents an important anthropogenic disturbance in subterranean heritage environments, yet its associations with epilithic microbial communities and biodeterioration processes remain poorly understood. In tourist-accessible subterranean caves, artificial illumination creates persistent illuminated areas on stone surfaces that may alter microbial community assembly and biogeochemical functions associated with biofilm development. Here, the Longyou Grottoes, a large underground sandstone cave complex in Zhejiang, China, were investigated using 16S rRNA gene sequencing and metagenomics. Bacterial communities dominated all samples (>98% relative abundance). Cyanobacteriota were enriched under artificial light and sunlight (>40%), whereas Pseudomonadota and Actinomycetota prevailed in darkness. Dark sites exhibited higher bacterial alpha diversity and more complex co-occurrence networks. Compared with sunlight and dark environments, the artificial-light environment was associated with greater stochasticity in bacterial community assembly, broader niche breadth, and lower niche overlap. Metabolic potential analysis further revealed light-dependent metabolic shifts: artificial light enhanced assimilatory nitrogen and sulfur metabolism, sunlight promoted nitrogen fixation, and darkness favored nitrification, denitrification, and sulfur oxidation. However, bacterial community patterns were also associated with temperature, humidity, pH, and soluble salts, indicating that the observed differentiation reflected the combined influence of light and environmental heterogeneity. These findings identify artificial lighting as an important and manageable environmental factor associated with epilithic bacterial communities and provide a basis for integrating lighting management with environmental control in the preventive conservation of subterranean sandstone heritage.", "zh_summary": "本研究探討人造光污染對地下砂岩古蹟（龍游石窟）岩表微生物群落及生物降解功能的影響。透過16S rRNA定序與總體基因體學分析，發現光照顯著改變群落結構：人工光與日光下藍菌門富集，而黑暗環境則由假單胞菌門和放線菌門主導，且黑暗處具更高的多樣性與網絡複雜度。代謝潛力分析顯示，人工光增強了同化性氮、硫代謝，而黑暗則利於硝化與硫氧化。此外，群落分化也與溫濕度及pH等環境因子相關。本研究證實人造光源是調控地下微生物的重要因子，為砂岩文物的預防性保護與照光管理提供科學依據。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42660482/"}, {"pmid": "42649294", "title": "Synergistic degradation of fucoidans in the ocean.", "journal": "Nature", "impact_factor": 48.5, "tech_types": "metabolomics, metagenomics", "sample_size": "未提及（該研究採用重組海洋微生物群落進行實驗，未提供具體的生物樣本人數或檢體數量）", "has_fulltext": false, "abstract": "Fucoidans, a class of complex polysaccharides produced by brown algae and diatoms, contribute to long-term carbon sequestration owing to their resistance to microbial degradation1,2. Although individual microorganisms can break down portions of these polysaccharides3-5, it remains unclear whether complete breakdown is possible in nature and, if so, by what mechanisms. Here we show that fucoidans are degraded through synergistic interactions between specialized bacteria with complementary metabolic functions. Using metabolomic analysis of a reconstructed marine consortium, we uncovered metabolic guilds of bacteria that preferentially degrade either the sulfated fucose backbone or the side branches of rare monomers. This functional division of labour leads to an unexpectedly high number of synergistic interactions between different degraders that enhanced degradation efficiency up to 97.1%. Despite varying fucoidan structures across different types of algae6, the metabolic functions of degraders remained conserved, enabling quantitative prediction of degradation outcomes based on community and substrate composition. The frequent co-occurrence of functionally complementary fucoidan degraders in ocean metagenomes suggests that synergistic degradation is a globally relevant strategy. Our findings suggest that the environmental turnover of complex biopolymers depends not only on individual metabolic capabilities of degraders but also on ecological interactions shaped by substrate architecture. This work provides a mechanistic framework for understanding carbon cycling in the ocean and for engineering synthetic microbial consortia to degrade recalcitrant polysaccharides.", "zh_summary": "本研究探討海洋中複雜多醣體「褐藻醣膠」（fucoidans）的微生物降解機制。儘管褐藻醣膠因其抗降解性在碳封存中扮演關鍵角色，但過往對於其在自然界中是否能被完全分解並不清楚。研究發現，褐藻醣膠的降解並非單一物種所能完成，而是透過具有互補代謝功能的細菌群落進行「協同作用」。透過代謝體學分析，研究團隊識別出專門降解硫酸岩藻糖骨架與稀有單醣側鏈的代謝群組（metabolic guilds），這種分工合作能將降解效率大幅提升至 97.1%。此外，研究顯示此代謝功能在不同環境下具有高度保守性，且在海洋宏基因組中普遍存在。本研究揭示了生物聚合物的環境周轉率取決於微生物間的生態交互作用，為理解海洋碳循環機制提供了重要框架，並為未來利用人工合成微生物群落降解頑固性多醣體提供了技術基礎。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42649294/"}, {"pmid": "42657129", "title": "Pulmonary Infiltrates, Airway Mucosal Lesions and Respiratory Microbiology After Freshwater Drowning: A Case Report.", "journal": "Respirology case reports", "impact_factor": NaN, "tech_types": "metagenomics", "sample_size": "1 例病患（n=1）", "has_fulltext": false, "abstract": "Early pulmonary abnormalities after freshwater drowning can be overinterpreted as bacterial pneumonia, especially when inflammatory biomarkers and respiratory microbiology are positive. A 20-year-old man was resuscitated after approximately 2 min of freshwater submersion. Day 1 chest CT showed bilateral lower-lobe-predominant opacities compatible with non-cardiogenic pulmonary oedema and aspiration-related lung injury, with near-complete resolution by Day 25. Day 3 bronchoscopy showed diffuse, non-removable, millet-seed-like whitish tracheal mucosal protrusions with hyperaemia and oedema, compatible with acute irritative airway injury. BALF mNGS detected multiple gram-negative bacterial signals, predominantly Klebsiella pneumoniae, while sputum culture yielded ESBL-negative, susceptible K. pneumoniae. Possible drowning-associated pneumonia was considered because of aspiration, fever, markedly elevated inflammatory biomarkers and concordant microbiology; however, rapid radiological improvement and clinical stability suggested a substantial non-infectious component. The patient recovered after an 8-day course of piperacillin-tazobactam without antibiotic escalation, corticosteroids, mechanical ventilation or acute respiratory distress syndrome.", "zh_summary": "本研究透過單一病例報告，探討淡水溺水後肺部浸潤與呼吸道損傷的臨床鑑別診斷。一名 20 歲男性溺水後出現肺水腫與氣道黏膜病變，臨床表現極易與細菌性肺炎混淆。研究利用 mNGS（宏基因組次世代定序）檢測支氣管肺泡灌洗液，雖確認存在肺炎克雷伯菌（*Klebsiella pneumoniae*）訊號，但影像學與臨床病程顯示其肺部損傷主要源於吸入性損傷及急性化學性氣道刺激，而非嚴重的細菌感染。此案例凸顯了臨床判斷溺水相關肺炎時的挑戰，強調在面對看似感染的臨床數據時，應綜合考量影像改善速度與臨床穩定性，避免過度診斷與不必要的抗生素升級，對急性溺水病患的精準治療具有重要的臨床參考價值。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42657129/"}, {"pmid": "42644746", "title": "Metabolic division of labour drives estuarine-coastal N2O emissions.", "journal": "The ISME journal", "impact_factor": NaN, "tech_types": "metagenomics, metatranscriptomics", "sample_size": "974 個重建的 N2O 相關基因體（原文未提及具體的環境樣本採集數量）", "has_fulltext": false, "abstract": "Estuarine and coastal systems are global hotspots of marine nitrous oxide (N2O) emissions, where microbial nitrification and denitrification are the primary processes regulating N2O dynamics. However, how interactions among different N2O-associated microorganisms influence ecosystem-scale N2O emissions remains poorly understood. This study combined in situ N2O concentrations, 15N-based potential rates, metagenomics, metatranscriptomics, and genome-scale metabolic model analysis to explore N2O production and reduction processes in estuarine and coastal systems. Potential N2O production and reduction rates, together with in situ concentrations, the relative abundance, and the transcriptional activity of associated genes, were significantly higher at low salinity and declined toward coastal regions. Based on the gene content of 974 recovered N2O-associated genomes, microorganisms were classified into three functional groups: net N2O producers, net N2O consumers, and self-sustaining N2O players. The abundance, composition, and activity of these functional groups shifted along estuarine-coastal gradients. A larger NO/N2O exchange gap, reflecting the imbalance between model-inferred NO and N2O handoff potentials, was found at low salinity and was associated with elevated bottom-water N2O concentrations. Together, community-level division of labour and the associated exchange gap provide a conceptual framework for linking N2O-related functional groups to N2O accumulation in estuarine-coastal ecosystems.", "zh_summary": "本研究旨在探討河口與沿海系統中，微生物交互作用如何驅動一氧化二氮（N2O）的排放。研究結合現場觀測、15N同位素速率、總體基因體與轉錄體學，重建了974個N2O相關基因體。結果指出，低鹽度區域的N2O產生與還原速率及基因表達顯著較高。研究將微生物劃分為淨產生者、淨消費者與自給自足者，並發現低鹽度區因群落間物質交換失衡，存在較大的NO/N2O交換缺口，進而導致底層水體N2O顯著累積。本研究建立了群落水平的「分工與交換缺口」理論框架，為預測及理解海洋生態系統N2O排放提供了關鍵的科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42644746/"}, {"pmid": "42647164", "title": "Sex differences in the gut microbiome and related metabolites: role in cardiometabolic disease.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "others", "sample_size": "未提及（本文為綜論性回顧文章，非原創實驗研究）", "has_fulltext": false, "abstract": "Sex differences in major cardiometabolic diseases (CMD), such as type 2 diabetes, metabolic dysfunction-associated steatotic liver disease, and cardiovascular disease, have been increasingly recognized across the life course. During the reproductive stage, women generally have a more favorable cardiometabolic risk profile than men, but their risk of experiencing CMD significantly increases after menopause. Emerging evidence suggests that sexually dimorphic gut microbiota and gut microbiota-related metabolites (GMRMs) may contribute to such sex disparities. However, existing findings are heterogeneous and underlying mechanisms remain incompletely understood. In this review, we synthesize the evidence examining sex differences in gut microbial diversity, overall composition, taxa abundances, and levels of GMRMs across key life stages, including pre-puberty, adolescence, and different phases of adulthood (with emphasis on pre- and post-menopausal periods). We summarize potential biological mechanisms underlying sexual dimorphism in the gut microbiome and GMRMs, emphasizing the central role of sex steroids, along with contributions from immune function and other host and environmental factors. We further integrate evidence linking sexually dimorphic microbial taxa (e.g., Akkermansia muciniphila, Eubacterium, Ruminococcus, and other Firmicutes taxa) and GMRMs (e.g., microbiota-derived short-chain fatty acids, secondary bile acids, and trimethylamine N-oxide) to key cardiometabolic pathways involving inflammation, glucose and lipid metabolism, and vascular function. Finally, we identify critical knowledge gaps and emphasize the need for future large longitudinal studies that would integrate repeated measurements of the gut microbiome, untargeted metabolomics, and sex steroid hormones across the life course. Such approaches are essential to clarify biological pathways and inform sex-specific microbiome-based interventions for CMD prevention and management.", "zh_summary": "本文旨在探討性別差異在腸道微生物群與相關代謝物（GMRMs）中如何影響心臟代謝疾病（CMD）。研究指出，受性類固醇、免疫功能及環境因素影響，腸道菌相與代謝產物存在顯著的性別二態性。女性在生育期較男性具備更佳的心臟代謝特徵，但停經後風險顯著升高，此變化與特定菌屬（如 *Akkermansia muciniphila*）及代謝物（如短鏈脂肪酸、次級膽汁酸、TMAO）的豐度改變密切相關。這些微生物與代謝物透過調節發炎反應、醣脂代謝及血管功能，進而影響 CMD 的發生。本文強調未來需透過大型縱向研究，結合微生物組學、代謝組學與荷爾蒙監測，以深入解析其生物學機制，並開發針對不同性別的精準微生物介入療法，對於預防及管理心臟代謝疾病具有重要的科學價值。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647164/"}, {"pmid": "42647759", "title": "The Gut Microbiome in Multiple Sclerosis.", "journal": "Neurology(R) neuroimmunology & neuroinflammation", "impact_factor": NaN, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Multiple sclerosis (MS) is a chronic inflammatory demyelinating disease of the CNS whose risk and course are shaped by both genetic and environmental factors, among which the intestinal microbiota has emerged as a key, potentially modifiable contributor. People with MS frequently display altered gut microbiota, characterized by depletion of fiber-fermenting, short-chain fatty acid (SCFA)-producing commensals, and expansion of taxa associated with mucus degradation and proinflammatory metabolism. These compositional shifts are paralleled by broad changes in blood and CSF metabolites, including reduced SCFAs, tryptophan-derived aryl hydrocarbon receptor ligands, and secondary bile acids. In addition, several reports highlight the accumulation of aromatic amino acid-derived phenolic and indolic compounds and specific lipid mediators linked to neuroinflammation and neurodegeneration. In this up-to-date review, we synthesize evidence from experimental models and human studies showing how microbial metabolites can influence MS pathogenesis through converging mechanisms: modulation of gut and blood-brain barrier integrity; shaping of T-cell and B-cell responses; direct effects on microglia, astrocytes, and oligodendrocyte lineage cells after crossing into the CNS; and modulation of neural circuits, particularly those involving the vagus nerve. Finally, we highlight current gaps, including the need for longitudinal, harmonized multiomic cohorts, and mechanistic studies integrating microbiome, metabolome, and host readouts across gut, blood, and CNS. Overall, available data support a model in which coordinated disruption of the gut microbiota-metabolite axis, rather than any single pathogen, contributes to MS, opening avenues for microbiota-based and metabolite-based biomarkers and therapies aimed at restoring immune and neuroglial homeostasis.", "zh_summary": "本研究探討多發性硬化症（MS）與腸道微生物群之間的關聯。研究指出，MS 患者的腸道菌相呈現失調狀態，包括短鏈脂肪酸（SCFA）產生菌減少，以及促發炎代謝菌的增加。這些微生物群落的變化伴隨著血液與腦脊髓液中代謝物（如色胺酸衍生物、膽汁酸及 SCFA）的顯著改變，這些物質經證實與神經發炎及退化密切相關。文中綜述了微生物代謝產物如何透過調節腸道與血腦屏障完整性、影響免疫細胞（T/B 細胞）反應，以及直接作用於神經膠質細胞來參與 MS 的致病機制。總結而言，MS 的發生與腸道菌群-代謝物軸的整體失調有關，而非單一病原體所致。該研究強調未來需進行多體學（multiomics）整合分析，以開發基於微生物群的生物標記與創新治療策略，旨在恢復患者的免疫與神經恆定。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647759/"}, {"pmid": "42648171", "title": "Co-occurrence of muddy off flavor and cyanotoxin genes in the polluted Guandu river waters (Rio de Janeiro, Brazil).", "journal": "The Science of the total environment", "impact_factor": NaN, "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "The Guandu river basin is responsible for supplying Rio de Janeiro municipality, Brazil, with drinking water. This study investigated water quality during the geosmin crisis in January and March 2020, by relating the water quality and odor compounds with metagenomic tools. Guandu river water was eutrophic. The cyanobacterial genera identified were Microcystis, Planktothrix, Dolichospermum, Nostoc, Synechococcus, Planktothricoides, and Cyanobium, indicating that bloom-associated communities in the system are taxonomically diverse. Functional annotation of metagenomic sequences revealed the presence of genes associated with the biosynthesis of taste-and-odor compounds, including geosmin (geoA) and 2-methylisoborneol (mic), as well as multiple biosynthetic clusters related to cyanotoxin production. Genes linked to microcystin (mcy), saxitoxin (sxt), anatoxin (ana), cylindrospermopsin (cyr), lyngbyatoxin (ltx), guanitoxin (gnt), and nodularin (nda) were detected across the dataset, indicating a broad genetic potential for the production of secondary metabolites relevant to water quality. The co-occurrence of cyanotoxins, geosmin and 2-MIB genes suggests that off-flavor is an indication of cyanotoxin potential production in the water.", "zh_summary": "本研究旨在探究巴西里約熱內盧瓜杜河於2020年初爆發土臭素危機期間的水質狀況，並利用總體基因體學技術探討水質異味與微生物群落之關聯。研究發現，該富營養化水體中含有多種藍菌，且功能性註釋顯示其富含合成土臭素（*geoA*）與2-甲基異莰醇（*mic*）等異味物質的基因。更重要的是，多種藍菌毒素（如微囊藻毒素、石房蛤毒素等）的合成基因群與這些異味基因呈現共存。此發現證實了水體異味的出現與藍菌毒素的潛在生成具有高度相關性，可作為飲用水安全監測及評估藍菌毒素潛在危害的重要預警指標。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42648171/"}, {"pmid": "42644416", "title": "Nationwide cohort study reveals low bifidobacteria and distinct microbiota composition and function in Swedish newborns.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "metagenomics", "sample_size": "308 名瑞典新生兒的糞便檢體", "has_fulltext": false, "abstract": "NCT06285630.", "zh_summary": "本研究旨在探討瑞典新生兒的腸道菌相組成與功能特徵。透過總體基因體學分析，研究發現瑞典新生兒腸道中的雙歧桿菌（特別是嬰兒雙歧桿菌）豐度顯著偏低，並呈現出獨特的菌相結構與代謝功能。此現象與現代化生活型態及分娩方式密切相關。這項全國性世代研究揭示了現代環境對嬰兒早期腸道微生態建立的深遠影響，為未來的臨床嬰幼兒益生菌介入與健康照護策略提供了關鍵的科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42644416/"}, {"pmid": "42648218", "title": "Agricultural sprinkler irrigation systems as environmental reservoirs and airborne dissemination sources of Legionella pneumophila.", "journal": "Journal of environmental management", "impact_factor": 8.4, "tech_types": "metagenomics, small genome", "sample_size": "未明確提及具體檢體數量（僅指出於西班牙東北部農村的兩個區域，針對灌溉池塘與溝渠進行採樣）", "has_fulltext": false, "abstract": "Sprinkler irrigation systems are critical for modern agriculture but represent largely unrecognized aquatic environments capable of sustaining opportunistic human pathogens. Among them, Legionella pneumophila is of particular concern due to its ability to colonize engineered water systems, persist under fluctuating environmental conditions, and be transmitted through aerosols. In this study, we conducted a comprehensive microbiological and genomic investigation of irrigation ponds and ditches in a rural area of north-east Spain where two zones were sampled. Metagenomic profiling revealed highly diverse microbial communities encompassing more than 20,000 species, including 21 airborne-transmissible bacterial pathogens of clinical relevance. Notably, L. pneumophila was detected in both zones, with a relative abundance of up to 4.6 %. Culture-based isolation confirmed the presence of L. pneumophila serogroup 1, Pontiac group, Benidorm subgroup, sequence type 15. Phylogenetic analysis demonstrated a close relationship between this environmental strain and clinical isolates obtained during a Legionnaires' disease outbreak occurred in 2015, which had remained without a confirmed environmental source. Meteorological data from the exposure period revealed wind conditions favouring long-distance aerosol dispersion from irrigated fields toward residential areas. Our findings provide evidence that irrigation infrastructures can act as environmental reservoirs and dissemination routes of L. pneumophila among other airborne pathogens. These results underscore the need to incorporate agricultural irrigation systems into routine environmental surveillance, outbreak investigations, and public health risk assessments.", "zh_summary": "本研究旨在探討農業噴灌系統是否為嗜肺軍團菌（*Legionella pneumophila*）等致病菌的環境宿主與空氣傳播源。團隊對西班牙農村灌溉水體進行分析，總體基因體學顯示其含有逾2萬種微生物，包括21種臨床相關的空氣傳播病原體，且嗜肺軍團菌相對豐度達4.6%。研究成功分離出嗜肺軍團菌血清型1（ST15），系統發育分析證實該環境株與2015年退伍軍人症爆發的臨床分離株高度相關。氣象數據亦支持風向有利於氣膠從農田長距離擴散至住宅區。此發現證實農業灌溉系統為軍團菌的傳播媒介，強調應將其納入例行環境監測與公衛風險評估。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42648218/"}, {"pmid": "42648688", "title": "Temperature Sensitivity of Pyrrhotite-Driven Metavanadate Bioreduction in Groundwater.", "journal": "Environmental research", "impact_factor": 7.7, "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Pyrrhotite-driven metavanadate [V(V)] bioreduction is a promising green strategy for the remediation of vanadium-contaminated aquifers. However, how this microbially driven process responds to different temperatures remains unclear. Herein, the responses of pyrrhotite-driven V(V) bioreduction to different temperatures ranging from 4 to 45 °C were investigated. V(V) removal first increased and then decreased with increasing temperature, peaking at 35 °C, with the reaction rate constant reaching 0.077 d-1. V(V) could be reduced to VO2 precipitates, accompanied by oxidation of S(-II) and Fe(II) to sulfate and Fe(III), respectively. Metagenomic binning revealed that S(-II) oxidation was more sensitive to temperature changes than Fe(II) oxidation for V(V) reducers. Bacteria coupling V(V) reduction with both S(-II) and Fe(II) oxidation (e.g., Ramlibacter sp.) were detected exclusively at 35 °C. The transcription of functional genes (related to V(V) reduction, S(-II) oxidation, and Fe(II) oxidation), electron transport activity and related components all exhibited a temperature-dependent pattern, first increasing and then decreasing, with a peak at 35 °C. This study reveals the temperature sensitivity of pyrrhotite-driven V(V) bioreduction, which is helpful for risk assessment and targeted bioremediation of vanadium contamination under different temperature conditions.", "zh_summary": "本研究旨在探討不同溫度（4至45 °C）對地下水中磁黃鐵礦驅動的偏釩酸鹽 [V(V)] 生物還原過程之影響。研究發現，V(V) 去除率隨溫度升高呈先升後降趨勢，並在 35 °C 時達到峰值（反應速率常數 0.077 d⁻¹），此時 V(V) 被還原為 VO₂ 沉澱，並伴隨硫與鐵的氧化。總體基因體 binning 分析顯示，還原菌的硫氧化過程對溫度變化比鐵氧化更為敏感，且僅在 35 °C 下偵測到能同時耦合硫與鐵氧化的關鍵細菌（如 *Ramlibacter* sp.）。此外，相關功能基因轉錄與電子傳遞活性亦在 35 °C 達到頂峰。本研究揭示了該還原作用的溫度敏感性，為釩污染的環境風險評估與精準生物整治提供了科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42648688/"}, {"pmid": "42647600", "title": "Urogenital immune signatures are associated with birth outcomes after maternal urinary tract infection.", "journal": "Science translational medicine", "impact_factor": 14.6, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Preterm birth is the leading cause of infant mortality, resulting in more than 1 million neonatal deaths globally each year. Maternal urinary tract infection (UTI) during pregnancy increases risk for preterm birth; however, biological processes mediating UTI-associated preterm birth are not well described. We established a murine maternal UTI model in which challenge with uropathogenic Escherichia coli (UPEC) initiated preterm labor and birth in about half of dams. Although bacterial burdens were similar, dams experiencing preterm birth displ
