 remain unclear. This study aimed to identify the bioactive polysaccharide fraction from Shenling Baizhu San and evaluate its pairing with responder bacteria for alleviating high-lactose diet (HLD)-induced intestinal dysfunction. Stepwise ethanol precipitation yielded SLP-2, which was subsequently identified as the principal bioactive fraction through human fecal fermentation, monoculture assays, and an HLD rat model. SLP-2 enriched Eubacterium-associated taxa and supported the growth of Akkermansia muciniphila in monoculture and in vivo. Building on this, a synbiotic combining SLP-2 with A. muciniphila and E. rectale alleviated HLD-induced gut dysfunction; the antibiotic-matched comparison with the probiotics-only group supported an SLP-2-associated contribution. The synbiotic intervention was associated with increased tight junction proteins, MUC2 expression, improved intestinal architecture, and thicker mucus layers. Multi-omics analysis linked co-metabolites, including intestinal 6-MGG and HTy-Ac and systemic DHPV-G, with barrier restoration and an immune profile characterized by increased IL-10 and lower TLR4 expression. These findings suggest that SLP-2-based synbiotic intervention alleviates HLD-induced intestinal dysfunction through microbiota-metabolite-barrier modulation, providing preclinical evidence for future functional-food strategies pending human validation.", "zh_summary": "本研究旨在探討參苓白朮散多醣活性組分（SLP-2）結合特定菌株，對高乳糖飲食（HLD）引發之腸道功能障礙的緩解作用。研究發現，SLP-2能促進*A. muciniphila*與真桿菌屬相關菌群生長。以SLP-2搭配益生菌的合生元配方，能顯著改善HLD大鼠的腸道屏障，包含增加緊密連接蛋白與MUC2表達、增厚黏液層。多體學分析顯示，其保護作用與腸道及全身性代謝物（如6-MGG、DHPV-G）的調節，以及抗發炎反應（提升IL-10、降低TLR4）密切相關。此發現為開發防治乳糖不耐症的功能性食品提供了臨床前依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637476/"}, {"pmid": "42637471", "title": "Fucoidan from giant kelp alleviates postmenopausal osteoporosis by regulating the betaine-OPG/RANKL/RANK signaling axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Postmenopausal osteoporosis (PMOP), characterized by excessive bone resorption and impaired bone remodeling, remains a significant global health challenge. This study investigated the protective effects of fucoidan from giant kelp (GKP) against PMOP and its underlying mechanisms in ovariectomized mice. GKP supplementation attenuated bone loss by preserving trabecular microarchitecture, normalizing systemic mineral homeostasis, and suppressing osteoclastogenesis, as evidenced by the downregulation of osteoclast-related genes. 16S rRNA gene sequencing revealed that GKP reshaped the gut microbiota by decreasing the Bacteroidota/Firmicutes ratio and enriching beneficial taxa, which promoted short-chain fatty acid production. Targeted metabolomics revealed that GKP induced profound systemic metabolic reprogramming, particularly amino acid metabolism, and identified betaine as a key systemic metabolite effector upregulated following GKP treatment. In vitro assays demonstrated that betaine suppressed receptor activator of nuclear factor-κB ligand (RANKL)-induced osteoclast differentiation and mitigated inflammation. In vivo validation demonstrated that betaine intervention recapitulated the osteoprotective phenotype observed in GKP-treated mice, which was associated with regulation of the osteoprotegerin/RANKL/RANK signaling axis. These results indicate that GKP exerts anti-osteoporotic effects in association with changes in gut microbiota and systemic metabolism, while betaine-mediated regulation of the OPG/RANKL/RANK signaling may contribute to its osteoprotective activity.", "zh_summary": "本研究探討巨藻褐藻醣膠（GKP）對去卵巢小鼠更年期後骨質疏鬆症（PMOP）的保護機制。結果顯示，補充GKP能有效減少骨質流失並抑制破骨細胞生成。16S定序顯示GKP重塑了腸道菌群（降低擬桿菌門/厚壁菌門比例），促進短鏈脂肪酸產生。代謝組學分析發現，GKP顯著提升了系統性代謝物甜菜鹼（betaine）的含量。體內外實驗進一步證實，甜菜鹼透過調控OPG/RANKL/RANK信號軸，能抑制破骨細胞分化並緩解骨質流失。本研究證實GKP具備透過「腸道菌群-代謝物」軸抗骨質疏鬆的潛力，為PMOP防治提供了科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637471/"}, {"pmid": "42637450", "title": "Highland barley polysaccharides promoted lactose intestinal fermentation in vitro: Unveiling the dynamic response of gut microbiota and polysaccharide structure.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "乳糖不耐症患者的糞便檢體（未提及具體數量）", "has_fulltext": false, "abstract": "Lactose intolerance affects over 70% of the global population due to the untimely metabolism of lactose in the colon. To accelerate lactose metabolism, we innovatively employed highland barley polysaccharides (HBP) to modulate the colonic fermentation efficiency of lactose using an in vitro fermentation model and fecal samples from lactose intolerant patients. With the addition of HBP, the consumption efficiency of lactose began to increase after 6 h of fermentation. At 48 h, lactose consumption increased by 29%, surpassing the effect of commercial prebiotics. Meanwhile, HBP with lower molecular weight (HBP-L, 8.69 × 104 g/Mol) exhibited more effective impacts than HBP with high molecular weight (HBP-H, 1.22 × 105 g/Mol), which was particularly evident during the 12-48 h of fermentation. More importantly, HBP, particularly HBP-L, substantially enriched Segatella, Bifidobacterium, and Ligilactobacillus in a time-dependent manner and was positively correlated with decreased lactose levels and elevated bacterial lactase activity, resulting in significant conversion of lactose to lactic acid and short-chain fatty acids. During the first 12 h of fermentation, HBP-L underwent more significant degradation than HBP-H. Meanwhile, the xylose residues and Glcp glycosidic bonds in HBP-L were preferentially utilized, while it was glucose residue in HBP-H. Thus, it indicated that HBPs were degraded and altered the composition of the gut microbiota, thereby enhancing the fermentation efficiency of lactose. Our findings provide a theoretical basis for developing targeted prebiotic foods to manage lactose intolerance.", "zh_summary": "本研究旨在探討青稞多醣（HBP）如何調控乳糖不耐症患者的腸道菌群，以促進體外乳糖發酵與代謝。研究發現，添加 HBP（特別是低分子量的 HBP-L）能在發酵 48 小時後提升乳糖消耗效率達 29%，效果顯著優於商業益生元。機制上，HBP-L 在發酵初期降解更為顯著，並能隨時間特異性富集 *Segatella*、雙歧桿菌屬（*Bifidobacterium*）及 *Ligilactobacillus*，進而提升細菌乳糖酶活性，將乳糖轉化為乳酸與短鏈脂肪酸。本研究證實了青稞多醣能透過重塑腸道菌群結構來加速乳糖代謝，為開發緩解乳糖不耐症的標靶益生元食品提供了重要科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637450/"}, {"pmid": "42637441", "title": "Microbial succession drives quality deterioration in refrigerated golden pompano (Trachinotus ovatus): regulatory network of dominant spoilage microbiota on characteristic biomarkers.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Elucidating the quality deterioration mechanisms of refrigerated golden pompano (Trachinotus ovatus), this study integrated 16S rRNA gene sequencing and untargeted metabolomics to systematically dissect how microbial ecological succession drives metabolic changes. As critical spoilage indicators, total volatile basic nitrogen (TVB-N) and thiobarbituric acid reactive substances (TBARS) continuously increased during storage, indicating significant deterioration by day 6. Microbial community succession analysis revealed that Psychrobacter, Shewanella, and Pseudomonas gradually became the dominant microbiota in the late storage stage. Metabolite enrichment analysis further demonstrated that this shift redirected the metabolic focus from early-stage nucleotide degradation to late-stage protein hydrolysis and amino acid metabolism. Moreover, multivariate statistical analysis identified 50 potential spoilage biomarkers, among which biogenic amines (histamine, tyramine, and phenylethylamine) were recognized as key indicators reflecting spoilage progression. Correlation network analysis revealed positive correlations between Pseudomonas and Shewanella abundances and the accumulation of these biogenic amines. This suggests that these two genera act as the core functional microbiota, driving spoilage metabolite generation and subsequent quality deterioration. Pathway analysis of potential spoilage biomarker generation indicates that amino acid and nucleotide metabolism constitute the core spoilage pathways, with lipid oxidation serving as a complementary mechanism. Overall, this study elucidates the spoilage mechanisms of refrigerated golden pompano, providing chemical targets for early biomarker detection and targeted antibacterial strategies.", "zh_summary": "本研究旨在探討冷藏金鯧魚品質劣化的機制。研究結合 16S rRNA 基因定序與非靶向代謝組學，分析微生物群落演替如何驅動代謝變化。結果顯示，金鯧魚冷藏至第 6 天時顯著腐敗。在貯藏後期，*Psychrobacter*、*Shewanella* 與 *Pseudomonas* 逐漸成為優勢菌群，使代謝焦點自初期的核苷酸降解轉向後期的蛋白質水解與氨基酸代謝。研究鑑定出 50 個潛在腐敗生物標誌物（如組胺、酪胺等生物胺），並發現 *Pseudomonas* 和 *Shewanella* 的豐度與這些生物胺的累積呈正相關，為驅動腐敗的核心菌群。本研究闡明了金鯧魚的腐敗機制，為食品早期變質檢測及靶向抑菌策略提供了科學依據與化學標靶。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637441/"}, {"pmid": "42637430", "title": "Regional differentiation of microbial communities and metabolites in Yunnan dry-cured beef: insights from high-throughput sequencing and untargeted metabolomics.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "To reveal the effects of regional processing on quality, microbial communities and metabolites of traditional Yunnan dry-cured beef, samples from Xundian (XD), Yuxi (YX) and Honghe (HH) were analyzed. High-throughput sequencing and UHPLC-Q-Exactive HF/MS untargeted metabolomics were applied. Sensory scores and physicochemical Properties differed significantly (p < 0.05). Bacillota and Staphylococcus dominated bacterial communities. The observed differences in microbial communities and metabolites among regions are shaped by the combined effects of geographical environment and processing conditions. Ascomycota was the main fungal phylum. Debaryomyces dominated XD and HH samples. YX samples had a unique fungal profile dominated by Rhodotorula and Cladosporium. A total of 1320 metabolites were identified. 196 differential metabolites were screened. Key pathways included glycerophospholipid metabolism, pyrimidine metabolism and arachidonic acid metabolism. Correlation analysis indicated that Staphylococcus and Lactococcus were positively associated with amino acid derivatives, while Latilactobacillus and Debaryomyces correlated with organic acids and glycerophospholipids. These findings revealed the potential microbial-metabolic association underlying regional quality differences. They provide support for quality control and traceability of dry-cured beef.", "zh_summary": "本研究旨在探討地理區域與加工工藝對雲南傳統乾醃牛肉（尋甸、玉溪、紅河三地）品質、微生物群落及代謝物的影響。研究結合高通量定序與非靶向代謝組學技術，發現不同地區的乾醃牛肉在感官評分與理化性質上存有顯著差異。細菌群落以厚壁菌門和葡萄球菌屬為主；真菌群落中，尋甸和紅河樣品以德巴利酵母屬為主，玉溪樣品則以紅酵母屬與枝孢菌屬為特有優勢菌。代謝組學共鑑定出1320種代謝物，其中196種為差異代謝物，主要涉及甘油磷脂、嘧啶及花生四烯酸代謝通路。關聯分析顯示，葡萄球菌屬和乳球菌屬與氨基酸衍生物呈正相關，而廣義乳桿菌屬與德巴利酵母屬則與有機酸及甘油磷脂密切相關。本研究揭示了微生物與代謝物的關聯性，為乾醃牛肉的品質控制與產地溯源提供了重要科學依據。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637430/"}, {"pmid": "42637417", "title": "Allergic responses, gut microbiome and serum metabolism of mice: Effects of epigallocatechin gallate combined with sodium pyrophosphate modified parvalbumin.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Epigallocatechin gallate (EGCG) combined with sodium pyrophosphate (SP) modified parvalbumin (PV) was proposed to sensitize mice, and investigated whether allergic responses changes were associated with gut microbiome and serum metabolism of mice. EGCG combined with SP modified PV has structural changes, and alleviated jejunal damage in mice, while decreased specific serum IgG, IgG1 and IgE levels and may rebalanced Th1/Th2 immune responses. PV-induced allergic responses disrupted gut microbiota and reduced short-chain fatty acids (SCFAs) levels. In contrast, the modified PV could alter the relative abundance of allergic responses-related gut microbiota, such as g__unclassified_f__Lachnospiraceae, g__norank_o__Clostridia_UCG-014 and g__Alistipes, alongside elevated SCFAs levels. Additionally, the modified PV could affect multiple metabolic pathways in serum, and exert a positive impact on phosphatidylethanolamine and phosphatidylcholine levels in glycerophospholipid metabolism. Therefore, the reduction in the allergic responses of PV modified by EGCG and SP were associated with changes in gut microbiota and modulation of glycerophospholipid metabolisms. These correlational observations provided preliminary associative evidence supporting the potential utility of combined EGCG-SP modification as a hypoallergenic processing approach for fish parvalbumin mitigation.", "zh_summary": "本研究旨在探討利用表沒食子兒茶素沒食子酸酯（EGCG）結合焦磷酸鈉（SP）修飾魚類主要過敏原小清蛋白（PV），對小鼠過敏反應、腸道菌群及血清代謝的影響。結果顯示，修飾後的PV結構發生改變，能顯著減輕小鼠空腸損傷，降低血清特異性IgG、IgG1及IgE水平，並重建Th1/Th2免疫平衡。此外，修飾後的PV調節了過敏相關腸道菌群（如*Lachnospiraceae*與*Alistipes*）的相對豐度，提升了短鏈脂肪酸（SCFAs）含量，並改善血清甘油磷脂代謝。本研究證實EGCG-SP聯合修飾可作為降低魚類過敏原性的潛在低致敏加工方法。", "date": "2026-07-19", "url": "https://pubmed.ncbi.nlm.nih.gov/42637417/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        const itemsPerPage = 15;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 事件監聽
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選 (包含於字串內)
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("page-info").textContent = `第 ${currentPage} 頁 / 共 ${totalPages || 1} 頁 (篩選出 ${filteredArticles.length} 筆)`;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
