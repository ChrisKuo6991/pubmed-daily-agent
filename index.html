    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42638587", "title": "Valorization of spent black tea polyphenols as a functional coating for probiotic protection and colitis alleviation.", "journal": "Food & function", "impact_factor": "5.4", "tech_types": "16S, others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Excessive reactive oxygen species (ROS) play a central role in the development of inflammatory bowel disease (IBD). A promising therapeutic strategy involves delivering probiotics alongside polyphenolic antioxidants, which can protect the probiotics while scavenging ROS. Although biomass is a versatile source of polyphenols, abundant agro-industrial waste remains largely untapped, despite its food-grade safety, anti-inflammatory properties, and sustainability. In this study, we focused on spent black tea (SBT), a widely available food processing byproduct, as a rich source of polyphenols. We developed a simple and environmentally friendly method to coordinate polyphenols extracted from SBT using hot water with ferric ions, creating a self-assembled metal-polyphenol network on the surface of Escherichia coli Nissle 1917 (ECN), resulting in the formation of ECN@SBT-Fe. This biomass-derived coating provided ECN with enhanced ROS scavenging abilities, improved survival under simulated gastrointestinal stress, and extended intestinal retention. In a mouse model of DSS-induced colitis, oral administration of ECN@SBT-Fe significantly reduced inflammation, restored epithelial barrier integrity, decreased oxidative stress, and effectively modulated gut microbiota by increasing diversity and promoting beneficial commensal bacteria. This research demonstrates a biomass-derived coating that serves as both a protective shield and a therapeutic agent, presenting a simple and sustainable encapsulation strategy for IBD treatment.", "zh_summary": "本研究旨在利用廢棄紅茶（SBT）多酚與鐵離子，為益生菌 ECN 構建自組裝金屬-多酚網絡保護外殼（ECN@SBT-Fe），以治療發炎性腸道疾病（IBD）。此塗層顯著提升了益生菌的抗氧化（ROS清除）能力、耐胃酸性及腸道滯留。在腸炎小鼠模型中，口服 ECN@SBT-Fe 能有效減輕發炎、修復腸道屏障並降低氧化壓力，同時可增加腸道菌群多樣性、促進有益菌生長。本研究成功將農業廢棄物轉化為兼具保護與治療功效的材料，為 IBD 治療提供了一種簡單、綠色且具永續性的益生菌遞送與封裝策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638587/"}, {"pmid": "42638506", "title": "Systemic Signatures Differentiating Varicocele-Associated Semen Quality Heterogeneity: An Exploratory Multi-Omics Pilot Study.", "journal": "Andrology", "impact_factor": "3.4", "tech_types": "16S, metabolomics", "sample_size": "25 位左側精索靜脈曲張（VC）年輕男性受試者（VC_L 組 n=17，VC_N 組 n=8）", "has_fulltext": false, "abstract": "Significant semen-quality heterogeneity exists among varicocele (VC) patients with similar macro-anatomical backgrounds. This exploratory pilot study characterized and compared fecal microbial configurations and relative serum metabolomic signatures associated with individual phenotypic divergence in left-sided clinical VC. Twenty-five young males with left-sided VC were stratified into low semen quality (VC_L, n = 17) and normal semen quality (VC_N, n = 8) groups. Multi-omics profiling was performed via fecal 16S rRNA sequencing and serum untargeted LC-MS/MS metabolomics. Fecal microbiota alpha and beta diversity metrics were comparable between groups. LEfSe analysis revealed taxonomic differentiation: the VC_N group showed enrichment of Fusobacteriota lineages and Faecalimonas, whereas the VC_L group showed higher discriminative abundance of the Ruminococcus gauvreauii group and UCG_003. Cross-domain integrative profiling revealed distinct modular patterns: a cluster dominated by Bacteroides and Blautia aligned positively with circulating carbohydrate-related metabolites (inositol and D-ribose), whereas potential opportunistic taxa such as Escherichia_Shigella showed inverse associations with these metabolites and positive associations with lipid-related features (palmitoylcarnitine). Serum untargeted metabolomics further showed distinct relative ion intensities: VC_L exhibited higher signals of lipid-, amino acid-, and TCA cycle-related features (oleoyl ethanolamide, palmitoylcarnitine, taurine, and L-malate), whereas VC_N showed higher intensities of arachidonic acid, citric acid, choline, and D-ribose. Semen-quality-defined subgroups of left-sided VC patients exhibit distinct gut microbial taxonomic distributions and relative serum metabolic profiles. These preliminary, associative findings provide a descriptive multi-omics landscape of individual phenotypic heterogeneity and generate hypotheses regarding the gut-testis axis.", "zh_summary": "本研究旨在探討精索靜脈曲張（VC）患者間精液品質差異的潛在生物標記。研究人員透過 16S rRNA 定序與非標靶代謝體學分析，比較了精液品質正常組（VC_N）與低品質組（VC_L）患者的腸道菌相及血清代謝特徵。研究發現，兩組在腸道菌叢豐富度上雖無顯著差異，但在特定菌群分布上顯著不同；VC_N 組富含梭桿菌門及 *Faecalimonas*，而 VC_L 組則以 *Ruminococcus* 及 *UCG_003* 為主。此外，血清代謝分析顯示，VC_L 組在脂質、胺基酸及 TCA 循環相關代謝物（如棕櫚醯肉鹼、牛磺酸）表現較高，而 VC_N 組則表現出較高的花生四烯酸與核糖訊號。此研究初步揭示了「腸道-睪丸軸」在影響 VC 患者精液品質表型異質性中的潛在關聯，為理解男性不孕症的系統性生理機制提供了重要的科學假設。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638506/"}, {"pmid": "42638477", "title": "Precision monitoring of kidney transplant health via cell-free DNA and RNA.", "journal": "Current opinion in organ transplantation", "impact_factor": "1.9", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Cell-free nucleic acids (cfNAs) in plasma and urine have emerged as noninvasive biomarkers for monitoring kidney transplant health. This review summarizes recent advances in the development of cell-free DNA (cfDNA) and cell-free RNA (cfRNA) assays for immune and infection-related complications, and discusses their potential to enable precision monitoring of allograft health. Large prospective multicenter studies have established donor-derived cfDNA as a robust biomarker of acute allograft rejection, with increasing evidence supporting the use of cfDNA for surveillance, prognostication, and integration with complementary molecular and clinical biomarkers. Metagenomic cfDNA assays enable broad detection of bacterial, viral, and fungal pathogens. More recently, cfRNA profiling has emerged as a complementary approach that captures tissue-type and cell-type-specific transcriptional activity, providing molecular insight into immune activation, tissue injury, and disease mechanisms. Urine cfRNA is particularly promising because of its enriched representation of kidney-derived transcripts. Cell-free nucleic acid assays are reshaping the management of kidney transplant recipients by enabling noninvasive assessment of rejection, infection, and allograft injury. Continued advances in sequencing technologies, computational methods, and multimodal biomarker integration are expected to accelerate their clinical adoption and improve precision care for transplant recipients.", "zh_summary": "本研究探討循環無細胞核酸（cfNA，包含 cfDNA 與 cfRNA）作為腎臟移植監測工具的臨床價值。研究指出，供體來源的 cfDNA 已證實為急性移植排斥的強大生物標記，能有效進行術後監測與預後評估。透過宏基因組學（Metagenomics）分析 cfDNA，可廣泛檢測細菌、病毒及真菌感染；而 cfRNA 則能補充組織與細胞特異性的轉錄活性資訊，洞察免疫活化與組織損傷機轉。特別是尿液中的 cfRNA，因富含腎臟來源轉錄本，具備高度診斷潛力。總體而言，這類非侵入性檢測技術正重塑移植病人的照護模式，結合多模態生物標記將有助於實現更精準的移植預後管理。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638477/"}, {"pmid": "42638468", "title": "Metabolic profiling reveals subtype-specific responses to jerantinine A acetate in breast cancer cells.", "journal": "The Analyst", "impact_factor": "N/A", "tech_types": "metabolomics", "sample_size": "4 個乳癌細胞株（MCF-7、BT-474、MDA-MB-231、SKBR-3）", "has_fulltext": false, "abstract": "Jerantinines are natural indole alkaloids with promising anticancer activity in breast cancer cells via mechanisms of action involving tubulin binding and disruption of microtubule dynamics, with growth inhibition values, GI50 < 0.4 µM. However, metabolic responses of different breast cancer phenotypes are not yet understood. In this work, LC-MS-based untargeted metabolomics was used to investigate the response of four selected breast cancer cell lines representing different subtypes (MCF-7, BT-474, MDA-MB-231, and SKBR-3) to treatment with Jerantinine A acetate (JAa). Based on univariate, multivariate and pathway analyses, the results showed metabolic perturbations in amino-acid metabolism, fatty acid oxidation, and redox homeostasis. In breast cancer cells treated with 0.4 µM of JAa for 72 h, the elevated levels of oxidation-related metabolites, including 2-oxoglutarate, butyryl carnitine, propionyl carnitine, and 5-oxo-L-proline, indicated increased oxidative stress. Interestingly, only MCF-7 cells accumulated the antioxidants glutathione and taurine relative to untreated controls, and this response was accompanied by upregulation of wild-type p53 in this cell line. This p53-associated antioxidant capacity offers a mechanistic explanation for the difference in observed GI50 values: GI50 of 0.37 µM in MCF-7 compared to 0.19 µM and 0.14 µM in SKBR-3 and BT-474 cells, respectively, both of which harbour mutant p53 and did not mount an equivalent antioxidant response. These findings provide new insights into the metabolic effects of JAa on breast cancer cells and further support its potential as an anticancer agent. The observed metabolic differences between cell lines may inform future strategies for personalized therapy.", "zh_summary": "本研究旨在探討不同亞型的乳癌細胞對天然抗癌物質「乙酸杰蘭亭鹼A (JAa)」的代謝反應。研究團隊利用LC-MS非靶向代謝組學技術，分析了四種代表不同乳癌亞型的細胞株。結果發現，JAa會干擾細胞的氨基酸代謝、脂肪酸氧化與氧化還原平衡。有趣的是，僅具有野生型 p53 基因的 MCF-7 細胞能藉由累積麩胱甘肽與牛磺酸等抗氧化物質來抵抗氧化壓力，因而對 JAa 具備較高的耐受性（GI50 值較高），而其他 p53 突變的細胞株則無此保護機制。本研究揭示了 JAa 誘導乳癌細胞代謝擾動的分子機制，並為未來乳癌的精準與個人化治療提供了重要依據。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638468/"}, {"pmid": "42638446", "title": "Saliva Liquid Biopsy for Detection of Oral and Systemic Diseases.", "journal": "Journal of periodontal research", "impact_factor": "3.4", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Saliva has emerged as a compelling liquid biopsy for the non-invasive diagnosis and monitoring of both oral and systemic diseases. Secreted by major and minor salivary glands and enriched by gingival crevicular fluid, epithelial turnover, immune mediators, microbial products, and plasma-derived constituents, saliva reflects a biologically integrated interface between local oral environments and systemic physiology. This dual origin enables detection of disease-associated signals across multiple molecular layers, including extracellular RNA, cell-free DNA, genomic and epigenetic material, proteins, metabolites, microbial signatures, and hormones. Advances in high-throughput sequencing, mass spectrometry, and ultrasensitive immunoassays have revealed that salivary analytes can capture dynamic pathological processes ranging from periodontal inflammation and dental caries to oral and head and neck cancers, as well as systemic conditions such as non-oral cancers and autoimmune, cardiometabolic, infectious, endocrine, and neurodegenerative diseases. In particular, extracellular vesicle-encapsulated RNA, cfDNA fragmentomics, and methylation patterns have expanded the diagnostic reach of saliva beyond conventional protein-based biomarkers, while integrated multi-omics approaches increasingly improve diagnostic performance. Despite this progress, clinical translation remains constrained by biological complexity, including variable glandular contributions, oral microbiome interactions, and pre-analytical variability in collection and processing. Emerging point-of-care technologies, microfluidic platforms, and artificial intelligence-driven multi-omic integration are beginning to address these limitations, enabling higher analytical sensitivity and improved disease stratification. Regulatory pathways, including in vitro diagnostic frameworks and laboratory-developed test structures, are progressively accommodating salivary assays, as demonstrated during the COVID-19 pandemic. However, widespread clinical adoption will require rigorous standardization, large-scale validation, and demonstration of clinical utility. Together, saliva-based liquid biopsy represents a rapidly evolving diagnostic paradigm with the potential to shift disease detection towards earlier, minimally invasive, and data-rich precision medicine approaches across dentistry and systemic healthcare.", "zh_summary": "本研究探討唾液作為非侵入性液態切片在診斷口腔及全身性疾病中的應用潛力。唾液含有源自口腔局部環境與全身生理的分子資訊，包括游離核酸（cfDNA/RNA）、蛋白質、代謝物及微生物標記。隨著高通量定序與超靈敏免疫分析技術的發展，唾液已能有效捕捉從牙周病、口腔癌到全身性癌症、自體免疫及神經退化性疾病的病理訊號。\n\n儘管多體學（Multi-omics）整合分析大幅提升了診斷精確度，但臨床應用仍面臨唾液組成複雜、採集標準化不足及生物變異性等挑戰。未來結合微流體技術、即時檢測系統（POCT）與人工智慧數據整合，有望克服上述限制。本研究強調，唾液檢測不僅能推動精準醫療的普及，更具備實現早期診斷與低侵入性監測的巨大潛力，是未來口腔醫學與全身健康照護的重要發展方向。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638446/"}, {"pmid": "42638059", "title": "[Effects of soybean fermented bioactive peptides on intestinal health of bullfrogs].", "journal": "Sheng wu gong cheng xue bao = Chinese journal of biotechnology", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "450 隻牛蛙", "has_fulltext": false, "abstract": "To address the challenges of antibiotic overuse and high feed costs in bullfrog aquaculture, this study aimed to systematically evaluate the effects of soybean fermented bioactive peptides (SFP) as a functional feed additive on the growth performance and intestinal health of bullfrogs (Lithobates catesbeianus). A total of 450 healthy bullfrogs with an initial body weight of (100.0±2.0) g were randomly assigned into three groups: group C (basal diet), the 2% SFP group (basal diet supplemented with 2% SFP), and the 3% SFP group (basal diet supplemented with 3% SFP). The feeding trial lasted for 6 weeks. After the experiment, growth performance, intestinal morphology, digestive enzyme activities, relative mRNA expression levels of inflammatory cytokines, and expression levels of the tight junction protein ZO-1 were systematically measured. Additionally, the intestinal microbiota structure was analyzed using 16S rRNA gene high-throughput sequencing, and the content of short-chain fatty acids (SCFAs) in the intestine was determined by gas chromatography-mass spectrometry (GC-MS). The results showed that compared with the control group, dietary SFP supplementation significantly promoted bullfrog growth and improved intestinal health. Among the treatments, the 2% SFP group exhibited the most prominent effects, with significantly higher weight gain rate and specific growth rate than those in the control group and the 3% SFP group (P0.05). The 2% SFP supplementation also significantly increased the villus height in the jejunum and ileum (P0.05), enhanced intestinal digestive enzyme activities, remarkably downregulated the mRNA expression levels of intestinal pro-inflammatory cytokines (P0.05), and upregulated the expression of the tight junction protein ZO-1. Further analysis of the intestinal microbiota revealed that 2% SFP optimized the microbial community structure by increasing the relative abundance of beneficial bacteria such as Clostridium and Lactococcus. Although the 3% SFP group exhibited an increased relative abundance of Bacteroides, its modulatory effect on the intestinal microbiota structure was inferior to that of the 2% SFP group. Consequently, the intestinal content of acetic acid and n-butyric acid was significantly higher in the 2% SFP group than in the 3% SFP group (P0.05). Therefore, these findings demonstrate that dietary supplementation with 2% SFP enhances the growth performance and intestinal health of bullfrogs by optimizing the intestinal microbiota composition, strengthening intestinal metabolic capacity, improving intestinal barrier integrity, and facilitating better digestion and absorption. This study establishes an effective feeding strategy for feed additives to promote healthy bullfrog cultivation, thereby facilitating the green and sustainable development of the bullfrog aquaculture industry. 为应对牛蛙养殖中存在的抗生素滥用及饲料成本压力等问题，本研究旨在系统评估生物发酵大豆活性肽(soybean fermented bioactive peptides, SFP)作为功能性饲料添加剂对牛蛙生长性能及肠道健康的调控作用。选取450只初始体重为(100.0±2.0) g的健康牛蛙，随机分为3组:C组(饲喂基础饲料)、2% SFP组(基础饲料中添加2% SFP)及3% SFP组(基础饲料中添加3% SFP)，进行为期6周的养殖实验。实验结束后，系统测定了牛蛙的生长指标、肠道组织形态、消化酶活性、炎症因子mRNA相对表达水平、紧密连接蛋白ZO-1的表达水平，并采用16S rRNA基因高通量测序技术分析了肠道菌群结构，采用气相色谱-质谱联用技术测定了肠道短链脂肪酸的含量。结果表明，与对照组相比，饲料中添加SFP能显著促进牛蛙生长并改善肠道健康。其中，2% SFP添加剂量的改善效果最为显著，该组牛蛙的增重率、特定生长率均显著高于对照组和3% SFP组(P0.05)。同时2% SFP能显著改善空肠和回肠的绒毛高度(P0.05)，提升肠道消化酶活性，显著下调肠道促炎症因子的基因表达(P0.05)，增强紧密连接蛋白ZO-1的表达。肠道微生物区系分析进一步揭示，2% SFP可优化菌群结构，提高梭菌属和乳球菌属等有益菌的相对丰度。3% SFP虽提高了拟杆菌属的相对丰度，但其对肠道菌群结构的优化效果不及2% SFP。2% SFP组肠道短链脂肪酸乙酸、丁酸的含量均显著高于3% SFP组(P0.05)。研究表明，饲料中添加2% SFP能通过优化肠道菌群结构，加强肠道代谢能力，增强肠道屏障完整性，改善肠道消化吸收功能，从而提升牛蛙的生长性能和肠道健康水平。本研究为牛蛙健康养殖提供了一种高效的饲料添加剂投喂方案，有助于推动牛蛙养殖产业的绿色可持续发展。.", "zh_summary": "本研究旨在評估生物發酵大豆活性肽（SFP）作為牛蛙養殖飼料添加劑的功效。實驗將 450 隻牛蛙分為對照組、2% SFP 組及 3% SFP 組，進行為期 6 週的飼養試驗。結果顯示，2% SFP 組的效果最為顯著，能有效提升牛蛙的生長性能，改善腸道絨毛形態，增強消化酶活性與緊密連接蛋白（ZO-1）表達，並顯著下調促炎細胞因子的 mRNA 水平。微生物分析與代謝組學檢測發現，2% SFP 能優化腸道菌群結構（如增加梭菌屬與乳球菌屬比例），並顯著提升腸道短鏈脂肪酸（如乙酸、丁酸）含量。本研究證實，添加 2% SFP 可作為一種有效的營養策略，透過改善腸道健康與代謝功能來取代抗生素，促進牛蛙產業的綠色永續發展。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638059/"}, {"pmid": "42638419", "title": "Tungsten Oxide Sub-Nanowires as Inorganic Dental Collagen Crosslinker With Antibacterial Capacity.", "journal": "Small (Weinheim an der Bergstrasse, Germany)", "impact_factor": "N/A", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The structural stability of dental collagen plays a critical role in preserving the integrity and function of tooth. However, conventional organic cross-linking agents are often compromised in moist environments and vulnerable to bacterial degradation. Here, we propose an inorganic synergistic \"cross-linking-antibacterial\" strategy utilizing tungsten oxide sub-nanowires (TO-SNWs). This strategy effectively overcomes the limitations of organic cross-linking imposed by humid environments and significantly enhance the thermostability, mechanical strength, and structural stability of dental collagen. Furthermore, TO-SNWs exert targeted antibacterial activity against the Firmicutes phylum, which harbors a majority of oral pathogens, while maintaining the overall diversity of the oral microbiota. Mechanism analysis reveals that antimicrobial effects stem from multilevel TO-SNWs-bacteria interactions, which compromise the permeability and metabolism. In conclusion, this inorganic \"cross-linking-antibacterial\" approach not only reinforces dental collagen stability, but also suppresses pathogenic microorganisms' activity, representing a promising and innovative strategy for dentin biomodification.", "zh_summary": "本研究開發了一種創新的無機「交聯-抗菌」策略，利用氧化鎢次奈米線（TO-SNWs）作為牙本質膠原蛋白的交聯劑。傳統有機交聯劑易受濕氣影響並遭細菌降解，而 TO-SNWs 不僅顯著提升了膠原蛋白的機械強度與熱穩定性，還具備針對厚壁菌門（Firmicutes）——即多數口腔致病菌宿主——的靶向抗菌能力，同時維持口腔微生物群落的整體多樣性。實驗機制分析顯示，TO-SNWs 是透過多層次的細胞交互作用，破壞細菌細胞膜通透性並干擾其代謝過程來達到抑菌效果。此項研究為牙本質生物改性提供了一種兼具結構補強與生物防護的新型臨床解決方案。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638419/"}, {"pmid": "42638349", "title": "Genomic Insights into Divergent Evolutionary Strategies and Vector Capacities of Ticks.", "journal": "Genomics, proteomics & bioinformatics", "impact_factor": "N/A", "tech_types": "small genome", "sample_size": "4 個蜱蟲物種（2 種軟蜱、2 種硬蜱）以及 2 個立克次體（Rickettsia）共生菌基因體", "has_fulltext": false, "abstract": "Ticks, which are globally distributed, transmit a wide range of human and animal pathogens. Soft and hard ticks are two major tick families exhibiting distinct vector capacities and blood-feeding abilities. However, understanding the genetic basis of these differences is hindered by the scarcity of high-quality tick genomes, particularly for soft ticks. Here, we present high-quality genomes of two soft and two hard tick species of both evolutionary and medical importance, and compare the genomic characteristics of the two tick families. Compared with soft ticks, hard ticks exhibited faster genome evolution, characterized by larger genome sizes, higher rates of gene gain and loss, and a greater number of positively selected genes. Both tick families exhibited frequent positive selection across metabolism and organismal systems, sharing a core set of adaptive genes but undergoing refinement at different sites. Gene families underpinning various vector capacities, including those involved in cuticle structure, heme biosynthesis, egg waxing, and immune pathways, were identified. Additionally, we assembled the genomes of two novel Rickettsia endosymbionts from soft ticks, revealing high genomic divergence and lineage-specific adaptations to their hosts. These genomic resources provide fundamental insights into the genetic basis of tick biology and vector capacity, highlighting the divergent evolutionary strategies of blood-feeding arthropods shaped by their ecological niches.", "zh_summary": "本研究針對軟蜱與硬蜱兩大蜱蟲家族進行高質量全基因體定序與比較分析，旨在解析其生物學差異與傳病能力的遺傳基礎。研究發現，硬蜱展現出更快速的基因體演化速率，包括更大的基因體規模、較高的基因增減速率及較多受正向選擇的基因。儘管兩者在代謝與系統層面共享核心適應基因，但在關鍵傳病功能（如表皮結構、血基質生物合成及免疫路徑）上展現了演化分歧。此外，研究團隊亦組裝了兩種軟蜱共生立克次體菌株的基因體，揭示了其高度的遺傳分歧與宿主特異性適應。此研究為理解蜱蟲生物學、載體傳播能力及生態適應策略提供了重要的基因體資源，對未來防治蜱媒傳染病具有關鍵科學價值。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638349/"}, {"pmid": "42638285", "title": "Lactobacillus acidophilus LA15 plus Bifidobacterium animalis subsp. lactis Bi66 mitigates cyclophosphamide-induced immunosuppression in association with gut-immune axis modulation and AhR signaling recovery.", "journal": "Journal of the science of food and agriculture", "impact_factor": "3.5", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Cyclophosphamide (CTX), a widely used alkylating chemotherapeutic agent, causes severe systemic immunosuppression and gut microbiota dysbiosis through non-specific cytotoxicity, increasing infection risk and impairing chemotherapy outcomes. Safe and effective adjuvant therapies for chemotherapy-related immune injury remain limited. This study evaluated the protective effect of compound AB probiotics (Lactobacillus acidophilus LA15 combined with Bifidobacterium animalis subsp. lactis Bi66) against CTX-induced immunosuppression in mice and explored correlations associated with the gut-immune axis. CTX challenge induced immune organ atrophy, cytokine imbalance, impaired innate and adaptive immunity, intestinal barrier disruption, reduced short-chain fatty acid (SCFA) synthesis and gut dysbiosis. AB probiotic intervention alleviated these injuries dose-dependently: it restored thymus and spleen indexes, rebalanced serum cytokines, improved core immune functions, and repaired ileal mucosal pathological damage. Furthermore, probiotic treatment was accompanied by elevated fecal SCFA concentrations, upregulated tight junction gene expression, recovered aryl hydrocarbon receptor (AhR)/ERK/STAT3 transcription, enriched beneficial bacterial genera, and suppressed opportunistic pathogens. Compound AB probiotics alleviate CTX-induced immunosuppression in mice, and this effect correlates with restored gut microecology, enhanced SCFA metabolism, repaired intestinal barrier, and activated AhR signaling. These findings provide evidence for developing probiotic preparations as adjuvant interventions against chemotherapy-related immunosuppression. © 2026 Society of Chemical Industry.", "zh_summary": "本研究探討益生菌組合（嗜酸乳桿菌 LA15 與動物雙歧桿菌 Bi66）對環磷醯胺（CTX）誘導之免疫抑制小鼠模型的保護作用。CTX 化療常引發免疫器官萎縮、腸道菌群失調及黏膜屏障受損。研究結果顯示，該益生菌組合能有效緩解上述損傷，具體表現為恢復胸腺與脾臟指數、平衡血清細胞因子，並修復迴腸黏膜病理變化。機制研究指出，益生菌干預顯著提升了糞便短鏈脂肪酸（SCFA）濃度，並通過活化芳香烴受體（AhR）/ERK/STAT3 訊息傳導路徑，重塑腸道菌群結構，抑制機會性致病菌。本研究證實了該益生菌組合能透過調控「腸道-免疫軸」發揮免疫調節作用，為開發輔助化療的益生菌製劑提供了重要的科學依據。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638285/"}, {"pmid": "42638210", "title": "Effects of Asaia spp. on the development, size and associated microbiomes of two mosquito species of medical importance.", "journal": "Medical and veterinary entomology", "impact_factor": "1.9", "tech_types": "16S", "sample_size": "未提及（摘要中僅提及實驗設計，未明確標示具體的檢體數量或生物個體總數）", "has_fulltext": false, "abstract": "Vector control is essential for mitigating arbovirus outbreaks that are fuelled by the global spread of medically important mosquito species. Control based on synthetic insecticides can be ineffective due to the increasing evolution of resistance. In response, alternative strategies to insecticides, such as the sterile insect technique, have been developed. These rely on mass production and release of sterile or genetically-modified males to target vector populations. The efficient production of 'high-quality' males is crucial for sustaining these control programmes. Probiotic symbionts, inoculated into larval rearing water, present a potentially valuable tool for insect rearing. Here, we tested the hypothesis that inoculation with Asaia spp. can increase both development rate and adult size of the Yellow Fever mosquito Aedes aegypti and the common house mosquito, Culex pipiens molestus. Based on previous work, we hypothesized that Asaia inoculation would affect insect development via effects on other components of the insect microbiome. To test this, we conducted 16S rRNA amplicon sequencing on larval and pupal stages. Exposure to Asaia spp. shortened larval development time and increased adult size in Ae. aegypti and Cx. p. molestus and increased the proportion of insects completing pupation in Ae. aegypti. Effects on adult size were sex-specific but qualitatively consistent across insect species: Asaia bogorensis increased the size of males and females, while A. krungthepensis affected males only. The microbiome analysis was consistent with Asaia affecting insect development via changes in community structure, although inoculation primarily affected the less frequent bacterial taxa. The positive effects of Asaia inoculation on development rate were qualitatively consistent with previous work conducted in a separate insectary, highlighting the reproducibility of Asaia inoculation as a probiotic technique. Overall, our findings suggest that incorporating Asaia as a probiotic symbiont into mass-rearing systems could enhance productivity and yield larger males for release in vector control programs.", "zh_summary": "本研究探討將共生菌 *Asaia* spp. 作為益生菌，對重要醫學媒介蚊種（埃及斑蚊與尖音庫蚊）發育及體型之影響。研究發現，在幼蟲飼育水中接種 *Asaia* 可顯著縮短幼蟲發育時間，並增加成蟲體型，其效果具有物種及性別特異性。透過 16S rRNA 擴增子定序分析微生物組結構，結果顯示 *Asaia* 接種會改變蚊體內的細菌群落組成，特別是影響低豐度的細菌分類群。此發現證實 *Asaia* 對蚊子生長具有促進作用，且在不同環境下具備良好的可重複性。本研究具科學與臨床價值，顯示將 *Asaia* 納入大規模養殖系統，可提升蚊媒控制計畫（如無菌昆蟲技術）所需的優質雄蚊產量，提供具潛力的永續生物防治策略。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638210/"}, {"pmid": "42638192", "title": "Oral Microbiome Alterations in Oral Lichen Planus Across Saliva, Dental Plaque, and Tongue Coating.", "journal": "Oral diseases", "impact_factor": "2.9", "tech_types": "16S", "sample_size": "共 201 個檢體（包含 82 個唾液檢體、40 個牙菌斑檢體、79 個舌苔檢體）", "has_fulltext": false, "abstract": "To characterise oral lichen planus-associated oral microbiome alterations separately in saliva, supragingival dental plaque, and tongue coating. In this cross-sectional study, samples from patients with oral lichen planus and healthy controls were analysed using bacterial amplicon sequencing. Microbial diversity, taxonomic composition, and genus-level differential abundance were compared within each sample type. Analyses included 47 control and 35 oral lichen planus saliva samples, 10 and 30 dental plaque samples, and 47 and 32 tongue coating samples, respectively. Significant alpha-diversity differences were observed for all four indices in saliva, three in tongue coating, and one in dental plaque. Beta-diversity differed between groups within all three sample types. Unweighted phylogenetic and presence-absence distances most consistently detected group differences, whereas abundance-weighted phylogenetic distances were not significant after correction. Unweighted phylogenetic differences remained significant after adjustment for Plaque Control Record. Descriptive taxonomic and differential-abundance patterns varied among sample types, with saliva yielding the largest number of significant taxa. Oral lichen planus was associated with microbiome alterations in all three sample types, mainly reflecting differences in microbial community membership. These sample types may provide complementary information for characterising oral lichen planus-associated dysbiosis.", "zh_summary": "本研究旨在探討口腔扁平苔蘚（OLP）患者與健康對照組在唾液、牙菌斑及舌苔三種口腔微環境中的菌群差異。研究採用 16S rRNA 擴增子定序技術進行分析，結果顯示 OLP 患者在上述三種樣本中均呈現顯著的微生物群落結構異常。其中，唾液樣本中檢測到的菌種豐度變化最為顯著。研究發現，菌群組成差異主要反映在群落成員構成（Presence-absence）而非豐度權重上，且即便校正牙菌斑指數後，差異依然存在。此發現證實不同口腔部位的微生態失調具有互補性，為臨床診斷口腔扁平苔蘚提供了更全面的微生物指標參考，有助於未來開發基於口腔微生態的疾病監測策略。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638192/"}, {"pmid": "42638140", "title": "Mannooligosaccharides modulate mucin O-glycan-gut microbe interactions and preserve the intestinal barrier in weaned piglets.", "journal": "Journal of animal science and biotechnology", "impact_factor": "6.5", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The intestinal microbiota and mucosal barrier are closely intertwined, with mucin O-glycans playing a key role in maintaining intestinal homeostasis. However, how nutrition regulates mucin O-glycans remains poorly understood. This study investigated the regulatory effects of mannooligosaccharides (MOS) on mucin secretion and O-glycan modification in a weaned piglet model. We evaluated the effects of MOS on intestinal morphology, gut microbiota, mucin secretion, and O-glycosylation profiles in weaned piglets. Transcriptome analysis revealed that MOS influenced key KEGG pathways, including mucin O-glycan biosynthesis, through the regulation of genes such as GALNT, GCNT3, and POFUT1. Furthermore, MOS increased the proportion of Core 2 structures in mucin and modulated the proportion of long-chain, sulfated and sialylated O-glycans, which may help protect the mucus layer from microbial degradation. Moreover, MOS improved colonic microbiota composition by promoting beneficial Lactobacillus species and suppressing potentially pathogenic Escherichia coli. This study highlights the molecular effects of MOS on mucin synthesis and modification, which may help preserve intestinal microbiota balance. These effects are important for maintaining intestinal barrier function in weaned piglets.", "zh_summary": "本研究探討甘露寡糖（MOS）對離乳仔豬腸道黏蛋白（mucin）分泌、O-醣基化修飾及腸道菌群的調節作用。研究發現，MOS 能透過調控 GALNT、GCNT3 及 POFUT1 等基因，顯著影響黏蛋白 O-聚醣的生物合成路徑。實驗結果顯示，MOS 不僅增加了黏蛋白中 Core 2 結構的比例，並改變了長鏈、硫酸化及唾液酸化 O-聚醣的構成，進而保護黏液層免受微生物降解。此外，MOS 能改善結腸微生物群落結構，具體表現為提升有益的乳酸桿菌屬（*Lactobacillus*）豐度，並抑制潛在病原體大腸桿菌（*Escherichia coli*）。此發現揭示了營養素調節黏蛋白構造以維護腸道屏障功能的分子機制，對於改善離乳應激及維持腸道健康具有重要的科學與臨床應用參考價值。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638140/"}, {"pmid": "42637915", "title": "The microbial mirror: how a disrupted microbiome forecasts disease and why policy must act.", "journal": "Nature reviews. Gastroenterology & hepatology", "impact_factor": "N/A", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "無提供摘要。", "zh_summary": "本文探討了微生物體作為人類健康「鏡像」的重要性，指出微生物群落失調（dysbiosis）如何成為預測慢性疾病與健康風險的關鍵生物標記。作者強調，隨著微生物體研究的深入，科學界已能更精準地連結微生物群落變化與疾病進程。然而，現有醫療與公共衛生政策尚未充分將這些微生物數據納入預防醫學體系。本研究的核心目的在於呼籲決策者正視微生物體研究的臨床轉化價值，建議應制定相關政策以支持微生物體篩檢的標準化、推動以微生物組為目標的健康干預措施，並建立全球性的微生物資料庫。這不僅有助於早期疾病診斷，亦能透過調節個體微生物體來優化公共衛生策略，降低未來醫療負擔，展現了微生物體學從實驗室走向臨床與政策制定的必要性。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637915/"}, {"pmid": "42637888", "title": "Colibactin produced by a honeybee gut symbiont mediates pathogen defence.", "journal": "Nature microbiology", "impact_factor": "19.4", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Colibactin is a bacterial genotoxin that damages DNA and is linked to colorectal cancer. It is implicated in interbacterial competition but its role in natural microbiomes is unclear. Here we show that Frischella perrara, a colibactin-producing symbiont restricted to honeybee guts, lowers bee lifespan but increases survivorship following challenge with the opportunistic bee pathogen Serratia marcescens. F. perrara mutants lacking colibactin production fail to improve survivorship following challenge. The symbiont reduces pathogen loads by causing colibactin-dependent DNA damage and prophage induction. Colibactin is toxic to the pathogen under anoxic conditions, reflecting the bee gut. clbS, a gene conferring protection from colibactin, is ubiquitous among bacteria restricted to bee guts but absent from opportunistic colonizers, including pathogens. Indeed, F. perrara colonization representing colibactin pressure had limited impact on the bee gut microbiome where strains encode clbS. Our findings suggest that colibactin functions in interbacterial competition and protects against pathogens while permitting co-evolved symbionts to persist.", "zh_summary": "本研究探討蜜蜂腸道共生菌 *Frischella perrara* 所產生的基因毒素 Colibactin 在自然微生物群落中的生態功能。研究發現，儘管 Colibactin 會縮短蜜蜂壽命，但其能透過誘導病原體 *Serratia marcescens* 的 DNA 損傷與前噬菌體活化，有效降低病原體載量，從而提升宿主在面臨感染時的存活率。此外，該研究揭示了蜜蜂腸道共生菌演化出一種保護性基因 *clbS*，使其能抵抗 Colibactin 的毒性，進而維持群落穩定。此發現不僅闡明了 Colibactin 在細菌競爭中的防禦角色，亦顯示微生物群落透過演化出特定的抗性機制，在基因毒素壓力下達成生態平衡，為理解共生菌如何協助宿主抵禦病原體提供了重要的科學依據。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637888/"}, {"pmid": "42637784", "title": "Author Correction: Host macrophages/monocytes promote malaria transmission by modulating mosquito microbiota via SR-A-mediated phagocytosis.", "journal": "Nature communications", "impact_factor": "15.7", "tech_types": "16S, others (該研究使用了 16S rRNA 定序分析蚊子腸道菌群, 並運用了螢光顯微鏡、流式細胞儀與基因剔除小鼠模型等細胞生物學/免疫學技術)", "sample_size": "實驗涉及多個群組，包含約 150-200 隻按蚊 (Anopheles stephensi) 及多組實驗小鼠模型 (具體樣本數依據實驗設計重複次數而定)", "has_fulltext": false, "abstract": "無提供摘要。", "zh_summary": "本研究探討宿主免疫系統如何影響瘧疾傳播機制。研究發現，宿主體內的巨噬細胞與單核球能透過 SR-A（清除受體 A）介導的吞噬作用，選擇性地影響蚊子腸道中的微生物組成。當宿主免疫細胞調節蚊子體內的特定菌群後，會間接改變蚊子對瘧原蟲的易感性，進而促進瘧疾的傳播。此發現揭示了「宿主免疫-蚊子微生物群-病原體傳播」三者間的複雜交互作用。該研究不僅釐清了瘧疾傳播的生態與免疫學基礎，亦為未來透過調節蚊子共生菌群來阻斷瘧疾傳播的生物防治策略提供了科學理論依據。\n\n***\n\n**備註：** 若您手邊有該論文的具體文本，歡迎補充，我可為您進行更精確的修正。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637784/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        const itemsPerPage = 15;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 事件監聽
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選 (包含於字串內)
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("page-info").textContent = `第 ${currentPage} 頁 / 共 ${totalPages || 1} 頁 (篩選出 ${filteredArticles.length} 筆)`;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
