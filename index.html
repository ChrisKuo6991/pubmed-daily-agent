檢測及靶向抑菌策略提供了科學依據與化學標靶。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637441/"}, {"pmid": "42637430", "title": "Regional differentiation of microbial communities and metabolites in Yunnan dry-cured beef: insights from high-throughput sequencing and untargeted metabolomics.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "To reveal the effects of regional processing on quality, microbial communities and metabolites of traditional Yunnan dry-cured beef, samples from Xundian (XD), Yuxi (YX) and Honghe (HH) were analyzed. High-throughput sequencing and UHPLC-Q-Exactive HF/MS untargeted metabolomics were applied. Sensory scores and physicochemical Properties differed significantly (p < 0.05). Bacillota and Staphylococcus dominated bacterial communities. The observed differences in microbial communities and metabolites among regions are shaped by the combined effects of geographical environment and processing conditions. Ascomycota was the main fungal phylum. Debaryomyces dominated XD and HH samples. YX samples had a unique fungal profile dominated by Rhodotorula and Cladosporium. A total of 1320 metabolites were identified. 196 differential metabolites were screened. Key pathways included glycerophospholipid metabolism, pyrimidine metabolism and arachidonic acid metabolism. Correlation analysis indicated that Staphylococcus and Lactococcus were positively associated with amino acid derivatives, while Latilactobacillus and Debaryomyces correlated with organic acids and glycerophospholipids. These findings revealed the potential microbial-metabolic association underlying regional quality differences. They provide support for quality control and traceability of dry-cured beef.", "zh_summary": "本研究旨在探討地理區域與加工工藝對雲南傳統乾醃牛肉（尋甸、玉溪、紅河三地）品質、微生物群落及代謝物的影響。研究結合高通量定序與非靶向代謝組學技術，發現不同地區的乾醃牛肉在感官評分與理化性質上存有顯著差異。細菌群落以厚壁菌門和葡萄球菌屬為主；真菌群落中，尋甸和紅河樣品以德巴利酵母屬為主，玉溪樣品則以紅酵母屬與枝孢菌屬為特有優勢菌。代謝組學共鑑定出1320種代謝物，其中196種為差異代謝物，主要涉及甘油磷脂、嘧啶及花生四烯酸代謝通路。關聯分析顯示，葡萄球菌屬和乳球菌屬與氨基酸衍生物呈正相關，而廣義乳桿菌屬與德巴利酵母屬則與有機酸及甘油磷脂密切相關。本研究揭示了微生物與代謝物的關聯性，為乾醃牛肉的品質控制與產地溯源提供了重要科學依據。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637430/"}, {"pmid": "42637417", "title": "Allergic responses, gut microbiome and serum metabolism of mice: Effects of epigallocatechin gallate combined with sodium pyrophosphate modified parvalbumin.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Epigallocatechin gallate (EGCG) combined with sodium pyrophosphate (SP) modified parvalbumin (PV) was proposed to sensitize mice, and investigated whether allergic responses changes were associated with gut microbiome and serum metabolism of mice. EGCG combined with SP modified PV has structural changes, and alleviated jejunal damage in mice, while decreased specific serum IgG, IgG1 and IgE levels and may rebalanced Th1/Th2 immune responses. PV-induced allergic responses disrupted gut microbiota and reduced short-chain fatty acids (SCFAs) levels. In contrast, the modified PV could alter the relative abundance of allergic responses-related gut microbiota, such as g__unclassified_f__Lachnospiraceae, g__norank_o__Clostridia_UCG-014 and g__Alistipes, alongside elevated SCFAs levels. Additionally, the modified PV could affect multiple metabolic pathways in serum, and exert a positive impact on phosphatidylethanolamine and phosphatidylcholine levels in glycerophospholipid metabolism. Therefore, the reduction in the allergic responses of PV modified by EGCG and SP were associated with changes in gut microbiota and modulation of glycerophospholipid metabolisms. These correlational observations provided preliminary associative evidence supporting the potential utility of combined EGCG-SP modification as a hypoallergenic processing approach for fish parvalbumin mitigation.", "zh_summary": "本研究旨在探討利用表沒食子兒茶素沒食子酸酯（EGCG）結合焦磷酸鈉（SP）修飾魚類主要過敏原小清蛋白（PV），對小鼠過敏反應、腸道菌群及血清代謝的影響。結果顯示，修飾後的PV結構發生改變，能顯著減輕小鼠空腸損傷，降低血清特異性IgG、IgG1及IgE水平，並重建Th1/Th2免疫平衡。此外，修飾後的PV調節了過敏相關腸道菌群（如*Lachnospiraceae*與*Alistipes*）的相對豐度，提升了短鏈脂肪酸（SCFAs）含量，並改善血清甘油磷脂代謝。本研究證實EGCG-SP聯合修飾可作為降低魚類過敏原性的潛在低致敏加工方法。", "date": "2026-07-19", "url": "https://pubmed.ncbi.nlm.nih.gov/42637417/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        const itemsPerPage = 15;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 事件監聽
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選 (包含於字串內)
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("page-info").textContent = `第 ${currentPage} 頁 / 共 ${totalPages || 1} 頁 (篩選出 ${filteredArticles.length} 筆)`;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
