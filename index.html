    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42640624", "title": "Gut microbial diversity at baseline conditions the clinical, microbiome, and metabolic response to paraprobiotic Lactiplantibacillus plantarum LRCC5282 in overweight adults.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metabolomics", "sample_size": "120 位過重成人", "has_fulltext": false, "abstract": "The gut microbiota is increasingly recognized as a target for obesity management; however, whether baseline gut microbial diversity conditions responsiveness to microbiota-targeted interventions remains unclear. We aimed to investigate whether baseline gut microbial diversity is associated with responsiveness to a paraprobiotic derived from Lactiplantibacillus plantarum LRCC5282 (LP5282-P) in overweight adults. In a 12-week, randomized, double-blind, placebo-controlled, multicenter trial of 120 overweight adults, LP5282-P produced no significant between-group differences in any clinical outcome across the overall per-protocol population. However, in the low-diversity subgroup, LP5282-P was associated with significant reductions in body weight, body mass index, and circulating leptin levels. These clinical changes were accompanied by compositional shifts in the gut microbiota, including higher relative abundances of Christensenellaceae, Faecalibacterium, and Alistipes. Fecal metabolite profiles showed elevated acetate and butyrate concentrations and altered bile acid composition. Within the low-diversity subgroup, changes in the relative abundances of Akkermansia and Eubacterium were inversely correlated with changes in body weight, body fat mass, and leptin levels. In contrast, the high-diversity subgroup exhibited no consistent response across the outcome domains examined. Overall, baseline gut microbial diversity was associated with differential responsiveness to LP5282-P, supporting its potential use as a stratification variable in future microbiota-targeted intervention trials. Further studies integrating direct measures of microbial activity and host response are warranted to elucidate the biological pathways underlying this diversity-dependent responsiveness. Trial registration: Clinical Research Information Service (CRIS), KCT0008119.", "zh_summary": "本研究旨在探討基準線腸道菌相多樣性，是否會影響過重成人對副益生菌LP5282-P的介入反應。一項120位過重成人的臨床試驗顯示，雖然整體人群無顯著差異，但在「低菌相多樣性」亞組中，補充LP5282-P能顯著降低體重、BMI及血清瘦素，並伴隨有益菌（如*Faecalibacterium*與*Alistipes*）豐度增加，以及糞便短鏈脂肪酸（乙酸、丁酸）濃度上升；高多樣性亞組則無此反應。研究證實基準線菌相多樣性會決定個體對副益生菌的療效反應，未來可作為個人化體重管理與微生態介入的重要分層指標。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640624/"}, {"pmid": "42640100", "title": "Revisiting gut microbiota-driven ammonia metabolism: from disease burden to physiological adaptation.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Ammonia homeostasis is governed by interconnected host and microbial pathways, including hepatic ureagenesis, glutamine synthesis, and gut microbiota-mediated urea hydrolysis, proteolysis, and amino acid deamination. Ammonia has historically been viewed primarily as a nitrogenous waste product and neurotoxic molecule, a concept strongly supported by studies of hyperammonemia and hepatic encephalopathy. Impaired hepatic clearance, portosystemic shunting, and enhanced gut-derived ammonia input increase systemic ammonia burden and are linked to neurological dysfunction, muscle wasting, immune dysregulation, and progression of liver disease. In the gut lumen and mucosal environment, however, gut microbes not only generate ammonia but can also reuse ammonia-derived nitrogen for amino acid synthesis, microbial biomass formation, and community nitrogen exchange. Evidence from selected physiological and preclinical models indicates that microbiota-derived ammonia may contribute to nitrogen recycling, microbial community maintenance, enteric neural regulation, or metabolic adaptation under defined conditions. These roles are more context-specific and less broadly established than the pathological effects of systemic hyperammonemia. When epithelial barrier integrity is compromised, hepatic clearance declines, or host buffering reserves are depleted, elevated ammonia can increase epithelial exposure, portal ammonia input, or peripheral blood ammonia. Conversely, evidence that reduced microbiota-derived ammonia contributes to disease remains limited and currently comes mainly from selected animal models. This review re-examines ammonia metabolism from a gut microbiota-centered perspective. We discuss the ecological origins, spatial distribution, exposure characteristics, host-interface effects, and context-specific outcomes of microbiota-derived ammonia in physiology and disease, and discuss how ammonia should be measured, stratified, and targeted in microbial nitrogen metabolism.", "zh_summary": "本文重新審視了腸道菌群驅動的氨（ammonia）代謝，探討其在疾病負擔與生理適應中的雙重角色。傳統上，氨被視為具神經毒性的代謝廢物，與高氨血症、肝性腦病及肌肉流失密切相關。然而，在特定生理條件下，腸道微生物亦能回收氨源性氮用於氨基酸合成、維持菌群穩定及進行腸道神經調節。當上皮屏障受損、肝臟清除能力下降或宿主緩衝儲備耗盡時，才會引發病理效應。本綜述的科學意義在於從菌群視角系統性整合了氨的空間分佈與宿主互動，為未來如何精準測量、分層並調控微生物氮代謝提供了重要指引。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640100/"}, {"pmid": "42641146", "title": "Engineered bacterial therapeutics from synthetic biology to clinical translation: A multi-database scientometric analysis, 2000-2026.", "journal": "Human vaccines & immunotherapeutics", "impact_factor": "3.5", "tech_types": "others", "sample_size": "1,730 篇學術文獻", "has_fulltext": false, "abstract": "Engineered bacterial therapeutics integrate programmable strain engineering with biomedical functions such as sensing, delivery, immune modulation, microbiome intervention, and disease management. This study conducted a multi-database bibliometric analysis to map the knowledge structure, collaboration patterns, and translational direction of this field. Bibliographic records were retrieved from Web of Science Core Collection, Scopus, and PubMed for publications from 1 January 2000 to 1 June 2026. After document-type filtering, time restriction, deduplication, language screening, and manual eligibility assessment, 1,730 English-language articles and reviews were included. CiteSpace 6.4.R1, VOSviewer 1.6.20, and the bibliometrix R package were used to analyze publication trends, collaboration networks, journal co-citation, dual-map citation trajectories, citation bursts, keyword co-occurrence, and thematic evolution. Publication output increased steadily, with faster growth after 2020; 2025 was the highest-output complete year, while 2026 represented a partial retrieval year. China and the United States were the leading contributors, although institutional collaboration remained regionally clustered. Co-citation, citation-burst, and keyword analyses showed a shift from bacterial chassis construction and circuit design toward engineered probiotics, gut microbiota-related therapy, cancer immunotherapy, drug delivery, live biotherapeutic products, and clinical translation. Persistent translational priorities include controllability, safety, manufacturing consistency, and regulatory alignment.", "zh_summary": "本研究透過文獻計量學方法，針對 2000 年至 2026 年間有關「工程化細菌療法」的 1,730 篇文獻進行系統性分析。研究旨在梳理該領域的知識結構、國際合作模式及臨床轉化趨勢。結果顯示，相關研究產出自 2020 年後顯著加速，美中兩國為主要貢獻者。分析揭示了學界重心已從早期的細菌底盤與電路設計，轉向工程化益生菌、癌症免疫治療、藥物傳遞及活體生物藥物（LBP）的研發與臨床應用。該研究強調，未來該領域的發展關鍵在於克服安全性、可控性、生產一致性及法規監管等挑戰，為工程化細菌從實驗室走向臨床應用提供了重要的科學導向與策略藍圖。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42641146/"}, {"pmid": "42635406", "title": "Separating extracellular from intracellular fecal metabolites exposes cross-feeding architecture in the gut: exploring metabolite partitioning and ecological associations.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "metagenomics, metabolomics", "sample_size": "63 個健康受試者的糞便檢體", "has_fulltext": false, "abstract": "The gut microbiota forms a complex ecosystem through metabolic interdependence (cross-feeding). However, conventional fecal metabolomics typically quantifies only total metabolite pools, making it difficult to distinguish extracellular-enriched metabolite pools from predominantly cell-associated ones, and thus limiting reconstruction of in situ metabolic networks. Here, we quantified fecal metabolites in paired fractions from the same specimen: an undisrupted fraction representing the extracellular pool and a strongly bead-beaten fraction representing the total pool; the intracellular pool was defined as the difference between total and extracellular measurements. Stool samples from 63 healthy individuals were analyzed for short-chain fatty acids, polyamines, and water-soluble vitamins, and the results were integrated with shotgun metagenomic profiles of species composition and functional genes. Vitamins exhibited two distinct behaviors. Adenosylcobalamin (a vitamin B12 coenzyme) was detectable only after disruption, and together with thiamine (B1) and niacin (B3) was classified as an intracellular-retained type (Type 1). In contrast, biotin (B7) and pantothenate (B5) showed higher extracellular proportions (Type 2). Integrative analyses further indicated that Type 1 thiamine was negatively associated with Blautia, consistent with intensive microbial utilization, whereas Type 2 biotin was strongly positively associated with Alistipes, suggesting links to ecological niches shaped by luminal pH and fermentation modes (carbohydrate vs protein fermentation). Fraction-resolved quantification provides a practical operational framework to differentiate extracellular from cell-associated metabolite pools, helping reconcile metagenomic potential with metabolomic reality and enabling deeper inference of cross-feeding structure in the gut ecosystem.", "zh_summary": "本研究旨在解決傳統糞便代謝體學無法區分胞外與胞內代謝物的限制。研究團隊開發了一種分級定量方法，透過比較未處理（胞外）與強力震盪破碎（總體）的糞便樣本，進而計算出胞內代謝物比例。針對 63 位健康受試者的短鏈脂肪酸、多胺及水溶性維生素進行分析，並整合宏基因組數據。研究發現維生素存在兩種分佈特性：維生素 B1、B3 與 B12 屬於胞內滯留型，而 B5 與 B7 則傾向於胞外分佈。進一步分析顯示，胞內型維生素 B1 與 *Blautia* 屬呈負相關，反映了微生物的攝取利用；胞外型維生素 B7 與 *Alistipes* 屬呈正相關，暗示其受腸道 pH 值與發酵模式影響。此方法成功架起了宏基因組功能潛力與實際代謝產物間的橋樑，為深入理解腸道微生物群系內的跨餵養（cross-feeding）代謝網絡提供了關鍵的分析框架。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635406/"}, {"pmid": "42635403", "title": "Baseline gut microbiome ecology predicts long-term fat mass loss after bariatric surgery: evidence for a thrifty Bifidobacterium phenotype.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metabolomics", "sample_size": "106 個研究對象（85 位接受減重手術的肥胖患者與 21 位健康對照組）", "has_fulltext": false, "abstract": "Bariatric surgery (BS) induces weight loss, but long-term success involves complex host-microbiome interactions. We evaluated the longitudinal impact of BS, microbiome resilience, and Mediterranean Diet (MedDiet) adherence up to 24 months. This prospective observational study included 85 patients with severe obesity undergoing BS and 21 normal-weight healthy controls (HC). MedDiet adherence (PREDIMED) was assessed before surgery. Fecal microbiota (16S-rRNA sequencing) and metabolomics (1H-NMR spectroscopy) were analyzed at baseline and at 1-, 6-, and 12-months post-BS. Clinical outcomes and fat mass, evaluated by bioimpedanciometry, were tracked up to 24 months. At baseline, patients exhibited higher microbial Shannon diversity than controls (p = 0.041), alongside a dysfunctional microbiome and metabolome characterized by a higher Firmicutes/Bacteroidetes ratio and elevated levels of branched-chain amino acids (p < 0.0001). Ordinary Least Squares (OLS) regression analysis revealed that MedDiet adherence and type 2 diabetes status significantly modulated baseline diversity. At 12 months post-BS, the gut ecosystem underwent profound remodeling, characterized by depletion of Bifidobacterium spp. and an increase in butyrate levels (p < 0.0001), establishing a novel adaptive state distinct from HC. Baseline gut ecology significantly conditioned long-term BS outcomes: patients in the highest quartile of baseline Bifidobacterium spp. lost significantly less fat mass at 24 months than those in the lowest (6.6% vs. 13.2%, p = 0.010). High baseline Bifidobacterium abundance paradoxically acts as a \"thrifty microbiome,\" potentially maximizing energy harvest and limiting surgery-induced fat loss. Overall, BS induces adaptive microbiome restoration rather than true normalization, highlighting the potential for precision interventions prior to surgery.", "zh_summary": "本研究旨在探討減重手術（BS）後腸道微生物群、代謝體變化與長期脂肪減量的關聯。研究追蹤受試者長達 24 個月，發現手術能顯著重塑腸道生態，導致 *Bifidobacterium* 耗竭及丁酸鹽水平上升。關鍵發現顯示，基線時 *Bifidobacterium* 豐度較高的患者，在術後 24 個月的脂肪減量效果反而較差（6.6% vs 13.2%）。這表明高水平的 *Bifidobacterium* 可能扮演「節儉型微生物」角色，透過增強能量獲取限制了手術後的減脂效益。本研究證實手術後的腸道菌群呈現的是「適應性重塑」而非「完全正常化」，突顯了術前評估患者微生物生態對於制定精準減重策略的臨床價值。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635403/"}, {"pmid": "42635401", "title": "Fecal filtrate transplantation as salvage therapy for fulminant Clostridioides difficile infection in adult hematological patients during chemotherapy-induced aplasia: a pilot experience.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metagenomics", "sample_size": "3 位化療誘導骨髓再生不良且具猛爆性困難梭狀芽孢桿菌感染（CDI）的成人血液病患者，以及 1 名非親屬捐贈者。", "has_fulltext": false, "abstract": "Fulminant Clostridioides difficile infection (CDI) in patients with hematologic malignancies during chemotherapy-induced aplasia carries high mortality and limited treatment options. Our objective was to evaluate fecal filtrate transplantation (FFT) as a salvage therapy for fulminant CDI during aplasia, and to explore whether donor-recipient phage dynamics may contribute to clinical response. We conducted a single-center, prospective, protocol-defined pilot case series study including consecutive adults with hematologic malignancies, chemotherapy-induced grade-4 aplasia and fulminant CDI, refractory to ≥5 d of high-dose oral vancomycin plus intravenous metronidazole and tigecycline. FFT was prepared from a single unrelated donor using sequential centrifugation and filtration, and administered via nasogastric tube in two doses. The primary outcome was sustained clinical cure, secondary outcomes included survival and adverse events, assessed at +14 and +30 d post-FFT. 16S rRNA gene sequencing was used to assess microbiome compositions, while viral metagenomics and in vitro propagation assays were employed to characterize donor-recipient phageome interactions. Three patients with adverse-risk acute myeloid leukemia and fulminant CDI caused by genetically distinct C. difficile strains received FFT. All patients achieved clinical resolution by day +14, accompanied by improvements in abdominal distension and inflammatory markers. By day +30, one patient died from Pseudomonas aeruginosa septic shock, while two maintained remission with confirmatory follow-up. FFT was well tolerated, with no procedure-related immediate complications or FFT-attributable adverse events. Microbiome and phage profiling revealed heterogeneous responses, including shifts in bacterial community composition, with no clear evidence for a general role of donor-derived phages in CDI resolution. In contrast, we observed induction of prophages harbored by recipient-associated Clostridium species, which may have contributed to decolonization through stress-induced entry into the lytic cycle. FFT was feasible, with rapid sustained CDI resolution in hematologic patients with chemotherapy-induced aplasia. ClinicalTrials.gov identifier NCT07172191. Prospective single-center pilot study of fecal filtrate transplantation (FFT) for fulminant-refractory C. difficile infection in three aplastic adult hematologic patients. FFT was well tolerated, achieved rapid clinical cure, and showed heterogeneous microbiome and phageome modulation, potentially contributing to therapeutic effects.", "zh_summary": "本研究旨在評估糞便濾液移植（FFT）作為挽救療法，治療化療致骨髓再生不良之血液腫瘤患者合併猛爆性困難梭狀芽孢桿菌（CDI）感染的療效，並探討其微生態動力學。研究納入3位患者接受FFT治療，結果顯示所有患者在移植14天內均達到臨床治癒，且耐受良好、無治療相關副作用。微生物與噬菌體體學分析指出，FFT引發了多樣的菌群變化。雖未發現供體噬菌體直接清除病原菌的證據，但觀察到受體體內梭菌屬的前噬菌體被活化並進入裂解期，這可能促進了病原菌的清除。本研究證實FFT在此類高風險患者中安全可行，為難治性CDI提供了新的治療視角與潛在機制。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635401/"}, {"pmid": "42634246", "title": "Natural microbiota confer life-long protection against obesity via an early-life, immune-mediated effect on brown adipocytes.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "others", "sample_size": "未提及（文中未明確提供受試小鼠的具體數量）", "has_fulltext": false, "abstract": "Obesity, a major risk factor for metabolic disease, has increased in industrialized nations alongside a reduction in gut microbiota diversity. Reconstituting laboratory mice with complex, natural microbiota and commensals from wild mice resulted in protection against diet-induced obesity. These natural microbiota reduced weight gain in both male and female mice of different genetic backgrounds throughout their life and increased energy expenditure. Single-nuclei RNA sequencing identified a dominant adipocyte population in brown adipose tissue (BAT) with a transcriptional signature of increased thermogenic activity, while white adipose tissue mass and beiging were reduced. Protection against diet-induced obesity was transferable to adult germ-free mice via exposure to natural microbiota, indicating an association with the timing of immune response induction rather than BAT developmental programming. However, protection against diet-induced obesity did not require type 2 immune signaling, as shown in STAT6 knockout mice. Rather, it was associated with increased levels of chemokines and monocytes in BAT in early life, pointing to a role of infiltrating myeloid cells. Indeed, CCR2-deficient mice with natural microbiota lacked the BAT transcriptional signature of increased thermogenic activity, increased energy expenditure, and protection against diet-induced obesity that wild-type mice with natural microbiota exhibited. The latter was restored upon injection with wild-type bone marrow. Taken together, these findings identify a novel microbiota‒immune‒adipose tissue axis that results in increased BAT thermogenesis and improved energy balance throughout life.", "zh_summary": "本研究探討野生小鼠的天然腸道菌相如何對抗肥胖。研究發現，將野生小鼠的天然菌群移植至實驗室小鼠，可透過促進棕色脂肪組織（BAT）的產熱活性，達到終身防範飲食誘導肥胖的效果。研究證實，此保護效應並非源於發育過程，而是與早期生命階段中免疫系統的參與有關。具體而言，天然菌相會觸發骨髓衍生細胞（特別是 CCR2+ 單核球）浸潤至棕色脂肪組織，進而提升其產熱基因表現。此機制揭示了一條「菌相-免疫-脂肪」的訊息傳遞軸，強調早期微生物暴露對調節終身能量平衡及代謝健康的重要性，為預防肥胖提供了嶄新的微生物免疫治療方向。", "date": "2026-08-23", "url": "https://pubmed.ncbi.nlm.nih.gov/42634246/"}, {"pmid": "42637484", "title": "Insights into the analysis of microbial communities in fermented foods from the perspective of DNA-based techniques.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metagenomics", "sample_size": "未提及（本文為綜述型論文，非實驗研究）", "has_fulltext": false, "abstract": "The quality, flavor, and stability of fermented foods depend on the microbial community. However, microbial dynamics are difficult to observe directly, leading to limited control over fermentation. High-throughput sequencing is a revolutionary tool for microbial characterization, among which DNA-based amplicon and metagenomic sequencing are core techniques. Nevertheless, the related data processing workflows in the context of fermented foods have not yet been systematically summarized, hindering the translation of research findings into fermentation practices. This review clarifies the applications of amplicon and metagenomic sequencing in fermented foods. For amplicon sequencing, the impacts of target regions, data preprocessing, and reference databases are addressed. For metagenomic sequencing, sequencing strategies, read-based and binning-based analytical methods, functional annotation, and species-specific databases are discussed. In addition, major strategies for downstream analysis of community data are summarized, including microbial diversity, co-occurrence networks, niche and community assembly, key environmental drivers, and machine learning-based prediction. Amplicon sequencing efficiently reveals microbial succession during fermentation but has limitations in functional annotation. Metagenomic sequencing is notable for functional annotation, enabling the linkage between microbial communities and metabolic potential alongside community characterization. Standardized data preprocessing and specific databases are critical for improving characterization. For community data, integrated analysis allows uncovering the driving factors of microbial succession, thereby helping to regulate fermentation. Notably, the compositional nature of the data must be considered and validated to avoid spurious associations. In summary, the exponential growth of sequencing data will propel the era of precision fermentation.", "zh_summary": "本文旨在探討高通量定序技術（如擴增子定序與宏基因組學）在發酵食品微生物群落分析中的應用。研究指出，擴增子定序適合觀察發酵過程中的微生物演替，但在功能註解上受限；宏基因組學則能更精準地連結微生物組成與代謝潛力。透過分析定序策略、數據預處理流程、物種資料庫選擇及下游統計分析（如多樣性、共現網路與機器學習），本文為發酵食品的微生態研究提供了標準化框架。研究強調，考慮數據的組成性質並採用整合分析，能有效揭示微生物演替的驅動因子，對於提升發酵過程的品質控制與穩定性具有重要臨床與科學意義，並將推動精準發酵時代的發展。", "date": "2026-07-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42637484/"}, {"pmid": "42637478", "title": "Effects of sorghum variety on fermentation microecology and flavor characteristics of sesame-flavor Baijiu.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "3 種高粱品種（Hongyingzi, Hei'e, G），於 2 輪發酵週期中，在 3 個時間點（0、15、50 天）採集發酵酒醅（Jiupei）樣本", "has_fulltext": false, "abstract": "Sorghum, the principal raw material for Baijiu fermentation, plays a key role in shaping fermentation microecology and flavor formation. However, the effects of sorghum varietal differences on sesame-flavor Baijiu fermentation remain insufficiently understood. In this study, three sorghum varieties, Hongyingzi (R), Hei'e (B), and a domestic cultivar (G), were compared over two consecutive fermentation rounds. Fermented grain (Jiupei) samples collected at 0, 15, and 50 days were analyzed for physicochemical properties, enzyme activities, microbial communities, volatile compounds in Jiupei and base liquor, and the taste characteristics of the corresponding base liquor. Despite showing similar overall fermentation trends, the three sorghum varieties differed in acid accumulation, starch utilization, microbial succession, and volatile composition. Fungal communities shifted from early Pichia dominance to multi-genus coexistence, whereas bacterial communities progressively converged toward Lactobacillus dominance. A total of 218 and 258 volatile compounds were identified in Jiupei and 176 and 192 in base liquor from the first and second rounds, respectively. Esters were the dominant differential class, and volatile-marker profiles varied among sorghum varieties and fermentation rounds, with no single variety showing consistent enrichment across all sesame-flavor-related compounds. These results indicate that sorghum variety is an important factor associated with microbial assembly and flavor formation during sesame-flavor Baijiu fermentation, and provide a basis for raw material selection and flavor-oriented process optimization.", "zh_summary": "本研究旨在探討不同高粱品種（紅纓子、黑鵝及國產品種）對芝麻香型白酒發酵過程中微生物生態與風味形成的影響。研究分析了發酵過程中的理化性質、酶活性、微生物群落演替及揮發性化合物組成。結果顯示，儘管三種高粱的總體發酵趨勢相似，但在酸累積、澱粉利用率及微生物演替路徑上存在差異。真菌群落隨時間由畢赤酵母（*Pichia*）主導轉變為多屬共存，細菌群落則趨向於乳桿菌（*Lactobacillus*）主導。此外，不同品種顯著影響了酒醅與原酒中的揮發性風味物質譜。本研究證實高粱品種是影響白酒微生物組裝與風味生成的關鍵因子，研究成果為芝麻香型白酒原料選擇與製程優化提供了重要的科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637478/"}, {"pmid": "42637476", "title": "A Shenling Baizhu San polysaccharide fraction (SLP-2)-based synbiotic alleviates lactose-induced gut dysfunction via a microbiota-metabolite-barrier axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "HLD 大鼠模型（具體樣本數未提及）、人體糞便檢體（具體樣本數未提及）", "has_fulltext": false, "abstract": "Lactose intolerance (LI) is a common digestive disorder, and its management still relies largely on dietary restriction. Because gut microbial fermentation and barrier dysfunction contribute to LI-related symptoms, microbiota-targeted prebiotic or synbiotic strategies may provide complementary approaches. However, the active plant-polysaccharide fractions and their microbial partners remain unclear. This study aimed to identify the bioactive polysaccharide fraction from Shenling Baizhu San and evaluate its pairing with responder bacteria for alleviating high-lactose diet (HLD)-induced intestinal dysfunction. Stepwise ethanol precipitation yielded SLP-2, which was subsequently identified as the principal bioactive fraction through human fecal fermentation, monoculture assays, and an HLD rat model. SLP-2 enriched Eubacterium-associated taxa and supported the growth of Akkermansia muciniphila in monoculture and in vivo. Building on this, a synbiotic combining SLP-2 with A. muciniphila and E. rectale alleviated HLD-induced gut dysfunction; the antibiotic-matched comparison with the probiotics-only group supported an SLP-2-associated contribution. The synbiotic intervention was associated with increased tight junction proteins, MUC2 expression, improved intestinal architecture, and thicker mucus layers. Multi-omics analysis linked co-metabolites, including intestinal 6-MGG and HTy-Ac and systemic DHPV-G, with barrier restoration and an immune profile characterized by increased IL-10 and lower TLR4 expression. These findings suggest that SLP-2-based synbiotic intervention alleviates HLD-induced intestinal dysfunction through microbiota-metabolite-barrier modulation, providing preclinical evidence for future functional-food strategies pending human validation.", "zh_summary": "本研究旨在探討參苓白朮散（Shenling Baizhu San）中的生物活性多醣組分 SLP-2，及其與特定益生菌形成的合生元（synbiotic）對乳糖誘發腸道功能障礙的緩解效應。研究發現，SLP-2 能顯著富集 *Eubacterium* 相關菌群並促進 *Akkermansia muciniphila* 的生長。實驗結果顯示，由 SLP-2 與 *A. muciniphila* 及 *E. rectale* 組成的合生元，能透過增強腸道緊密連結蛋白（tight junction proteins）與 MUC2 表現、改善腸道屏障完整性，進而緩解大鼠腸道功能紊亂。多體學分析進一步證實，該機制涉及腸道與全身性代謝產物（如 6-MGG、HTy-Ac 及 DHPV-G）的變化，並能調節免疫表現（增加 IL-10、降低 TLR4）。此發現揭示了「微生物-代謝物-腸道屏障」軸線在緩解乳糖不耐症中的關鍵角色，為未來開發功能性食品提供了重要的臨床前科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637476/"}, {"pmid": "42637471", "title": "Fucoidan from giant kelp alleviates postmenopausal osteoporosis by regulating the betaine-OPG/RANKL/RANK signaling axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及（原文僅提及使用卵巢切除小鼠模型，未說明具體樣本數）", "has_fulltext": false, "abstract": "Postmenopausal osteoporosis (PMOP), characterized by excessive bone resorption and impaired bone remodeling, remains a significant global health challenge. This study investigated the protective effects of fucoidan from giant kelp (GKP) against PMOP and its underlying mechanisms in ovariectomized mice. GKP supplementation attenuated bone loss by preserving trabecular microarchitecture, normalizing systemic mineral homeostasis, and suppressing osteoclastogenesis, as evidenced by the downregulation of osteoclast-related genes. 16S rRNA gene sequencing revealed that GKP reshaped the gut microbiota by decreasing the Bacteroidota/Firmicutes ratio and enriching beneficial taxa, which promoted short-chain fatty acid production. Targeted metabolomics revealed that GKP induced profound systemic metabolic reprogramming, particularly amino acid metabolism, and identified betaine as a key systemic metabolite effector upregulated following GKP treatment. In vitro assays demonstrated that betaine suppressed receptor activator of nuclear factor-κB ligand (RANKL)-induced osteoclast differentiation and mitigated inflammation. In vivo validation demonstrated that betaine intervention recapitulated the osteoprotective phenotype observed in GKP-treated mice, which was associated with regulation of the osteoprotegerin/RANKL/RANK signaling axis. These results indicate that GKP exerts anti-osteoporotic effects in association with changes in gut microbiota and systemic metabolism, while betaine-mediated regulation of the OPG/RANKL/RANK signaling may contribute to its osteoprotective activity.", "zh_summary": "本研究探討巨藻褐藻醣膠（GKP）對停經後骨質疏鬆症（PMOP）的保護作用及其分子機制。實驗結果顯示，GKP 可改善卵巢切除小鼠的骨微結構並抑制破骨細胞生成。機制研究發現，GKP 能優化腸道菌群結構，降低 Bacteroidota/Firmicutes 比值並促進短鏈脂肪酸產生；同時，代謝體學分析證實 GKP 誘導了全身性代謝重塑，特別是甜菜鹼（betaine）水準的顯著提升。進一步驗證表明，甜菜鹼透過調節 OPG/RANKL/RANK 訊號軸，可有效抑制 RANKL 誘導的破骨細胞分化並減輕炎症。本研究揭示了「腸道菌群—代謝物—骨代謝」的交互作用軸，證實 GKP 與其核心代謝物甜菜鹼在對抗骨質疏鬆方面具有潛在的臨床應用價值。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637471/"}, {"pmid": "42637450", "title": "Highland barley polysaccharides promoted lactose intestinal fermentation in vitro: Unveiling the dynamic response of gut microbiota and polysaccharide structure.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及（原文僅提及使用乳糖不耐症患者的糞便樣本進行體外發酵模型，未標註具體人數或檢體數量）", "has_fulltext": false, "abstract": "Lactose intolerance affects over 70% of the global population due to the untimely metabolism of lactose in the colon. To accelerate lactose metabolism, we innovatively employed highland barley polysaccharides (HBP) to modulate the colonic fermentation efficiency of lactose using an in vitro fermentation model and fecal samples from lactose intolerant patients. With the addition of HBP, the consumption efficiency of lactose began to increase after 6 h of fermentation. At 48 h, lactose consumption increased by 29%, surpassing the effect of commercial prebiotics. Meanwhile, HBP with lower molecular weight (HBP-L, 8.69 × 104 g/Mol) exhibited more effective impacts than HBP with high molecular weight (HBP-H, 1.22 × 105 g/Mol), which was particularly evident during the 12-48 h of fermentation. More importantly, HBP, particularly HBP-L, substantially enriched Segatella, Bifidobacterium, and Ligilactobacillus in a time-dependent manner and was positively correlated with decreased lactose levels and elevated bacterial lactase activity, resulting in significant conversion of lactose to lactic acid and short-chain fatty acids. During the first 12 h of fermentation, HBP-L underwent more significant degradation than HBP-H. Meanwhile, the xylose residues and Glcp glycosidic bonds in HBP-L were preferentially utilized, while it was glucose residue in HBP-H. Thus, it indicated that HBPs were degraded and altered the composition of the gut microbiota, thereby enhancing the fermentation efficiency of lactose. Our findings provide a theoretical basis for developing targeted prebiotic foods to manage lactose intolerance.", "zh_summary": "本研究探討青稞多醣（HBP）對緩解乳糖不耐症的潛力。透過體外發酵模型，證實添加 HBP 可顯著提升腸道菌群對乳糖的發酵效率，其中低分子量多醣（HBP-L）的效果優於高分子量多醣（HBP-H）。研究發現，HBP 能動態調節腸道微生物組成，顯著增加 *Segatella*、*Bifidobacterium* 與 *Ligilactobacillus* 等益生菌豐度，進而提升細菌乳糖酶活性，加速乳糖轉化為乳酸與短鏈脂肪酸。此外，HBP-L 的木糖殘基與糖苷鍵更易被菌群利用。此研究揭示了青稞多醣調節腸道菌群改善乳糖代謝的機制，為開發針對乳糖不耐症的功能性益生元食品提供了科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637450/"}, {"pmid": "42637441", "title": "Microbial succession drives quality deterioration in refrigerated golden pompano (Trachinotus ovatus): regulatory network of dominant spoilage microbiota on characteristic biomarkers.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Elucidating the quality deterioration mechanisms of refrigerated golden pompano (Trachinotus ovatus), this study integrated 16S rRNA gene sequencing and untargeted metabolomics to systematically dissect how microbial ecological succession drives metabolic changes. As critical spoilage indicators, total volatile basic nitrogen (TVB-N) and thiobarbituric acid reactive substances (TBARS) continuously increased during storage, indicating significant deterioration by day 6. Microbial community succession analysis revealed that Psychrobacter, Shewanella, and Pseudomonas gradually became the dominant microbiota in the late storage stage. Metabolite enrichment analysis further demonstrated that this shift redirected the metabolic focus from early-stage nucleotide degradation to late-stage protein hydrolysis and amino acid metabolism. Moreover, multivariate statistical analysis identified 50 potential spoilage biomarkers, among which biogenic amines (histamine, tyramine, and phenylethylamine) were recognized as key indicators reflecting spoilage progression. Correlation network analysis revealed positive correlations between Pseudomonas and Shewanella abundances and the accumulation of these biogenic amines. This suggests that these two genera act as the core functional microbiota, driving spoilage metabolite generation and subsequent quality deterioration. Pathway analysis of potential spoilage biomarker generation indicates that amino acid and nucleotide metabolism constitute the core spoilage pathways, with lipid oxidation serving as a complementary mechanism. Overall, this study elucidates the spoilage mechanisms of refrigerated golden pompano, providing chemical targets for early biomarker detection and targeted antibacterial strategies.", "zh_summary": "本研究旨在探討冷藏卵形鯧（金鯧）的品質劣變機制。研究結合 16S rRNA 基因定序與非標靶代謝體學，分析微生物演替如何驅動代謝變化。結果發現，隨儲存時間延長，Psychrobacter、Shewanella 與 Pseudomonas 成為優勢菌群，促使代謝途徑從核苷酸降解轉向蛋白質水解與胺基酸代謝。研究篩選出 50 種潛在腐敗生物標記，特別是組織胺、酪胺及苯乙胺等生物胺，顯示 Pseudomonas 與 Shewanella 為導致腐敗的核心功能菌群。此研究明確了微生物與代謝產物的相關性，不僅揭示了冷藏魚肉的腐敗分子機制，亦為開發早期腐敗檢測技術及針對性抑菌策略提供了科學基礎。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637441/"}, {"pmid": "42637430", "title": "Regional differentiation of microbial communities and metabolites in Yunnan dry-cured beef: insights from high-throughput sequencing and untargeted metabolomics.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及（原文僅提及來自三個地區 Xundian, Yuxi, Honghe，未提供具體的樣本總數或重複次數）", "has_fulltext": false, "abstract": "To reveal the effects of regional processing on quality, microbial communities and metabolites of traditional Yunnan dry-cured beef, samples from Xundian (XD), Yuxi (YX) and Honghe (HH) were analyzed. High-throughput sequencing and UHPLC-Q-Exactive HF/MS untargeted metabolomics were applied. Sensory scores and physicochemical Properties differed significantly (p < 0.05). Bacillota and Staphylococcus dominated bacterial communities. The observed differences in microbial communities and metabolites among regions are shaped by the combined effects of geographical environment and processing conditions. Ascomycota was the main fungal phylum. Debaryomyces dominated XD and HH samples. YX samples had a unique fungal profile dominated by Rhodotorula and Cladosporium. A total of 1320 metabolites were identified. 196 differential metabolites were screened. Key pathways included glycerophospholipid metabolism, pyrimidine metabolism and arachidonic acid metabolism. Correlation analysis indicated that Staphylococcus and Lactococcus were positively associated with amino acid derivatives, while Latilactobacillus and Debaryomyces correlated with organic acids and glycerophospholipids. These findings revealed the potential microbial-metabolic association underlying regional quality differences. They provide support for quality control and traceability of dry-cured beef.", "zh_summary": "本研究旨在探討地理環境與加工條件對雲南乾醃牛肉品質的影響。研究團隊針對尋甸（XD）、玉溪（YX）與紅河（HH）三地的乾醃牛肉，結合高通量定序與非標靶代謝組學技術（UHPLC-Q-Exactive HF/MS），分析其微生物群落結構與代謝產物差異。研究發現，不同產地的感官評分與理化性質顯著不同，且各地區具備獨特的微生物組成（如菌群以 *Bacillota* 及 *Staphylococcus* 為主，真菌則隨產地呈現明顯差異）。透過鑑定出的 1,320 種代謝物與關聯分析，揭示了 *Staphylococcus*、*Lactococcus* 等菌屬與胺基酸衍生物及有機酸代謝路徑之間的相關性。此發現證實了區域特性透過塑造微生物代謝網絡，進而決定了產品的風味與品質。本研究成果為傳統肉製品的品質控制、產地溯源及標準化生產提供了重要的科學依據。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637430/"}, {"pmid": "42637417", "title": "Allergic responses, gut microbiome and serum metabolism of mice: Effects of epigallocatechin gallate combined with sodium pyrophosphate modified parvalbumin.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Epigallocatechin gallate (EGCG) combined with sodium pyrophosphate (SP) modified parvalbumin (PV) was proposed to sensitize mice, and investigated whether allergic responses changes were associated with gut microbiome and serum metabolism of mice. EGCG combined with SP modified PV has structural changes, and alleviated jejunal damage in mice, while decreased specific serum IgG, IgG1 and IgE levels and may rebalanced Th1/Th2 immune responses. PV-induced allergic responses disrupted gut microbiota and reduced short-chain fatty acids (SCFAs) levels. In contrast, the modified PV could alter the relative abundance of allergic responses-related gut microbiota, such as g__unclassified_f__Lachnospiraceae, g__norank_o__Clostridia_UCG-014 and g__Alistipes, alongside elevated SCFAs levels. Additionally, the modified PV could affect multiple metabolic pathways in serum, and exert a positive impact on phosphatidylethanolamine and phosphatidylcholine levels in glycerophospholipid metabolism. Therefore, the reduction in the allergic responses of PV modified by EGCG and SP were associated with changes in gut microbiota and modulation of glycerophospholipid metabolisms. These correlational observations provided preliminary associative evidence supporting the potential utility of combined EGCG-SP modification as a hypoallergenic processing approach for fish parvalbumin mitigation.", "zh_summary": "本研究旨在探討經表沒食子兒茶素沒食子酸酯（EGCG）與焦磷酸鈉（SP）修飾後的魚類小清蛋白（PV），對改善過敏反應的潛在機制。研究發現，未經修飾的 PV 會引發小鼠過敏，導致空腸受損、免疫球蛋白（IgG/IgE）升高、腸道菌群失調及短鏈脂肪酸（SCFAs）水平下降。相反地，經 EGCG-SP 修飾的 PV 能減緩腸道損傷，重塑腸道菌群組成（如增加 Lachnospiraceae 與 Alistipes 豐度），並提升 SCFAs 水準。此外，代謝組學分析顯示，該修飾物能有效調節血清中甘油磷脂代謝（如磷脂醯乙醇胺與磷脂醯膽鹼）。此結果證實，透過 EGCG-SP 修飾可有效緩解過敏反應，其機轉與腸道菌群平衡及代謝路徑調控密切相關，為開發低過敏性食品加工技術提供了重要的科學依據。", "date": "2026-07-19", "url": "https://pubmed.ncbi.nlm.nih.gov/42637417/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        const itemsPerPage = 15;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 事件監聽
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選 (包含於字串內)
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("page-info").textContent = `第 ${currentPage} 頁 / 共 ${totalPages || 1} 頁 (篩選出 ${filteredArticles.length} 筆)`;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
