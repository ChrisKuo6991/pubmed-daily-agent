    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42658871", "title": "Breastmilk microbiota and its association with infant iron deficiency anaemia: A 16S rRNA metagenomic study in Peruvian mothers cohort.", "journal": "PloS one", "impact_factor": "2.6", "tech_types": "16S", "sample_size": "46 對母子（46 個母乳檢體）", "has_fulltext": false, "abstract": "Anaemia is one of the most important public health challenges in developing countries. The global burden is estimated at 1.8 billion people, affecting approximately 30% of all children. Despite the implementation of multiple strategies over several decades, up to 42.5% of children under 3 years of age suffer anaemia in rural areas of Peru. We studied the microbiota of breastmilk (hBM) from mothers with children under the age of 1 and analysed its association with their iron deficiency anaemia. 46 mother-child pairs were recruited from Talara, a town on the northern coast of Peru and classified according to the clinical status of the children. Children with anaemia were also tested for ferritin level to classify them as iron deficiency anaemia (IDA) or non-iron deficiency anaemia (non-IDA). hBM samples were taken from the mothers after careful instruction to reduce the risk of sample contamination and the microbiome was analyzed using 16S rRNA sequencing. Streptococcus and Staphylococcus were the predominant genera, with 90% of bacterial abundance being explained by 14 genera. Alpha diversity analysis showed that hBM from mothers of children with non-IDA had higher levels of bacterial richness than hBM from healthy (p < 0.01) and IDA (p < 0.05) participants. Principal coordinates analysis did not yield differential clusters but showed a disparity in the spread of samples for non-IDA group when compared with the other groups. IDA group showed higher burden of Corynebacterium, Acinetobacter, Paludibacter and Nitrospira, while exhibiting a trend towards a lower burden of Streptococcus. No statistically significant differences were identified on demographic characteristics. This study suggests that hBM microbiota may differ in mothers of children with IDA and non-IDA, highlighting the necessity of further in-depth research to elucidate potential factors associated with its pathogenesis.", "zh_summary": "本研究旨在探討秘魯母乳微生物相與一歲以下嬰兒缺鐵性貧血（IDA）的關聯。研究團隊招募46對母子，並利用16S rRNA定序技術分析母乳樣本。結果顯示，母乳微生物主要由鏈球菌屬與葡萄球菌屬主導。相較於健康組與IDA組，非缺鐵性貧血（non-IDA）組母親的母乳菌群豐富度顯著較高。此外，IDA組母乳中的棒狀桿菌屬、不動桿菌屬等豐度顯著升高，而鏈球菌屬則呈減少趨勢。本研究證實母乳微生物組成與嬰兒缺鐵性貧血具潛在關聯，為理解嬰兒貧血的病理機制及未來預防策略提供了全新視角。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42658871/"}, {"pmid": "42658844", "title": "Enrichment and Characterization of a Haloalkaline-tolerant Anammox Bacterium.", "journal": "The ISME journal", "impact_factor": "N/A", "tech_types": "metagenomics, metatranscriptomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Metagenomic surveys have substantially expanded the known diversity of anaerobic ammonium-oxidizing (anammox) bacteria. However, the physiological traits of newly proposed anammox genera remain largely hypothetical due to the lack of cultured representatives. Although niche differentiation driven by salinity, organic substrates, and oxygen is well documented in anammox bacteria, adaptations to alkaline environments remain uncharacterized. Moreover, no anammox lineage has been identified as an alkaline specialist. Herein, we report the enrichment (>80% relative abundance) of an anammox bacterium, provisionally named Candidatus Loosdrechtia alkalitolerans, which represents the cultured member of the genus Ca. Loosdrechtia. Ca. L. alkalitolerans exhibits marked haloalkaline tolerance, outcompeting other freshwater anammox genera under long-term saline-alkaline stress conditions (0.5% NaCl; pH~9.13). Comparative genomics revealed that among freshwater anammox lineages, only Ca. L. alkalitolerans encodes a complete multiple resistance and pH adaptation (Mrp) cation/proton antiporter operon. Batch assays with transcriptional profiling demonstrated that sodium addition upregulated mrp expression and recovered anammox activity under alkaline stress, suggesting that Mrp-mediated cation/proton exchange may contribute to pH homeostasis in Ca. L. alkalitolerans. Furthermore, database mining revealed that the habitat of Ca. L. alkalitolerans is not restricted to haloalkaline environments, but extends to diverse freshwater and wastewater ecosystems. These findings provide mechanistic insight into saline-alkaline tolerance in anammox bacteria, expanding understanding of their physiological plasticity and ecological roles.", "zh_summary": "本研究旨在富集並鑑定一種新型耐鹽鹼厭氧氨氧化（anammox）細菌，命名為 *Candidatus* Loosdrechtia alkalitolerans，以探討其對鹼性環境的適應機制。研究團隊成功將其富集至 80% 以上的相對豐度，並證實其在長期鹽鹼壓力下（0.5% NaCl, pH~9.13）具有顯著的競爭優勢。比較基因體學與轉錄分析顯示，該菌編碼完整的 Mrp 陽離子/質子反向轉運體操縱子；添加鈉離子能上調 *mrp* 基因表達，進而在鹼性壓力下恢復其厭氧氨氧化活性。此研究揭示了 Mrp 介導的 pH 調節機制，拓展了對該菌生理可塑性與生態分布的認知。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42658844/"}, {"pmid": "42657522", "title": "Resistant starch alleviates intestinal fibrosis involving an acetate-mediated HDAC2-H3K27ac axis in fibroblasts.", "journal": "Food & function", "impact_factor": "5.4", "tech_types": "metagenomics, metabolomics", "sample_size": "DSS誘導的慢性結腸炎小鼠模型（未明確標示具體n值）、人類CCD-18Co細胞株及原代小鼠腸道纖維母細胞", "has_fulltext": false, "abstract": "Dietary fibre-based interventions are of growing interest for the prevention and treatment of digestive diseases. In this study, we investigated the effect of resistant starch (RS) on intestinal fibrosis, a stricturing condition driven by excessive extracellular matrix (ECM) accumulation. RS was found to alleviate intestinal fibrosis in a dextran sulfate sodium (DSS)-induced chronic colitis mouse model, as evidenced by restored colon length, reduced ECM deposition (fibronectin and collagen I), and decreased levels of α-smooth muscle actin. Given that RS is fermented by the gut microbiota in the colon, metagenomic sequencing revealed that RS reshaped the composition of the gut microbiota and increased the abundance of beneficial gut bacteria, including Bacteroides acidifaciens, Faecalibaculum rodentium, and Bifidobacterium pseudolongum, which are known to enhance the production of short-chain fatty acids. Targeted metabolomic analysis further showed a marked increase in acetate levels, which was associated with reduced intestinal fibrosis. However, direct in vivo evidence that acetate is required for the anti-fibrotic effect of RS remains lacking. Using human (CCD-18Co) and primary mouse intestinal fibroblasts, the major ECM-producing cells that drive fibrosis progression, we demonstrated that acetate inhibited TGF-β-induced fibroblast activation by inhibiting histone deacetylase 2, thereby enhancing the acetylation level of histone H3 at lysine 27. Collectively, these results suggest a potential microbial-metabolic-epigenetic axis linking RS and acetate to fibrosis attenuation, which awaits causal validation in vivo. This axis holds promise as a therapeutic target for fibrotic diseases.", "zh_summary": "本研究探討抗性澱粉（RS）對腸道纖維化的改善機制。研究顯示，RS 能顯著緩解 DSS 誘導的小鼠腸道纖維化，降低細胞外基質沈積。宏基因組定序發現 RS 重塑了腸道菌群，增加了如 *Bacteroides acidifaciens* 等短鏈脂肪酸產生菌的豐度；代謝組學分析則證實結腸內乙酸（acetate）水平顯著提升。機轉研究揭示，乙酸能抑制纖維母細胞中組蛋白去乙醯化酶 2（HDAC2）的活性，進而增加 H3K27 的乙醯化修飾，從而抑制 TGF-β 誘導的纖維母細胞活化。本研究揭示了「腸道菌群-代謝物-表觀遺傳」的調控軸，證實了飲食纖維代謝產物在改善纖維化疾病中的潛力，為開發纖維化治療策略提供了新的科學依據。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42657522/"}, {"pmid": "42656127", "title": "Development and Validation of Mock Communities as Quality Control Materials for Clinical Metagenomic Next-Generation Sequencing.", "journal": "Annals of laboratory medicine", "impact_factor": "3.9", "tech_types": "metagenomics", "sample_size": "25 次重複分析（針對開發出的 4 種模擬菌群樣本）", "has_fulltext": false, "abstract": "Metagenomic next-generation sequencing (NGS) enables comprehensive detection of a broad spectrum of microorganisms. However, its clinical application faces two major challenges: the development of appropriate microbiome-based biomarkers and the need to ensure the reproducibility and quality of the microbiome analytical workflow. Therefore, we developed four types of bead-based mock communities as standard materials for microbiome analysis and evaluated potential experimental biases arising from nucleic acid extraction and sequence analysis. Mock communities were assembled from strains isolated from clinical specimens and selected considering Gram reaction, taxonomic phylogeny, and prevalence, and processed into frozen beads. The communities were analyzed using shotgun whole-metagenome sequencing. The effect of DNA extraction kit choice was evaluated using the Thermo Fisher Scientific MagMAX Microbiome Ultra Nucleic Acid Isolation Kit and Qiagen PowerSoil Kit. Four types of mock communities comprising 26 species commonly found in the gastrointestinal tract, respiratory tract, skin, and genital tract plus cerebrospinal fluid were developed considering Gram reaction, GC content, and phylogenetic distribution. Across 25 repeated analyses, the median repeatability of each taxon was 18.97% (range, 2.87%-107.38%), while within-laboratory imprecision was 26.22% (range, 9.26%-153.83%). Repeatability remained below 10% for most dominant taxa with relative abundances >20%. The choice of DNA extraction kit had a significant effect on taxonomic distributions. Microbial mock communities are essential QC materials for clinical metagenomic NGS. Further studies are needed to minimize variability and establish a standardized protocol for clinical implementation.", "zh_summary": "本研究旨在解決臨床宏基因組次世代定序（mNGS）在檢測再現性與品質控管上的挑戰。研究開發了四種包含 26 種常見人體微生物（涵蓋腸胃道、呼吸道、皮膚、生殖道及腦脊髓液來源）的模擬菌群（Mock Communities）作為標準質控物質。透過鳥槍法總體基因體定序（shotgun metagenomics），評估了不同 DNA 萃取試劑盒對菌種分布的影響及檢測的精密度。結果顯示，DNA 萃取方法的差異會顯著影響分類群的結果，且該模擬菌群在常見優勢菌種（相對豐度 >20%）中表現出良好的再現性（變異係數 <10%）。此研究對於推動臨床 mNGS 的標準化流程具有重要意義，有助於提升臨床診斷分析的準確性與可信度。", "date": "2026-08-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42656127/"}, {"pmid": "42644416", "title": "Nationwide cohort study reveals low bifidobacteria and distinct microbiota composition and function in Swedish newborns.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "NCT06285630.", "zh_summary": "本研究是一項針對瑞典新生兒的全國性佇列研究，旨在評估嬰兒腸道微生態的組成與功能特徵。研究發現，瑞典新生兒體內的雙歧桿菌（Bifidobacteria）豐度普遍偏低，且其腸道菌相在物種組成與代謝功能上呈現獨特且不成熟的特徵。雙歧桿菌的缺乏可能影響嬰兒對母乳寡糖（HMOs）的降解與利用，進而對早期免疫與代謝發育帶來潛在影響。此發現揭示了現代西方社會新生兒腸道菌相失衡的現狀，強調了早期微生態發育的地理差異，並為未來透過精準益生菌干預（如補充特定雙歧桿菌）以重建嬰兒腸道健康提供了重要的科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42644416/"}, {"pmid": "42648171", "title": "Co-occurrence of muddy off flavor and cyanotoxin genes in the polluted Guandu river waters (Rio de Janeiro, Brazil).", "journal": "The Science of the total environment", "impact_factor": "N/A", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "The Guandu river basin is responsible for supplying Rio de Janeiro municipality, Brazil, with drinking water. This study investigated water quality during the geosmin crisis in January and March 2020, by relating the water quality and odor compounds with metagenomic tools. Guandu river water was eutrophic. The cyanobacterial genera identified were Microcystis, Planktothrix, Dolichospermum, Nostoc, Synechococcus, Planktothricoides, and Cyanobium, indicating that bloom-associated communities in the system are taxonomically diverse. Functional annotation of metagenomic sequences revealed the presence of genes associated with the biosynthesis of taste-and-odor compounds, including geosmin (geoA) and 2-methylisoborneol (mic), as well as multiple biosynthetic clusters related to cyanotoxin production. Genes linked to microcystin (mcy), saxitoxin (sxt), anatoxin (ana), cylindrospermopsin (cyr), lyngbyatoxin (ltx), guanitoxin (gnt), and nodularin (nda) were detected across the dataset, indicating a broad genetic potential for the production of secondary metabolites relevant to water quality. The co-occurrence of cyanotoxins, geosmin and 2-MIB genes suggests that off-flavor is an indication of cyanotoxin potential production in the water.", "zh_summary": "本研究針對巴西瓜納巴拉河（Guandu River）於 2020 年發生的異味危機進行調查。透過宏基因體定序技術分析水質，研究發現當地水體呈現優養化狀態，且存在多樣化的藍綠菌群落（如 Microcystis 及 Planktothrix 等）。功能性註解分析顯示，這些樣本不僅含有合成異味物質（土臭素 geoA 及 2-MIB）的基因，更同時攜帶多種藍綠菌毒素的生物合成基因群（如微囊藻毒素、神經毒素與擬柱孢藻毒素等）。此發現證實了異味物質與潛在毒素基因在環境中的共存性。這項研究的科學意義在於強調水體的「土腥異味」可作為水質潛在毒性風險的早期警訊，為飲用水安全監測提供了重要的生物資訊參考。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42648171/"}, {"pmid": "42647164", "title": "Sex differences in the gut microbiome and related metabolites: role in cardiometabolic disease.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "others", "sample_size": "未提及（本文為綜論性回顧文章，非原創實驗研究）", "has_fulltext": false, "abstract": "Sex differences in major cardiometabolic diseases (CMD), such as type 2 diabetes, metabolic dysfunction-associated steatotic liver disease, and cardiovascular disease, have been increasingly recognized across the life course. During the reproductive stage, women generally have a more favorable cardiometabolic risk profile than men, but their risk of experiencing CMD significantly increases after menopause. Emerging evidence suggests that sexually dimorphic gut microbiota and gut microbiota-related metabolites (GMRMs) may contribute to such sex disparities. However, existing findings are heterogeneous and underlying mechanisms remain incompletely understood. In this review, we synthesize the evidence examining sex differences in gut microbial diversity, overall composition, taxa abundances, and levels of GMRMs across key life stages, including pre-puberty, adolescence, and different phases of adulthood (with emphasis on pre- and post-menopausal periods). We summarize potential biological mechanisms underlying sexual dimorphism in the gut microbiome and GMRMs, emphasizing the central role of sex steroids, along with contributions from immune function and other host and environmental factors. We further integrate evidence linking sexually dimorphic microbial taxa (e.g., Akkermansia muciniphila, Eubacterium, Ruminococcus, and other Firmicutes taxa) and GMRMs (e.g., microbiota-derived short-chain fatty acids, secondary bile acids, and trimethylamine N-oxide) to key cardiometabolic pathways involving inflammation, glucose and lipid metabolism, and vascular function. Finally, we identify critical knowledge gaps and emphasize the need for future large longitudinal studies that would integrate repeated measurements of the gut microbiome, untargeted metabolomics, and sex steroid hormones across the life course. Such approaches are essential to clarify biological pathways and inform sex-specific microbiome-based interventions for CMD prevention and management.", "zh_summary": "本文旨在探討性別差異在腸道微生物群與相關代謝物（GMRMs）中如何影響心臟代謝疾病（CMD）。研究指出，受性類固醇、免疫功能及環境因素影響，腸道菌相與代謝產物存在顯著的性別二態性。女性在生育期較男性具備更佳的心臟代謝特徵，但停經後風險顯著升高，此變化與特定菌屬（如 *Akkermansia muciniphila*）及代謝物（如短鏈脂肪酸、次級膽汁酸、TMAO）的豐度改變密切相關。這些微生物與代謝物透過調節發炎反應、醣脂代謝及血管功能，進而影響 CMD 的發生。本文強調未來需透過大型縱向研究，結合微生物組學、代謝組學與荷爾蒙監測，以深入解析其生物學機制，並開發針對不同性別的精準微生物介入療法，對於預防及管理心臟代謝疾病具有重要的科學價值。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647164/"}, {"pmid": "42647759", "title": "The Gut Microbiome in Multiple Sclerosis.", "journal": "Neurology(R) neuroimmunology & neuroinflammation", "impact_factor": NaN, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Multiple sclerosis (MS) is a chronic inflammatory demyelinating disease of the CNS whose risk and course are shaped by both genetic and environmental factors, among which the intestinal microbiota has emerged as a key, potentially modifiable contributor. People with MS frequently display altered gut microbiota, characterized by depletion of fiber-fermenting, short-chain fatty acid (SCFA)-producing commensals, and expansion of taxa associated with mucus degradation and proinflammatory metabolism. These compositional shifts are paralleled by broad changes in blood and CSF metabolites, including reduced SCFAs, tryptophan-derived aryl hydrocarbon receptor ligands, and secondary bile acids. In addition, several reports highlight the accumulation of aromatic amino acid-derived phenolic and indolic compounds and specific lipid mediators linked to neuroinflammation and neurodegeneration. In this up-to-date review, we synthesize evidence from experimental models and human studies showing how microbial metabolites can influence MS pathogenesis through converging mechanisms: modulation of gut and blood-brain barrier integrity; shaping of T-cell and B-cell responses; direct effects on microglia, astrocytes, and oligodendrocyte lineage cells after crossing into the CNS; and modulation of neural circuits, particularly those involving the vagus nerve. Finally, we highlight current gaps, including the need for longitudinal, harmonized multiomic cohorts, and mechanistic studies integrating microbiome, metabolome, and host readouts across gut, blood, and CNS. Overall, available data support a model in which coordinated disruption of the gut microbiota-metabolite axis, rather than any single pathogen, contributes to MS, opening avenues for microbiota-based and metabolite-based biomarkers and therapies aimed at restoring immune and neuroglial homeostasis.", "zh_summary": "本研究探討多發性硬化症（MS）與腸道微生物群之間的關聯。研究指出，MS 患者的腸道菌相呈現失調狀態，包括短鏈脂肪酸（SCFA）產生菌減少，以及促發炎代謝菌的增加。這些微生物群落的變化伴隨著血液與腦脊髓液中代謝物（如色胺酸衍生物、膽汁酸及 SCFA）的顯著改變，這些物質經證實與神經發炎及退化密切相關。文中綜述了微生物代謝產物如何透過調節腸道與血腦屏障完整性、影響免疫細胞（T/B 細胞）反應，以及直接作用於神經膠質細胞來參與 MS 的致病機制。總結而言，MS 的發生與腸道菌群-代謝物軸的整體失調有關，而非單一病原體所致。該研究強調未來需進行多體學（multiomics）整合分析，以開發基於微生物群的生物標記與創新治療策略，旨在恢復患者的免疫與神經恆定。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647759/"}, {"pmid": "42644746", "title": "Metabolic division of labour drives estuarine-coastal N2O emissions.", "journal": "The ISME journal", "impact_factor": "N/A", "tech_types": "metagenomics, metatranscriptomics", "sample_size": "974 個 N2O 相關的基因體 (recovered N2O-associated genomes)", "has_fulltext": false, "abstract": "Estuarine and coastal systems are global hotspots of marine nitrous oxide (N2O) emissions, where microbial nitrification and denitrification are the primary processes regulating N2O dynamics. However, how interactions among different N2O-associated microorganisms influence ecosystem-scale N2O emissions remains poorly understood. This study combined in situ N2O concentrations, 15N-based potential rates, metagenomics, metatranscriptomics, and genome-scale metabolic model analysis to explore N2O production and reduction processes in estuarine and coastal systems. Potential N2O production and reduction rates, together with in situ concentrations, the relative abundance, and the transcriptional activity of associated genes, were significantly higher at low salinity and declined toward coastal regions. Based on the gene content of 974 recovered N2O-associated genomes, microorganisms were classified into three functional groups: net N2O producers, net N2O consumers, and self-sustaining N2O players. The abundance, composition, and activity of these functional groups shifted along estuarine-coastal gradients. A larger NO/N2O exchange gap, reflecting the imbalance between model-inferred NO and N2O handoff potentials, was found at low salinity and was associated with elevated bottom-water N2O concentrations. Together, community-level division of labour and the associated exchange gap provide a conceptual framework for linking N2O-related functional groups to N2O accumulation in estuarine-coastal ecosystems.", "zh_summary": "本研究旨在解析河口與沿海生態系統中，微生物群落如何透過代謝分工調控氧化亞氮（N2O）的排放。研究整合了現場濃度測量、同位素示蹤、宏基因組學及宏轉錄組學分析，發現低鹽度河口區的 N2O 產量與消耗潛力顯著高於沿海區域。透過重組 974 個相關微生物基因體，研究團隊將微生物劃分為產出型、消耗型及自給自足型三大功能群，並揭示其組成與活性會隨鹽度梯度產生位移。關鍵發現顯示，微生物間代謝產物的傳遞不平衡（即 NO/N2O 交換缺口）是導致河口區 N2O 積累的主因。此研究提出了一個全新的概念架構，闡明了微生物群落內部的「代謝分工」如何驅動全球溫室氣體 N2O 的排放，為預測氣候變遷下河口生態系的環境影響提供了重要的科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42644746/"}, {"pmid": "42644751", "title": "Soil amelioration impacts viral ecology in saline-alkali lands.", "journal": "The ISME journal", "impact_factor": "N/A", "tech_types": "metagenomics, others", "sample_size": "8 個土壤樣本（來自 4 個地區，每個地區含鹽鹼與改良後兩種狀態）", "has_fulltext": false, "abstract": "The continuous expansion of saline-alkali lands under climate change threatens food security and reduces soil carbon stocks. A common mitigation strategy is soil amelioration, which converts degraded soils back into an arable state. Microbes play critical roles in soil health and recovery. However, the viruses that infect these microbial communities, and their potential impacts during saline-alkali soil restoration, remain largely unknown. Here, we combined total soil metagenomics and viromics to investigate host-linked viral ecology across four major saline-alkali regions in China, each encompassing two soil amelioration statuses: saline-alkali and reclaimed. We found that viral community structure was shaped by both geography and soil amelioration status, with salinity and alkalinity emerging as key environmental factors. Viral populations were sensitive to soil restoration, showing strong amelioration-status endemism with functional adaptations. Virus-host dynamics ranged from reduced temperate viruses to abundance mismatches in those infecting key carbon-cycling microorganisms, including carbohydrate degraders. 13C-cellulose DNA-SIP experiments provided further support for this mismatch by tracing assimilated carbon transfer between active host and virus populations. Compared with saline-alkali soils, the relative abundance of hosts in restored soils increased from 39.0% to 61.0%, whereas the linked viruses decreased from 60.6% to 39.4%. Together, these findings reveal an underappreciated role of viruses in shaping saline-alkali soil amelioration trajectories, and could improve management strategies for degraded land recovery and carbon storage.", "zh_summary": "本研究探討土壤改良對鹽鹼地病毒生態的影響。研究團隊結合宏基因組學（metagenomics）與病毒組學分析，發現病毒群落結構受地理環境及土壤改良狀態顯著影響，其中鹽度與鹼度為關鍵驅動因子。結果顯示，土壤改良過程中病毒具有高度的環境特異性與功能適應性。特別是針對碳循環微生物（如碳水化合物降解菌）的病毒，其與宿主間出現了明顯的豐度失配。透過 13C-纖維素同位素標記探針（DNA-SIP）技術，證實了活躍宿主與病毒間的碳轉移差異。改良土壤中宿主微生物豐度由 39.0% 提升至 61.0%，而連結的病毒豐度則由 60.6% 降至 39.4%。本研究揭示了病毒在鹽鹼地改良與土壤碳固存過程中的關鍵調控角色，為退化土地的生態恢復與管理策略提供了重要的科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42644751/"}, {"pmid": "42647600", "title": "Urogenital immune signatures are associated with birth outcomes after maternal urinary tract infection.", "journal": "Science translational medicine", "impact_factor": "14.6", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Preterm birth is the leading cause of infant mortality, resulting in more than 1 million neonatal deaths globally each year. Maternal urinary tract infection (UTI) during pregnancy increases risk for preterm birth; however, biological processes mediating UTI-associated preterm birth are not well described. We established a murine maternal UTI model in which challenge with uropathogenic Escherichia coli (UPEC) initiated preterm labor and birth in about half of dams. Although bacterial burdens were similar, dams experiencing preterm birth displayed excessive bladder inflammation, elevated placental and decidual cytokines, higher proportions of male fetuses, and lower maternal serum interleukin-10 (IL-10) compared with nonlaboring dams. Exogenous IL-10 or lymph node sequestration of T cells reduced placental type 17 T helper cells (TH17 cells) and abrogated preterm birth. In a human pregnancy cohort, we correlated urinary cytokines with birth outcomes and urine culture status. These analyses yielded an exploratory, noninvasive culture-agnostic system for evaluating preterm birth risk, implicating T cell-related cytokines including IL-10, IL-15, GM-CSF, and RANTES. These findings demonstrate that our murine model provides a platform to investigate immunological and microbial factors governing UTI-associated preterm birth and, coupled with patient samples, may be used to identify candidate biomarkers and mechanistic targets for future investigation.", "zh_summary": "本研究探討母體泌尿道感染（UTI）導致早產的生物學機制。研究人員建立小鼠模型，發現致病性大腸桿菌（UPEC）感染後，發生早產的母鼠表現出顯著的膀胱發炎、胎盤與蛻膜細胞激素升高，以及母體血清 IL-10 濃度降低。實驗證實，外源性補充 IL-10 或隔離 T 細胞可減少胎盤 TH17 細胞並預防早產。在人體臨床隊列中，研究分析了尿液細胞激素與出生結果的關聯，識別出 IL-10、IL-15、GM-CSF 及 RANTES 等與早產風險相關的 T 細胞相關細胞激素。此研究不僅闡明了 UTI 誘發早產的免疫調節機制，更提供了一套非侵入性的生物標記篩檢潛力，為未來預防早產的臨床介入策略奠定基礎。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647600/"}, {"pmid": "42647084", "title": "Diet quality, gut microbiome, and inflammatory signatures in Puerto Rican adults with Crohn disease: a multidimensional analysis.", "journal": "Inflammatory bowel diseases", "impact_factor": "4.3", "tech_types": "metagenomics", "sample_size": "60 位克隆氏症（CD）成人患者", "has_fulltext": false, "abstract": "Diet is increasingly recognized as a modifiable factor influencing gut microbiome and outcomes in Crohn disease (CD), yet data in underrepresented populations remain limited. We evaluated diet quality, dietary patterns, gut microbiome composition, inflammatory markers, and patient-reported outcomes in adults with CD from Puerto Rico. We conducted a cross-sectional analysis of 60 adults with CD enrolled prior to dietary intervention in a parent study. Dietary intake was assessed using 24-hour recalls and evaluated using the Healthy Eating Index-2015 (HEI-2015), Alternative Healthy Eating Index-2010 (AHEI-2010), and exploratory dietary pattern analysis. The gut microbiome was assessed by shotgun metagenomic sequencing. Clinical outcomes included fecal calprotectin, C-reactive protein (CRP), a 96-cytokine panel, short Crohn Disease Activity Index (sCDAI), and short Inflammatory Bowel Disease Questionnaire (sIBDQ). Associations were evaluated using unadjusted and adjusted models with false discovery rate (FDR) correction. Overall diet quality was poor and characterized by low intake of fruits, vegetables, whole grains, and fiber, alongside high intake of saturated fat, added sugars, and animal-derived protein. Four dietary patterns were identified: vegetable-rich, dairy-rich, fruit-rich, and coffee/sweetener-rich. Participants adhering to the fruit-rich pattern exhibited the highest diet quality scores. Higher HEI-2015 scores were associated with greater gut microbial diversity and differences in overall microbiome composition. Participants with greater adherence to the vegetable-rich pattern showed modest increases in microbial diversity. Exploratory analyses suggested that higher fruit intake and adherence to a fruit-rich dietary pattern were associated with lower fecal calprotectin and CRP levels, whereas adherence to a vegetable-rich pattern was associated with better health-related quality of life (HRQoL) and adherence to a coffee/sweetener-rich pattern was associated with a worse symptom burden. However, no associations between dietary metrics and inflammatory markers, cytokines, or clinical outcomes remained significant after FDR correction. Most participants were in clinical remission despite substantial impairment in HRQoL. Adults with CD in Puerto Rico exhibited poor diet quality that was associated with gut microbial diversity and exploratory differences in clinical outcomes. While these findings support the influence of diet on the microbiome and clinical outcomes, larger longitudinal studies are needed to determine whether dietary improvements can influence disease outcomes this underrepresented population.", "zh_summary": "本研究針對波多黎各克隆氏症（CD）成人患者進行橫斷面分析，旨在探討飲食品質、腸道菌相與發炎指標間的關聯。研究透過總體基因體定序（Shotgun metagenomics）分析腸道菌相，並評估多項膳食指數與臨床指標。研究發現，該族群整體飲食品質較差，富含水果的飲食模式與較高的菌相多樣性及較低的發炎指標（鈣衛蛋白、CRP）呈正相關；富含蔬菜模式則與較佳的生活品質相關，而咖啡/甜味劑模式則與症狀負擔加重有關。儘管初步分析顯示飲食與菌相及臨床表現間存在關聯，但經多重比較校正（FDR）後，統計顯著性減弱。本研究證實飲食在調節 CD 患者腸道健康中的潛力，強調未來需進行大規模縱向研究，以進一步釐清飲食介入對改善該群體疾病預後的具體效應。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647084/"}, {"pmid": "42648218", "title": "Agricultural sprinkler irrigation systems as environmental reservoirs and airborne dissemination sources of Legionella pneumophila.", "journal": "Journal of environmental management", "impact_factor": "8.4", "tech_types": "metagenomics, small genome", "sample_size": "2 個區域的農業灌溉池塘與溝渠樣本（文中未明確給出具體檢體總數，僅提及兩處採樣區）", "has_fulltext": false, "abstract": "Sprinkler irrigation systems are critical for modern agriculture but represent largely unrecognized aquatic environments capable of sustaining opportunistic human pathogens. Among them, Legionella pneumophila is of particular concern due to its ability to colonize engineered water systems, persist under fluctuating environmental conditions, and be transmitted through aerosols. In this study, we conducted a comprehensive microbiological and genomic investigation of irrigation ponds and ditches in a rural area of north-east Spain where two zones were sampled. Metagenomic profiling revealed highly diverse microbial communities encompassing more than 20,000 species, including 21 airborne-transmissible bacterial pathogens of clinical relevance. Notably, L. pneumophila was detected in both zones, with a relative abundance of up to 4.6 %. Culture-based isolation confirmed the presence of L. pneumophila serogroup 1, Pontiac group, Benidorm subgroup, sequence type 15. Phylogenetic analysis demonstrated a close relationship between this environmental strain and clinical isolates obtained during a Legionnaires' disease outbreak occurred in 2015, which had remained without a confirmed environmental source. Meteorological data from the exposure period revealed wind conditions favouring long-distance aerosol dispersion from irrigated fields toward residential areas. Our findings provide evidence that irrigation infrastructures can act as environmental reservoirs and dissemination routes of L. pneumophila among other airborne pathogens. These results underscore the need to incorporate agricultural irrigation systems into routine environmental surveillance, outbreak investigations, and public health risk assessments.", "zh_summary": "本研究探討農業噴灌系統作為環境病原體儲存庫及氣膠傳播源的角色。研究針對西班牙東北部兩處農業灌溉水體進行宏基因體定序分析，發現高達兩萬種微生物多樣性，並檢測出 21 種具臨床意義的空氣傳播病原菌。研究證實嗜肺性退伍軍人菌（*L. pneumophila*）廣泛存在於灌溉系統中，且經細菌全基因體定序（ST15）比對發現，該環境菌株與 2015 年爆發退伍軍人症但未找到環境源頭的臨床病例具高度親緣關係。結合氣象數據分析，證實灌溉系統產生的氣膠可將病原體遠距離傳播至住宅區。此發現強調農業灌溉設施應被納入環境監測與公共衛生風險評估，以有效預防相關疾病爆發。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42648218/"}, {"pmid": "42648293", "title": "Defined human Clostridia consortia reverse colitis via dual effects of tryptophan metabolites on microbiota and immunity.", "journal": "Cell host & microbe", "impact_factor": "18.7", "tech_types": "metagenomics, metabolomics", "sample_size": "未提及（原文僅提及使用小鼠模型與 IBD 相關人類菌株組合，未明確統計樣本數）", "has_fulltext": false, "abstract": "Microbial dysbiosis and disrupted mucosal immune homeostasis are integrally involved in the pathogenesis of inflammatory bowel diseases (IBDs). Live biotherapeutic products (LBPs) offer a potential therapeutic strategy to restore beneficial microbes and mitigate disease. We investigated the therapeutic efficacy of 2 LBPs, human Clostridia consortia 17-mix and 11-mix, by treating established colitis in murine models. Both LBPs exhibited therapeutic effects in T cell-mediated chronic colitis models induced by human microbiota and in pathobiont-driven gnotobiotic colitis models established with combinations of IBD-relevant human-derived strains. Metagenomic and metabolomic analyses elucidated mechanisms that go beyond established functions driven by short-chain fatty acids (SCFAs) and interleukin (IL)-10-producing regulatory T cells. Notably, LBPs exerted therapeutic effects by directly inhibiting resident pathobionts and through IL-10-independent activation of host anti-inflammatory aryl hydrocarbon receptor (AhR) pathways by bacterial tryptophan metabolites. These results elucidate SCFA- and IL-10-independent protective mechanisms exerted by defined resident bacterial strains that are depleted in IBD dysbiosis.", "zh_summary": "本研究旨在探討定義明確的人類梭菌群（Clostridia consortia）作為活體生物治療產品（LBPs）在治療發炎性腸道疾病（IBD）的潛力。研究利用小鼠結腸炎模型證實，17-mix 與 11-mix 梭菌群能有效緩解由人類微生物群及病原菌驅動的結腸炎。除了傳統認知的短鏈脂肪酸（SCFAs）與 IL-10 產生型調節性 T 細胞機制外，總體基因體與代謝體分析顯示，這些梭菌能透過雙重途徑發揮療效：首先是直接抑制腸道內的病原菌，其次是透過細菌代謝產生的色胺酸代謝物，不依賴 IL-10 而直接活化宿主的芳香烴受體（AhR）抗發炎路徑。此發現揭示了腸道共生菌在恢復黏膜免疫穩態中的新機制，為 IBD 的精準微生態治療提供了重要的科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42648293/"}, {"pmid": "42648688", "title": "Temperature Sensitivity of Pyrrhotite-Driven Metavanadate Bioreduction in Groundwater.", "journal": "Environmental research", "impact_factor": "7.7", "tech_types": "metagenomics, metatranscriptomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Pyrrhotite-driven metavanadate [V(V)] bioreduction is a promising green strategy for the remediation of vanadium-contaminated aquifers. However, how this microbially driven process responds to different temperatures remains unclear. Herein, the responses of pyrrhotite-driven V(V) bioreduction to different temperatures ranging from 4 to 45 °C were investigated. V(V) removal first increased and then decreased with increasing temperature, peaking at 35 °C, with the reaction rate constant reaching 0.077 d-1. V(V) could be reduced to VO2 precipitates, accompanied by oxidation of S(-II) and Fe(II) to sulfate and Fe(III), respectively. Metagenomic binning revealed that S(-II) oxidation was more sensitive to temperature changes than Fe(II) oxidation for V(V) reducers. Bacteria coupling V(V) reduction with both S(-II) and Fe(II) oxidation (e.g., Ramlibacter sp.) were detected exclusively at 35 °C. The transcription of functional genes (related to V(V) reduction, S(-II) oxidation, and Fe(II) oxidation), electron transport activity and related components all exhibited a temperature-dependent pattern, first increasing and then decreasing, with a peak at 35 °C. This study reveals the temperature sensitivity of pyrrhotite-driven V(V) bioreduction, which is helpful for risk assessment and targeted bioremediation of vanadium contamination under different temperature conditions.", "zh_summary": "本研究探討了在地下水中，由磁黃鐵礦（pyrrhotite）驅動的偏釩酸鹽 [V(V)] 生物還原過程對溫度的敏感性。研究發現，在 4 至 45 °C 的溫度範圍內，V(V) 的移除效率呈現先升後降的趨勢，並在 35 °C 時達到最佳反應速率。透過宏基因組分箱（Metagenomic binning）與轉錄組分析，證實了微生物群落中的電子傳遞活性與關鍵功能基因（涉及 V(V) 還原、硫與鐵氧化）的表現均具有顯著的溫度依賴性。特別是能同時耦合硫與鐵氧化的菌種（如 *Ramlibacter* sp.）僅在 35 °C 下被檢測到，且發現硫氧化過程較鐵氧化過程對溫度變化更為敏感。此研究不僅揭示了環境溫度對生物修復效率的調控機制，也為受釩污染地下水的風險評估及制定精準的生物修復策略提供了關鍵科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42648688/"}, {"pmid": "42649294", "title": "Synergistic degradation of fucoidans in the ocean.", "journal": "Nature", "impact_factor": "48.5", "tech_types": "metabolomics, metagenomics", "sample_size": "未提及（研究使用重建的海洋微生物群落及分析現有的海洋宏基因組數據，未明確標註具體樣本人數或檢體數量）", "has_fulltext": false, "abstract": "Fucoidans, a class of complex polysaccharides produced by brown algae and diatoms, contribute to long-term carbon sequestration owing to their resistance to microbial degradation1,2. Although individual microorganisms can break down portions of these polysaccharides3-5, it remains unclear whether complete breakdown is possible in nature and, if so, by what mechanisms. Here we show that fucoidans are degraded through synergistic interactions between specialized bacteria with complementary metabolic functions. Using metabolomic analysis of a reconstructed marine consortium, we uncovered metabolic guilds of bacteria that preferentially degrade either the sulfated fucose backbone or the side branches of rare monomers. This functional division of labour leads to an unexpectedly high number of synergistic interactions between different degraders that enhanced degradation efficiency up to 97.1%. Despite varying fucoidan structures across different types of algae6, the metabolic functions of degraders remained conserved, enabling quantitative prediction of degradation outcomes based on community and substrate composition. The frequent co-occurrence of functionally complementary fucoidan degraders in ocean metagenomes suggests that synergistic degradation is a globally relevant strategy. Our findings suggest that the environmental turnover of complex biopolymers depends not only on individual metabolic capabilities of degraders but also on ecological interactions shaped by substrate architecture. This work provides a mechanistic framework for understanding carbon cycling in the ocean and for engineering synthetic microbial consortia to degrade recalcitrant polysaccharides.", "zh_summary": "本研究探討海洋中複雜多醣類「褐藻糖膠」（fucoidans）的微生物降解機制。研究發現，單一微生物難以完全分解褐藻糖膠，但透過具有互補代謝功能的細菌群落，能實現高效協同降解。研究利用代謝組學分析重建的微生物群落，揭示了細菌如何分工合作，分別降解褐藻糖膠的硫酸化岩藻糖主鏈與稀有單體支鏈，此分工使降解效率提升至 97.1%。此外，透過海洋宏基因組數據分析，證實此種功能互補的微生物組合在全球海洋中普遍存在。這項發現闡明了海洋碳循環的關鍵機制，不僅解釋了複雜生物聚合物的環境轉化原理，也為未來設計合成微生物群落以處理難降解多醣類提供了科學框架。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42649294/"}, {"pmid": "42657129", "title": "Pulmonary Infiltrates, Airway Mucosal Lesions and Respiratory Microbiology After Freshwater Drowning: A Case Report.", "journal": "Respirology case reports", "impact_factor": "N/A", "tech_types": "metagenomics", "sample_size": "n=1 (1 位 20 歲男性患者)", "has_fulltext": false, "abstract": "Early pulmonary abnormalities after freshwater drowning can be overinterpreted as bacterial pneumonia, especially when inflammatory biomarkers and respiratory microbiology are positive. A 20-year-old man was resuscitated after approximately 2 min of freshwater submersion. Day 1 chest CT showed bilateral lower-lobe-predominant opacities compatible with non-cardiogenic pulmonary oedema and aspiration-related lung injury, with near-complete resolution by Day 25. Day 3 bronchoscopy showed diffuse, non-removable, millet-seed-like whitish tracheal mucosal protrusions with hyperaemia and oedema, compatible with acute irritative airway injury. BALF mNGS detected multiple gram-negative bacterial signals, predominantly Klebsiella pneumoniae, while sputum culture yielded ESBL-negative, susceptible K. pneumoniae. Possible drowning-associated pneumonia was considered because of aspiration, fever, markedly elevated inflammatory biomarkers and concordant microbiology; however, rapid radiological improvement and clinical stability suggested a substantial non-infectious component. The patient recovered after an 8-day course of piperacillin-tazobactam without antibiotic escalation, corticosteroids, mechanical ventilation or acute respiratory distress syndrome.", "zh_summary": "本研究透過病例報告，探討淡水溺水後肺部浸潤與呼吸道微生物組成的臨床挑戰。患者溺水後出現類肺炎之放射線影像與發燒等發炎反應，肺泡灌洗液（BALF）經宏基因組定序（mNGS）檢測出大量肺炎克雷伯菌（*Klebsiella pneumoniae*）。儘管微生物學證據確鑿，但影像學快速恢復及穩定的臨床表現，顯示溺水造成的發炎主要源於非感染性的化學性肺損傷，而非單純的細菌性肺炎。此發現具有重要臨床意義：在處理溺水併發症時，醫師應謹慎判讀微生物檢測結果，避免過度診斷與抗生素濫用，強調了在臨床決策中整合影像學、微生物組學與病程演變的重要性。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42657129/"}, {"pmid": "42648179", "title": "Simultaneous removal of nitrogen, Cu2+, and bisphenol A in a hydrogel-biochar-AQDS immobilized bioreactor with added bicarbonate: Performance and metagenomic insights.", "journal": "Journal of hazardous materials", "impact_factor": "11.3", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "As the complexity of industrial wastewater pollution continues to increase, the simultaneous removal of nitrogen, metal contaminants, and persistent organic pollutants under low carbon conditions has become a key challenge for biological treatment systems. To address the operational instability and dependence on carbon sources observed in immobilized systems when exposed to copper (Cu2+) and bisphenol A (BPA), the Pseudoalteromonas japonicus strain LY0623 was integrated into a hydrogel-biochar-AQDS composite carrier to construct a multifunctional immobilized biofilm system. Notably, under conditions containing only NaHCO3, the R4 system achieved an NH4+-N removal rate of 89%. Under conditions where Cu2+ and BPA coexist, the R4 system achieved removal of NH4+-N (89%), NO3--N (100%), Cu2+ (85%), and BPA (88%). Sediment characterization confirmed that Cu2+ was immobilized through adsorption, complexation, and microbiologically induced carbonate precipitation (MICP). Metagenomic analysis further indicated that the Pseudomonadota phylum remained the dominant phylum, while functional pathways associated with inorganic carbon assimilation, HNAD nitrogen metabolism, endogenous carbon transformation, biomineralization, electron transfer, and aromatic compound degradation were preserved. By combining ammonia oxidation driven energy production, inorganic carbon utilization, redox mediated processes, and biomineralization, this study provides a highly promising low carbon strategy for treating industrial wastewater containing mixed pollutants.", "zh_summary": "本研究旨在解決工業廢水中氮、重金屬（Cu2+）與持久性有機污染物（雙酚A，BPA）在低碳條件下難以同時去除的問題。研究團隊開發了一種將 *Pseudoalteromonas japonicus* LY0623 菌株固定於水凝膠-生物炭-AQDS 複合載體中的生物反應器系統。實驗結果顯示，該系統在複雜污染條件下展現出卓越的處理效能，氨氮與硝酸鹽氮去除率分別達到 89% 與 100%，同時成功去除 85% 的 Cu2+ 與 88% 的 BPA。總體基因體分析（metagenomics）證實，系統中的優勢菌群（Pseudomonadota）保持穩定，且與無機碳同化、氮代謝、電子傳遞及芳香族化合物降解相關的關鍵功能路徑皆得以保留。該研究提出的整合性生物修復策略，透過結合生物礦化、氧化還原介導與無機碳利用，為處理含有多種污染物的工業廢水提供了一種高效且節能的新思路。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42648179/"}, {"pmid": "42642622", "title": "Deployable high-fidelity metagenome binning at scale with QuickBin.", "journal": "Communications biology", "impact_factor": "5.1", "tech_types": "metagenomics, small genome", "sample_size": "297 個真實宏基因組樣本（metagenomes）", "has_fulltext": false, "abstract": "Reconstructing genomes from metagenomic assemblies is foundational to microbiome research, yet binning faces a persistent trade-off between fidelity and throughput. Many high-accuracy methods rely on GPU-intensive workflows, marker-gene postprocessing, or heavy computational resources, limiting reproducible use at scale. Here, we present QuickBin, a CPU-native, marker-free binning algorithm designed to recover near-complete, ultra-low-contamination metagenome-assembled genomes (MAGs) efficiently. QuickBin pairs a GC-coverage spatial index (BinMap) with an early-exit Oracle cascade of similarity tests (scalar composition/coverage filters and SIMD-accelerated k-mer comparisons), reserving a compact neural network exclusively for ambiguous merges. Across synthetic communities, evaluated by marker-based and contig-origin ground truth, QuickBin maximizes high-fidelity sequence recovery. In benchmarking 297 diverse real metagenomes, QuickBin completed all runs, recovering more high-quality MAGs (≥95% completeness, ≤1% contamination) than resource-intensive alternatives that frequently failed. QuickBin provides a practical path to reproducible, genome-resolved metagenomics at scale for downstream comparative analyses. Open-source at: https://github.com/bbushnell/BBTools .", "zh_summary": "本研究針對總體基因體學中，組裝高準確度基因體（MAGs）時常見的計算效率瓶頸，開發了一種名為「QuickBin」的新型分箱（binning）演算法。QuickBin 採用 CPU 原生設計，無需依賴 GPU 或標記基因後處理，通過 GC 含量覆蓋率索引與 SIMD 加速比對技術，有效提升計算效能並優化對低汙染、高完整度基因體的組裝能力。在針對 297 個真實宏基因組樣本的效能評估中，QuickBin 展現了比傳統高資源需求工具更高的成功率與產出質量。此工具為大規模、高解析度的微生物群落基因體研究提供了一項高效、可複製的解決方案，能有效推進後續的比較基因體學分析。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642622/"}, {"pmid": "42642466", "title": "Empirical evidence for gut microbial influence on human brain neurochemistry via the gut-brain axis.", "journal": "Molecular psychiatry", "impact_factor": "10.1", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "The gut microbiome produces metabolites with potential neuroactive properties, many of which act locally within the gut. While preclinical studies suggest these microbial pathways can influence cognitive and emotional processes, human evidence remains limited. This study investigates associations between gut microbiome-derived neuroactive functional potential and in vivo brain neurotransmitter concentrations in healthy young females. Using proton magnetic resonance spectroscopy (¹H-MRS), we quantified GABA and glutamate levels in the dorsolateral prefrontal cortex (dlPFC), anterior cingulate cortex (ACC), and inferior occipital gyrus (IOG). Parallel metagenomic profiling characterised microbial functional potential for pathways related to the synthesis and degradation of GABA, glutamate, short-chain fatty acids (SCFAs), p-cresol, and inositol. Region-specific associations were observed between these microbial pathways and cortical GABA and glutamate levels, including excitatory/inhibitory (E/I) balance, a key marker of neuroplasticity and mental health. Notably, microbial glutamate degradation and inositol synthesis potential were associated with IOG E/I balance, while additional pathways including GABA metabolism, p-cresol production, and SCFA synthesis showed distinct associations across regions. Exploratory analyses also identified links between microbial functional potential and anxiety, depressive symptoms, and sleep quality. Together, these findings provide new human evidence that variation in microbial functional potential corresponds with regional cortical neurochemistry and psychological wellbeing, highlighting the gut-brain axis as a promising avenue for mechanistically informed microbiome-based- interventions.", "zh_summary": "本研究旨在探討人體腸道微生物群的代謝功能潛力與大腦神經化學物質之間的關聯。研究利用質子磁振光譜（¹H-MRS）量化年輕健康女性在背外側前額葉皮質（dlPFC）、前扣帶皮質（ACC）與下枕回（IOG）中的 GABA 與麩胺酸濃度，並透過宏基因組學（metagenomics）分析腸道菌群在合成與降解 GABA、麩胺酸、短鏈脂肪酸及對甲酚等代謝途徑的功能潛力。研究發現，特定的腸道微生物代謝途徑與大腦區域的神經傳導物質平衡（E/I balance）顯著相關，且這些關聯與受試者的焦慮、憂鬱症狀及睡眠品質存在潛在連結。此研究提供了腸道與大腦軸線（Gut-Brain Axis）在人類神經化學調節上的實證，不僅闡明了腸道菌群對大腦功能的潛在機制，也為未來開發針對微生物群的心理健康介入策略提供了科學依據。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642466/"}, {"pmid": "42641146", "title": "Engineered bacterial therapeutics from synthetic biology to clinical translation: A multi-database scientometric analysis, 2000-2026.", "journal": "Human vaccines & immunotherapeutics", "impact_factor": 3.5, "tech_types": "others", "sample_size": "1,730 篇學術文章與評論", "has_fulltext": false, "abstract": "Engineered bacterial therapeutics integrate programmable strain engineering with biomedical functions such as sensing, delivery, immune modulation, microbiome intervention, and disease management. This study conducted a multi-database bibliometric analysis to map the knowledge structure, collaboration patterns, and translational direction of this field. Bibliographic records were retrieved from Web of Science Core Collection, Scopus, and PubMed for publications from 1 January 2000 to 1 June 2026. After document-type filtering, time restriction, deduplication, language screening, and manual eligibility assessment, 1,730 English-language articles and reviews were included. CiteSpace 6.4.R1, VOSviewer 1.6.20, and the bibliometrix R package were used to analyze publication trends, collaboration networks, journal co-citation, dual-map citation trajectories, citation bursts, keyword co-occurrence, and thematic evolution. Publication output increased steadily, with faster growth after 2020; 2025 was the highest-output complete year, while 2026 represented a partial retrieval year. China and the United States were the leading contributors, although institutional collaboration remained regionally clustered. Co-citation, citation-burst, and keyword analyses showed a shift from bacterial chassis construction and circuit design toward engineered probiotics, gut microbiota-related therapy, cancer immunotherapy, drug delivery, live biotherapeutic products, and clinical translation. Persistent translational priorities include controllability, safety, manufacturing consistency, and regulatory alignment.", "zh_summary": "本研究透過文獻計量學方法，系統性分析 2000 年至 2026 年間有關「工程化細菌治療」的 1,730 篇學術文獻。研究旨在釐清該領域的知識結構、國際合作模式及臨床轉化趨勢。分析顯示，該領域自 2020 年後顯著加速發展，中國與美國為主要貢獻國。核心研究主軸已由早期的細菌底盤構建與基因電路設計，轉向工程化益生菌、癌症免疫治療、藥物遞送及活體生物藥物（LBP）的開發。科學意義在於確立了該領域從實驗室轉向臨床應用的優先議題，即解決控制力、生物安全性、生產一致性與法規調適等挑戰，為未來工程化細菌作為精準醫療工具的發展提供關鍵決策參考。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42641146/"}, {"pmid": "42642836", "title": "Microbiome-mediated regulation of pathogen virulence: Molecular mechanisms and clinical implications.", "journal": "Virulence", "impact_factor": 5.4, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The human microbiome profoundly influences pathogen virulence and disease susceptibility through diverse molecular mechanisms. This review, focused on literature from 2016 to 2026, synthesizes knowledge on microbiome-mediated regulation examining major pathogens including Vibrio cholerae, enterohemorrhagic Escherichia coli, Salmonella species, Clostridioides difficile, and Staphylococcus aureus. A triangular interaction model is presented, linking host immunity, resident microbiome, and invading pathogen to frame infection outcomes. Commensal bacteria regulate pathogen behavior through quorum sensing interference, metabolite-mediated regulation via short-chain fatty acids and bile acids, competitive exclusion, immune response modulation, and direct antimicrobial production. Key species-Lactobacillus spp. Bifidobacterium spp. Bacteroides thetaiotaomicron, and Faecalibacterium prausnitzii-employ distinct molecular strategies against these pathogens. Organ-on-chip platforms and multi-omics advances reveal context-dependent interactions. Clinical applications including rationally designed probiotics, fecal microbiota transplantation, and precision microbiome engineering show promise despite challenges of inter-individual microbiome variability, representing a paradigm shift toward ecosystem-based infectious disease management.", "zh_summary": "本研究綜述了2016年至2026年間關於腸道微生物群調控病原體毒力（如霍亂弧菌、大腸桿菌、沙門氏菌等）的分子機制。作者提出了一個結合宿主免疫、共生菌群與入侵病原體的「三角交互模型」，闡述了共生菌如何透過群體感應干擾、代謝產物（如短鏈脂肪酸、膽汁酸）調節、競爭性排斥及免疫調節來抑制病原體。研究強調了乳酸桿菌、雙歧桿菌及普拉梭菌等關鍵菌種的保護機制，並探討了器官晶片與多體學技術在揭示交互作用上的貢獻。此研究主張從生態系統角度管理傳染病，指出益生菌設計、糞便菌群移植及精準微生物組工程是未來治療的關鍵方向，雖面臨個體差異挑戰，但為臨床感染控制提供了典範轉移。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642836/"}, {"pmid": "42640100", "title": "Revisiting gut microbiota-driven ammonia metabolism: from disease burden to physiological adaptation.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Ammonia homeostasis is governed by interconnected host and microbial pathways, including hepatic ureagenesis, glutamine synthesis, and gut microbiota-mediated urea hydrolysis, proteolysis, and amino acid deamination. Ammonia has historically been viewed primarily as a nitrogenous waste product and neurotoxic molecule, a concept strongly supported by studies of hyperammonemia and hepatic encephalopathy. Impaired hepatic clearance, portosystemic shunting, and enhanced gut-derived ammonia input increase systemic ammonia burden and are linked to neurological dysfunction, muscle wasting, immune dysregulation, and progression of liver disease. In the gut lumen and mucosal environment, however, gut microbes not only generate ammonia but can also reuse ammonia-derived nitrogen for amino acid synthesis, microbial biomass formation, and community nitrogen exchange. Evidence from selected physiological and preclinical models indicates that microbiota-derived ammonia may contribute to nitrogen recycling, microbial community maintenance, enteric neural regulation, or metabolic adaptation under defined conditions. These roles are more context-specific and less broadly established than the pathological effects of systemic hyperammonemia. When epithelial barrier integrity is compromised, hepatic clearance declines, or host buffering reserves are depleted, elevated ammonia can increase epithelial exposure, portal ammonia input, or peripheral blood ammonia. Conversely, evidence that reduced microbiota-derived ammonia contributes to disease remains limited and currently comes mainly from selected animal models. This review re-examines ammonia metabolism from a gut microbiota-centered perspective. We discuss the ecological origins, spatial distribution, exposure characteristics, host-interface effects, and context-specific outcomes of microbiota-derived ammonia in physiology and disease, and discuss how ammonia should be measured, stratified, and targeted in microbial nitrogen metabolism.", "zh_summary": "本綜述重新審視了腸道菌群驅動的氨代謝，探討其從疾病負擔到生理適應的雙重角色。傳統上，氨被視為具神經毒性的代謝廢物，與高氨血症、肝性腦病及肝病惡化密切相關。然而，在腸道微環境中，微生物不僅產生氨，亦能利用氨源氮進行氨基酸合成與群落氮循環，展現出維持腸道神經與代謝適應等生理功能。文章強調，氨的病理與生理效應高度取決於上皮屏障、肝臟清除能力及宿主緩衝儲備。本研究為腸道微生物氮代謝提供了新的生態與臨床視角，並討論了未來如何精確測量及標靶氨代謝的策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640100/"}, {"pmid": "42640624", "title": "Gut microbial diversity at baseline conditions the clinical, microbiome, and metabolic response to paraprobiotic Lactiplantibacillus plantarum LRCC5282 in overweight adults.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "16S, metabolomics", "sample_size": "120 位過重成人", "has_fulltext": false, "abstract": "The gut microbiota is increasingly recognized as a target for obesity management; however, whether baseline gut microbial diversity conditions responsiveness to microbiota-targeted interventions remains unclear. We aimed to investigate whether baseline gut microbial diversity is associated with responsiveness to a paraprobiotic derived from Lactiplantibacillus plantarum LRCC5282 (LP5282-P) in overweight adults. In a 12-week, randomized, double-blind, placebo-controlled, multicenter trial of 120 overweight adults, LP5282-P produced no significant between-group differences in any clinical outcome across the overall per-protocol population. However, in the low-diversity subgroup, LP5282-P was associated with significant reductions in body weight, body mass index, and circulating leptin levels. These clinical changes were accompanied by compositional shifts in the gut microbiota, including higher relative abundances of Christensenellaceae, Faecalibacterium, and Alistipes. Fecal metabolite profiles showed elevated acetate and butyrate concentrations and altered bile acid composition. Within the low-diversity subgroup, changes in the relative abundances of Akkermansia and Eubacterium were inversely correlated with changes in body weight, body fat mass, and leptin levels. In contrast, the high-diversity subgroup exhibited no consistent response across the outcome domains examined. Overall, baseline gut microbial diversity was associated with differential responsiveness to LP5282-P, supporting its potential use as a stratification variable in future microbiota-targeted intervention trials. Further studies integrating direct measures of microbial activity and host response are warranted to elucidate the biological pathways underlying this diversity-dependent responsiveness. Trial registration: Clinical Research Information Service (CRIS), KCT0008119.", "zh_summary": "本研究旨在探討基準線腸道微生物多樣性，是否會影響過重成人對副乾酪乳桿菌（LP5282-P）介入的臨床、菌群及代謝反應。在一項為期12週、納入120位過重成人的臨床試驗中，整體人群並未展現顯著差異；然而，在「低多樣性」亞群中，LP5282-P顯著降低了受試者的體重、BMI與血清瘦素水平，並促使腸道有益菌（如 *Faecalibacterium* 與 *Alistipes*）豐度上升，同時提升糞便中乙酸與丁酸濃度並改變膽汁酸組成。相反地，「高多樣性」亞群則無一致反應。此研究證實基準線菌群多樣性是預測益生菌療效的重要關鍵，可作為未來精準微生態介入與體重管理的分層依據。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640624/"}, {"pmid": "42642834", "title": "Glycosylation in gut-brain communication: from the intestinal barrier and microbiota to immune and neural signaling.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The gut-brain axis is a complex bidirectional communication network linking the gastrointestinal tract and the central nervous system. Its dysregulation is closely associated with a wide range of gastrointestinal, metabolic, and neuropsychiatric disorders. Glycosylation, one of the most prevalent and structurally diverse post-translational modifications of proteins and lipids, is increasingly recognized as a regulator of multiple processes within the gut-brain axis. In this review, we summarize evidence that glycosylation influences several steps of gut-brain communication, including intestinal barrier function, microbial glycan metabolism, immune signaling, enteric and vagal pathways, blood-brain barrier integrity, and neural responses. We distinguish direct mechanistic findings from associative observations and discuss the more limited evidence for brain-to-gut regulation of intestinal glycosylation. In addition, we discuss the potential of glycosylation-targeted nutritional and microbiota-based interventions and highlight emerging opportunities to integrate glycomics with other omics approaches to dissect the complex regulatory networks underlying the gut-brain axis. In conclusion, elucidating how glycosylation shapes signaling along the gut-brain axis may open new avenues for understanding disease pathogenesis and for developing targeted therapeutic strategies.", "zh_summary": "本文探討「腸-腦軸線」（Gut-Brain Axis）中醣基化（Glycosylation）修飾的關鍵調節角色。醣基化作為蛋白質與脂質重要的轉譯後修飾，深刻影響腸道屏障功能、微生物聚醣代謝、免疫訊息傳遞及血腦屏障完整性。研究重點解析了醣基化如何調控腸道與中樞神經系統間的溝通，並區分了機制性證據與相關性觀察。本文不僅強調了醣基化在維繫軸線穩定中的核心地位，更提出透過營養干預與微生物調節，結合多體學（Omics）分析醣基化網絡，將有望為神經精神疾病與代謝性障礙提供創新的診斷與治療策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642834/"}, {"pmid": "42635401", "title": "Fecal filtrate transplantation as salvage therapy for fulminant Clostridioides difficile infection in adult hematological patients during chemotherapy-induced aplasia: a pilot experience.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "16S, metagenomics", "sample_size": "3 位成人血液腫瘤患者", "has_fulltext": false, "abstract": "Fulminant Clostridioides difficile infection (CDI) in patients with hematologic malignancies during chemotherapy-induced aplasia carries high mortality and limited treatment options. Our objective was to evaluate fecal filtrate transplantation (FFT) as a salvage therapy for fulminant CDI during aplasia, and to explore whether donor-recipient phage dynamics may contribute to clinical response. We conducted a single-center, prospective, protocol-defined pilot case series study including consecutive adults with hematologic malignancies, chemotherapy-induced grade-4 aplasia and fulminant CDI, refractory to ≥5 d of high-dose oral vancomycin plus intravenous metronidazole and tigecycline. FFT was prepared from a single unrelated donor using sequential centrifugation and filtration, and administered via nasogastric tube in two doses. The primary outcome was sustained clinical cure, secondary outcomes included survival and adverse events, assessed at +14 and +30 d post-FFT. 16S rRNA gene sequencing was used to assess microbiome compositions, while viral metagenomics and in vitro propagation assays were employed to characterize donor-recipient phageome interactions. Three patients with adverse-risk acute myeloid leukemia and fulminant CDI caused by genetically distinct C. difficile strains received FFT. All patients achieved clinical resolution by day +14, accompanied by improvements in abdominal distension and inflammatory markers. By day +30, one patient died from Pseudomonas aeruginosa septic shock, while two maintained remission with confirmatory follow-up. FFT was well tolerated, with no procedure-related immediate complications or FFT-attributable adverse events. Microbiome and phage profiling revealed heterogeneous responses, including shifts in bacterial community composition, with no clear evidence for a general role of donor-derived phages in CDI resolution. In contrast, we observed induction of prophages harbored by recipient-associated Clostridium species, which may have contributed to decolonization through stress-induced entry into the lytic cycle. FFT was feasible, with rapid sustained CDI resolution in hematologic patients with chemotherapy-induced aplasia. ClinicalTrials.gov identifier NCT07172191. Prospective single-center pilot study of fecal filtrate transplantation (FFT) for fulminant-refractory C. difficile infection in three aplastic adult hematologic patients. FFT was well tolerated, achieved rapid clinical cure, and showed heterogeneous microbiome and phageome modulation, potentially contributing to therapeutic effects.", "zh_summary": "本研究旨在評估糞便濾液移植（FFT）作為挽救療法，治療化療致免疫不全之血液腫瘤患者合併難治猛爆性艱難梭菌感染（CDI）的療效，並探討供受體間噬菌體的動力學關係。此臨床先導試驗納入3位患者，結果顯示FFT耐受性良好，所有患者在接受治療後14天內均達到臨床緩解。微生態與噬菌體體學分析顯示，臨床症狀的改善並非源於供體噬菌體的直接轉移，而是FFT可能誘發了受體腸道內艱難梭菌的原噬菌體進入溶菌週期，進而促進病原菌清除。本研究證實FFT在此高風險族群中具安全性與可行性，為難治性CDI提供了創新的機制見解與治療選擇。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635401/"}, {"pmid": "42635406", "title": "Separating extracellular from intracellular fecal metabolites exposes cross-feeding architecture in the gut: exploring metabolite partitioning and ecological associations.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "metagenomics, metabolomics", "sample_size": "63 個糞便檢體（來自 63 位健康受試者）", "has_fulltext": false, "abstract": "The gut microbiota forms a complex ecosystem through metabolic interdependence (cross-feeding). However, conventional fecal metabolomics typically quantifies only total metabolite pools, making it difficult to distinguish extracellular-enriched metabolite pools from predominantly cell-associated ones, and thus limiting reconstruction of in situ metabolic networks. Here, we quantified fecal metabolites in paired fractions from the same specimen: an undisrupted fraction representing the extracellular pool and a strongly bead-beaten fraction representing the total pool; the intracellular pool was defined as the difference between total and extracellular measurements. Stool samples from 63 healthy individuals were analyzed for short-chain fatty acids, polyamines, and water-soluble vitamins, and the results were integrated with shotgun metagenomic profiles of species composition and functional genes. Vitamins exhibited two distinct behaviors. Adenosylcobalamin (a vitamin B12 coenzyme) was detectable only after disruption, and together with thiamine (B1) and niacin (B3) was classified as an intracellular-retained type (Type 1). In contrast, biotin (B7) and pantothenate (B5) showed higher extracellular proportions (Type 2). Integrative analyses further indicated that Type 1 thiamine was negatively associated with Blautia, consistent with intensive microbial utilization, whereas Type 2 biotin was strongly positively associated with Alistipes, suggesting links to ecological niches shaped by luminal pH and fermentation modes (carbohydrate vs protein fermentation). Fraction-resolved quantification provides a practical operational framework to differentiate extracellular from cell-associated metabolite pools, helping reconcile metagenomic potential with metabolomic reality and enabling deeper inference of cross-feeding structure in the gut ecosystem.", "zh_summary": "本研究針對腸道微生物的代謝互營機制（cross-feeding）進行探討。傳統糞便代謝組學僅能分析總代謝物，無法區分細胞外與細胞內代謝池，限制了對代謝網絡的解析。研究團隊透過對比未破碎（代表細胞外池）與強力破碎（代表總代謝池）的糞便樣本，成功推算出細胞內代謝物的分佈。針對短鏈脂肪酸、多胺與水溶性維生素的分析顯示，維生素呈現兩類分佈：B12、B1 與 B3 傾向保留於細胞內（Type 1），而 B7 與 B5 則富集於細胞外（Type 2）。結合宏基因組分析發現，Type 1 代謝物與特定細菌（如 *Blautia*）的利用模式顯著相關，Type 2 代謝物則與 *Alistipes* 及腸道生態位特徵（如 pH 值、發酵類型）相關。此方法為區分代謝物空間分佈提供了實用架構，有助於更精確地將宏基因組功能潛力與代謝體現實連結，深入理解腸道微生物的互營生態結構。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635406/"}, {"pmid": "42659434", "title": "Blechomonas campbelli from Ctenocephalides felis: in vitro development, thermotolerance, and phylogenetic insights.", "journal": "Memorias do Instituto Oswaldo Cruz", "impact_factor": "2.5", "tech_types": "others", "sample_size": "340 隻跳蚤", "has_fulltext": false, "abstract": "Blechomonas spp. are flea-specific monoxenous trypanosomatids, whose biology, host range, and geographic distribution remain poorly understood, even for species inhabiting ubiquitous cat and dog fleas. To isolate and characterise blechomonads from fleas of domestic dogs in Brazil, focusing on culture growth, morphology, and phylogenetic relationships. Fleas collected from dogs in Sabará, Brazil, were morphologically identified and screened by cultivation. The isolate FL-1 was analysed for temperature-dependent growth, morphology, and phylogeny using 18S rRNA and gGAPDH sequences, including those mined from public metagenomic datasets. Of 340 fleas (four per pool), only one culture tested positive. Growth was optimal at 25ºC, reduced at 30ºC, and absent at 35ºC. Four cell types were revealed, including a predominant \"uromonad\" stage specialised for attachment and aggregation. Phylogenetic analyses placed the isolate within Blechomonas campbelli and indicated that this species and Blechomonas lauriereadi occur in Ctenocephalides spp. from multiple continents. Blechomonas campbelli exhibits developmental adaptations to the flea gut and limited tolerance to elevated temperatures, constraining its potential to persist in warm-blooded hosts. These findings highlight the value of combining culture-based and in silico approaches to investigate flea-associated trypanosomatids.", "zh_summary": "本研究旨在分離並表徵巴西家犬身上跳蚤所攜帶的單宿主錐蟲（*Blechomonas* spp.）。研究人員透過培養法分析 340 隻跳蚤，成功分離出 *Blechomonas campbelli* (FL-1 株)。實驗結果顯示，該菌株在 25°C 生長最佳，30°C 生長受限，35°C 則無法生長，顯示其對高溫耐受力差，難以在恆溫動物宿主內存活。形態學觀察發現其具備多種細胞型態，其中「尾鞭毛蟲」（uromonad）階段有利於附著與聚集。系統發生學分析結合了 18S rRNA、gGAPDH 序列及公共宏基因組數據，證實 *B. campbelli* 與 *B. lauriereadi* 廣泛分布於全球的貓蚤與狗蚤中。此研究揭示了該寄生蟲對跳蚤腸道環境的適應機制，並證實整合培養法與生物資訊學工具對於探索節肢動物共生寄生蟲具有高度科學價值。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42659434/"}, {"pmid": "42635403", "title": "Baseline gut microbiome ecology predicts long-term fat mass loss after bariatric surgery: evidence for a thrifty Bifidobacterium phenotype.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "16S, metabolomics", "sample_size": "85 位重度肥胖患者及 21 位健康對照組（共 106 名受試者）", "has_fulltext": false, "abstract": "Bariatric surgery (BS) induces weight loss, but long-term success involves complex host-microbiome interactions. We evaluated the longitudinal impact of BS, microbiome resilience, and Mediterranean Diet (MedDiet) adherence up to 24 months. This prospective observational study included 85 patients with severe obesity undergoing BS and 21 normal-weight healthy controls (HC). MedDiet adherence (PREDIMED) was assessed before surgery. Fecal microbiota (16S-rRNA sequencing) and metabolomics (1H-NMR spectroscopy) were analyzed at baseline and at 1-, 6-, and 12-months post-BS. Clinical outcomes and fat mass, evaluated by bioimpedanciometry, were tracked up to 24 months. At baseline, patients exhibited higher microbial Shannon diversity than controls (p = 0.041), alongside a dysfunctional microbiome and metabolome characterized by a higher Firmicutes/Bacteroidetes ratio and elevated levels of branched-chain amino acids (p < 0.0001). Ordinary Least Squares (OLS) regression analysis revealed that MedDiet adherence and type 2 diabetes status significantly modulated baseline diversity. At 12 months post-BS, the gut ecosystem underwent profound remodeling, characterized by depletion of Bifidobacterium spp. and an increase in butyrate levels (p < 0.0001), establishing a novel adaptive state distinct from HC. Baseline gut ecology significantly conditioned long-term BS outcomes: patients in the highest quartile of baseline Bifidobacterium spp. lost significantly less fat mass at 24 months than those in the lowest (6.6% vs. 13.2%, p = 0.010). High baseline Bifidobacterium abundance paradoxically acts as a \"thrifty microbiome,\" potentially maximizing energy harvest and limiting surgery-induced fat loss. Overall, BS induces adaptive microbiome restoration rather than true normalization, highlighting the potential for precision interventions prior to surgery.", "zh_summary": "本研究探討減重手術（BS）後腸道微生物群與長期減脂效果的關聯。研究追蹤 85 名患者於術前及術後長達 24 個月的變化，分析發現手術顯著重塑了腸道菌相與代謝環境，特別是雙歧桿菌（*Bifidobacterium*）的耗竭與丁酸鹽的增加。關鍵發現指出，術前高豐度的雙歧桿菌反而成為一種「節儉型表型」，會增加能量攝取效率，導致術後 24 個月的脂肪減少量顯著較少（6.6% 對比 13.2%）。這顯示減重手術並非使微生物組回歸常態，而是引發一種適應性重組。此研究凸顯了術前腸道生態作為預測手術成效生物標記的潛力，對於未來制定精準的術前介入策略具有重要的臨床指導意義。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635403/"}, {"pmid": "42634246", "title": "Natural microbiota confer life-long protection against obesity via an early-life, immune-mediated effect on brown adipocytes.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Obesity, a major risk factor for metabolic disease, has increased in industrialized nations alongside a reduction in gut microbiota diversity. Reconstituting laboratory mice with complex, natural microbiota and commensals from wild mice resulted in protection against diet-induced obesity. These natural microbiota reduced weight gain in both male and female mice of different genetic backgrounds throughout their life and increased energy expenditure. Single-nuclei RNA sequencing identified a dominant adipocyte population in brown adipose tissue (BAT) with a transcriptional signature of increased thermogenic activity, while white adipose tissue mass and beiging were reduced. Protection against diet-induced obesity was transferable to adult germ-free mice via exposure to natural microbiota, indicating an association with the timing of immune response induction rather than BAT developmental programming. However, protection against diet-induced obesity did not require type 2 immune signaling, as shown in STAT6 knockout mice. Rather, it was associated with increased levels of chemokines and monocytes in BAT in early life, pointing to a role of infiltrating myeloid cells. Indeed, CCR2-deficient mice with natural microbiota lacked the BAT transcriptional signature of increased thermogenic activity, increased energy expenditure, and protection against diet-induced obesity that wild-type mice with natural microbiota exhibited. The latter was restored upon injection with wild-type bone marrow. Taken together, these findings identify a novel microbiota‒immune‒adipose tissue axis that results in increased BAT thermogenesis and improved energy balance throughout life.", "zh_summary": "本研究旨在探討野生小鼠的天然腸道菌相如何預防飲食引起的肥胖。研究發現，移植天然菌相能終生保護不同遺傳背景的實驗小鼠免於肥胖，並顯著增加能量消耗。單細胞核RNA定序（snRNA-seq）顯示，這與褐色脂肪組織（BAT）中產熱活性增強的脂肪細胞亞群有關。此保護機制並非透過第二型免疫信號，而是依賴於早期生命階段骨髓源性細胞（特別是CCR2+單核細胞）向BAT的浸潤與免疫調節。本研究首次揭示了一條全新的「腸道菌群—免疫—脂肪組織」軸，證實早期菌相暴露能透過免疫介導促進褐色脂肪產熱，為肥胖及代謝性疾病的防治提供了新穎的科學依據與治療靶點。", "date": "2026-08-23", "url": "https://pubmed.ncbi.nlm.nih.gov/42634246/"}, {"pmid": "42644084", "title": "Viral metagenomics of synanthropic urban bats: A surveillance strategy for uncovering potentially zoonotic viruses.", "journal": "One health (Amsterdam, Netherlands)", "impact_factor": "N/A", "tech_types": "metagenomics", "sample_size": "2,422 隻蝙蝠中篩選出的 150 組配對肺部與腸道樣本（共 300 個檢體）", "has_fulltext": false, "abstract": "Bats are natural reservoirs for diverse viruses, including coronaviruses, filoviruses, and paramyxoviruses, several of those known to be involved in zoonotic spillover events and demanding an integrated surveillance. Here, we present a framework that leverages Brazil's rabies passive surveillance programme to detect bat-borne viruses. Using an algorithm to select representative specimens from 2422 bats collected across São Paulo state, we submitted 150 paired lung and intestine samples to nanopore metagenomic sequencing. We detected 98 viral contigs from 12 families of public health relevance, including Arenaviridae, Coronaviridae, and Paramyxoviridae. Notably, the approach identified a previously unknown filovirus in bats in the Americas, validating the framework's capacity for epidemic preparedness. These findings reveal an undetected viral diversity and demonstrate how existing animal surveillance can monitor pathogen threats. Crucially, in a workshop involving multisectoral One Health experts in Brazil, this framework was validated as a scalable model for national expansion, adapted for low- and middle-income countries (LMICs).", "zh_summary": "本研究旨在利用巴西現有的狂犬病被動監測系統，建立一套偵測蝙蝠源人畜共通病毒的監測框架。研究團隊從聖保羅州收集的 2,422 隻蝙蝠中，篩選出 150 組配對的肺部與腸道樣本進行奈米孔總體基因體定序。結果成功偵測到來自沙狀病毒、冠狀病毒及副黏液病毒等 12 個具公衛重要性病毒科的 98 個病毒基因片段，並首次在美洲蝙蝠中發現一種未知的絲狀病毒。此研究不僅揭示了隱匿的病毒多樣性，更證實該框架能有效預防新興傳染病，為中低收入國家提供了一套可推廣至全國的「健康一體」（One Health）防疫監測模型。", "date": "2026-08-17", "url": "https://pubmed.ncbi.nlm.nih.gov/42644084/"}, {"pmid": "42637484", "title": "Insights into the analysis of microbial communities in fermented foods from the perspective of DNA-based techniques.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "The quality, flavor, and stability of fermented foods depend on the microbial community. However, microbial dynamics are difficult to observe directly, leading to limited control over fermentation. High-throughput sequencing is a revolutionary tool for microbial characterization, among which DNA-based amplicon and metagenomic sequencing are core techniques. Nevertheless, the related data processing workflows in the context of fermented foods have not yet been systematically summarized, hindering the translation of research findings into fermentation practices. This review clarifies the applications of amplicon and metagenomic sequencing in fermented foods. For amplicon sequencing, the impacts of target regions, data preprocessing, and reference databases are addressed. For metagenomic sequencing, sequencing strategies, read-based and binning-based analytical methods, functional annotation, and species-specific databases are discussed. In addition, major strategies for downstream analysis of community data are summarized, including microbial diversity, co-occurrence networks, niche and community assembly, key environmental drivers, and machine learning-based prediction. Amplicon sequencing efficiently reveals microbial succession during fermentation but has limitations in functional annotation. Metagenomic sequencing is notable for functional annotation, enabling the linkage between microbial communities and metabolic potential alongside community characterization. Standardized data preprocessing and specific databases are critical for improving characterization. For community data, integrated analysis allows uncovering the driving factors of microbial succession, thereby helping to regulate fermentation. Notably, the compositional nature of the data must be considered and validated to avoid spurious associations. In summary, the exponential growth of sequencing data will propel the era of precision fermentation.", "zh_summary": "本文為一篇綜述性研究，旨在探討以 DNA 為基礎的高通量定序技術（包含擴增子定序與宏基因組學）在發酵食品微生物群落分析中的應用。研究指出，儘管高通量定序技術已成為解析微生物動態的革命性工具，但目前缺乏系統性的數據處理框架，限制了科學發現向產業實踐的轉化。本文詳細梳理了從目標區域選擇、數據預處理、參考數據庫建立到下游生物資訊分析（如共現網絡、生態棲位構建及機器學習預測）的標準化流程。研究強調，擴增子定序雖能有效揭示群落演替，但在功能註解上存在限制；而宏基因組學則具備更強的功能解析潛力，能將微生物組成與代謝功能聯繫起來。透過標準化數據處理流程並考慮數據的組成特性，這些先進技術將精準調控發酵過程，引領精密發酵時代的到來。", "date": "2026-07-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42637484/"}, {"pmid": "42637478", "title": "Effects of sorghum variety on fermentation microecology and flavor characteristics of sesame-flavor Baijiu.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "3 種高粱品種（Hongyingzi, Hei'e, G），於 2 輪發酵週期中，在 3 個時間點（0、15、50 天）採集發酵酒醅檢體（樣本總數依實驗設計推算為 18 組發酵樣品）", "has_fulltext": false, "abstract": "Sorghum, the principal raw material for Baijiu fermentation, plays a key role in shaping fermentation microecology and flavor formation. However, the effects of sorghum varietal differences on sesame-flavor Baijiu fermentation remain insufficiently understood. In this study, three sorghum varieties, Hongyingzi (R), Hei'e (B), and a domestic cultivar (G), were compared over two consecutive fermentation rounds. Fermented grain (Jiupei) samples collected at 0, 15, and 50 days were analyzed for physicochemical properties, enzyme activities, microbial communities, volatile compounds in Jiupei and base liquor, and the taste characteristics of the corresponding base liquor. Despite showing similar overall fermentation trends, the three sorghum varieties differed in acid accumulation, starch utilization, microbial succession, and volatile composition. Fungal communities shifted from early Pichia dominance to multi-genus coexistence, whereas bacterial communities progressively converged toward Lactobacillus dominance. A total of 218 and 258 volatile compounds were identified in Jiupei and 176 and 192 in base liquor from the first and second rounds, respectively. Esters were the dominant differential class, and volatile-marker profiles varied among sorghum varieties and fermentation rounds, with no single variety showing consistent enrichment across all sesame-flavor-related compounds. These results indicate that sorghum variety is an important factor associated with microbial assembly and flavor formation during sesame-flavor Baijiu fermentation, and provide a basis for raw material selection and flavor-oriented process optimization.", "zh_summary": "本研究旨在探討不同高粱品種對芝麻香型白酒發酵過程中，微生物群落結構與風味代謝物質形成的影響。研究比較了紅纓子（R）、黑鵝（B）與國內品種（G）三種高粱，分析其在發酵過程中的理化特性、微生物演替及揮發性化合物組成。研究發現，儘管各品種發酵趨勢相似，但在酸度累積、澱粉利用率及微生物群落演替上存在顯著差異；真菌群落由早期的畢赤酵母（*Pichia*）主導轉變為多菌屬共存，細菌群落則趨向於乳桿菌（*Lactobacillus*）主導。分析鑑定出上百種揮發性化合物，其中酯類是導致風味差異的主要代謝物。本研究證實了高粱品種是決定白酒發酵微生物群落組裝與最終風味品質的關鍵因子，為白酒產業的原料選擇與製程最佳化提供了重要的科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637478/"}, {"pmid": "42637476", "title": "A Shenling Baizhu San polysaccharide fraction (SLP-2)-based synbiotic alleviates lactose-induced gut dysfunction via a microbiota-metabolite-barrier axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Lactose intolerance (LI) is a common digestive disorder, and its management still relies largely on dietary restriction. Because gut microbial fermentation and barrier dysfunction contribute to LI-related symptoms, microbiota-targeted prebiotic or synbiotic strategies may provide complementary approaches. However, the active plant-polysaccharide fractions and their microbial partners
