    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42640624", "title": "Gut microbial diversity at baseline conditions the clinical, microbiome, and metabolic response to paraprobiotic Lactiplantibacillus plantarum LRCC5282 in overweight adults.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metabolomics", "sample_size": "120 位過重成人", "has_fulltext": false, "abstract": "The gut microbiota is increasingly recognized as a target for obesity management; however, whether baseline gut microbial diversity conditions responsiveness to microbiota-targeted interventions remains unclear. We aimed to investigate whether baseline gut microbial diversity is associated with responsiveness to a paraprobiotic derived from Lactiplantibacillus plantarum LRCC5282 (LP5282-P) in overweight adults. In a 12-week, randomized, double-blind, placebo-controlled, multicenter trial of 120 overweight adults, LP5282-P produced no significant between-group differences in any clinical outcome across the overall per-protocol population. However, in the low-diversity subgroup, LP5282-P was associated with significant reductions in body weight, body mass index, and circulating leptin levels. These clinical changes were accompanied by compositional shifts in the gut microbiota, including higher relative abundances of Christensenellaceae, Faecalibacterium, and Alistipes. Fecal metabolite profiles showed elevated acetate and butyrate concentrations and altered bile acid composition. Within the low-diversity subgroup, changes in the relative abundances of Akkermansia and Eubacterium were inversely correlated with changes in body weight, body fat mass, and leptin levels. In contrast, the high-diversity subgroup exhibited no consistent response across the outcome domains examined. Overall, baseline gut microbial diversity was associated with differential responsiveness to LP5282-P, supporting its potential use as a stratification variable in future microbiota-targeted intervention trials. Further studies integrating direct measures of microbial activity and host response are warranted to elucidate the biological pathways underlying this diversity-dependent responsiveness. Trial registration: Clinical Research Information Service (CRIS), KCT0008119.", "zh_summary": "本研究旨在探討基準線（baseline）腸道菌相多樣性，是否會影響過重成人對植物乳桿菌副乾酪乳酸菌（LP5282-P）干預的臨床與代謝反應。在一項納入120位過重成人的臨床試驗中，整體受試者接受LP5282-P後無顯著差異；然而，在「低菌相多樣性」亞群中，LP5282-P顯著降低了體重、BMI及血清瘦素水平，並伴隨有益菌（如*Christensenellaceae*、*Faecalibacterium*）富集，以及糞便中短鏈脂肪酸（乙酸、丁酸）濃度升高。高多樣性組則無明顯反應。此研究證實基準線菌相多樣性是預測微生態干預療效的重要指標，對未來個人化精準體重管理具有重要科學意義。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640624/"}, {"pmid": "42640100", "title": "Revisiting gut microbiota-driven ammonia metabolism: from disease burden to physiological adaptation.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Ammonia homeostasis is governed by interconnected host and microbial pathways, including hepatic ureagenesis, glutamine synthesis, and gut microbiota-mediated urea hydrolysis, proteolysis, and amino acid deamination. Ammonia has historically been viewed primarily as a nitrogenous waste product and neurotoxic molecule, a concept strongly supported by studies of hyperammonemia and hepatic encephalopathy. Impaired hepatic clearance, portosystemic shunting, and enhanced gut-derived ammonia input increase systemic ammonia burden and are linked to neurological dysfunction, muscle wasting, immune dysregulation, and progression of liver disease. In the gut lumen and mucosal environment, however, gut microbes not only generate ammonia but can also reuse ammonia-derived nitrogen for amino acid synthesis, microbial biomass formation, and community nitrogen exchange. Evidence from selected physiological and preclinical models indicates that microbiota-derived ammonia may contribute to nitrogen recycling, microbial community maintenance, enteric neural regulation, or metabolic adaptation under defined conditions. These roles are more context-specific and less broadly established than the pathological effects of systemic hyperammonemia. When epithelial barrier integrity is compromised, hepatic clearance declines, or host buffering reserves are depleted, elevated ammonia can increase epithelial exposure, portal ammonia input, or peripheral blood ammonia. Conversely, evidence that reduced microbiota-derived ammonia contributes to disease remains limited and currently comes mainly from selected animal models. This review re-examines ammonia metabolism from a gut microbiota-centered perspective. We discuss the ecological origins, spatial distribution, exposure characteristics, host-interface effects, and context-specific outcomes of microbiota-derived ammonia in physiology and disease, and discuss how ammonia should be measured, stratified, and targeted in microbial nitrogen metabolism.", "zh_summary": "本文為一篇綜述論文，重新審視了腸道菌群驅動的氨代謝，探討其在疾病負擔與生理適應中的雙重角色。傳統上，氨被視為具神經毒性的代謝廢物，與肝性腦病變、肌肉流失及免疫失調密切相關。然而，最新證據指出，在腸道局部環境中，菌群產生的氨可被重新利用於氨基酸合成與氮循環，維持菌落穩定並促進生理適應。氨的病理或生理效應取決於腸道屏障完整性、肝臟清除率及宿主緩衝能力。此研究的科學意義在於打破了氨僅為有害廢物的單一觀點，強調必須結合特定生理情境，精準測量並標靶調控腸道菌群的氮代謝，為相關疾病的臨床診療提供新思路。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640100/"}, {"pmid": "42641146", "title": "Engineered bacterial therapeutics from synthetic biology to clinical translation: A multi-database scientometric analysis, 2000-2026.", "journal": "Human vaccines & immunotherapeutics", "impact_factor": "3.5", "tech_types": "others", "sample_size": "1,730 篇英文文獻（包含研究文章與綜述）", "has_fulltext": false, "abstract": "Engineered bacterial therapeutics integrate programmable strain engineering with biomedical functions such as sensing, delivery, immune modulation, microbiome intervention, and disease management. This study conducted a multi-database bibliometric analysis to map the knowledge structure, collaboration patterns, and translational direction of this field. Bibliographic records were retrieved from Web of Science Core Collection, Scopus, and PubMed for publications from 1 January 2000 to 1 June 2026. After document-type filtering, time restriction, deduplication, language screening, and manual eligibility assessment, 1,730 English-language articles and reviews were included. CiteSpace 6.4.R1, VOSviewer 1.6.20, and the bibliometrix R package were used to analyze publication trends, collaboration networks, journal co-citation, dual-map citation trajectories, citation bursts, keyword co-occurrence, and thematic evolution. Publication output increased steadily, with faster growth after 2020; 2025 was the highest-output complete year, while 2026 represented a partial retrieval year. China and the United States were the leading contributors, although institutional collaboration remained regionally clustered. Co-citation, citation-burst, and keyword analyses showed a shift from bacterial chassis construction and circuit design toward engineered probiotics, gut microbiota-related therapy, cancer immunotherapy, drug delivery, live biotherapeutic products, and clinical translation. Persistent translational priorities include controllability, safety, manufacturing consistency, and regulatory alignment.", "zh_summary": "本研究透過多資料庫的文獻計量學分析，全面梳理了2000至2026年間工程菌治療（Engineered bacterial therapeutics）領域的知識架構、合作網絡與臨床轉化趨勢。分析 1,730 篇相關文獻顯示，該領域的發文量自2020年起快速增長，並以中美兩國為主要研究貢獻國。研究熱點已從早期的細菌底盤建構與基因電路設計，轉向工程益生菌、腸道菌群治療、癌症免疫治療、藥物傳遞及活體生物藥物（LBPs）。本研究不僅揭示了工程菌療法的整體發展軌跡，也指出可控性、安全性、生產一致性與監管合規是未來臨床轉化必須克服的關鍵挑戰。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42641146/"}, {"pmid": "42635406", "title": "Separating extracellular from intracellular fecal metabolites exposes cross-feeding architecture in the gut: exploring metabolite partitioning and ecological associations.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "metagenomics, metabolomics", "sample_size": "63 個糞便檢體（來自 63 位健康受試者）", "has_fulltext": false, "abstract": "The gut microbiota forms a complex ecosystem through metabolic interdependence (cross-feeding). However, conventional fecal metabolomics typically quantifies only total metabolite pools, making it difficult to distinguish extracellular-enriched metabolite pools from predominantly cell-associated ones, and thus limiting reconstruction of in situ metabolic networks. Here, we quantified fecal metabolites in paired fractions from the same specimen: an undisrupted fraction representing the extracellular pool and a strongly bead-beaten fraction representing the total pool; the intracellular pool was defined as the difference between total and extracellular measurements. Stool samples from 63 healthy individuals were analyzed for short-chain fatty acids, polyamines, and water-soluble vitamins, and the results were integrated with shotgun metagenomic profiles of species composition and functional genes. Vitamins exhibited two distinct behaviors. Adenosylcobalamin (a vitamin B12 coenzyme) was detectable only after disruption, and together with thiamine (B1) and niacin (B3) was classified as an intracellular-retained type (Type 1). In contrast, biotin (B7) and pantothenate (B5) showed higher extracellular proportions (Type 2). Integrative analyses further indicated that Type 1 thiamine was negatively associated with Blautia, consistent with intensive microbial utilization, whereas Type 2 biotin was strongly positively associated with Alistipes, suggesting links to ecological niches shaped by luminal pH and fermentation modes (carbohydrate vs protein fermentation). Fraction-resolved quantification provides a practical operational framework to differentiate extracellular from cell-associated metabolite pools, helping reconcile metagenomic potential with metabolomic reality and enabling deeper inference of cross-feeding structure in the gut ecosystem.", "zh_summary": "本研究旨在解決傳統糞便代謝體學無法區分胞外與胞內代謝物的限制。研究團隊開發了一種分離技術，將糞便檢體分為未處理（代表胞外池）與強效破碎（代表總代謝池）兩部分，透過兩者差值計算出胞內代謝池。分析顯示，維生素代謝呈現兩種模式：維生素 B12、B1 與 B3 主要滯留於胞內（Type 1），而生物素（B7）與泛酸（B5）則以胞外形式為主（Type 2）。結合總體基因體學數據分析發現，Type 1 維生素與 *Blautia* 菌屬呈負相關，推測為微生物密集利用的結果；Type 2 維生素則與 *Alistipes* 呈強正相關，暗示其受到腸道酸鹼值與發酵模式的生態位調控。此方法學突破了現有技術的瓶頸，能更精確地解析腸道菌群的交叉餵養（cross-feeding）機制，為理解腸道微生物生態系統中的代謝流動提供重要的科學依據。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635406/"}, {"pmid": "42635403", "title": "Baseline gut microbiome ecology predicts long-term fat mass loss after bariatric surgery: evidence for a thrifty Bifidobacterium phenotype.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metabolomics", "sample_size": "85位接受減重手術的嚴重肥胖患者，以及21位正常體重的健康對照組（共106位受試者，並於術前及術後1、6、12個月等多個時間點採集樣本）", "has_fulltext": false, "abstract": "Bariatric surgery (BS) induces weight loss, but long-term success involves complex host-microbiome interactions. We evaluated the longitudinal impact of BS, microbiome resilience, and Mediterranean Diet (MedDiet) adherence up to 24 months. This prospective observational study included 85 patients with severe obesity undergoing BS and 21 normal-weight healthy controls (HC). MedDiet adherence (PREDIMED) was assessed before surgery. Fecal microbiota (16S-rRNA sequencing) and metabolomics (1H-NMR spectroscopy) were analyzed at baseline and at 1-, 6-, and 12-months post-BS. Clinical outcomes and fat mass, evaluated by bioimpedanciometry, were tracked up to 24 months. At baseline, patients exhibited higher microbial Shannon diversity than controls (p = 0.041), alongside a dysfunctional microbiome and metabolome characterized by a higher Firmicutes/Bacteroidetes ratio and elevated levels of branched-chain amino acids (p < 0.0001). Ordinary Least Squares (OLS) regression analysis revealed that MedDiet adherence and type 2 diabetes status significantly modulated baseline diversity. At 12 months post-BS, the gut ecosystem underwent profound remodeling, characterized by depletion of Bifidobacterium spp. and an increase in butyrate levels (p < 0.0001), establishing a novel adaptive state distinct from HC. Baseline gut ecology significantly conditioned long-term BS outcomes: patients in the highest quartile of baseline Bifidobacterium spp. lost significantly less fat mass at 24 months than those in the lowest (6.6% vs. 13.2%, p = 0.010). High baseline Bifidobacterium abundance paradoxically acts as a \"thrifty microbiome,\" potentially maximizing energy harvest and limiting surgery-induced fat loss. Overall, BS induces adaptive microbiome restoration rather than true normalization, highlighting the potential for precision interventions prior to surgery.", "zh_summary": "本研究旨在探討減重手術（BS）對腸道菌相與代謝物的長期影響，並評估術前基線菌群如何預測術後減重成效。研究發現，手術12個月後腸道生態會發生深度重塑（如雙歧桿菌減少、丁酸增加），形成不同於健康對照組的新適應態。關鍵在於，術前擁有較高雙歧桿菌（Bifidobacterium）豐度的患者，術後24個月的脂肪流失比例顯著較低（6.6%對比13.2%）。這表明高豐度雙歧桿菌可能扮演「節約型菌相」角色，會最大化能量吸收並限制手術引起的脂肪流失。本研究證實減重手術引導的是適應性重塑而非完全正常化，突顯了術前進行精準菌相干預的臨床價值。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635403/"}, {"pmid": "42635401", "title": "Fecal filtrate transplantation as salvage therapy for fulminant Clostridioides difficile infection in adult hematological patients during chemotherapy-induced aplasia: a pilot experience.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metagenomics", "sample_size": "3 位接受化療後再生不良並併發猛爆性困難梭菌感染的成年血液腫瘤患者", "has_fulltext": false, "abstract": "Fulminant Clostridioides difficile infection (CDI) in patients with hematologic malignancies during chemotherapy-induced aplasia carries high mortality and limited treatment options. Our objective was to evaluate fecal filtrate transplantation (FFT) as a salvage therapy for fulminant CDI during aplasia, and to explore whether donor-recipient phage dynamics may contribute to clinical response. We conducted a single-center, prospective, protocol-defined pilot case series study including consecutive adults with hematologic malignancies, chemotherapy-induced grade-4 aplasia and fulminant CDI, refractory to ≥5 d of high-dose oral vancomycin plus intravenous metronidazole and tigecycline. FFT was prepared from a single unrelated donor using sequential centrifugation and filtration, and administered via nasogastric tube in two doses. The primary outcome was sustained clinical cure, secondary outcomes included survival and adverse events, assessed at +14 and +30 d post-FFT. 16S rRNA gene sequencing was used to assess microbiome compositions, while viral metagenomics and in vitro propagation assays were employed to characterize donor-recipient phageome interactions. Three patients with adverse-risk acute myeloid leukemia and fulminant CDI caused by genetically distinct C. difficile strains received FFT. All patients achieved clinical resolution by day +14, accompanied by improvements in abdominal distension and inflammatory markers. By day +30, one patient died from Pseudomonas aeruginosa septic shock, while two maintained remission with confirmatory follow-up. FFT was well tolerated, with no procedure-related immediate complications or FFT-attributable adverse events. Microbiome and phage profiling revealed heterogeneous responses, including shifts in bacterial community composition, with no clear evidence for a general role of donor-derived phages in CDI resolution. In contrast, we observed induction of prophages harbored by recipient-associated Clostridium species, which may have contributed to decolonization through stress-induced entry into the lytic cycle. FFT was feasible, with rapid sustained CDI resolution in hematologic patients with chemotherapy-induced aplasia. ClinicalTrials.gov identifier NCT07172191. Prospective single-center pilot study of fecal filtrate transplantation (FFT) for fulminant-refractory C. difficile infection in three aplastic adult hematologic patients. FFT was well tolerated, achieved rapid clinical cure, and showed heterogeneous microbiome and phageome modulation, potentially contributing to therapeutic effects.", "zh_summary": "本研究評估糞便濾液移植（FFT）作為血液腫瘤患者在化療後再生不良期間，罹患難治猛爆性困難梭菌感染（CDI）的挽救療法。研究納入3位急性骨髓性白血病患者。結果顯示，所有患者在FFT治療後14天內均達到臨床緩解，且無嚴重副作用。微生物與噬菌體組分析顯示，治療後患者菌相改變，且宿主原有的梭菌前噬菌體可能因壓力被誘導進入裂解週期進而協助去定殖，而非由供體噬菌體直接清除。本研究證實FFT對此高風險免疫低下族群是一項安全、可行且快速有效的挽救療法，並為噬菌體介導的治療機制提供了新觀點。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635401/"}, {"pmid": "42634246", "title": "Natural microbiota confer life-long protection against obesity via an early-life, immune-mediated effect on brown adipocytes.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Obesity, a major risk factor for metabolic disease, has increased in industrialized nations alongside a reduction in gut microbiota diversity. Reconstituting laboratory mice with complex, natural microbiota and commensals from wild mice resulted in protection against diet-induced obesity. These natural microbiota reduced weight gain in both male and female mice of different genetic backgrounds throughout their life and increased energy expenditure. Single-nuclei RNA sequencing identified a dominant adipocyte population in brown adipose tissue (BAT) with a transcriptional signature of increased thermogenic activity, while white adipose tissue mass and beiging were reduced. Protection against diet-induced obesity was transferable to adult germ-free mice via exposure to natural microbiota, indicating an association with the timing of immune response induction rather than BAT developmental programming. However, protection against diet-induced obesity did not require type 2 immune signaling, as shown in STAT6 knockout mice. Rather, it was associated with increased levels of chemokines and monocytes in BAT in early life, pointing to a role of infiltrating myeloid cells. Indeed, CCR2-deficient mice with natural microbiota lacked the BAT transcriptional signature of increased thermogenic activity, increased energy expenditure, and protection against diet-induced obesity that wild-type mice with natural microbiota exhibited. The latter was restored upon injection with wild-type bone marrow. Taken together, these findings identify a novel microbiota‒immune‒adipose tissue axis that results in increased BAT thermogenesis and improved energy balance throughout life.", "zh_summary": "本研究旨在探討野生小鼠的天然微生物群如何預防飲食誘導的肥胖。研究發現，引入天然微生物群能顯著降低雄性與雌性小鼠的體重增加，並提升能量消耗。機制分析顯示，這種保護作用並非源於棕色脂肪組織（BAT）的發育重編程，而是透過早期生命階段的免疫調節達成。具體而言，天然微生物群誘導了早期 BAT 中趨化因子與單核球的增加，進而促使骨髓來源的免疫細胞浸潤，活化 BAT 的產熱基因表現。此外，研究證實 CCR2 缺失小鼠無法展現此保護效果，且透過野生型骨髓移植可恢復其抗肥胖能力。此研究揭示了一個全新的「微生物-免疫-脂肪組織」軸線，對於理解微生物群如何透過調節早期免疫反應，長期影響機體能量代謝平衡具有重要的科學意義，並為肥胖防治提供了潛在的新策略。", "date": "2026-08-23", "url": "https://pubmed.ncbi.nlm.nih.gov/42634246/"}, {"pmid": "42637484", "title": "Insights into the analysis of microbial communities in fermented foods from the perspective of DNA-based techniques.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "The quality, flavor, and stability of fermented foods depend on the microbial community. However, microbial dynamics are difficult to observe directly, leading to limited control over fermentation. High-throughput sequencing is a revolutionary tool for microbial characterization, among which DNA-based amplicon and metagenomic sequencing are core techniques. Nevertheless, the related data processing workflows in the context of fermented foods have not yet been systematically summarized, hindering the translation of research findings into fermentation practices. This review clarifies the applications of amplicon and metagenomic sequencing in fermented foods. For amplicon sequencing, the impacts of target regions, data preprocessing, and reference databases are addressed. For metagenomic sequencing, sequencing strategies, read-based and binning-based analytical methods, functional annotation, and species-specific databases are discussed. In addition, major strategies for downstream analysis of community data are summarized, including microbial diversity, co-occurrence networks, niche and community assembly, key environmental drivers, and machine learning-based prediction. Amplicon sequencing efficiently reveals microbial succession during fermentation but has limitations in functional annotation. Metagenomic sequencing is notable for functional annotation, enabling the linkage between microbial communities and metabolic potential alongside community characterization. Standardized data preprocessing and specific databases are critical for improving characterization. For community data, integrated analysis allows uncovering the driving factors of microbial succession, thereby helping to regulate fermentation. Notably, the compositional nature of the data must be considered and validated to avoid spurious associations. In summary, the exponential growth of sequencing data will propel the era of precision fermentation.", "zh_summary": "本綜述旨在系統性總結基於DNA的擴增子（16S）與總體基因體學定序技術在發酵食品微生物群落分析中的應用與數據處理工作流程。文章指出，擴增子定序能高效揭示發酵過程中的微生物演替，但功能註釋受限；總體基因體定序則擅長功能註釋，可連結群落特徵與代謝潛力。此外，文章強調了標準化數據預處理、特定數據庫以及結合群落多樣性、共發生網路與機器學習等下游分析的重要性，並提醒需注意數據的組成性特徵以避免虛假關聯。本研究為發酵食品的微生物群落調控提供了理論指引，有助於推動精準發酵的實踐。", "date": "2026-07-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42637484/"}, {"pmid": "42637478", "title": "Effects of sorghum variety on fermentation microecology and flavor characteristics of sesame-flavor Baijiu.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "3 種高粱品種（紅纓子、黑殼、本地品種），於 2 輪連續發酵中的 3 個時間點（0、15、50天）所採集的酒醅及對應的基酒檢體（未提及具體總樣本件數）", "has_fulltext": false, "abstract": "Sorghum, the principal raw material for Baijiu fermentation, plays a key role in shaping fermentation microecology and flavor formation. However, the effects of sorghum varietal differences on sesame-flavor Baijiu fermentation remain insufficiently understood. In this study, three sorghum varieties, Hongyingzi (R), Hei'e (B), and a domestic cultivar (G), were compared over two consecutive fermentation rounds. Fermented grain (Jiupei) samples collected at 0, 15, and 50 days were analyzed for physicochemical properties, enzyme activities, microbial communities, volatile compounds in Jiupei and base liquor, and the taste characteristics of the corresponding base liquor. Despite showing similar overall fermentation trends, the three sorghum varieties differed in acid accumulation, starch utilization, microbial succession, and volatile composition. Fungal communities shifted from early Pichia dominance to multi-genus coexistence, whereas bacterial communities progressively converged toward Lactobacillus dominance. A total of 218 and 258 volatile compounds were identified in Jiupei and 176 and 192 in base liquor from the first and second rounds, respectively. Esters were the dominant differential class, and volatile-marker profiles varied among sorghum varieties and fermentation rounds, with no single variety showing consistent enrichment across all sesame-flavor-related compounds. These results indicate that sorghum variety is an important factor associated with microbial assembly and flavor formation during sesame-flavor Baijiu fermentation, and provide a basis for raw material selection and flavor-oriented process optimization.", "zh_summary": "本研究旨在探討不同高粱品種（紅纓子、黑殼及本地品種）對芝麻香型白酒發酵過程中微生態與風味特徵的影響。研究分析了兩輪連續發酵中不同時間點的酒醅與基酒。結果顯示，儘管整體發酵趨勢相似，但不同高粱在酸累積、澱粉利用、微生物演替及揮發性成分上存在顯著差異。發酵過程中，真菌群落由早期的畢赤酵母屬主導轉為多屬共存，細菌則逐漸趨向乳酸桿菌主導。此外，研究在酒醅與基酒中鑑定出數百種揮發性化合物（以酯類為差異主體），且不同品種高粱在風味物質的富集上各有優勢。本研究證實高粱品種是影響白酒發酵微生物群落組裝與風味形成的重要因素，為原料選擇與工藝優化提供了科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637478/"}, {"pmid": "42637476", "title": "A Shenling Baizhu San polysaccharide fraction (SLP-2)-based synbiotic alleviates lactose-induced gut dysfunction via a microbiota-metabolite-barrier axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Lactose intolerance (LI) is a common digestive disorder, and its management still relies largely on dietary restriction. Because gut microbial fermentation and barrier dysfunction contribute to LI-related symptoms, microbiota-targeted prebiotic or synbiotic strategies may provide complementary approaches. However, the active plant-polysaccharide fractions and their microbial partners remain unclear. This study aimed to identify the bioactive polysaccharide fraction from Shenling Baizhu San and evaluate its pairing with responder bacteria for alleviating high-lactose diet (HLD)-induced intestinal dysfunction. Stepwise ethanol precipitation yielded SLP-2, which was subsequently identified as the principal bioactive fraction through human fecal fermentation, monoculture assays, and an HLD rat model. SLP-2 enriched Eubacterium-associated taxa and supported the growth of Akkermansia muciniphila in monoculture and in vivo. Building on this, a synbiotic combining SLP-2 with A. muciniphila and E. rectale alleviated HLD-induced gut dysfunction; the antibiotic-matched comparison with the probiotics-only group supported an SLP-2-associated contribution. The synbiotic intervention was associated with increased tight junction proteins, MUC2 expression, improved intestinal architecture, and thicker mucus layers. Multi-omics analysis linked co-metabolites, including intestinal 6-MGG and HTy-Ac and systemic DHPV-G, with barrier restoration and an immune profile characterized by increased IL-10 and lower TLR4 expression. These findings suggest that SLP-2-based synbiotic intervention alleviates HLD-induced intestinal dysfunction through microbiota-metabolite-barrier modulation, providing preclinical evidence for future functional-food strategies pending human validation.", "zh_summary": "本研究旨在探討參苓白朮散多醣活性組分（SLP-2）結合特定菌株，對高乳糖飲食（HLD）引發之腸道功能障礙的緩解作用。研究發現，SLP-2能促進*A. muciniphila*與真桿菌屬相關菌群生長。以SLP-2搭配益生菌的合生元配方，能顯著改善HLD大鼠的腸道屏障，包含增加緊密連接蛋白與MUC2表達、增厚黏液層。多體學分析顯示，其保護作用與腸道及全身性代謝物（如6-MGG、DHPV-G）的調節，以及抗發炎反應（提升IL-10、降低TLR4）密切相關。此發現為開發防治乳糖不耐症的功能性食品提供了臨床前依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637476/"}, {"pmid": "42637471", "title": "Fucoidan from giant kelp alleviates postmenopausal osteoporosis by regulating the betaine-OPG/RANKL/RANK signaling axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Postmenopausal osteoporosis (PMOP), characterized by excessive bone resorption and impaired bone remodeling, remains a significant global health challenge. This study investigated the protective effects of fucoidan from giant kelp (GKP) against PMOP and its underlying mechanisms in ovariectomized mice. GKP supplementation attenuated bone loss by preserving trabecular microarchitecture, normalizing systemic mineral homeostasis, and suppressing osteoclastogenesis, as evidenced by the downregulation of osteoclast-related genes. 16S rRNA gene sequencing revealed that GKP reshaped the gut microbiota by decreasing the Bacteroidota/Firmicutes ratio and enriching beneficial taxa, which promoted short-chain fatty acid production. Targeted metabolomics revealed that GKP induced profound systemic metabolic reprogramming, particularly amino acid metabolism, and identified betaine as a key systemic metabolite effector upregulated following GKP treatment. In vitro assays demonstrated that betaine suppressed receptor activator of nuclear factor-κB ligand (RANKL)-induced osteoclast differentiation and mitigated inflammation. In vivo validation demonstrated that betaine intervention recapitulated the osteoprotective phenotype observed in GKP-treated mice, which was associated with regulation of the osteoprotegerin/RANKL/RANK signaling axis. These results indicate that GKP exerts anti-osteoporotic effects in association with changes in gut microbiota and systemic metabolism, while betaine-mediated regulation of the OPG/RANKL/RANK signaling may contribute to its osteoprotective activity.", "zh_summary": "本研究探討巨藻褐藻醣膠（GKP）對去卵巢小鼠更年期後骨質疏鬆症（PMOP）的保護機制。結果顯示，補充GKP能有效減少骨質流失並抑制破骨細胞生成。16S定序顯示GKP重塑了腸道菌群（降低擬桿菌門/厚壁菌門比例），促進短鏈脂肪酸產生。代謝組學分析發現，GKP顯著提升了系統性代謝物甜菜鹼（betaine）的含量。體內外實驗進一步證實，甜菜鹼透過調控OPG/RANKL/RANK信號軸，能抑制破骨細胞分化並緩解骨質流失。本研究證實GKP具備透過「腸道菌群-代謝物」軸抗骨質疏鬆的潛力，為PMOP防治提供了科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637471/"}, {"pmid": "42637450", "title": "Highland barley polysaccharides promoted lactose intestinal fermentation in vitro: Unveiling the dynamic response of gut microbiota and polysaccharide structure.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "乳糖不耐症患者的糞便檢體（未提及具體數量）", "has_fulltext": false, "abstract": "Lactose intolerance affects over 70% of the global population due to the untimely metabolism of lactose in the colon. To accelerate lactose metabolism, we innovatively employed highland barley polysaccharides (HBP) to modulate the colonic fermentation efficiency of lactose using an in vitro fermentation model and fecal samples from lactose intolerant patients. With the addition of HBP, the consumption efficiency of lactose began to increase after 6 h of fermentation. At 48 h, lactose consumption increased by 29%, surpassing the effect of commercial prebiotics. Meanwhile, HBP with lower molecular weight (HBP-L, 8.69 × 104 g/Mol) exhibited more effective impacts than HBP with high molecular weight (HBP-H, 1.22 × 105 g/Mol), which was particularly evident during the 12-48 h of fermentation. More importantly, HBP, particularly HBP-L, substantially enriched Segatella, Bifidobacterium, and Ligilactobacillus in a time-dependent manner and was positively correlated with decreased lactose levels and elevated bacterial lactase activity, resulting in significant conversion of lactose to lactic acid and short-chain fatty acids. During the first 12 h of fermentation, HBP-L underwent more significant degradation than HBP-H. Meanwhile, the xylose residues and Glcp glycosidic bonds in HBP-L were preferentially utilized, while it was glucose residue in HBP-H. Thus, it indicated that HBPs were degraded and altered the composition of the gut microbiota, thereby enhancing the fermentation efficiency of lactose. Our findings provide a theoretical basis for developing targeted prebiotic foods to manage lactose intolerance.", "zh_summary": "本研究旨在探討青稞多醣（HBP）如何調控乳糖不耐症患者的腸道菌群，以促進體外乳糖發酵與代謝。研究發現，添加 HBP（特別是低分子量的 HBP-L）能在發酵 48 小時後提升乳糖消耗效率達 29%，效果顯著優於商業益生元。機制上，HBP-L 在發酵初期降解更為顯著，並能隨時間特異性富集 *Segatella*、雙歧桿菌屬（*Bifidobacterium*）及 *Ligilactobacillus*，進而提升細菌乳糖酶活性，將乳糖轉化為乳酸與短鏈脂肪酸。本研究證實了青稞多醣能透過重塑腸道菌群結構來加速乳糖代謝，為開發緩解乳糖不耐症的標靶益生元食品提供了重要科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637450/"}, {"pmid": "42637441", "title": "Microbial succession drives quality deterioration in refrigerated golden pompano (Trachinotus ovatus): regulatory network of dominant spoilage microbiota on characteristic biomarkers.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Elucidating the quality deterioration mechanisms of refrigerated golden pompano (Trachinotus ovatus), this study integrated 16S rRNA gene sequencing and untargeted metabolomics to systematically dissect how microbial ecological succession drives metabolic changes. As critical spoilage indicators, total volatile basic nitrogen (TVB-N) and thiobarbituric acid reactive substances (TBARS) continuously increased during storage, indicating significant deterioration by day 6. Microbial community succession analysis revealed that Psychrobacter, Shewanella, and Pseudomonas gradually became the dominant microbiota in the late storage stage. Metabolite enrichment analysis further demonstrated that this shift redirected the metabolic focus from early-stage nucleotide degradation to late-stage protein hydrolysis and amino acid metabolism. Moreover, multivariate statistical analysis identified 50 potential spoilage biomarkers, among which biogenic amines (histamine, tyramine, and phenylethylamine) were recognized as key indicators reflecting spoilage progression. Correlation network analysis revealed positive correlations between Pseudomonas and Shewanella abundances and the accumulation of these biogenic amines. This suggests that these two genera act as the core functional microbiota, driving spoilage metabolite generation and subsequent quality deterioration. Pathway analysis of potential spoilage biomarker generation indicates that amino acid and nucleotide metabolism constitute the core spoilage pathways, with lipid oxidation serving as a complementary mechanism. Overall, this study elucidates the spoilage mechanisms of refrigerated golden pompano, providing chemical targets for early biomarker detection and targeted antibacterial strategies.", "zh_summary": "本研究旨在探討冷藏金鯧魚品質劣化的機制。研究結合 16S rRNA 基因定序與非靶向代謝組學，分析微生物群落演替如何驅動代謝變化。結果顯示，金鯧魚冷藏至第 6 天時顯著腐敗。在貯藏後期，*Psychrobacter*、*Shewanella* 與 *Pseudomonas* 逐漸成為優勢菌群，使代謝焦點自初期的核苷酸降解轉向後期的蛋白質水解與氨基酸代謝。研究鑑定出 50 個潛在腐敗生物標誌物（如組胺、酪胺等生物胺），並發現 *Pseudomonas* 和 *Shewanella* 的豐度與這些生物胺的累積呈正相關，為驅動腐敗的核心菌群。本研究闡明了金鯧魚的腐敗機制，為食品早期變質檢測及靶向抑菌策略提供了科學依據與化學標靶。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637441/"}, {"pmid": "42637430", "title": "Regional differentiation of microbial communities and metabolites in Yunnan dry-cured beef: insights from high-throughput sequencing and untargeted metabolomics.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "To reveal the effects of regional processing on quality, microbial communities and metabolites of traditional Yunnan dry-cured beef, samples from Xundian (XD), Yuxi (YX) and Honghe (HH) were analyzed. High-throughput sequencing and UHPLC-Q-Exactive HF/MS untargeted metabolomics were applied. Sensory scores and physicochemical Properties differed significantly (p < 0.05). Bacillota and Staphylococcus dominated bacterial communities. The observed differences in microbial communities and metabolites among regions are shaped by the combined effects of geographical environment and processing conditions. Ascomycota was the main fungal phylum. Debaryomyces dominated XD and HH samples. YX samples had a unique fungal profile dominated by Rhodotorula and Cladosporium. A total of 1320 metabolites were identified. 196 differential metabolites were screened. Key pathways included glycerophospholipid metabolism, pyrimidine metabolism and arachidonic acid metabolism. Correlation analysis indicated that Staphylococcus and Lactococcus were positively associated with amino acid derivatives, while Latilactobacillus and Debaryomyces correlated with organic acids and glycerophospholipids. These findings revealed the potential microbial-metabolic association underlying regional quality differences. They provide support for quality control and traceability of dry-cured beef.", "zh_summary": "本研究旨在探討地理區域與加工工藝對雲南傳統乾醃牛肉（尋甸、玉溪、紅河三地）品質、微生物群落及代謝物的影響。研究結合高通量定序與非靶向代謝組學技術，發現不同地區的乾醃牛肉在感官評分與理化性質上存有顯著差異。細菌群落以厚壁菌門和葡萄球菌屬為主；真菌群落中，尋甸和紅河樣品以德巴利酵母屬為主，玉溪樣品則以紅酵母屬與枝孢菌屬為特有優勢菌。代謝組學共鑑定出1320種代謝物，其中196種為差異代謝物，主要涉及甘油磷脂、嘧啶及花生四烯酸代謝通路。關聯分析顯示，葡萄球菌屬和乳球菌屬與氨基酸衍生物呈正相關，而廣義乳桿菌屬與德巴利酵母屬則與有機酸及甘油磷脂密切相關。本研究揭示了微生物與代謝物的關聯性，為乾醃牛肉的品質控制與產地溯源提供了重要科學依據。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637430/"}, {"pmid": "42637417", "title": "Allergic responses, gut microbiome and serum metabolism of mice: Effects of epigallocatechin gallate combined with sodium pyrophosphate modified parvalbumin.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Epigallocatechin gallate (EGCG) combined with sodium pyrophosphate (SP) modified parvalbumin (PV) was proposed to sensitize mice, and investigated whether allergic responses changes were associated with gut microbiome and serum metabolism of mice. EGCG combined with SP modified PV has structural changes, and alleviated jejunal damage in mice, while decreased specific serum IgG, IgG1 and IgE levels and may rebalanced Th1/Th2 immune responses. PV-induced allergic responses disrupted gut microbiota and reduced short-chain fatty acids (SCFAs) levels. In contrast, the modified PV could alter the relative abundance of allergic responses-related gut microbiota, such as g__unclassified_f__Lachnospiraceae, g__norank_o__Clostridia_UCG-014 and g__Alistipes, alongside elevated SCFAs levels. Additionally, the modified PV could affect multiple metabolic pathways in serum, and exert a positive impact on phosphatidylethanolamine and phosphatidylcholine levels in glycerophospholipid metabolism. Therefore, the reduction in the allergic responses of PV modified by EGCG and SP were associated with changes in gut microbiota and modulation of glycerophospholipid metabolisms. These correlational observations provided preliminary associative evidence supporting the potential utility of combined EGCG-SP modification as a hypoallergenic processing approach for fish parvalbumin mitigation.", "zh_summary": "本研究旨在探討利用表沒食子兒茶素沒食子酸酯（EGCG）結合焦磷酸鈉（SP）修飾魚類主要過敏原小清蛋白（PV），對小鼠過敏反應、腸道菌群及血清代謝的影響。結果顯示，修飾後的PV結構發生改變，能顯著減輕小鼠空腸損傷，降低血清特異性IgG、IgG1及IgE水平，並重建Th1/Th2免疫平衡。此外，修飾後的PV調節了過敏相關腸道菌群（如*Lachnospiraceae*與*Alistipes*）的相對豐度，提升了短鏈脂肪酸（SCFAs）含量，並改善血清甘油磷脂代謝。本研究證實EGCG-SP聯合修飾可作為降低魚類過敏原性的潛在低致敏加工方法。", "date": "2026-07-19", "url": "https://pubmed.ncbi.nlm.nih.gov/42637417/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        const itemsPerPage = 15;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 事件監聽
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選 (包含於字串內)
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("page-info").textContent = `第 ${currentPage} 頁 / 共 ${totalPages || 1} 頁 (篩選出 ${filteredArticles.length} 筆)`;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
