    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42647164", "title": "Sex differences in the gut microbiome and related metabolites: role in cardiometabolic disease.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "others", "sample_size": "未提及（本文為綜論性回顧文章，非原創實驗研究）", "has_fulltext": false, "abstract": "Sex differences in major cardiometabolic diseases (CMD), such as type 2 diabetes, metabolic dysfunction-associated steatotic liver disease, and cardiovascular disease, have been increasingly recognized across the life course. During the reproductive stage, women generally have a more favorable cardiometabolic risk profile than men, but their risk of experiencing CMD significantly increases after menopause. Emerging evidence suggests that sexually dimorphic gut microbiota and gut microbiota-related metabolites (GMRMs) may contribute to such sex disparities. However, existing findings are heterogeneous and underlying mechanisms remain incompletely understood. In this review, we synthesize the evidence examining sex differences in gut microbial diversity, overall composition, taxa abundances, and levels of GMRMs across key life stages, including pre-puberty, adolescence, and different phases of adulthood (with emphasis on pre- and post-menopausal periods). We summarize potential biological mechanisms underlying sexual dimorphism in the gut microbiome and GMRMs, emphasizing the central role of sex steroids, along with contributions from immune function and other host and environmental factors. We further integrate evidence linking sexually dimorphic microbial taxa (e.g., Akkermansia muciniphila, Eubacterium, Ruminococcus, and other Firmicutes taxa) and GMRMs (e.g., microbiota-derived short-chain fatty acids, secondary bile acids, and trimethylamine N-oxide) to key cardiometabolic pathways involving inflammation, glucose and lipid metabolism, and vascular function. Finally, we identify critical knowledge gaps and emphasize the need for future large longitudinal studies that would integrate repeated measurements of the gut microbiome, untargeted metabolomics, and sex steroid hormones across the life course. Such approaches are essential to clarify biological pathways and inform sex-specific microbiome-based interventions for CMD prevention and management.", "zh_summary": "本文旨在探討性別差異在腸道微生物群與相關代謝物（GMRMs）中如何影響心臟代謝疾病（CMD）。研究指出，受性類固醇、免疫功能及環境因素影響，腸道菌相與代謝產物存在顯著的性別二態性。女性在生育期較男性具備更佳的心臟代謝特徵，但停經後風險顯著升高，此變化與特定菌屬（如 *Akkermansia muciniphila*）及代謝物（如短鏈脂肪酸、次級膽汁酸、TMAO）的豐度改變密切相關。這些微生物與代謝物透過調節發炎反應、醣脂代謝及血管功能，進而影響 CMD 的發生。本文強調未來需透過大型縱向研究，結合微生物組學、代謝組學與荷爾蒙監測，以深入解析其生物學機制，並開發針對不同性別的精準微生物介入療法，對於預防及管理心臟代謝疾病具有重要的科學價值。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647164/"}, {"pmid": "42644416", "title": "Nationwide cohort study reveals low bifidobacteria and distinct microbiota composition and function in Swedish newborns.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "metagenomics, 16S", "sample_size": "未提及", "has_fulltext": false, "abstract": "NCT06285630.", "zh_summary": "本研究為一項瑞典全國性世代研究（臨床試驗登記號：NCT06285630），旨在探討瑞典新生兒的腸道菌相特徵。研究核心發現瑞典新生兒體內的雙歧桿菌（Bifidobacteria）豐度偏低，且其腸道菌群在物種組成與代謝功能上呈現出獨特的特徵。雙歧桿菌在嬰兒早期腸道發育與免疫調控中扮演關鍵角色，其水平偏低可能與現代生活方式、分娩方式或抗生素使用有關。本研究的科學意義在於揭示了特定地理區域新生兒腸道菌相的特殊結構與功能缺陷，為未來評估早期微生態失調及開發嬰兒精準益生菌干預手段提供了重要依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42644416/"}, {"pmid": "42647759", "title": "The Gut Microbiome in Multiple Sclerosis.", "journal": "Neurology(R) neuroimmunology & neuroinflammation", "impact_factor": "N/A", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Multiple sclerosis (MS) is a chronic inflammatory demyelinating disease of the CNS whose risk and course are shaped by both genetic and environmental factors, among which the intestinal microbiota has emerged as a key, potentially modifiable contributor. People with MS frequently display altered gut microbiota, characterized by depletion of fiber-fermenting, short-chain fatty acid (SCFA)-producing commensals, and expansion of taxa associated with mucus degradation and proinflammatory metabolism. These compositional shifts are paralleled by broad changes in blood and CSF metabolites, including reduced SCFAs, tryptophan-derived aryl hydrocarbon receptor ligands, and secondary bile acids. In addition, several reports highlight the accumulation of aromatic amino acid-derived phenolic and indolic compounds and specific lipid mediators linked to neuroinflammation and neurodegeneration. In this up-to-date review, we synthesize evidence from experimental models and human studies showing how microbial metabolites can influence MS pathogenesis through converging mechanisms: modulation of gut and blood-brain barrier integrity; shaping of T-cell and B-cell responses; direct effects on microglia, astrocytes, and oligodendrocyte lineage cells after crossing into the CNS; and modulation of neural circuits, particularly those involving the vagus nerve. Finally, we highlight current gaps, including the need for longitudinal, harmonized multiomic cohorts, and mechanistic studies integrating microbiome, metabolome, and host readouts across gut, blood, and CNS. Overall, available data support a model in which coordinated disruption of the gut microbiota-metabolite axis, rather than any single pathogen, contributes to MS, opening avenues for microbiota-based and metabolite-based biomarkers and therapies aimed at restoring immune and neuroglial homeostasis.", "zh_summary": "本研究探討多發性硬化症（MS）與腸道微生物群之間的關聯。研究指出，MS 患者的腸道菌相呈現失調狀態，包括短鏈脂肪酸（SCFA）產生菌減少，以及促發炎代謝菌的增加。這些微生物群落的變化伴隨著血液與腦脊髓液中代謝物（如色胺酸衍生物、膽汁酸及 SCFA）的顯著改變，這些物質經證實與神經發炎及退化密切相關。文中綜述了微生物代謝產物如何透過調節腸道與血腦屏障完整性、影響免疫細胞（T/B 細胞）反應，以及直接作用於神經膠質細胞來參與 MS 的致病機制。總結而言，MS 的發生與腸道菌群-代謝物軸的整體失調有關，而非單一病原體所致。該研究強調未來需進行多體學（multiomics）整合分析，以開發基於微生物群的生物標記與創新治療策略，旨在恢復患者的免疫與神經恆定。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647759/"}, {"pmid": "42641146", "title": "Engineered bacterial therapeutics from synthetic biology to clinical translation: A multi-database scientometric analysis, 2000-2026.", "journal": "Human vaccines & immunotherapeutics", "impact_factor": "3.5", "tech_types": "others", "sample_size": "1,730 篇學術文章與評論", "has_fulltext": false, "abstract": "Engineered bacterial therapeutics integrate programmable strain engineering with biomedical functions such as sensing, delivery, immune modulation, microbiome intervention, and disease management. This study conducted a multi-database bibliometric analysis to map the knowledge structure, collaboration patterns, and translational direction of this field. Bibliographic records were retrieved from Web of Science Core Collection, Scopus, and PubMed for publications from 1 January 2000 to 1 June 2026. After document-type filtering, time restriction, deduplication, language screening, and manual eligibility assessment, 1,730 English-language articles and reviews were included. CiteSpace 6.4.R1, VOSviewer 1.6.20, and the bibliometrix R package were used to analyze publication trends, collaboration networks, journal co-citation, dual-map citation trajectories, citation bursts, keyword co-occurrence, and thematic evolution. Publication output increased steadily, with faster growth after 2020; 2025 was the highest-output complete year, while 2026 represented a partial retrieval year. China and the United States were the leading contributors, although institutional collaboration remained regionally clustered. Co-citation, citation-burst, and keyword analyses showed a shift from bacterial chassis construction and circuit design toward engineered probiotics, gut microbiota-related therapy, cancer immunotherapy, drug delivery, live biotherapeutic products, and clinical translation. Persistent translational priorities include controllability, safety, manufacturing consistency, and regulatory alignment.", "zh_summary": "本研究透過文獻計量學方法，系統性分析 2000 年至 2026 年間有關「工程化細菌治療」的 1,730 篇學術文獻。研究旨在釐清該領域的知識結構、國際合作模式及臨床轉化趨勢。分析顯示，該領域自 2020 年後顯著加速發展，中國與美國為主要貢獻國。核心研究主軸已由早期的細菌底盤構建與基因電路設計，轉向工程化益生菌、癌症免疫治療、藥物遞送及活體生物藥物（LBP）的開發。科學意義在於確立了該領域從實驗室轉向臨床應用的優先議題，即解決控制力、生物安全性、生產一致性與法規調適等挑戰，為未來工程化細菌作為精準醫療工具的發展提供關鍵決策參考。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42641146/"}, {"pmid": "42642836", "title": "Microbiome-mediated regulation of pathogen virulence: Molecular mechanisms and clinical implications.", "journal": "Virulence", "impact_factor": "5.4", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The human microbiome profoundly influences pathogen virulence and disease susceptibility through diverse molecular mechanisms. This review, focused on literature from 2016 to 2026, synthesizes knowledge on microbiome-mediated regulation examining major pathogens including Vibrio cholerae, enterohemorrhagic Escherichia coli, Salmonella species, Clostridioides difficile, and Staphylococcus aureus. A triangular interaction model is presented, linking host immunity, resident microbiome, and invading pathogen to frame infection outcomes. Commensal bacteria regulate pathogen behavior through quorum sensing interference, metabolite-mediated regulation via short-chain fatty acids and bile acids, competitive exclusion, immune response modulation, and direct antimicrobial production. Key species-Lactobacillus spp. Bifidobacterium spp. Bacteroides thetaiotaomicron, and Faecalibacterium prausnitzii-employ distinct molecular strategies against these pathogens. Organ-on-chip platforms and multi-omics advances reveal context-dependent interactions. Clinical applications including rationally designed probiotics, fecal microbiota transplantation, and precision microbiome engineering show promise despite challenges of inter-individual microbiome variability, representing a paradigm shift toward ecosystem-based infectious disease management.", "zh_summary": "本研究綜述了2016年至2026年間關於腸道微生物群調控病原體毒力（如霍亂弧菌、大腸桿菌、沙門氏菌等）的分子機制。作者提出了一個結合宿主免疫、共生菌群與入侵病原體的「三角交互模型」，闡述了共生菌如何透過群體感應干擾、代謝產物（如短鏈脂肪酸、膽汁酸）調節、競爭性排斥及免疫調節來抑制病原體。研究強調了乳酸桿菌、雙歧桿菌及普拉梭菌等關鍵菌種的保護機制，並探討了器官晶片與多體學技術在揭示交互作用上的貢獻。此研究主張從生態系統角度管理傳染病，指出益生菌設計、糞便菌群移植及精準微生物組工程是未來治療的關鍵方向，雖面臨個體差異挑戰，但為臨床感染控制提供了典範轉移。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642836/"}, {"pmid": "42640100", "title": "Revisiting gut microbiota-driven ammonia metabolism: from disease burden to physiological adaptation.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Ammonia homeostasis is governed by interconnected host and microbial pathways, including hepatic ureagenesis, glutamine synthesis, and gut microbiota-mediated urea hydrolysis, proteolysis, and amino acid deamination. Ammonia has historically been viewed primarily as a nitrogenous waste product and neurotoxic molecule, a concept strongly supported by studies of hyperammonemia and hepatic encephalopathy. Impaired hepatic clearance, portosystemic shunting, and enhanced gut-derived ammonia input increase systemic ammonia burden and are linked to neurological dysfunction, muscle wasting, immune dysregulation, and progression of liver disease. In the gut lumen and mucosal environment, however, gut microbes not only generate ammonia but can also reuse ammonia-derived nitrogen for amino acid synthesis, microbial biomass formation, and community nitrogen exchange. Evidence from selected physiological and preclinical models indicates that microbiota-derived ammonia may contribute to nitrogen recycling, microbial community maintenance, enteric neural regulation, or metabolic adaptation under defined conditions. These roles are more context-specific and less broadly established than the pathological effects of systemic hyperammonemia. When epithelial barrier integrity is compromised, hepatic clearance declines, or host buffering reserves are depleted, elevated ammonia can increase epithelial exposure, portal ammonia input, or peripheral blood ammonia. Conversely, evidence that reduced microbiota-derived ammonia contributes to disease remains limited and currently comes mainly from selected animal models. This review re-examines ammonia metabolism from a gut microbiota-centered perspective. We discuss the ecological origins, spatial distribution, exposure characteristics, host-interface effects, and context-specific outcomes of microbiota-derived ammonia in physiology and disease, and discuss how ammonia should be measured, stratified, and targeted in microbial nitrogen metabolism.", "zh_summary": "本綜述重新審視了腸道菌群驅動的氨代謝，探討其從疾病負擔到生理適應的雙重角色。傳統上，氨被視為具神經毒性的代謝廢物，與高氨血症、肝性腦病及肝病惡化密切相關。然而，在腸道微環境中，微生物不僅產生氨，亦能利用氨源氮進行氨基酸合成與群落氮循環，展現出維持腸道神經與代謝適應等生理功能。文章強調，氨的病理與生理效應高度取決於上皮屏障、肝臟清除能力及宿主緩衝儲備。本研究為腸道微生物氮代謝提供了新的生態與臨床視角，並討論了未來如何精確測量及標靶氨代謝的策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640100/"}, {"pmid": "42640624", "title": "Gut microbial diversity at baseline conditions the clinical, microbiome, and metabolic response to paraprobiotic Lactiplantibacillus plantarum LRCC5282 in overweight adults.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metabolomics", "sample_size": "120 位過重成人", "has_fulltext": false, "abstract": "The gut microbiota is increasingly recognized as a target for obesity management; however, whether baseline gut microbial diversity conditions responsiveness to microbiota-targeted interventions remains unclear. We aimed to investigate whether baseline gut microbial diversity is associated with responsiveness to a paraprobiotic derived from Lactiplantibacillus plantarum LRCC5282 (LP5282-P) in overweight adults. In a 12-week, randomized, double-blind, placebo-controlled, multicenter trial of 120 overweight adults, LP5282-P produced no significant between-group differences in any clinical outcome across the overall per-protocol population. However, in the low-diversity subgroup, LP5282-P was associated with significant reductions in body weight, body mass index, and circulating leptin levels. These clinical changes were accompanied by compositional shifts in the gut microbiota, including higher relative abundances of Christensenellaceae, Faecalibacterium, and Alistipes. Fecal metabolite profiles showed elevated acetate and butyrate concentrations and altered bile acid composition. Within the low-diversity subgroup, changes in the relative abundances of Akkermansia and Eubacterium were inversely correlated with changes in body weight, body fat mass, and leptin levels. In contrast, the high-diversity subgroup exhibited no consistent response across the outcome domains examined. Overall, baseline gut microbial diversity was associated with differential responsiveness to LP5282-P, supporting its potential use as a stratification variable in future microbiota-targeted intervention trials. Further studies integrating direct measures of microbial activity and host response are warranted to elucidate the biological pathways underlying this diversity-dependent responsiveness. Trial registration: Clinical Research Information Service (CRIS), KCT0008119.", "zh_summary": "本研究旨在探討基準線腸道微生物多樣性，是否會影響過重成人對副乾酪乳桿菌（LP5282-P）介入的臨床、菌群及代謝反應。在一項為期12週、納入120位過重成人的臨床試驗中，整體人群並未展現顯著差異；然而，在「低多樣性」亞群中，LP5282-P顯著降低了受試者的體重、BMI與血清瘦素水平，並促使腸道有益菌（如 *Faecalibacterium* 與 *Alistipes*）豐度上升，同時提升糞便中乙酸與丁酸濃度並改變膽汁酸組成。相反地，「高多樣性」亞群則無一致反應。此研究證實基準線菌群多樣性是預測益生菌療效的重要關鍵，可作為未來精準微生態介入與體重管理的分層依據。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640624/"}, {"pmid": "42642834", "title": "Glycosylation in gut-brain communication: from the intestinal barrier and microbiota to immune and neural signaling.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The gut-brain axis is a complex bidirectional communication network linking the gastrointestinal tract and the central nervous system. Its dysregulation is closely associated with a wide range of gastrointestinal, metabolic, and neuropsychiatric disorders. Glycosylation, one of the most prevalent and structurally diverse post-translational modifications of proteins and lipids, is increasingly recognized as a regulator of multiple processes within the gut-brain axis. In this review, we summarize evidence that glycosylation influences several steps of gut-brain communication, including intestinal barrier function, microbial glycan metabolism, immune signaling, enteric and vagal pathways, blood-brain barrier integrity, and neural responses. We distinguish direct mechanistic findings from associative observations and discuss the more limited evidence for brain-to-gut regulation of intestinal glycosylation. In addition, we discuss the potential of glycosylation-targeted nutritional and microbiota-based interventions and highlight emerging opportunities to integrate glycomics with other omics approaches to dissect the complex regulatory networks underlying the gut-brain axis. In conclusion, elucidating how glycosylation shapes signaling along the gut-brain axis may open new avenues for understanding disease pathogenesis and for developing targeted therapeutic strategies.", "zh_summary": "本文探討「腸-腦軸線」（Gut-Brain Axis）中醣基化（Glycosylation）修飾的關鍵調節角色。醣基化作為蛋白質與脂質重要的轉譯後修飾，深刻影響腸道屏障功能、微生物聚醣代謝、免疫訊息傳遞及血腦屏障完整性。研究重點解析了醣基化如何調控腸道與中樞神經系統間的溝通，並區分了機制性證據與相關性觀察。本文不僅強調了醣基化在維繫軸線穩定中的核心地位，更提出透過營養干預與微生物調節，結合多體學（Omics）分析醣基化網絡，將有望為神經精神疾病與代謝性障礙提供創新的診斷與治療策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642834/"}, {"pmid": "42635406", "title": "Separating extracellular from intracellular fecal metabolites exposes cross-feeding architecture in the gut: exploring metabolite partitioning and ecological associations.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "metagenomics, metabolomics", "sample_size": "63 個糞便檢體（來自 63 位健康受試者）", "has_fulltext": false, "abstract": "The gut microbiota forms a complex ecosystem through metabolic interdependence (cross-feeding). However, conventional fecal metabolomics typically quantifies only total metabolite pools, making it difficult to distinguish extracellular-enriched metabolite pools from predominantly cell-associated ones, and thus limiting reconstruction of in situ metabolic networks. Here, we quantified fecal metabolites in paired fractions from the same specimen: an undisrupted fraction representing the extracellular pool and a strongly bead-beaten fraction representing the total pool; the intracellular pool was defined as the difference between total and extracellular measurements. Stool samples from 63 healthy individuals were analyzed for short-chain fatty acids, polyamines, and water-soluble vitamins, and the results were integrated with shotgun metagenomic profiles of species composition and functional genes. Vitamins exhibited two distinct behaviors. Adenosylcobalamin (a vitamin B12 coenzyme) was detectable only after disruption, and together with thiamine (B1) and niacin (B3) was classified as an intracellular-retained type (Type 1). In contrast, biotin (B7) and pantothenate (B5) showed higher extracellular proportions (Type 2). Integrative analyses further indicated that Type 1 thiamine was negatively associated with Blautia, consistent with intensive microbial utilization, whereas Type 2 biotin was strongly positively associated with Alistipes, suggesting links to ecological niches shaped by luminal pH and fermentation modes (carbohydrate vs protein fermentation). Fraction-resolved quantification provides a practical operational framework to differentiate extracellular from cell-associated metabolite pools, helping reconcile metagenomic potential with metabolomic reality and enabling deeper inference of cross-feeding structure in the gut ecosystem.", "zh_summary": "本研究針對腸道微生物的代謝互營機制（cross-feeding）進行探討。傳統糞便代謝組學僅能分析總代謝物，無法區分細胞外與細胞內代謝池，限制了對代謝網絡的解析。研究團隊透過對比未破碎（代表細胞外池）與強力破碎（代表總代謝池）的糞便樣本，成功推算出細胞內代謝物的分佈。針對短鏈脂肪酸、多胺與水溶性維生素的分析顯示，維生素呈現兩類分佈：B12、B1 與 B3 傾向保留於細胞內（Type 1），而 B7 與 B5 則富集於細胞外（Type 2）。結合宏基因組分析發現，Type 1 代謝物與特定細菌（如 *Blautia*）的利用模式顯著相關，Type 2 代謝物則與 *Alistipes* 及腸道生態位特徵（如 pH 值、發酵類型）相關。此方法為區分代謝物空間分佈提供了實用架構，有助於更精確地將宏基因組功能潛力與代謝體現實連結，深入理解腸道微生物的互營生態結構。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635406/"}, {"pmid": "42635403", "title": "Baseline gut microbiome ecology predicts long-term fat mass loss after bariatric surgery: evidence for a thrifty Bifidobacterium phenotype.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metabolomics", "sample_size": "85 位重度肥胖患者及 21 位健康對照組（共 106 名受試者）", "has_fulltext": false, "abstract": "Bariatric surgery (BS) induces weight loss, but long-term success involves complex host-microbiome interactions. We evaluated the longitudinal impact of BS, microbiome resilience, and Mediterranean Diet (MedDiet) adherence up to 24 months. This prospective observational study included 85 patients with severe obesity undergoing BS and 21 normal-weight healthy controls (HC). MedDiet adherence (PREDIMED) was assessed before surgery. Fecal microbiota (16S-rRNA sequencing) and metabolomics (1H-NMR spectroscopy) were analyzed at baseline and at 1-, 6-, and 12-months post-BS. Clinical outcomes and fat mass, evaluated by bioimpedanciometry, were tracked up to 24 months. At baseline, patients exhibited higher microbial Shannon diversity than controls (p = 0.041), alongside a dysfunctional microbiome and metabolome characterized by a higher Firmicutes/Bacteroidetes ratio and elevated levels of branched-chain amino acids (p < 0.0001). Ordinary Least Squares (OLS) regression analysis revealed that MedDiet adherence and type 2 diabetes status significantly modulated baseline diversity. At 12 months post-BS, the gut ecosystem underwent profound remodeling, characterized by depletion of Bifidobacterium spp. and an increase in butyrate levels (p < 0.0001), establishing a novel adaptive state distinct from HC. Baseline gut ecology significantly conditioned long-term BS outcomes: patients in the highest quartile of baseline Bifidobacterium spp. lost significantly less fat mass at 24 months than those in the lowest (6.6% vs. 13.2%, p = 0.010). High baseline Bifidobacterium abundance paradoxically acts as a \"thrifty microbiome,\" potentially maximizing energy harvest and limiting surgery-induced fat loss. Overall, BS induces adaptive microbiome restoration rather than true normalization, highlighting the potential for precision interventions prior to surgery.", "zh_summary": "本研究探討減重手術（BS）後腸道微生物群與長期減脂效果的關聯。研究追蹤 85 名患者於術前及術後長達 24 個月的變化，分析發現手術顯著重塑了腸道菌相與代謝環境，特別是雙歧桿菌（*Bifidobacterium*）的耗竭與丁酸鹽的增加。關鍵發現指出，術前高豐度的雙歧桿菌反而成為一種「節儉型表型」，會增加能量攝取效率，導致術後 24 個月的脂肪減少量顯著較少（6.6% 對比 13.2%）。這顯示減重手術並非使微生物組回歸常態，而是引發一種適應性重組。此研究凸顯了術前腸道生態作為預測手術成效生物標記的潛力，對於未來制定精準的術前介入策略具有重要的臨床指導意義。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635403/"}, {"pmid": "42635401", "title": "Fecal filtrate transplantation as salvage therapy for fulminant Clostridioides difficile infection in adult hematological patients during chemotherapy-induced aplasia: a pilot experience.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "16S, metagenomics", "sample_size": "3 位成人血液腫瘤患者", "has_fulltext": false, "abstract": "Fulminant Clostridioides difficile infection (CDI) in patients with hematologic malignancies during chemotherapy-induced aplasia carries high mortality and limited treatment options. Our objective was to evaluate fecal filtrate transplantation (FFT) as a salvage therapy for fulminant CDI during aplasia, and to explore whether donor-recipient phage dynamics may contribute to clinical response. We conducted a single-center, prospective, protocol-defined pilot case series study including consecutive adults with hematologic malignancies, chemotherapy-induced grade-4 aplasia and fulminant CDI, refractory to ≥5 d of high-dose oral vancomycin plus intravenous metronidazole and tigecycline. FFT was prepared from a single unrelated donor using sequential centrifugation and filtration, and administered via nasogastric tube in two doses. The primary outcome was sustained clinical cure, secondary outcomes included survival and adverse events, assessed at +14 and +30 d post-FFT. 16S rRNA gene sequencing was used to assess microbiome compositions, while viral metagenomics and in vitro propagation assays were employed to characterize donor-recipient phageome interactions. Three patients with adverse-risk acute myeloid leukemia and fulminant CDI caused by genetically distinct C. difficile strains received FFT. All patients achieved clinical resolution by day +14, accompanied by improvements in abdominal distension and inflammatory markers. By day +30, one patient died from Pseudomonas aeruginosa septic shock, while two maintained remission with confirmatory follow-up. FFT was well tolerated, with no procedure-related immediate complications or FFT-attributable adverse events. Microbiome and phage profiling revealed heterogeneous responses, including shifts in bacterial community composition, with no clear evidence for a general role of donor-derived phages in CDI resolution. In contrast, we observed induction of prophages harbored by recipient-associated Clostridium species, which may have contributed to decolonization through stress-induced entry into the lytic cycle. FFT was feasible, with rapid sustained CDI resolution in hematologic patients with chemotherapy-induced aplasia. ClinicalTrials.gov identifier NCT07172191. Prospective single-center pilot study of fecal filtrate transplantation (FFT) for fulminant-refractory C. difficile infection in three aplastic adult hematologic patients. FFT was well tolerated, achieved rapid clinical cure, and showed heterogeneous microbiome and phageome modulation, potentially contributing to therapeutic effects.", "zh_summary": "本研究旨在評估糞便濾液移植（FFT）作為挽救療法，治療化療致免疫不全之血液腫瘤患者合併難治猛爆性艱難梭菌感染（CDI）的療效，並探討供受體間噬菌體的動力學關係。此臨床先導試驗納入3位患者，結果顯示FFT耐受性良好，所有患者在接受治療後14天內均達到臨床緩解。微生態與噬菌體體學分析顯示，臨床症狀的改善並非源於供體噬菌體的直接轉移，而是FFT可能誘發了受體腸道內艱難梭菌的原噬菌體進入溶菌週期，進而促進病原菌清除。本研究證實FFT在此高風險族群中具安全性與可行性，為難治性CDI提供了創新的機制見解與治療選擇。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635401/"}, {"pmid": "42634246", "title": "Natural microbiota confer life-long protection against obesity via an early-life, immune-mediated effect on brown adipocytes.", "journal": "Gut microbes", "impact_factor": "11.0", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Obesity, a major risk factor for metabolic disease, has increased in industrialized nations alongside a reduction in gut microbiota diversity. Reconstituting laboratory mice with complex, natural microbiota and commensals from wild mice resulted in protection against diet-induced obesity. These natural microbiota reduced weight gain in both male and female mice of different genetic backgrounds throughout their life and increased energy expenditure. Single-nuclei RNA sequencing identified a dominant adipocyte population in brown adipose tissue (BAT) with a transcriptional signature of increased thermogenic activity, while white adipose tissue mass and beiging were reduced. Protection against diet-induced obesity was transferable to adult germ-free mice via exposure to natural microbiota, indicating an association with the timing of immune response induction rather than BAT developmental programming. However, protection against diet-induced obesity did not require type 2 immune signaling, as shown in STAT6 knockout mice. Rather, it was associated with increased levels of chemokines and monocytes in BAT in early life, pointing to a role of infiltrating myeloid cells. Indeed, CCR2-deficient mice with natural microbiota lacked the BAT transcriptional signature of increased thermogenic activity, increased energy expenditure, and protection against diet-induced obesity that wild-type mice with natural microbiota exhibited. The latter was restored upon injection with wild-type bone marrow. Taken together, these findings identify a novel microbiota‒immune‒adipose tissue axis that results in increased BAT thermogenesis and improved energy balance throughout life.", "zh_summary": "本研究旨在探討野生小鼠的天然腸道菌相如何預防飲食引起的肥胖。研究發現，移植天然菌相能終生保護不同遺傳背景的實驗小鼠免於肥胖，並顯著增加能量消耗。單細胞核RNA定序（snRNA-seq）顯示，這與褐色脂肪組織（BAT）中產熱活性增強的脂肪細胞亞群有關。此保護機制並非透過第二型免疫信號，而是依賴於早期生命階段骨髓源性細胞（特別是CCR2+單核細胞）向BAT的浸潤與免疫調節。本研究首次揭示了一條全新的「腸道菌群—免疫—脂肪組織」軸，證實早期菌相暴露能透過免疫介導促進褐色脂肪產熱，為肥胖及代謝性疾病的防治提供了新穎的科學依據與治療靶點。", "date": "2026-08-23", "url": "https://pubmed.ncbi.nlm.nih.gov/42634246/"}, {"pmid": "42644084", "title": "Viral metagenomics of synanthropic urban bats: A surveillance strategy for uncovering potentially zoonotic viruses.", "journal": "One health (Amsterdam, Netherlands)", "impact_factor": "N/A", "tech_types": "metagenomics", "sample_size": "2,422 隻收集的蝙蝠，其中 150 對肺部與腸道配對樣本（共 300 個組織檢體）", "has_fulltext": false, "abstract": "Bats are natural reservoirs for diverse viruses, including coronaviruses, filoviruses, and paramyxoviruses, several of those known to be involved in zoonotic spillover events and demanding an integrated surveillance. Here, we present a framework that leverages Brazil's rabies passive surveillance programme to detect bat-borne viruses. Using an algorithm to select representative specimens from 2422 bats collected across São Paulo state, we submitted 150 paired lung and intestine samples to nanopore metagenomic sequencing. We detected 98 viral contigs from 12 families of public health relevance, including Arenaviridae, Coronaviridae, and Paramyxoviridae. Notably, the approach identified a previously unknown filovirus in bats in the Americas, validating the framework's capacity for epidemic preparedness. These findings reveal an undetected viral diversity and demonstrate how existing animal surveillance can monitor pathogen threats. Crucially, in a workshop involving multisectoral One Health experts in Brazil, this framework was validated as a scalable model for national expansion, adapted for low- and middle-income countries (LMICs).", "zh_summary": "本研究旨在建立一個利用現有狂犬病被動監測系統來偵測蝙蝠攜帶病毒的防疫框架，以預防潛在的人畜共通傳染病爆發。研究團隊從巴西聖保羅州收集的 2,422 隻蝙蝠中篩選出代表性個體，並對 150 對肺部與腸道組織樣本進行奈米孔總體基因體定序（nanopore metagenomic sequencing）。結果成功偵測到來自 12 個與公共衛生密切相關病毒科的 98 個病毒重疊群（contigs），包括冠狀病毒與副黏液病毒，並首次在美洲蝙蝠中發現未知的絲狀病毒。此研究揭示了未被察覺的病毒多樣性，證實利用既有動物監測進行病原體預警的可行性，為中低收入國家提供了可推廣的「健康一體」（One Health）監測模型。", "date": "2026-08-17", "url": "https://pubmed.ncbi.nlm.nih.gov/42644084/"}, {"pmid": "42637484", "title": "Insights into the analysis of microbial communities in fermented foods from the perspective of DNA-based techniques.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "The quality, flavor, and stability of fermented foods depend on the microbial community. However, microbial dynamics are difficult to observe directly, leading to limited control over fermentation. High-throughput sequencing is a revolutionary tool for microbial characterization, among which DNA-based amplicon and metagenomic sequencing are core techniques. Nevertheless, the related data processing workflows in the context of fermented foods have not yet been systematically summarized, hindering the translation of research findings into fermentation practices. This review clarifies the applications of amplicon and metagenomic sequencing in fermented foods. For amplicon sequencing, the impacts of target regions, data preprocessing, and reference databases are addressed. For metagenomic sequencing, sequencing strategies, read-based and binning-based analytical methods, functional annotation, and species-specific databases are discussed. In addition, major strategies for downstream analysis of community data are summarized, including microbial diversity, co-occurrence networks, niche and community assembly, key environmental drivers, and machine learning-based prediction. Amplicon sequencing efficiently reveals microbial succession during fermentation but has limitations in functional annotation. Metagenomic sequencing is notable for functional annotation, enabling the linkage between microbial communities and metabolic potential alongside community characterization. Standardized data preprocessing and specific databases are critical for improving characterization. For community data, integrated analysis allows uncovering the driving factors of microbial succession, thereby helping to regulate fermentation. Notably, the compositional nature of the data must be considered and validated to avoid spurious associations. In summary, the exponential growth of sequencing data will propel the era of precision fermentation.", "zh_summary": "本文為一篇綜述性研究，旨在探討以 DNA 為基礎的高通量定序技術（包含擴增子定序與宏基因組學）在發酵食品微生物群落分析中的應用。研究指出，儘管高通量定序技術已成為解析微生物動態的革命性工具，但目前缺乏系統性的數據處理框架，限制了科學發現向產業實踐的轉化。本文詳細梳理了從目標區域選擇、數據預處理、參考數據庫建立到下游生物資訊分析（如共現網絡、生態棲位構建及機器學習預測）的標準化流程。研究強調，擴增子定序雖能有效揭示群落演替，但在功能註解上存在限制；而宏基因組學則具備更強的功能解析潛力，能將微生物組成與代謝功能聯繫起來。透過標準化數據處理流程並考慮數據的組成特性，這些先進技術將精準調控發酵過程，引領精密發酵時代的到來。", "date": "2026-07-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42637484/"}, {"pmid": "42637478", "title": "Effects of sorghum variety on fermentation microecology and flavor characteristics of sesame-flavor Baijiu.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "3 種高粱品種（Hongyingzi, Hei'e, G），於 2 輪發酵週期中，在 3 個時間點（0、15、50 天）採集發酵酒醅檢體（樣本總數依實驗設計推算為 18 組發酵樣品）", "has_fulltext": false, "abstract": "Sorghum, the principal raw material for Baijiu fermentation, plays a key role in shaping fermentation microecology and flavor formation. However, the effects of sorghum varietal differences on sesame-flavor Baijiu fermentation remain insufficiently understood. In this study, three sorghum varieties, Hongyingzi (R), Hei'e (B), and a domestic cultivar (G), were compared over two consecutive fermentation rounds. Fermented grain (Jiupei) samples collected at 0, 15, and 50 days were analyzed for physicochemical properties, enzyme activities, microbial communities, volatile compounds in Jiupei and base liquor, and the taste characteristics of the corresponding base liquor. Despite showing similar overall fermentation trends, the three sorghum varieties differed in acid accumulation, starch utilization, microbial succession, and volatile composition. Fungal communities shifted from early Pichia dominance to multi-genus coexistence, whereas bacterial communities progressively converged toward Lactobacillus dominance. A total of 218 and 258 volatile compounds were identified in Jiupei and 176 and 192 in base liquor from the first and second rounds, respectively. Esters were the dominant differential class, and volatile-marker profiles varied among sorghum varieties and fermentation rounds, with no single variety showing consistent enrichment across all sesame-flavor-related compounds. These results indicate that sorghum variety is an important factor associated with microbial assembly and flavor formation during sesame-flavor Baijiu fermentation, and provide a basis for raw material selection and flavor-oriented process optimization.", "zh_summary": "本研究旨在探討不同高粱品種對芝麻香型白酒發酵過程中，微生物群落結構與風味代謝物質形成的影響。研究比較了紅纓子（R）、黑鵝（B）與國內品種（G）三種高粱，分析其在發酵過程中的理化特性、微生物演替及揮發性化合物組成。研究發現，儘管各品種發酵趨勢相似，但在酸度累積、澱粉利用率及微生物群落演替上存在顯著差異；真菌群落由早期的畢赤酵母（*Pichia*）主導轉變為多菌屬共存，細菌群落則趨向於乳桿菌（*Lactobacillus*）主導。分析鑑定出上百種揮發性化合物，其中酯類是導致風味差異的主要代謝物。本研究證實了高粱品種是決定白酒發酵微生物群落組裝與最終風味品質的關鍵因子，為白酒產業的原料選擇與製程最佳化提供了重要的科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637478/"}, {"pmid": "42637476", "title": "A Shenling Baizhu San polysaccharide fraction (SLP-2)-based synbiotic alleviates lactose-induced gut dysfunction via a microbiota-metabolite-barrier axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Lactose intolerance (LI) is a common digestive disorder, and its management still relies largely on dietary restriction. Because gut microbial fermentation and barrier dysfunction contribute to LI-related symptoms, microbiota-targeted prebiotic or synbiotic strategies may provide complementary approaches. However, the active plant-polysaccharide fractions and their microbial partners remain unclear. This study aimed to identify the bioactive polysaccharide fraction from Shenling Baizhu San and evaluate its pairing with responder bacteria for alleviating high-lactose diet (HLD)-induced intestinal dysfunction. Stepwise ethanol precipitation yielded SLP-2, which was subsequently identified as the principal bioactive fraction through human fecal fermentation, monoculture assays, and an HLD rat model. SLP-2 enriched Eubacterium-associated taxa and supported the growth of Akkermansia muciniphila in monoculture and in vivo. Building on this, a synbiotic combining SLP-2 with A. muciniphila and E. rectale alleviated HLD-induced gut dysfunction; the antibiotic-matched comparison with the probiotics-only group supported an SLP-2-associated contribution. The synbiotic intervention was associated with increased tight junction proteins, MUC2 expression, improved intestinal architecture, and thicker mucus layers. Multi-omics analysis linked co-metabolites, including intestinal 6-MGG and HTy-Ac and systemic DHPV-G, with barrier restoration and an immune profile characterized by increased IL-10 and lower TLR4 expression. These findings suggest that SLP-2-based synbiotic intervention alleviates HLD-induced intestinal dysfunction through microbiota-metabolite-barrier modulation, providing preclinical evidence for future functional-food strategies pending human validation.", "zh_summary": "本研究旨在探討參苓白朮散多醣活性組分（SLP-2）結合特定菌株，對高乳糖飲食（HLD）引發之腸道功能障礙的緩解作用。研究發現，SLP-2能促進*A. muciniphila*與真桿菌屬相關菌群生長。以SLP-2搭配益生菌的合生元配方，能顯著改善HLD大鼠的腸道屏障，包含增加緊密連接蛋白與MUC2表達、增厚黏液層。多體學分析顯示，其保護作用與腸道及全身性代謝物（如6-MGG、DHPV-G）的調節，以及抗發炎反應（提升IL-10、降低TLR4）密切相關。此發現為開發防治乳糖不耐症的功能性食品提供了臨床前依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637476/"}, {"pmid": "42637471", "title": "Fucoidan from giant kelp alleviates postmenopausal osteoporosis by regulating the betaine-OPG/RANKL/RANK signaling axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Postmenopausal osteoporosis (PMOP), characterized by excessive bone resorption and impaired bone remodeling, remains a significant global health challenge. This study investigated the protective effects of fucoidan from giant kelp (GKP) against PMOP and its underlying mechanisms in ovariectomized mice. GKP supplementation attenuated bone loss by preserving trabecular microarchitecture, normalizing systemic mineral homeostasis, and suppressing osteoclastogenesis, as evidenced by the downregulation of osteoclast-related genes. 16S rRNA gene sequencing revealed that GKP reshaped the gut microbiota by decreasing the Bacteroidota/Firmicutes ratio and enriching beneficial taxa, which promoted short-chain fatty acid production. Targeted metabolomics revealed that GKP induced profound systemic metabolic reprogramming, particularly amino acid metabolism, and identified betaine as a key systemic metabolite effector upregulated following GKP treatment. In vitro assays demonstrated that betaine suppressed receptor activator of nuclear factor-κB ligand (RANKL)-induced osteoclast differentiation and mitigated inflammation. In vivo validation demonstrated that betaine intervention recapitulated the osteoprotective phenotype observed in GKP-treated mice, which was associated with regulation of the osteoprotegerin/RANKL/RANK signaling axis. These results indicate that GKP exerts anti-osteoporotic effects in association with changes in gut microbiota and systemic metabolism, while betaine-mediated regulation of the OPG/RANKL/RANK signaling may contribute to its osteoprotective activity.", "zh_summary": "本研究探討巨藻褐藻醣膠（GKP）對去卵巢小鼠更年期後骨質疏鬆症（PMOP）的保護機制。結果顯示，補充GKP能有效減少骨質流失並抑制破骨細胞生成。16S定序顯示GKP重塑了腸道菌群（降低擬桿菌門/厚壁菌門比例），促進短鏈脂肪酸產生。代謝組學分析發現，GKP顯著提升了系統性代謝物甜菜鹼（betaine）的含量。體內外實驗進一步證實，甜菜鹼透過調控OPG/RANKL/RANK信號軸，能抑制破骨細胞分化並緩解骨質流失。本研究證實GKP具備透過「腸道菌群-代謝物」軸抗骨質疏鬆的潛力，為PMOP防治提供了科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637471/"}, {"pmid": "42637450", "title": "Highland barley polysaccharides promoted lactose intestinal fermentation in vitro: Unveiling the dynamic response of gut microbiota and polysaccharide structure.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "乳糖不耐症患者的糞便檢體（未提及具體數量）", "has_fulltext": false, "abstract": "Lactose intolerance affects over 70% of the global population due to the untimely metabolism of lactose in the colon. To accelerate lactose metabolism, we innovatively employed highland barley polysaccharides (HBP) to modulate the colonic fermentation efficiency of lactose using an in vitro fermentation model and fecal samples from lactose intolerant patients. With the addition of HBP, the consumption efficiency of lactose began to increase after 6 h of fermentation. At 48 h, lactose consumption increased by 29%, surpassing the effect of commercial prebiotics. Meanwhile, HBP with lower molecular weight (HBP-L, 8.69 × 104 g/Mol) exhibited more effective impacts than HBP with high molecular weight (HBP-H, 1.22 × 105 g/Mol), which was particularly evident during the 12-48 h of fermentation. More importantly, HBP, particularly HBP-L, substantially enriched Segatella, Bifidobacterium, and Ligilactobacillus in a time-dependent manner and was positively correlated with decreased lactose levels and elevated bacterial lactase activity, resulting in significant conversion of lactose to lactic acid and short-chain fatty acids. During the first 12 h of fermentation, HBP-L underwent more significant degradation than HBP-H. Meanwhile, the xylose residues and Glcp glycosidic bonds in HBP-L were preferentially utilized, while it was glucose residue in HBP-H. Thus, it indicated that HBPs were degraded and altered the composition of the gut microbiota, thereby enhancing the fermentation efficiency of lactose. Our findings provide a theoretical basis for developing targeted prebiotic foods to manage lactose intolerance.", "zh_summary": "本研究旨在探討青稞多醣（HBP）如何調控乳糖不耐症患者的腸道菌群，以促進體外乳糖發酵與代謝。研究發現，添加 HBP（特別是低分子量的 HBP-L）能在發酵 48 小時後提升乳糖消耗效率達 29%，效果顯著優於商業益生元。機制上，HBP-L 在發酵初期降解更為顯著，並能隨時間特異性富集 *Segatella*、雙歧桿菌屬（*Bifidobacterium*）及 *Ligilactobacillus*，進而提升細菌乳糖酶活性，將乳糖轉化為乳酸與短鏈脂肪酸。本研究證實了青稞多醣能透過重塑腸道菌群結構來加速乳糖代謝，為開發緩解乳糖不耐症的標靶益生元食品提供了重要科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637450/"}, {"pmid": "42637441", "title": "Microbial succession drives quality deterioration in refrigerated golden pompano (Trachinotus ovatus): regulatory network of dominant spoilage microbiota on characteristic biomarkers.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Elucidating the quality deterioration mechanisms of refrigerated golden pompano (Trachinotus ovatus), this study integrated 16S rRNA gene sequencing and untargeted metabolomics to systematically dissect how microbial ecological succession drives metabolic changes. As critical spoilage indicators, total volatile basic nitrogen (TVB-N) and thiobarbituric acid reactive substances (TBARS) continuously increased during storage, indicating significant deterioration by day 6. Microbial community succession analysis revealed that Psychrobacter, Shewanella, and Pseudomonas gradually became the dominant microbiota in the late storage stage. Metabolite enrichment analysis further demonstrated that this shift redirected the metabolic focus from early-stage nucleotide degradation to late-stage protein hydrolysis and amino acid metabolism. Moreover, multivariate statistical analysis identified 50 potential spoilage biomarkers, among which biogenic amines (histamine, tyramine, and phenylethylamine) were recognized as key indicators reflecting spoilage progression. Correlation network analysis revealed positive correlations between Pseudomonas and Shewanella abundances and the accumulation of these biogenic amines. This suggests that these two genera act as the core functional microbiota, driving spoilage metabolite generation and subsequent quality deterioration. Pathway analysis of potential spoilage biomarker generation indicates that amino acid and nucleotide metabolism constitute the core spoilage pathways, with lipid oxidation serving as a complementary mechanism. Overall, this study elucidates the spoilage mechanisms of refrigerated golden pompano, providing chemical targets for early biomarker detection and targeted antibacterial strategies.", "zh_summary": "本研究旨在探討冷藏金鯧魚品質劣化的機制。研究結合 16S rRNA 基因定序與非靶向代謝組學，分析微生物群落演替如何驅動代謝變化。結果顯示，金鯧魚冷藏至第 6 天時顯著腐敗。在貯藏後期，*Psychrobacter*、*Shewanella* 與 *Pseudomonas* 逐漸成為優勢菌群，使代謝焦點自初期的核苷酸降解轉向後期的蛋白質水解與氨基酸代謝。研究鑑定出 50 個潛在腐敗生物標誌物（如組胺、酪胺等生物胺），並發現 *Pseudomonas* 和 *Shewanella* 的豐度與這些生物胺的累積呈正相關，為驅動腐敗的核心菌群。本研究闡明了金鯧魚的腐敗機制，為食品早期變質檢測及靶向抑菌策略提供了科學依據與化學標靶。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637441/"}, {"pmid": "42637430", "title": "Regional differentiation of microbial communities and metabolites in Yunnan dry-cured beef: insights from high-throughput sequencing and untargeted metabolomics.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "To reveal the effects of regional processing on quality, microbial communities and metabolites of traditional Yunnan dry-cured beef, samples from Xundian (XD), Yuxi (YX) and Honghe (HH) were analyzed. High-throughput sequencing and UHPLC-Q-Exactive HF/MS untargeted metabolomics were applied. Sensory scores and physicochemical Properties differed significantly (p < 0.05). Bacillota and Staphylococcus dominated bacterial communities. The observed differences in microbial communities and metabolites among regions are shaped by the combined effects of geographical environment and processing conditions. Ascomycota was the main fungal phylum. Debaryomyces dominated XD and HH samples. YX samples had a unique fungal profile dominated by Rhodotorula and Cladosporium. A total of 1320 metabolites were identified. 196 differential metabolites were screened. Key pathways included glycerophospholipid metabolism, pyrimidine metabolism and arachidonic acid metabolism. Correlation analysis indicated that Staphylococcus and Lactococcus were positively associated with amino acid derivatives, while Latilactobacillus and Debaryomyces correlated with organic acids and glycerophospholipids. These findings revealed the potential microbial-metabolic association underlying regional quality differences. They provide support for quality control and traceability of dry-cured beef.", "zh_summary": "本研究旨在探討地理區域與加工工藝對雲南傳統乾醃牛肉（尋甸、玉溪、紅河三地）品質、微生物群落及代謝物的影響。研究結合高通量定序與非靶向代謝組學技術，發現不同地區的乾醃牛肉在感官評分與理化性質上存有顯著差異。細菌群落以厚壁菌門和葡萄球菌屬為主；真菌群落中，尋甸和紅河樣品以德巴利酵母屬為主，玉溪樣品則以紅酵母屬與枝孢菌屬為特有優勢菌。代謝組學共鑑定出1320種代謝物，其中196種為差異代謝物，主要涉及甘油磷脂、嘧啶及花生四烯酸代謝通路。關聯分析顯示，葡萄球菌屬和乳球菌屬與氨基酸衍生物呈正相關，而廣義乳桿菌屬與德巴利酵母屬則與有機酸及甘油磷脂密切相關。本研究揭示了微生物與代謝物的關聯性，為乾醃牛肉的品質控制與產地溯源提供了重要科學依據。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42637430/"}, {"pmid": "42637417", "title": "Allergic responses, gut microbiome and serum metabolism of mice: Effects of epigallocatechin gallate combined with sodium pyrophosphate modified parvalbumin.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Epigallocatechin gallate (EGCG) combined with sodium pyrophosphate (SP) modified parvalbumin (PV) was proposed to sensitize mice, and investigated whether allergic responses changes were associated with gut microbiome and serum metabolism of mice. EGCG combined with SP modified PV has structural changes, and alleviated jejunal damage in mice, while decreased specific serum IgG, IgG1 and IgE levels and may rebalanced Th1/Th2 immune responses. PV-induced allergic responses disrupted gut microbiota and reduced short-chain fatty acids (SCFAs) levels. In contrast, the modified PV could alter the relative abundance of allergic responses-related gut microbiota, such as g__unclassified_f__Lachnospiraceae, g__norank_o__Clostridia_UCG-014 and g__Alistipes, alongside elevated SCFAs levels. Additionally, the modified PV could affect multiple metabolic pathways in serum, and exert a positive impact on phosphatidylethanolamine and phosphatidylcholine levels in glycerophospholipid metabolism. Therefore, the reduction in the allergic responses of PV modified by EGCG and SP were associated with changes in gut microbiota and modulation of glycerophospholipid metabolisms. These correlational observations provided preliminary associative evidence supporting the potential utility of combined EGCG-SP modification as a hypoallergenic processing approach for fish parvalbumin mitigation.", "zh_summary": "本研究旨在探討利用表沒食子兒茶素沒食子酸酯（EGCG）結合焦磷酸鈉（SP）修飾魚類主要過敏原小清蛋白（PV），對小鼠過敏反應、腸道菌群及血清代謝的影響。結果顯示，修飾後的PV結構發生改變，能顯著減輕小鼠空腸損傷，降低血清特異性IgG、IgG1及IgE水平，並重建Th1/Th2免疫平衡。此外，修飾後的PV調節了過敏相關腸道菌群（如*Lachnospiraceae*與*Alistipes*）的相對豐度，提升了短鏈脂肪酸（SCFAs）含量，並改善血清甘油磷脂代謝。本研究證實EGCG-SP聯合修飾可作為降低魚類過敏原性的潛在低致敏加工方法。", "date": "2026-07-19", "url": "https://pubmed.ncbi.nlm.nih.gov/42637417/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        const itemsPerPage = 15;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 事件監聽
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選 (包含於字串內)
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("page-info").textContent = `第 ${currentPage} 頁 / 共 ${totalPages || 1} 頁 (篩選出 ${filteredArticles.length} 筆)`;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
