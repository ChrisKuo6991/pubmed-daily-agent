    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42638587", "title": "Valorization of spent black tea polyphenols as a functional coating for probiotic protection and colitis alleviation.", "journal": "Food & function", "impact_factor": "5.4", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Excessive reactive oxygen species (ROS) play a central role in the development of inflammatory bowel disease (IBD). A promising therapeutic strategy involves delivering probiotics alongside polyphenolic antioxidants, which can protect the probiotics while scavenging ROS. Although biomass is a versatile source of polyphenols, abundant agro-industrial waste remains largely untapped, despite its food-grade safety, anti-inflammatory properties, and sustainability. In this study, we focused on spent black tea (SBT), a widely available food processing byproduct, as a rich source of polyphenols. We developed a simple and environmentally friendly method to coordinate polyphenols extracted from SBT using hot water with ferric ions, creating a self-assembled metal-polyphenol network on the surface of Escherichia coli Nissle 1917 (ECN), resulting in the formation of ECN@SBT-Fe. This biomass-derived coating provided ECN with enhanced ROS scavenging abilities, improved survival under simulated gastrointestinal stress, and extended intestinal retention. In a mouse model of DSS-induced colitis, oral administration of ECN@SBT-Fe significantly reduced inflammation, restored epithelial barrier integrity, decreased oxidative stress, and effectively modulated gut microbiota by increasing diversity and promoting beneficial commensal bacteria. This research demonstrates a biomass-derived coating that serves as both a protective shield and a therapeutic agent, presenting a simple and sustainable encapsulation strategy for IBD treatment.", "zh_summary": "本研究開發了一種具永續性的益生菌包覆策略，利用廢棄紅茶渣（SBT）中的多酚與鐵離子結合，在益生菌 Escherichia coli Nissle 1917 (ECN) 表面形成金屬-多酚網絡保護層（ECN@SBT-Fe）。該塗層不僅提升了益生菌在模擬腸胃道環境中的存活率，還增強了其清除活性氧（ROS）的能力與腸道滯留時間。在 DSS 誘導的結腸炎小鼠模型中，ECN@SBT-Fe 有效緩解了發炎反應、修復腸道上皮屏障功能，並透過調節腸道菌相、增加微生物多樣性來改善宿主健康。這項研究證實了廢棄生物質轉化為功能性保護塗層的可行性，為發炎性腸道疾病（IBD）提供了一種低成本且環保的治療新策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638587/"}, {"pmid": "42638506", "title": "Systemic Signatures Differentiating Varicocele-Associated Semen Quality Heterogeneity: An Exploratory Multi-Omics Pilot Study.", "journal": "Andrology", "impact_factor": "3.4", "tech_types": "16S, metabolomics", "sample_size": "25 位左側精索靜脈曲張（VC）年輕男性受試者（VC_L 組 n=17，VC_N 組 n=8）", "has_fulltext": false, "abstract": "Significant semen-quality heterogeneity exists among varicocele (VC) patients with similar macro-anatomical backgrounds. This exploratory pilot study characterized and compared fecal microbial configurations and relative serum metabolomic signatures associated with individual phenotypic divergence in left-sided clinical VC. Twenty-five young males with left-sided VC were stratified into low semen quality (VC_L, n = 17) and normal semen quality (VC_N, n = 8) groups. Multi-omics profiling was performed via fecal 16S rRNA sequencing and serum untargeted LC-MS/MS metabolomics. Fecal microbiota alpha and beta diversity metrics were comparable between groups. LEfSe analysis revealed taxonomic differentiation: the VC_N group showed enrichment of Fusobacteriota lineages and Faecalimonas, whereas the VC_L group showed higher discriminative abundance of the Ruminococcus gauvreauii group and UCG_003. Cross-domain integrative profiling revealed distinct modular patterns: a cluster dominated by Bacteroides and Blautia aligned positively with circulating carbohydrate-related metabolites (inositol and D-ribose), whereas potential opportunistic taxa such as Escherichia_Shigella showed inverse associations with these metabolites and positive associations with lipid-related features (palmitoylcarnitine). Serum untargeted metabolomics further showed distinct relative ion intensities: VC_L exhibited higher signals of lipid-, amino acid-, and TCA cycle-related features (oleoyl ethanolamide, palmitoylcarnitine, taurine, and L-malate), whereas VC_N showed higher intensities of arachidonic acid, citric acid, choline, and D-ribose. Semen-quality-defined subgroups of left-sided VC patients exhibit distinct gut microbial taxonomic distributions and relative serum metabolic profiles. These preliminary, associative findings provide a descriptive multi-omics landscape of individual phenotypic heterogeneity and generate hypotheses regarding the gut-testis axis.", "zh_summary": "本研究探討精索靜脈曲張（VC）患者精液品質異質性與腸道菌群及血清代謝物之關聯。研究比較了精液品質較低（VC_L）與正常（VC_N）的 VC 患者，發現兩組在腸道菌相分類群上存在顯著差異，VC_N 組富集梭桿菌門及 *Faecalimonas*，而 VC_L 組則富集 *Ruminococcus gauvreauii* 等菌群。代謝體分析顯示，兩組在脂質、胺基酸及三羧酸循環代謝物表現各異，且腸道菌群與特定代謝物（如碳水化合物與脂質代謝物）存在交互關聯。此初步研究證實了「腸-睪丸軸」的存在，揭示了精液品質差異與系統性微生物及代謝特徵的關聯，為未來探討男性不孕症的病理機制提供了新的科學見解與假設基礎。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638506/"}, {"pmid": "42638477", "title": "Precision monitoring of kidney transplant health via cell-free DNA and RNA.", "journal": "Current opinion in organ transplantation", "impact_factor": "1.9", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Cell-free nucleic acids (cfNAs) in plasma and urine have emerged as noninvasive biomarkers for monitoring kidney transplant health. This review summarizes recent advances in the development of cell-free DNA (cfDNA) and cell-free RNA (cfRNA) assays for immune and infection-related complications, and discusses their potential to enable precision monitoring of allograft health. Large prospective multicenter studies have established donor-derived cfDNA as a robust biomarker of acute allograft rejection, with increasing evidence supporting the use of cfDNA for surveillance, prognostication, and integration with complementary molecular and clinical biomarkers. Metagenomic cfDNA assays enable broad detection of bacterial, viral, and fungal pathogens. More recently, cfRNA profiling has emerged as a complementary approach that captures tissue-type and cell-type-specific transcriptional activity, providing molecular insight into immune activation, tissue injury, and disease mechanisms. Urine cfRNA is particularly promising because of its enriched representation of kidney-derived transcripts. Cell-free nucleic acid assays are reshaping the management of kidney transplant recipients by enabling noninvasive assessment of rejection, infection, and allograft injury. Continued advances in sequencing technologies, computational methods, and multimodal biomarker integration are expected to accelerate their clinical adoption and improve precision care for transplant recipients.", "zh_summary": "本文綜述了利用血漿與尿液中的游離核酸（cfNA），作為腎臟移植後健康監測的非侵入性生物標記物。研究指出，供體來源的游離 DNA（dd-cfDNA）已在多中心臨床研究中證實能有效偵測急性排斥反應。此外，總體基因體學（Metagenomics）分析能廣泛篩檢細菌、病毒及真菌感染；而游離 RNA（cfRNA）技術則進一步補充了組織特異性的轉錄活性資訊，能精準反映免疫活化與組織損傷機制。特別是尿液中的 cfRNA，因富含腎臟衍生轉錄本，具備高度診斷潛力。整體而言，這些分子檢測技術整合了免疫監控與病原檢測，對於實現腎臟移植後的精準醫療、優化臨床決策及改善受贈者預後具有重要科學與臨床意義。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638477/"}, {"pmid": "42638468", "title": "Metabolic profiling reveals subtype-specific responses to jerantinine A acetate in breast cancer cells.", "journal": "The Analyst", "impact_factor": "N/A", "tech_types": "metabolomics", "sample_size": "4 種乳癌細胞株 (MCF-7, BT-474, MDA-MB-231, SKBR-3)", "has_fulltext": false, "abstract": "Jerantinines are natural indole alkaloids with promising anticancer activity in breast cancer cells via mechanisms of action involving tubulin binding and disruption of microtubule dynamics, with growth inhibition values, GI50 < 0.4 µM. However, metabolic responses of different breast cancer phenotypes are not yet understood. In this work, LC-MS-based untargeted metabolomics was used to investigate the response of four selected breast cancer cell lines representing different subtypes (MCF-7, BT-474, MDA-MB-231, and SKBR-3) to treatment with Jerantinine A acetate (JAa). Based on univariate, multivariate and pathway analyses, the results showed metabolic perturbations in amino-acid metabolism, fatty acid oxidation, and redox homeostasis. In breast cancer cells treated with 0.4 µM of JAa for 72 h, the elevated levels of oxidation-related metabolites, including 2-oxoglutarate, butyryl carnitine, propionyl carnitine, and 5-oxo-L-proline, indicated increased oxidative stress. Interestingly, only MCF-7 cells accumulated the antioxidants glutathione and taurine relative to untreated controls, and this response was accompanied by upregulation of wild-type p53 in this cell line. This p53-associated antioxidant capacity offers a mechanistic explanation for the difference in observed GI50 values: GI50 of 0.37 µM in MCF-7 compared to 0.19 µM and 0.14 µM in SKBR-3 and BT-474 cells, respectively, both of which harbour mutant p53 and did not mount an equivalent antioxidant response. These findings provide new insights into the metabolic effects of JAa on breast cancer cells and further support its potential as an anticancer agent. The observed metabolic differences between cell lines may inform future strategies for personalized therapy.", "zh_summary": "本研究旨在探討天然生物鹼 Jerantinine A acetate (JAa) 對不同乳癌亞型細胞的代謝影響。研究利用液相層析質譜儀 (LC-MS) 進行非標靶代謝體學分析，發現 JAa 處理後，細胞在胺基酸代謝、脂肪酸氧化及氧化還原穩態上產生顯著擾動。研究發現，MCF-7 細胞因具有野生型 p53，在藥物壓力下能透過上調穀胱甘肽與牛磺酸來提升抗氧化能力，進而影響其對藥物的敏感度（GI50 值較高）。相比之下，具備 p53 突變的 SKBR-3 與 BT-474 細胞則缺乏此抗氧化防禦反應，對藥物更為敏感。這些發現揭示了代謝反應與 p53 狀態之間的關聯，不僅闡明了 JAa 的抗癌作用機制，亦強調了基於代謝特徵進行乳癌個人化治療潛力的重要性。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638468/"}, {"pmid": "42638446", "title": "Saliva Liquid Biopsy for Detection of Oral and Systemic Diseases.", "journal": "Journal of periodontal research", "impact_factor": "3.4", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Saliva has emerged as a compelling liquid biopsy for the non-invasive diagnosis and monitoring of both oral and systemic diseases. Secreted by major and minor salivary glands and enriched by gingival crevicular fluid, epithelial turnover, immune mediators, microbial products, and plasma-derived constituents, saliva reflects a biologically integrated interface between local oral environments and systemic physiology. This dual origin enables detection of disease-associated signals across multiple molecular layers, including extracellular RNA, cell-free DNA, genomic and epigenetic material, proteins, metabolites, microbial signatures, and hormones. Advances in high-throughput sequencing, mass spectrometry, and ultrasensitive immunoassays have revealed that salivary analytes can capture dynamic pathological processes ranging from periodontal inflammation and dental caries to oral and head and neck cancers, as well as systemic conditions such as non-oral cancers and autoimmune, cardiometabolic, infectious, endocrine, and neurodegenerative diseases. In particular, extracellular vesicle-encapsulated RNA, cfDNA fragmentomics, and methylation patterns have expanded the diagnostic reach of saliva beyond conventional protein-based biomarkers, while integrated multi-omics approaches increasingly improve diagnostic performance. Despite this progress, clinical translation remains constrained by biological complexity, including variable glandular contributions, oral microbiome interactions, and pre-analytical variability in collection and processing. Emerging point-of-care technologies, microfluidic platforms, and artificial intelligence-driven multi-omic integration are beginning to address these limitations, enabling higher analytical sensitivity and improved disease stratification. Regulatory pathways, including in vitro diagnostic frameworks and laboratory-developed test structures, are progressively accommodating salivary assays, as demonstrated during the COVID-19 pandemic. However, widespread clinical adoption will require rigorous standardization, large-scale validation, and demonstration of clinical utility. Together, saliva-based liquid biopsy represents a rapidly evolving diagnostic paradigm with the potential to shift disease detection towards earlier, minimally invasive, and data-rich precision medicine approaches across dentistry and systemic healthcare.", "zh_summary": "本文探討唾液作為液態切片在診斷口腔及全身性疾病中的潛力。唾液含有源自口腔環境與全身循環的分子（如細胞外RNA、cfDNA、蛋白質、代謝物及微生物特徵），提供了一種非侵入性的檢測媒介。隨著高通量定序與質譜分析技術的進步，唾液檢測已能捕捉從牙周病、口腔癌到全身性癌症、自體免疫與神經退化性疾病的病理訊號。儘管唾液的複雜性與分析前變異性仍是臨床轉譯的挑戰，但結合微流體技術、人工智慧及多體學整合分析，正顯著提升其臨床診斷的準確度。唾液檢測具有實現早期診斷、減少侵入性檢查及推動精準醫療的巨大潛力，未來若能透過標準化流程與大規模驗證，將能成為口腔與全身性疾病臨床診斷的重要工具。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638446/"}, {"pmid": "42638059", "title": "[Effects of soybean fermented bioactive peptides on intestinal health of bullfrogs].", "journal": "Sheng wu gong cheng xue bao = Chinese journal of biotechnology", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "450 隻牛蛙", "has_fulltext": false, "abstract": "To address the challenges of antibiotic overuse and high feed costs in bullfrog aquaculture, this study aimed to systematically evaluate the effects of soybean fermented bioactive peptides (SFP) as a functional feed additive on the growth performance and intestinal health of bullfrogs (Lithobates catesbeianus). A total of 450 healthy bullfrogs with an initial body weight of (100.0±2.0) g were randomly assigned into three groups: group C (basal diet), the 2% SFP group (basal diet supplemented with 2% SFP), and the 3% SFP group (basal diet supplemented with 3% SFP). The feeding trial lasted for 6 weeks. After the experiment, growth performance, intestinal morphology, digestive enzyme activities, relative mRNA expression levels of inflammatory cytokines, and expression levels of the tight junction protein ZO-1 were systematically measured. Additionally, the intestinal microbiota structure was analyzed using 16S rRNA gene high-throughput sequencing, and the content of short-chain fatty acids (SCFAs) in the intestine was determined by gas chromatography-mass spectrometry (GC-MS). The results showed that compared with the control group, dietary SFP supplementation significantly promoted bullfrog growth and improved intestinal health. Among the treatments, the 2% SFP group exhibited the most prominent effects, with significantly higher weight gain rate and specific growth rate than those in the control group and the 3% SFP group (P0.05). The 2% SFP supplementation also significantly increased the villus height in the jejunum and ileum (P0.05), enhanced intestinal digestive enzyme activities, remarkably downregulated the mRNA expression levels of intestinal pro-inflammatory cytokines (P0.05), and upregulated the expression of the tight junction protein ZO-1. Further analysis of the intestinal microbiota revealed that 2% SFP optimized the microbial community structure by increasing the relative abundance of beneficial bacteria such as Clostridium and Lactococcus. Although the 3% SFP group exhibited an increased relative abundance of Bacteroides, its modulatory effect on the intestinal microbiota structure was inferior to that of the 2% SFP group. Consequently, the intestinal content of acetic acid and n-butyric acid was significantly higher in the 2% SFP group than in the 3% SFP group (P0.05). Therefore, these findings demonstrate that dietary supplementation with 2% SFP enhances the growth performance and intestinal health of bullfrogs by optimizing the intestinal microbiota composition, strengthening intestinal metabolic capacity, improving intestinal barrier integrity, and facilitating better digestion and absorption. This study establishes an effective feeding strategy for feed additives to promote healthy bullfrog cultivation, thereby facilitating the green and sustainable development of the bullfrog aquaculture industry. 为应对牛蛙养殖中存在的抗生素滥用及饲料成本压力等问题，本研究旨在系统评估生物发酵大豆活性肽(soybean fermented bioactive peptides, SFP)作为功能性饲料添加剂对牛蛙生长性能及肠道健康的调控作用。选取450只初始体重为(100.0±2.0) g的健康牛蛙，随机分为3组:C组(饲喂基础饲料)、2% SFP组(基础饲料中添加2% SFP)及3% SFP组(基础饲料中添加3% SFP)，进行为期6周的养殖实验。实验结束后，系统测定了牛蛙的生长指标、肠道组织形态、消化酶活性、炎症因子mRNA相对表达水平、紧密连接蛋白ZO-1的表达水平，并采用16S rRNA基因高通量测序技术分析了肠道菌群结构，采用气相色谱-质谱联用技术测定了肠道短链脂肪酸的含量。结果表明，与对照组相比，饲料中添加SFP能显著促进牛蛙生长并改善肠道健康。其中，2% SFP添加剂量的改善效果最为显著，该组牛蛙的增重率、特定生长率均显著高于对照组和3% SFP组(P0.05)。同时2% SFP能显著改善空肠和回肠的绒毛高度(P0.05)，提升肠道消化酶活性，显著下调肠道促炎症因子的基因表达(P0.05)，增强紧密连接蛋白ZO-1的表达。肠道微生物区系分析进一步揭示，2% SFP可优化菌群结构，提高梭菌属和乳球菌属等有益菌的相对丰度。3% SFP虽提高了拟杆菌属的相对丰度，但其对肠道菌群结构的优化效果不及2% SFP。2% SFP组肠道短链脂肪酸乙酸、丁酸的含量均显著高于3% SFP组(P0.05)。研究表明，饲料中添加2% SFP能通过优化肠道菌群结构，加强肠道代谢能力，增强肠道屏障完整性，改善肠道消化吸收功能，从而提升牛蛙的生长性能和肠道健康水平。本研究为牛蛙健康养殖提供了一种高效的饲料添加剂投喂方案，有助于推动牛蛙养殖产业的绿色可持续发展。.", "zh_summary": "本研究旨在評估生物發酵大豆活性肽（SFP）作為牛蛙飼料添加劑的功效。實驗將 450 隻牛蛙隨機分為對照組、2% SFP 組與 3% SFP 組，進行 6 週養殖試驗。研究結果顯示，添加 2% SFP 的效果最為顯著，能有效提升牛蛙的生長性能，改善腸道絨毛形態，並透過提升消化酶活性與緊密連接蛋白（ZO-1）表達來增強腸道屏障功能，同時降低促發炎因子的表現。微生物分析與代謝體檢測進一步證實，2% SFP 能優化腸道菌群結構（增加梭菌屬與乳球菌屬豐度），並顯著提高腸道內乙酸與丁酸等短鏈脂肪酸的含量。結論指出，飼料添加 2% SFP 是一種優化牛蛙腸道健康與促進生長的有效策略，為水產養殖業減少抗生素使用並推動綠色永續發展提供了科學依據。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638059/"}, {"pmid": "42638419", "title": "Tungsten Oxide Sub-Nanowires as Inorganic Dental Collagen Crosslinker With Antibacterial Capacity.", "journal": "Small (Weinheim an der Bergstrasse, Germany)", "impact_factor": "N/A", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The structural stability of dental collagen plays a critical role in preserving the integrity and function of tooth. However, conventional organic cross-linking agents are often compromised in moist environments and vulnerable to bacterial degradation. Here, we propose an inorganic synergistic \"cross-linking-antibacterial\" strategy utilizing tungsten oxide sub-nanowires (TO-SNWs). This strategy effectively overcomes the limitations of organic cross-linking imposed by humid environments and significantly enhance the thermostability, mechanical strength, and structural stability of dental collagen. Furthermore, TO-SNWs exert targeted antibacterial activity against the Firmicutes phylum, which harbors a majority of oral pathogens, while maintaining the overall diversity of the oral microbiota. Mechanism analysis reveals that antimicrobial effects stem from multilevel TO-SNWs-bacteria interactions, which compromise the permeability and metabolism. In conclusion, this inorganic \"cross-linking-antibacterial\" approach not only reinforces dental collagen stability, but also suppresses pathogenic microorganisms' activity, representing a promising and innovative strategy for dentin biomodification.", "zh_summary": "本研究開發了一種新型無機材料「氧化鎢次奈米線」（TO-SNWs），旨在解決傳統有機交聯劑在潮濕環境中易降解及抗菌能力不足的問題。實驗證實，TO-SNWs 能有效增強牙本質膠原蛋白的機械強度、熱穩定性及結構完整性。在生物活性方面，該材料展現出對口腔厚壁菌門（Firmicutes）具備選擇性的抗菌效果，能精準抑制多數口腔致病菌，同時維持口腔微生物群的整體多樣性。其抗菌機制主要透過多層次的物理與化學相互作用，破壞細菌細胞膜通透性並干擾其代謝功能。這項無機「交聯-抗菌」雙效策略，為牙本質生物改性提供了一種兼具結構強化與病原菌控制的創新臨床應用方向。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638419/"}, {"pmid": "42638349", "title": "Genomic Insights into Divergent Evolutionary Strategies and Vector Capacities of Ticks.", "journal": "Genomics, proteomics & bioinformatics", "impact_factor": "N/A", "tech_types": "small genome", "sample_size": "4 個蜱蟲物種基因體、2 個立克次體內共生菌基因體", "has_fulltext": false, "abstract": "Ticks, which are globally distributed, transmit a wide range of human and animal pathogens. Soft and hard ticks are two major tick families exhibiting distinct vector capacities and blood-feeding abilities. However, understanding the genetic basis of these differences is hindered by the scarcity of high-quality tick genomes, particularly for soft ticks. Here, we present high-quality genomes of two soft and two hard tick species of both evolutionary and medical importance, and compare the genomic characteristics of the two tick families. Compared with soft ticks, hard ticks exhibited faster genome evolution, characterized by larger genome sizes, higher rates of gene gain and loss, and a greater number of positively selected genes. Both tick families exhibited frequent positive selection across metabolism and organismal systems, sharing a core set of adaptive genes but undergoing refinement at different sites. Gene families underpinning various vector capacities, including those involved in cuticle structure, heme biosynthesis, egg waxing, and immune pathways, were identified. Additionally, we assembled the genomes of two novel Rickettsia endosymbionts from soft ticks, revealing high genomic divergence and lineage-specific adaptations to their hosts. These genomic resources provide fundamental insights into the genetic basis of tick biology and vector capacity, highlighting the divergent evolutionary strategies of blood-feeding arthropods shaped by their ecological niches.", "zh_summary": "本研究旨在探討硬蜱與軟蜱在演化策略與病媒能力上的遺傳差異。研究團隊針對兩類蜱蟲各進行了高品質的全基因體定序與組裝。分析顯示，硬蜱的基因體演化速度較快，具備更大的基因體規模、更高的基因增減率及更多的正向選擇基因。研究發現兩者雖共享核心適應基因，但在代謝與生理系統的演化細節上存在分歧；並成功鑑定出與幾丁質結構、血紅素合成及免疫路徑等病媒能力相關的關鍵基因家族。此外，研究亦組裝了兩種新型立克次體內共生菌的基因體，揭示了其與宿主間的高度分歧與適應機制。這些成果不僅填補了軟蜱基因體數據的不足，更為理解節肢動物如何適應不同生態棲位及病媒演化提供了關鍵的遺傳視角。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638349/"}, {"pmid": "42638285", "title": "Lactobacillus acidophilus LA15 plus Bifidobacterium animalis subsp. lactis Bi66 mitigates cyclophosphamide-induced immunosuppression in association with gut-immune axis modulation and AhR signaling recovery.", "journal": "Journal of the science of food and agriculture", "impact_factor": "3.5", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Cyclophosphamide (CTX), a widely used alkylating chemotherapeutic agent, causes severe systemic immunosuppression and gut microbiota dysbiosis through non-specific cytotoxicity, increasing infection risk and impairing chemotherapy outcomes. Safe and effective adjuvant therapies for chemotherapy-related immune injury remain limited. This study evaluated the protective effect of compound AB probiotics (Lactobacillus acidophilus LA15 combined with Bifidobacterium animalis subsp. lactis Bi66) against CTX-induced immunosuppression in mice and explored correlations associated with the gut-immune axis. CTX challenge induced immune organ atrophy, cytokine imbalance, impaired innate and adaptive immunity, intestinal barrier disruption, reduced short-chain fatty acid (SCFA) synthesis and gut dysbiosis. AB probiotic intervention alleviated these injuries dose-dependently: it restored thymus and spleen indexes, rebalanced serum cytokines, improved core immune functions, and repaired ileal mucosal pathological damage. Furthermore, probiotic treatment was accompanied by elevated fecal SCFA concentrations, upregulated tight junction gene expression, recovered aryl hydrocarbon receptor (AhR)/ERK/STAT3 transcription, enriched beneficial bacterial genera, and suppressed opportunistic pathogens. Compound AB probiotics alleviate CTX-induced immunosuppression in mice, and this effect correlates with restored gut microecology, enhanced SCFA metabolism, repaired intestinal barrier, and activated AhR signaling. These findings provide evidence for developing probiotic preparations as adjuvant interventions against chemotherapy-related immunosuppression. © 2026 Society of Chemical Industry.", "zh_summary": "本研究旨在探討嗜酸乳桿菌（LA15）與動物雙歧桿菌（Bi66）組成的複合益生菌，對環磷醯胺（CTX）誘導之免疫抑制與腸道菌群失調的保護作用。實驗證實，CTX 會導致小鼠免疫器官萎縮、細胞激素失衡、腸道屏障受損及短鏈脂肪酸（SCFA）合成減少。研究發現，補充該複合益生菌能顯著改善上述症狀，包括恢復胸腺與脾臟指標、修復迴腸黏膜，並促進 SCFA 生成。機制上，益生菌透過重塑腸道菌群結構，激活芳香烴受體（AhR）/ERK/STAT3 訊號通路，進而維持腸道免疫穩態。此研究證實了該複合益生菌在減輕化療副作用方面的潛力，為未來開發臨床輔助治療策略提供了科學依據。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638285/"}, {"pmid": "42638210", "title": "Effects of Asaia spp. on the development, size and associated microbiomes of two mosquito species of medical importance.", "journal": "Medical and veterinary entomology", "impact_factor": "1.9", "tech_types": "16S", "sample_size": "未提及（摘要中未明確列出具體的樣本數量或重複次數）", "has_fulltext": false, "abstract": "Vector control is essential for mitigating arbovirus outbreaks that are fuelled by the global spread of medically important mosquito species. Control based on synthetic insecticides can be ineffective due to the increasing evolution of resistance. In response, alternative strategies to insecticides, such as the sterile insect technique, have been developed. These rely on mass production and release of sterile or genetically-modified males to target vector populations. The efficient production of 'high-quality' males is crucial for sustaining these control programmes. Probiotic symbionts, inoculated into larval rearing water, present a potentially valuable tool for insect rearing. Here, we tested the hypothesis that inoculation with Asaia spp. can increase both development rate and adult size of the Yellow Fever mosquito Aedes aegypti and the common house mosquito, Culex pipiens molestus. Based on previous work, we hypothesized that Asaia inoculation would affect insect development via effects on other components of the insect microbiome. To test this, we conducted 16S rRNA amplicon sequencing on larval and pupal stages. Exposure to Asaia spp. shortened larval development time and increased adult size in Ae. aegypti and Cx. p. molestus and increased the proportion of insects completing pupation in Ae. aegypti. Effects on adult size were sex-specific but qualitatively consistent across insect species: Asaia bogorensis increased the size of males and females, while A. krungthepensis affected males only. The microbiome analysis was consistent with Asaia affecting insect development via changes in community structure, although inoculation primarily affected the less frequent bacterial taxa. The positive effects of Asaia inoculation on development rate were qualitatively consistent with previous work conducted in a separate insectary, highlighting the reproducibility of Asaia inoculation as a probiotic technique. Overall, our findings suggest that incorporating Asaia as a probiotic symbiont into mass-rearing systems could enhance productivity and yield larger males for release in vector control programs.", "zh_summary": "本研究探討添加益生性共生菌 *Asaia* spp. 對於兩種重要病媒蚊——埃及斑蚊 (*Aedes aegypti*) 與地下家蚊 (*Culex pipiens molestus*) 發育與微生物相的影響。研究發現，在幼蟲飼養水中接種 *Asaia* 可有效縮短幼蟲發育時間，並增加成蟲體型，提升羽化率。透過 16S rRNA 擴增子定序分析證實，*Asaia* 的接種會改變蚊蟲體內微生物群落結構，特別是影響低豐度的細菌類群。這些發現顯示 *Asaia* 可作為一種有效的益生菌，應用於病媒蚊大規模繁育系統中，不僅能優化生產效率，還能培育出更健壯的雄性個體，對於提升病媒控制計畫（如昆蟲不育技術）的成效具有顯著的科學與應用價值。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638210/"}, {"pmid": "42638192", "title": "Oral Microbiome Alterations in Oral Lichen Planus Across Saliva, Dental Plaque, and Tongue Coating.", "journal": "Oral diseases", "impact_factor": "2.9", "tech_types": "16S", "sample_size": "186 個檢體（包含 82 個唾液樣本、40 個牙菌斑樣本、79 個舌苔樣本）", "has_fulltext": false, "abstract": "To characterise oral lichen planus-associated oral microbiome alterations separately in saliva, supragingival dental plaque, and tongue coating. In this cross-sectional study, samples from patients with oral lichen planus and healthy controls were analysed using bacterial amplicon sequencing. Microbial diversity, taxonomic composition, and genus-level differential abundance were compared within each sample type. Analyses included 47 control and 35 oral lichen planus saliva samples, 10 and 30 dental plaque samples, and 47 and 32 tongue coating samples, respectively. Significant alpha-diversity differences were observed for all four indices in saliva, three in tongue coating, and one in dental plaque. Beta-diversity differed between groups within all three sample types. Unweighted phylogenetic and presence-absence distances most consistently detected group differences, whereas abundance-weighted phylogenetic distances were not significant after correction. Unweighted phylogenetic differences remained significant after adjustment for Plaque Control Record. Descriptive taxonomic and differential-abundance patterns varied among sample types, with saliva yielding the largest number of significant taxa. Oral lichen planus was associated with microbiome alterations in all three sample types, mainly reflecting differences in microbial community membership. These sample types may provide complementary information for characterising oral lichen planus-associated dysbiosis.", "zh_summary": "本研究旨在探討口腔扁平苔蘚（OLP）患者在唾液、齦上牙菌斑及舌苔三種不同微環境下的口腔微生物群落變化。透過 16S rRNA 擴增子定序分析，研究發現 OLP 患者與健康對照組在微生物多樣性與組成上存在顯著差異，且此現象在唾液檢體中尤為明顯。研究結果指出，微生物群落成員結構（community membership）的改變是 OLP 患者的主要特徵。此研究證實了口腔不同部位的菌叢對診斷 OLP 具有互補價值，並強調針對不同取樣部位進行分析對於深入了解 OLP 相關菌群失調（dysbiosis）具備臨床科學意義，有助於未來開發更精準的口腔疾病微生物標記。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638192/"}, {"pmid": "42638140", "title": "Mannooligosaccharides modulate mucin O-glycan-gut microbe interactions and preserve the intestinal barrier in weaned piglets.", "journal": "Journal of animal science and biotechnology", "impact_factor": "6.5", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The intestinal microbiota and mucosal barrier are closely intertwined, with mucin O-glycans playing a key role in maintaining intestinal homeostasis. However, how nutrition regulates mucin O-glycans remains poorly understood. This study investigated the regulatory effects of mannooligosaccharides (MOS) on mucin secretion and O-glycan modification in a weaned piglet model. We evaluated the effects of MOS on intestinal morphology, gut microbiota, mucin secretion, and O-glycosylation profiles in weaned piglets. Transcriptome analysis revealed that MOS influenced key KEGG pathways, including mucin O-glycan biosynthesis, through the regulation of genes such as GALNT, GCNT3, and POFUT1. Furthermore, MOS increased the proportion of Core 2 structures in mucin and modulated the proportion of long-chain, sulfated and sialylated O-glycans, which may help protect the mucus layer from microbial degradation. Moreover, MOS improved colonic microbiota composition by promoting beneficial Lactobacillus species and suppressing potentially pathogenic Escherichia coli. This study highlights the molecular effects of MOS on mucin synthesis and modification, which may help preserve intestinal microbiota balance. These effects are important for maintaining intestinal barrier function in weaned piglets.", "zh_summary": "本研究探討甘露寡糖（MOS）對離乳仔豬腸道黏液素（mucin）分泌、O-聚醣修飾及腸道菌群的調節機制。研究發現，MOS 能有效調控與黏液素 O-聚醣生物合成相關的基因（如 GALNT, GCNT3, POFUT1），進而改變腸道黏液中 Core 2 結構及長鏈、硫酸化與唾液酸化聚醣的比例，從而強化黏液層對微生物降解的抵抗力。此外，MOS 能改善腸道菌群結構，提升益生菌（如乳酸桿菌屬）比例並抑制致病菌（如大腸桿菌）。此結果顯示，MOS 可透過分子層面的調節，優化腸道黏液屏障結構並維護微生物平衡，對離乳仔豬的腸道健康與功能保護具有重要的營養科學意義。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638140/"}, {"pmid": "42637915", "title": "The microbial mirror: how a disrupted microbiome forecasts disease and why policy must act.", "journal": "Nature reviews. Gastroenterology & hepatology", "impact_factor": "N/A", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "無提供摘要。", "zh_summary": "本文探討微生物群落作為健康指標的關鍵作用，視其為反映宿主生理狀態的「微生物鏡像」。文章核心目的在於強調微生態失調（Dysbiosis）對預測慢性病與疾病風險的重要性，並從公共衛生政策的角度出發，呼籲決策者正視微生物群落對群體健康的影響。作者主張，應將微生態指標納入未來的臨床評估與公共衛生策略中，透過預防性干預來降低疾病負擔。此篇論文主要闡述科學與政策之間的橋樑，對於推動微生物組學從實驗室走向臨床與公衛政策框架具有重要的導向意義。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637915/"}, {"pmid": "42637888", "title": "Colibactin produced by a honeybee gut symbiont mediates pathogen defence.", "journal": "Nature microbiology", "impact_factor": "19.4", "tech_types": "others", "sample_size": "未提及（研究採用實驗室培養菌株及蜜蜂感染模型，未明確列出具體的樣本總數）", "has_fulltext": false, "abstract": "Colibactin is a bacterial genotoxin that damages DNA and is linked to colorectal cancer. It is implicated in interbacterial competition but its role in natural microbiomes is unclear. Here we show that Frischella perrara, a colibactin-producing symbiont restricted to honeybee guts, lowers bee lifespan but increases survivorship following challenge with the opportunistic bee pathogen Serratia marcescens. F. perrara mutants lacking colibactin production fail to improve survivorship following challenge. The symbiont reduces pathogen loads by causing colibactin-dependent DNA damage and prophage induction. Colibactin is toxic to the pathogen under anoxic conditions, reflecting the bee gut. clbS, a gene conferring protection from colibactin, is ubiquitous among bacteria restricted to bee guts but absent from opportunistic colonizers, including pathogens. Indeed, F. perrara colonization representing colibactin pressure had limited impact on the bee gut microbiome where strains encode clbS. Our findings suggest that colibactin functions in interbacterial competition and protects against pathogens while permitting co-evolved symbionts to persist.", "zh_summary": "本研究探討蜜蜂腸道共生菌《Frischella perrara》所產生的遺傳毒素「Colibactin」在自然微生物群落中的生態功能。實驗結果顯示，雖然 Colibactin 會縮短蜜蜂壽命，但能有效對抗伺機性病原體《Serratia marcescens》。其機制在於 Colibactin 誘導病原體產生 DNA 損傷及原噬菌體激活，進而降低病原負荷。研究發現，蜜蜂腸道內的原生共生菌具備抗性基因《clbS》以避免受損，而病原體則缺乏此保護機制。此發現揭示了 Colibactin 在微生物群落中扮演「選擇性防禦」的角色，既能抑制入侵病原，又能讓演化適應後的共生菌群持續存在，提供了對於微生物間競爭與宿主保護機制的新見解。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637888/"}, {"pmid": "42637784", "title": "Author Correction: Host macrophages/monocytes promote malaria transmission by modulating mosquito microbiota via SR-A-mediated phagocytosis.", "journal": "Nature communications", "impact_factor": "15.7", "tech_types": "16S, small genome (針對蚊子共生菌株的全基因體定序)", "sample_size": "實驗設計包含多組樣本，主要包括 30-40 隻蚊子（不同處理組之腸道微生物分析）以及多個小鼠模型（涉及瘧原蟲感染實驗，具體樣本數視實驗重複次數而定，約 n=5-10/組）。", "has_fulltext": false, "abstract": "無提供摘要。", "zh_summary": "本研究探討了宿主免疫系統（巨噬細胞與單核球）如何透過清道夫受體 A (SR-A) 介導的吞噬作用，調控瘧蚊體內的微生物群落組成，進而影響瘧疾的傳播效率。研究發現，當宿主免疫細胞攝取瘧原蟲並產生相關代謝產物後，會改變蚊子腸道內特定共生菌（如*Enterobacter*屬）的豐度。這些微生物群的變化不僅影響蚊子的抗病性，更直接調節了瘧原蟲在蚊體內的發育與感染潛力。此發現揭示了「宿主免疫-蚊子微生物群-病原體」三者之間的複雜交互作用，為中斷瘧疾傳播提供了一種新的生物防治思路，即透過調控蚊子微生物組來抑制瘧原蟲的傳播能力。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637784/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        const itemsPerPage = 15;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 事件監聽
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選 (包含於字串內)
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("page-info").textContent = `第 ${currentPage} 頁 / 共 ${totalPages || 1} 頁 (篩選出 ${filteredArticles.length} 筆)`;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
