        /* 分頁元件 */

    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42708205", "title": "Opportunistic premise plumbing pathogens (OPPPs) in the built environment: transmission, resistance, and strategies for detection and mitigation.", "journal": "Reviews on environmental health", "impact_factor": "4.5", "tech_types": "others", "sample_size": "未提及", "country": "USA", "has_fulltext": false, "abstract": "Healthcare associated infections (HAIs) lead to tens of thousands of deaths annually, with 21.6 % being caused by water, according to Collier S, Deng L, Adam E, Benedict K, Beshearse E, Blackstock A, et al. Estimate of burden and direct healthcare cost of infectious waterborne disease in the United States. Emerging Infect Disease J 2021;27:140. This is partially due to Opportunistic Premise Plumbing Pathogens (OPPPs); which may exhibit resistance to disinfection and thrive in pipe biofilms. Evidence found in literature indicates the rate of infections caused by OPPPs are going to increase with time, highlighting the need for better understanding of their detection and mitigation. The aim of this review is to provide insight on the latest status of OPPP research and highlight areas that need further investigation. It also emphasizes the importance of proactive surveillance, extensive water management protocols, and advanced detection technologies in reducing waterborne healthcare-associated infections. Ultimately, it was found there is still extensive research needed to fully mitigate and prevent pathogenic outbreaks.", "zh_summary": "本研究針對建築環境中「伺機性管線病原體」（OPPPs）進行綜合性回顧。核心目的在於探討這些病原體如何於供水系統生物膜中存活並產生消毒耐受性，進而引發醫療照護相關感染（HAIs）。作者指出，隨著水媒傳染病負擔加重，現有的檢測與防治策略仍顯不足。本研究強調，未來必須強化主動監測機制、制定更嚴謹的水質管理規範，並發展先進的偵測技術。科學意義在於總結當前研究瓶頸，為降低建築環境中的水傳染風險提供關鍵策略方向。", "date": "2026-09-09", "url": "https://pubmed.ncbi.nlm.nih.gov/42708205/"}, {"pmid": "42709766", "title": "Ketogenic diet-induced changes in hepatic drug metabolism with potential implications for ozanimod pharmacokinetics in mice.", "journal": "PloS one", "impact_factor": "2.6", "tech_types": "metagenomics", "sample_size": "根據實驗設計描述，為 C57BL/6 小鼠模型（未明確給出具體總數，僅提及分組實驗）", "country": "Czech Republic", "has_fulltext": false, "abstract": "Ketogenic diet (KD) is increasingly considered as an adjunctive therapeutic approach across a range of diseases, but its effects on the pharmacokinetics of concomitantly administered drugs remain unclear. Such interactions may be particularly relevant in multiple sclerosis, where KD is being explored as a complementary strategy alongside disease-modifying therapies, such as ozanimod. We therefore investigated whether KD affects ozanimod metabolism and pharmacokinetics and explored potential factors that may contribute to such effects. Specific pathogen-free female C57BL/6 mice were fed either a control diet containing 10% of calories from fat or a ketogenic diet containing 90% of calories from fat for 4 weeks. Metabolic, inflammatory, and hormonal parameters were determined in plasma. Gut microbiota composition was analyzed by whole-metagenome shotgun sequencing. In parallel, hepatic cytochrome P450 (CYP) enzymes were evaluated by mRNA expression and activity together with ozanimod pharmacokinetics. KD induced the expected metabolic adaptation to ketosis and led to a significant increase in plasma cholesterol accompanied by changes in gut microbiota composition. Other metabolic and inflammatory parameters showed only modest changes. In addition, KD altered the expression and activity of hepatic CYP enzymes, including enzymes involved in ozanimod metabolism: CYP1A activity and mRNA expression were significantly increased in KD-fed mice, whereas lower CYP2C activity was observed in pooled samples and CYP3A activity showed a non-significant trend toward lower values. Ozanimod exposure tended to be higher in KD-fed mice, resulting in an approximately 17% increase in area under the concentration-time curve, although this effect did not reach statistical significance. In conclusion, our findings demonstrate that KD altered the expression and activity of hepatic CYP enzymes and revealed a non-significant trend toward increased ozanimod exposure. These observations highlight the potential importance of considering dietary interventions as a factor contributing to variability in drug response.", "zh_summary": "本研究旨在探討生酮飲食（KD）對藥物奧扎莫德（ozanimod）代謝與藥物動力學的潛在影響。研究人員以小鼠為模型，比較餵食高脂肪生酮飲食與對照飲食後的生理變化。研究發現，生酮飲食不僅改變了小鼠的腸道菌相與血漿膽固醇濃度，更顯著影響了肝臟細胞色素 P450（CYP）酵素的表現與活性（特別是 CYP1A 的增加與 CYP2C 的降低）。雖然生酮飲食導致奧扎莫德的藥物暴露量有增加趨勢，但統計上未達顯著差異。此研究結果凸顯了飲食干預作為藥物反應變異性影響因子的重要性，對於多發性硬化症等需同時使用飲食療法與特定藥物的病患具有臨床參考價值，提醒醫學界應關注飲食對藥物動力學的潛在交互作用。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42709766/"}, {"pmid": "42708949", "title": "Ecological Restoration of the Soil-Like Function in the Bauxite Residue: Natural Microbiomes Mediated Molecular Transformation of Dissolved Organic Matter.", "journal": "Environmental science & technology", "impact_factor": "11.3", "tech_types": "metagenomics, others", "sample_size": "未提及", "country": "China", "has_fulltext": false, "abstract": "Soilization of bauxite residues offers a scalable route for long-term carbon management and ecological restoration. However, the microbial processes that transform exogenous organic inputs into stable soil-like carbon pools remain poorly resolved. Here, we combined cross-ecosystem meta-analysis, machine-learning prediction, native synthetic community (SynCom) construction, 13C-labeled straw microcosms, field validation, Fourier transform ion cyclotron resonance mass spectrometry, and genome-resolved metagenomics to unravel microbiome-mediated carbon transformation at the dissolved organic matter (DOM) molecular scale. Our meta-analysis revealed that alkaline industrial wastes retained soil-like DOM signatures but were enriched in microbial humic- and protein-like components, indicating active yet incomplete carbon processing. Guided by these patterns, native SynCom inoculation increased 13C incorporation into total organic carbon (TOC) and dissolved organic carbon (DOC), enlarged biodegradable and adsorbable DOC fractions, and shifted DOM from recalcitrant aromatic pools toward oxygenated carbohydrate-, tannin-, and phenolic-like molecular classes. Genome-resolved analyses linked this transformation to complementary polymer degradation and nutrient-cycling functions across fungal and bacterial guilds, including enriched carbohydrate-active enzymes in straw-carbon-utilizing metagenome-assembled genomes. Null model and thermodynamic analyses further showed that microbial communities were constrained by homogeneous selection, whereas DOM molecules were diversified through variable selection and redox-dependent transformation. Field-scale validation confirmed that SynCom promoted TOC and DOC accumulation and humic-like, high-density DOM fractions under alkaline conditions. Together, these findings establish a mechanistic framework in which functional microbiomes couple plant carbon depolymerization, DOM molecular diversification, and mineral-interactive carbon stabilization, providing a microbiome-guided strategy for carbon sequestration and soilization in the bauxite residue.", "zh_summary": "本研究探討鋁土礦殘渣（Bauxite residues）的土壤化過程，旨在解析微生物如何將外源有機碳轉化為穩定的類土壤碳庫。研究結合了跨生態系統統合分析、機器學習預測、合成菌群（SynCom）建構及13C標記實驗等多項技術。結果顯示，接種原生合成菌群能有效促進碳的生物轉化，將難降解的芳香族化合物轉變為含氧碳水化合物、單寧及酚類等類別。基因組分析發現，細菌與真菌菌群透過互補的聚合物降解與營養循環功能協同運作。此研究建立了一個微生物介導碳固定與礦物互動的機制框架，證實了透過合成菌群技術可促進鋁土礦殘渣的土壤化與碳封存，為工業廢棄地的生態修復提供了具備臨床與科學價值的修復策略。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42708949/"}, {"pmid": "42708953", "title": "Adaptive Evolution Reveals Metabolic Plasticity and Functional Redundancy in an Anaerobic Microbiome under Extreme Ammonia Stress.", "journal": "Environmental science & technology", "impact_factor": "11.3", "tech_types": "metagenomics, metatranscriptomics", "sample_size": "1 個微生物群落樣品（於 240 天試驗期間進行長期序列富集）", "country": "Italy, USA", "has_fulltext": false, "abstract": "Ammonia toxicity represents a primary biochemical bottleneck governing microbial community structure and performance during the anaerobic digestion of the organic fraction of municipal solid waste. However, the mechanistic basis of microbial adaptation to chronic ammonia levels remains poorly characterized. In this study, a long-term sequential enrichment strategy under progressively increasing ammonia concentrations (350-1500 mgN L-1), integrated with genome-centric metagenomics and metatranscriptomics, was employed to resolve the response of an organic waste-degrading microbiome over a 240 day period. Increasing ammonia pressure induced a progressive decline in methanogenesis and accumulation of volatile fatty acids, particularly acetate. Despite these inhibitory pressures, methane production was only halved relative to the initial baseline reflecting a resilient methanogenic community. This stability was driven by a restructuring of the microbiome, where functional redundancy across divergent taxa preserved core metabolic functions. Key adaptive responses included the reconfiguration of carbon fixation pathways, specifically via a variant of the Wood-Ljungdahl pathway coupled with the glycine cleavage system acting as an alternative acetate oxidation route, as well as sustained osmoprotectant biosynthesis. Cellular homeostasis was preserved through H+ replenishment via multiple energy-converting complexes and K+ influx to maintain cation-proton balance. Collectively, these findings demonstrate that metabolic plasticity and the preservation of core metabolic functions are the primary determinants of ammonia resilience, sustaining methane production under inhibitory conditions.", "zh_summary": "本研究探討厭氧消化過程中微生物群落對氨氮脅迫的適應機制。研究人員透過為期 240 天、氨氮濃度逐步提升的長期富集實驗，整合宏基因組學與宏轉錄組學技術進行分析。結果顯示，儘管高氨氮環境導致產甲烷作用下降並造成揮發性脂肪酸（特別是乙酸）堆積，微生物群落仍展現出高度韌性。此韌性歸因於微生物的代謝可塑性與功能冗餘，即使分類群結構發生變動，仍能維持核心代謝功能。關鍵適應機制包含 Wood-Ljungdahl 路徑的變體重組、甘胺酸裂解系統作為乙酸氧化途徑，以及合成滲透壓保護劑以維持細胞恆定。本研究揭示了微生物群落如何在極端壓力下透過代謝重組維持生態穩定，對於優化厭氧消化系統處理有機廢棄物的效率具有重要科學參考價值。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42708953/"}, {"pmid": "42708591", "title": "Divergent avian strains drive an off-season influenza A peak in municipal wastewater.", "journal": "Microbiology spectrum", "impact_factor": "3.8", "tech_types": "metagenomics, small genome", "sample_size": "未提及（文章描述為針對一間市政廢水處理廠的長期常規監測，未列出具體的檢體總數）", "country": "USA", "has_fulltext": false, "abstract": "Wastewater sequencing is an increasingly valuable tool in tracking the spread of infectious disease agents across space and time in areas of dense human settlement. Among pathogens that can be readily detected by this approach is influenza A, which follows predictable patterns of prevalence through the winter months in North America. Here, we leverage routine surveillance of a municipal wastewater treatment plant in Northern California to describe an atypical, off-season spike in influenza A concentrations that rivals that of the winter respiratory virus season. Drawing upon metagenomic data generated through hybrid-capture sequencing, we assemble and subsequently characterize fragments of divergent influenza genomes that appear to derive predominantly from the avian H16 clade. These strains exhibit close evolutionary relationships to influenza isolated from migratory shorebirds, hinting at potential host species and mechanisms of geographic spread. Analysis of read abundances suggests that these avian strains dominate the pool of influenza circulating during the summer months, when typical human-infecting strains are essentially absent. Together, our results expand the value of wastewater sequencing to encompass sensitive tracking of outbreaks within animals in interface regions where human settlement abuts wildlands, increasing overall pandemic preparedness.IMPORTANCEResearchers now commonly search municipal wastewater for viral genetic material, which can indicate trends in the diversity and abundance of strains circulating in communities. Here, we show that under certain conditions, municipal wastewater can also capture the signatures of viruses circulating among animal populations, such as birds. Specifically, we draw on a targeted form of nucleic acid sequencing to discover a strain of influenza that is fairly genetically distinct from known relatives and may be circulating among shorebirds in Northern California. These findings both broaden the possible use cases of wastewater sequencing and provide new insights into avian viruses, some of which can jump host species to make other animals or people sick.", "zh_summary": "本研究透過分析加州北部市政廢水處理廠的監測數據，發現了非季節性的流感病毒高峰。研究團隊利用宏基因體學（metagenomics）與混合捕獲定序技術，成功組裝並鑑定出主要源自禽類 H16 支系的流感病毒基因體片段。這些病毒株與遷徙濱鳥身上分離出的流感病毒具高度演化相關性，顯示廢水不僅能監測人類病原體，亦可作為偵測野生動物傳染病擴散的有效工具。此發現擴展了廢水監測在公共衛生與大流行預防中的應用價值，特別是在人類居住區與野生棲地交界處，對於監控人畜共通傳染病風險具有重要的科學意義。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42708591/"}, {"pmid": "42709883", "title": "Curvularia lunata drives biodeterioration of PVC secondary cable insulation involving surface colonization, moisture retention and chemical deterioration.", "journal": "PloS one", "impact_factor": "2.6", "tech_types": "metagenomics, small genome", "sample_size": "未提及（僅提及進行了人工接種實驗及對纜線樣本的表徵分析，未具體說明樣本總數）", "country": "China", "has_fulltext": false, "abstract": "Microbial degradation of cable insulation materials is a critical issue affecting the reliability of power systems. In this study, metagenomic analysis was employed to reveal the microbial community structure on contaminated substation cables, identifying Curvularia lunata as a dominant fungal species in high-voltage environments. Subsequently, a specific strain, Curvularia lunata B3, was isolated and identified for further investigation. To assess its specific impact on insulation performance, artificial inoculation experiments were conducted on secondary cable samples. Multi-dimensional characterization techniques, including SEM, WCA measurements, halogen moisture analysis, FTIR, XPS, and LCR digital bridge testing, were utilized to evaluate material degradation. The results demonstrated that C. lunata colonization caused significant surface erosion, characterized by the formation of holes and furrows. This physical damage was accompanied by a marked decrease in hydrophobicity, with the water contact angle dropping from 88.30 ± 0.79° to 78.27 ± 1.27°, and a gradual increase in water content to approximately 1.2% over 60 days. Chemical analysis revealed that microbial activity induced oxidation and dechlorination of the PVC insulation, evidenced by the reduction of C-Cl bonds and the emergence of oxygen-containing functional groups. These physicochemical alterations significantly compromised the electrical insulation of the cables, as evidenced by a marked decrease in series resistance (Rs) and an increase in series capacitance (Cs). This study elucidates the mechanisms of fungal erosion on cable insulation and provides a scientific basis for developing targeted protective strategies in power systems.", "zh_summary": "本研究探討了真菌《Curvularia lunata》對變電站二次電纜PVC絕緣材料的生物降解機制。研究透過宏基因體學定序發現該菌為高壓環境下的優勢真菌，並分離出菌株B3進行人工接種實驗。結果顯示，該菌會在電纜表面形成孔洞與溝槽，導致疏水性下降與含水量上升。化學分析證實，真菌活動誘發了PVC的氧化及去氯化反應（C-Cl鍵減少、含氧官能基增加），進而導致電纜的電阻下降與電容增加，嚴重影響電氣絕緣性能。本研究揭示了真菌侵蝕電纜的物理與化學機制，為提升電力系統安全性及開發防護策略提供了科學依據。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42709883/"}, {"pmid": "42710654", "title": "Host detoxification and gut microbiota are associated with chlorantraniliprole resistance in Spodoptera frugiperda.", "journal": "Journal of insect physiology", "impact_factor": "2.3", "tech_types": "metagenomics", "sample_size": "2 個品系（CR 抗性品系與對照品系，歷經 10 代篩選）", "country": "China", "has_fulltext": false, "abstract": "Spodoptera frugiperda is a major agricultural pest that causes severe damage in China. Chlorantraniliprole (CAP) is the primary insecticide used for control; however, it is yet unknown how much the intrinsic detoxification system and gut microbiota of the host contribute to resistance. In this study, we used a resistant strain (CR) with a 71.85-fold resistance ratio after 10 generations of CAP selection. The molecular and microbial changes associated with CAP resistance in S. frugiperda were systematically analyzed by integrating phenotypic and multi-omics data. Results demonstrated that detoxification enzyme activities were markedly increased in the CR strain. Host-mediated metabolic pathways driven by Cytochrome P450 and glutathione S-transferase were significantly upregulated. Furthermore, transcriptome evidence indicated that CAP-induced calcium dysregulation was mitigated via enhanced calcium sequestration and endoplasmic reticulum chaperone responses, suggesting physiological tolerance of insects to this insecticide.. Continuous CAP stress also significantly reshaped the gut microbial community structure of S. frugiperda, with Enterococcus emerging as the dominant genus. According to metagenomic annotation, the gut microbiome was enriched in candidate genes associated with CAP degradation, including dehalogenases and amidases, that could potentially break the chemical bonds in CAP and thereby contribute to resistance. Enterococcus mundtii was the most prominently contributor in terms of gene abundance. Phylogenetic analysis revealed sequence similarities and conserved domains between candidate microbial degradation genes and host metabolic detoxification genes, suggesting potential functional similarity. The integrative analyses suggested that S. frugiperda resistance may arise from correlated changes in host endogenous metabolism, calcium homeostasis, and gut-microbiota-mediated degradation potential. The gut microbiota may form a coordinated adaptive regulatory system by encoding candidate degrading enzymes and exhibiting correlative coupling with host genes, which requires further functional validation. These findings highlight the potential synergy between host detoxification and gut microbiota as a contributing factor to CAP resistance in S. frugiperda.", "zh_summary": "本研究探討秋行軍蟲（Spodoptera frugiperda）對殺蟲劑氯蟲苯甲醯胺（CAP）的抗藥性機制。研究透過對比抗性品系與敏感品系，發現抗性機制涉及宿主內源性代謝的強化，特別是細胞色素 P450 與穀胱甘肽 S-轉移酶活性的顯著提升，以及透過內質網分子伴侶反應緩解鈣離子失調。此外，宏基因組分析顯示，長期藥物壓力重塑了腸道微生物群落，使腸球菌（Enterococcus）成為優勢菌屬，其攜帶的去鹵素酶與醯胺酶基因具備降解 CAP 的潛力。研究結論指出，秋行軍蟲的抗藥性源於宿主代謝調控與腸道菌群降解能力的協同作用，這種宿主-微生物間的適應性機制為害蟲防治策略提供了新的科學依據。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42710654/"}, {"pmid": "42710694", "title": "Gut microbiota correlating with glycerophospholipid metabolism dysregulation is associated with brain functional alterations in adolescent depression.", "journal": "Brain, behavior, and immunity", "impact_factor": "N/A", "tech_types": "metagenomics, metabolomics", "sample_size": "250 位受試者（160 位憂鬱症青少年與 90 位健康對照組）", "country": "China", "has_fulltext": false, "abstract": "Gut microbiota dysbiosis has been linked to depression; however, evidence regarding this association in adolescents remains scarce, and the underlying molecular and neuropathological mechanisms are poorly understood. We conducted an integrative multi-omics study combining fecal metagenomic sequencing, serum untargeted metabolomics, resting-state fMRI, and spatial brain transcriptomics in 160 adolescents with depression (PT) recruited from multicenter cohort and 90 local healthy controls (HC) during the same period. Multimodal neuroimaging assessed spontaneous activity, functional connectivity, and structure-function coupling. Cross-omics association, mediation analyses, and machine learning were applied to identify mechanistic pathways and robust biomarkers. Adolescents with depression exhibited distinct gut microbial dysbiosis and pronounced disruption of glycerophospholipid metabolism. Multiple phospholipids and their metabolites were significantly altered and closely associated with differential microbial taxa. Neuroimaging revealed abnormal functional reorganization and regional structure-function decoupling, prominently involving the precuneus and precentral gyrus. Transcriptomic mapping demonstrated that brain regions showing the greatest functional alterations were enriched for genes related to phospholipid metabolism. Mediation analyses indicated that gut microbiota may influence depressive symptoms through glycerophospholipid metabolites and precentral gyrus dysfunction. A cross-validated multi-omics biomarker panel showed strong predictive performance for identifying patients with depression. These findings suggested glycerophospholipid metabolism may be as a key molecular interface linking gut microbial dysbiosis to brain network dysfunction in adolescents with depression, providing a multiscale framework for microbiota-informed stratification and prevention.", "zh_summary": "本研究透過整合宏基因組學、非標靶代謝組學、靜息態 fMRI 及空間腦轉錄組學，探討青少年憂鬱症（PT）患者腸道菌相與腦部功能異常的關聯。研究發現，患者腸道菌相失調與甘油磷脂代謝異常密切相關，且多種磷脂類代謝物出現顯著改變。神經影像分析顯示，患者存在顯著的腦功能重組及結構與功能解耦現象，特別集中於楔前葉與中央前回，且這些區域富含與磷脂代謝相關的基因表現。中介分析證實，腸道菌群可能透過甘油磷脂代謝物影響中央前回功能，進而導致憂鬱症狀。本研究建立的多體學生物標記組合展現了優異的預測能力，揭示了甘油磷脂代謝作為連接「腸-腦軸」的核心分子介面，為青少年憂鬱症的精準分層治療與預防提供了科學基礎。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42710694/"}, {"pmid": "42706715", "title": "Benchmarking of Reference-Based Tools for Strain-Level Resolution of Plant Microbiome.", "journal": "Molecular ecology resources", "impact_factor": "5.5", "tech_types": "metagenomics", "sample_size": "未提及（該研究採用合成數據集與現有真實宏基因體數據集進行基準測試，未明列具體樣本數）", "country": "India", "has_fulltext": false, "abstract": "Strain-level identification of each microbe is crucial for understanding its role in the host. Most of the existing tools have primarily been evaluated on human metagenomic datasets, whereas the plant microbiome exhibits greater diversity and complexity and thus poses a challenge in the strain-level resolution of individual microbes. In this study, we conducted a comprehensive benchmarking of available reference-based tools for strain-level resolution of the plant microbiome. We evaluated seven tools on various performance parameters, like computational requirements, F1-score and relative abundances using synthetic datasets comprising microbes known to have strong associations with plants as well as real plant microbiome datasets. Our results demonstrated a better performance of StrainScan on the synthetic data, achieving higher F1-score and more accurate relative abundance estimates as compared to other tools, but its performance declined gradually with increasing strain diversity. However, StrainGE and StrainScan exhibited competitive performance on real plant metagenome data. Overall, though StrainGE exhibited better performance, it was more computationally expensive. However, StrainScan performed better in detecting low-abundance strains. Our findings suggest the comparative suitability of the available tools for the strain-level analysis of plant metagenome data and highlight the need for the development of more efficient and accurate taxonomic classifiers capable of handling the complex plant metagenome data while maintaining computational efficiency.", "zh_summary": "本研究旨在針對植物微生物組進行基準測試，探討各類基於參考序列的分析工具在解析菌株層級（Strain-level）多樣性時的效能。由於植物微生物組的複雜度遠高於人體，現有工具在應用時面臨挑戰。研究評估了七款工具在計算需求、F1分數及相對豐度估算上的表現。結果顯示，StrainScan 在合成數據集中表現優異，但在高菌株多樣性樣本中效能下降；而 StrainGE 與 StrainScan 在真實植物宏基因體數據中均具競爭力。儘管 StrainGE 準確度較高，但其計算成本較大；StrainScan 則在檢測低豐度菌株方面更具優勢。此研究為植物微生物組分析提供了重要的技術評估指標，並強調未來需開發兼具高效能與精準度的演算法，以應對植物微生物組數據的複雜性。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42706715/"}, {"pmid": "42708973", "title": "Malassezia May Contribute to Basal Cell Carcinoma Development via Inflammatory and Oxidative Stress Pathways.", "journal": "MicrobiologyOpen", "impact_factor": "4.6", "tech_types": "metagenomics", "sample_size": "3 對新鮮腫瘤與周邊組織（以及 FFPE 檢體數量於摘要中未明確標示具體個數）", "country": "China", "has_fulltext": false, "abstract": "Basal cell carcinoma (BCC) is the most common malignant skin tumor. Skin-resident lipophilic Malassezia yeasts are associated with various cutaneous disorders, while their correlative patterns and potential biological effects in BCC tissues remain insufficiently defined. We used RT-qPCR screening of archived FFPE BCC specimens and metagenomic sequencing of three paired fresh tumor and peritumoral tissues to characterize tissue-associated Malassezia colonization. M. globosa was the most abundant species in FFPE samples and was also detectable in fresh tissues. In vitro functional assays (CCK-8, EdU) in HaCaT keratinocytes and A-431 epidermoid carcinoma cells showed that 12 h stimulation with optimal concentrations of M. globosa (1.2 × 107 CFU/mL) and M. yamatoensis (1.6 × 107 CFU/mL) significantly promoted epithelial cell proliferation. Transcriptome sequencing and subsequent RT-qPCR validation further showed that both strains significantly upregulate pro-inflammatory genes (IL-1β, IL-6, TNF-α) and oxidative stress-related genes (SOD1, SOD2) in these cell lines. Collectively, our findings describe a correlative association between Malassezia colonization and BCC lesions and offer preliminary in vitro mechanistic clues.", "zh_summary": "本研究旨在探討基底細胞癌（BCC）與皮膚共生真菌「馬拉色菌屬（Malassezia）」之間的關聯。研究透過宏基因組定序與 RT-qPCR 分析發現，BCC 組織中存在馬拉色菌定植，其中以球形馬拉色菌（*M. globosa*）為優勢菌種。細胞實驗證實，球形馬拉色菌與大和馬拉色菌（*M. yamatoensis*）能顯著促進角質細胞與上皮癌細胞的增殖。機制分析顯示，這些菌株能活化促發炎因子（IL-1β, IL-6, TNF-α）及氧化壓力相關基因（SOD1, SOD2）的表現。本研究初步揭示了馬拉色菌可能透過誘發發炎與氧化壓力反應，在基底細胞癌的病程發展中扮演潛在的致病角色，為皮膚真菌微生物群與皮膚腫瘤發病機制提供了新的科學見解。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42708973/"}, {"pmid": "42708586", "title": "Genome mining of alkaliphilic cyanobacterial consortia: identification of biosynthetic gene clusters in Sodalinema and associated heterotrophs.", "journal": "Applied and environmental microbiology", "impact_factor": "3.7", "tech_types": "metagenomics, metatranscriptomics", "sample_size": "3 個藍綠菌群落（consortia）", "country": "Canada", "has_fulltext": false, "abstract": "Alkaline soda lakes are high-pH environments that host specialized microbial communities with potential for biotechnology and natural product discovery. We characterized three Sodalinema-dominated cyanobacterial consortia enriched from Canadian soda lakes over 510 days. Using hybrid metagenomic sequencing and metatranscriptomics across pH, alkalinity, and temperature gradients, we reconstructed high-quality metagenome-assembled genomes and assessed functional activity. All consortia converged toward cyanobacteria dominance and exhibited temperature optima between 21°C and 30°C. Phylogenetic analysis placed Sodalinema genomes within a distinct clade affiliated with Candidatus Sodalinema alkaliphilum. Genomic analysis indicated complete biosynthetic pathways for vitamin B5, vitamin B7, and the molybdenum cofactor, but incomplete pathways for vitamins B1, B9, and B12, consistent with patterns observed in Sodalinema yuhuli. Metatranscriptomic profiles showed increased expression of genes involved in phycocyanin and carotenoid biosynthesis at pH 10.2 relative to pH 8.5. Biosynthetic gene cluster analysis revealed that most secondary metabolic potential resided in heterotrophic community members. Roseinatronobacter encoded pathways for N-acyl homoserine lactones, osmoprotectants, betalactones, and prodigiosin, while Alkalimonas, Wenzhouxiangella, and members of the Kiloniellales encoded clusters for lanthipeptides, cyclodipeptides, hydrogen cyanide, and pyrroloquinoline quinone. These findings indicate functional partitioning within the consortia and highlight the contribution of heterotrophs to secondary metabolism.IMPORTANCEAlkaline soda lakes contain microbial communities adapted to high pH that remain underexplored for biotechnology. This study focuses on Sodalinema, a filamentous cyanobacterium that dominates enriched consortia from Canadian soda lakes, and its associated heterotrophic partners. We show that while Sodalinema drives primary productivity, heterotrophic bacteria encode most of the pathways for antimicrobial and signaling compounds. These interactions may support community stability and defense against competing microorganisms. By linking genomic potential with gene expression, this work identifies alkaline cyanobacterial consortia as a source of bioactive compounds and provides a framework for exploring extremophilic microbial communities for natural product discovery.", "zh_summary": "本研究探討了來自加拿大鹼性蘇打湖的 *Sodalinema* 藍綠菌群落，透過混合宏基因體定序（metagenomics）與宏轉錄體學（metatranscriptomics）技術，分析其在不同環境梯度下的功能活性。研究發現該群落展現了明顯的功能分工：*Sodalinema* 作為主要的初級生產者，而共生的異營菌（如 *Roseinatronobacter* 和 *Alkalimonas* 等）則編碼了大部分的次級代謝生物合成基因簇（BGCs），包括抗菌物質、信號分子及滲透保護劑的生成途徑。此外，轉錄體數據揭示了藍綠菌在不同 pH 值下對色素合成基因的調控機制。本研究不僅證實了極端環境微生物群落在生物技術與天然產物開發上的巨大潛力，更強調了微生物間的交互作用對於維持群落穩定與防禦機制的重要性。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42708586/"}, {"pmid": "42708583", "title": "Genome-resolved analysis reveals disruption of gut microbial vitamin B and K2 biosynthesis during Toxoplasma gondii infection in mice.", "journal": "Microbiology spectrum", "impact_factor": "3.8", "tech_types": "metagenomics, small genome", "sample_size": "30 個小鼠模型 (急性感染、慢性感染及對照組各 n=10)", "country": "China", "has_fulltext": false, "abstract": "Toxoplasma gondii infection remodels the gut microbiome, yet its impact on microbial vitamin biosynthetic potential and host redox metabolism remains unclear. Here, we integrated mouse gut metagenomes with publicly available metagenome-assembled genomes (MAGs) to construct a genome-resolved atlas of B-vitamin and vitamin K2 biosynthesis. From 45,697 MAGs, we curated 4,771 representative genomes, of which 2,682 met high-quality criteria (completeness ≥90%, contamination <5%). Functional annotation identified 229,717 vitamin-related genes corresponding to 177 Kyoto Encyclopedia of Genes and Genomes (KEGG) orthologs across de novo pathways for eight B vitamins, thiamine (B1), riboflavin (B2), niacin (B3), pantothenate (B5), pyridoxine (B6), biotin (B7), folate (B9), cobalamin (B12), and vitamin K2. Among the high-quality genomes, 1,665 encoded complete de novo pathways for at least one vitamin, highlighting functional specialization and community-level complementarity. Transcripts per million-normalized metagenomic read counts revealed significant differences in KEGG ortholog abundances across six of the nine vitamin pathways. Reanalysis of metagenomic data from infected mice (acute, chronic, and control; n = 10 per group) revealed a stage-dependent reduction in α-diversity of vitamin biosynthesis pathways during acute infection, and a clear β-diversity separation from chronic and control groups. Core niacin biosynthesis genes (nadB, nadA, nadC) displayed phylum-specific redistribution, indicating selective remodeling of microbial NAD+ precursor production under infection-induced metabolic stress. These results suggest that T. gondii infection disrupts cooperative vitamin biosynthetic networks while specifically modulating niacin pathways linked to host NAD+ metabolism. Gut microbes can synthesize essential vitamins, but how infection alters this function is poorly understood. By integrating mouse gut metagenomes with genome-resolved microbial data, we show that Toxoplasma gondii infection reshapes the vitamin biosynthetic potential of the gut microbiome in a stage-dependent manner. Acute infection reduces the diversity of vitamin biosynthesis pathways and shifts the taxonomic distribution of key niacin biosynthesis genes involved in microbial NAD+ precursor production. These findings identify vitamin metabolism, especially niacin-related pathways, as a sensitive functional axis of microbiome remodeling during infection. Our work links microbial taxonomic changes to functional metabolic consequences and suggests that microbiome-mediated regulation of NAD+-related metabolism may contribute to host redox adaptation during T. gondii infection.", "zh_summary": "本研究旨在探討弓形蟲（Toxoplasma gondii）感染如何影響小鼠腸道微生物群合成維生素（B群及K2）的能力及其對宿主氧化還原代謝的影響。研究團隊透過整合大規模宏基因組組裝基因組（MAGs），構建了精確的維生素生物合成圖譜。研究發現，弓形蟲感染會造成階段性的腸道微生物群落重塑，特別是在急性感染期，微生物合成維生素路徑的多樣性顯著下降。關鍵發現指出，與宿主NAD+代謝密切相關的菸鹼酸（Niacin）生物合成路徑在感染期間發生了顯著的分類群重組。此研究揭示了病原體感染如何透過改變微生物的代謝功能，影響腸道內維生素合成網絡，並暗示微生物介導的NAD+代謝調節可能是宿主應對感染時氧化還原適應的重要機制。這些發現為理解感染引發的微生物組功能性失調及其臨床意義提供了新視角。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42708583/"}, {"pmid": "42708950", "title": "Soil Type Governs the Degradation Dynamics and Microbial Assimilation of Biodegradable Plastic Polybutylene Adipate Terephthalate.", "journal": "Environmental science & technology", "impact_factor": "11.3", "tech_types": "metagenomics, others (微生物群落分析與菌株分離)", "sample_size": "10 個農業土壤樣本", "country": "China", "has_fulltext": false, "abstract": "Biodegradable plastics like polybutylene adipate terephthalate (PBAT) are increasingly marketed as alternatives to conventional plastics, yet how soil properties regulate degradation kinetics, how intact films and microplastic fragments differentially affect microbial communities, and which metabolic pathways and functional genes govern mineralization remain unclear. The present study investigated PBAT degradation mechanisms in 10 distinct agricultural soils by integrating metagenomics, microbial community analysis, and strain isolation. The results revealed that the environmental fate of PBAT is critically modulated by soil properties. Neutral-alkaline powdery loam soils exhibited the highest degradation efficiency. Soil physicochemical properties indirectly modulate PBAT weight loss by altering the gene abundance of hydrolases and aromatic-degrading enzymes, with soil nitrogen content serving as a key regulatory factor. Metagenomic correlation analysis suggests that PBAT degradation is associated with specific microbial consortia, including Hydrogenophaga and Ascomycota fungi. Microplastic particles of PBAT induced greater disturbances than intact films, as evidenced by significant reductions in microbial diversity, altered community structure, and shifts in functional gene composition. A complete degradation pathway, including initial polymer cleavage followed by terephthalic acid assimilation via the β-ketoadipate pathway, was elucidated. These results provide mechanistic insights into soil-specific PBAT degradation and facilitate risk assessment and sustainable management of biodegradable plastics.", "zh_summary": "本研究探討可生物降解塑膠 PBAT 在 10 種不同農業土壤中的降解動力學與微生物機制。研究發現，土壤屬性（特別是中鹼性粉壤土）對降解效率影響顯著，土壤氮含量為關鍵調控因子。宏基因體分析顯示，PBAT 降解與特定微生物群落（如氫氧化菌屬 *Hydrogenophaga* 與子囊菌門真菌）密切相關，且微塑膠碎片對微生物多樣性的干擾大於完整薄膜。本研究成功解析 PBAT 的降解途徑，證實其經由水解酶切斷聚合物後，透過 β-酮己二酸途徑代謝對苯二甲酸。研究結果提供了土壤特異性降解的機制見解，對評估生物降解塑膠的環境風險與永續管理具重要科學意義。", "date": "2026-09-08", "url": "https://pubmed.ncbi.nlm.nih.gov/42708950/"}, {"pmid": "42709542", "title": "Species and strain sharing in the vaginal microbiome of mothers and their adult daughters.", "journal": "Cell reports", "impact_factor": "6.9", "tech_types": "16S, metagenomics, small genome", "sample_size": "未提及（僅提到參與 Isala 計畫，未明確列出母女對數）", "country": "Belgium", "has_fulltext": false, "abstract": "The vaginal microbiome is key for women's health. However, its establishment, interindividual variation and dynamics remain poorly understood. Here, we investigate bacterial relatedness at species and strain level in adult mother-daughter pairs from the large-scale citizen-science program Isala. Using metagenomic sequencing with quality control including 16S rRNA profile comparison, along with targeted culturing, we assess intergenerational microbiome sharing. At species level, daughters' vaginal microbiomes are significantly more similar to their mothers' than to those of unrelated mothers, with a strong mother-daughter correlation in Lactobacillus crispatus dominance. Strain-level analyses of metagenomes and isolate genomes reveal intraspecies diversity in L. crispatus, with up to two strains observed within the same host, and support intergenerational vaginal bacteria sharing. SNV counts in shared L. crispatus strains show no correlation with daughters' ages. Together, these findings suggest that maternal transmission, host factors, and (shared) environment collectively shape the vaginal microbiome, providing fundamental ecological insights into vaginal microbiome dynamics and perspectives toward lactobacilli-based applications.", "zh_summary": "本研究探討母女間陰道微生物群落的物種與菌株傳遞機制。透過「Isala」公民科學計畫，研究人員對母女配對進行宏基因體定序及目標菌株培養，比較其陰道菌叢的相似度。研究發現，在物種層級上，女兒的陰道微生物群落與母親的相似度顯著高於非親緣關係者，特別是在核心菌種《捲曲乳酸桿菌》(Lactobacillus crispatus) 的優勢表現上具顯著相關性。在菌株層級的分析中，研究證實了母系傳播的存在，並揭示了宿主內部存在多種菌株共存的現象。這些發現不僅闡明了母體傳遞、宿主因子與環境共同形塑陰道微生物群落的生態機制，更為未來開發基於乳酸桿菌的婦科益生菌治療與預防應用提供了科學基礎。", "date": "2026-09-07", "url": "https://pubmed.ncbi.nlm.nih.gov/42709542/"}, {"pmid": "42707924", "title": "Prognosis of Patients Infected With Talaromyces marneffei Across Various Risk Factors.", "journal": "Journal of general and family medicine", "impact_factor": "2.3", "tech_types": "metagenomics", "sample_size": "218 例馬爾尼菲藍狀菌病（talaromycosis）病例", "country": "China", "has_fulltext": false, "abstract": "Talaromyces marneffei (TM) is an opportunistic infectious fungus, and more patients in HIV-negative populations are infected with TM. We reviewed the adult patients with TM infections (TMIs) between November 1, 2020 and April 30, 2025. This single-center retrospective study was conducted at a tertiary care hospital located in an urban area, eastern China. Patients with TMI were divided into the following four groups: the HIV group, the non-HIV with solid organ transplant (SOT) group, the non-HIV with stem cell transplantation (SCT) group, and the non-HIV with other factors group. There were a total of 218 cases of talaromycosis: 165 in the HIV group, 16 in the non-HIV with SOT group, 4 in the non-HIV with SCT group, and 33 in the non-HIV with other factors group. The number (proportion) of patients diagnosed through metagenomic next-generation sequencing (mNGS) in the four groups was as follows: 51 (30.9%), 11 (68.8%), 2 (50.0%), and 25 (75.8%), respectively. The number (proportion) of patients who tested positive in both culture and mNGS was as follows: 19 (11.5%), 1 (6.3%), 0 (0.0%), and 1 (3.0%), respectively. Kaplan-Meier estimates indicated that the patients in the non-HIV with SCT group had the worst prognosis and those in the non-HIV with other factors group had poorer prognosis than the patients in the HIV group. TMI in patients who are HIV-negative without SOT may have poorer prognosis. If talaromycosis is suspected, mNGS can be an important supplementary tool for confirming TMI.", "zh_summary": "本研究旨在探討不同風險因子下，馬爾尼菲藍狀菌（*Talaromyces marneffei*, TM）感染患者的預後差異。透過分析 218 例臨床病例，研究發現除 HIV 陽性患者外，非 HIV 感染族群（如器官移植或造血幹細胞移植患者）的感染比例顯著增加。研究結果顯示，造血幹細胞移植（SCT）組的預後最差，且非 HIV 感染者整體的預後較 HIV 組更差。在診斷技術上，宏基因組次世代定序（mNGS）展現了重要價值，特別是在非 HIV 族群中具有極高的檢出率。本研究強調，對於臨床疑似馬爾尼菲藍狀菌感染的患者，mNGS 可作為傳統培養法的關鍵輔助診斷工具，有助於早期診斷並改善高風險族群的預後。", "date": "2026-09-07", "url": "https://pubmed.ncbi.nlm.nih.gov/42707924/"}, {"pmid": "42705487", "title": "Ethanol pretreatment drives microbial community adaptation to overcome acidification in high-solid anaerobic digestion of food waste under rapid organic loading shock.", "journal": "Bioresource technology", "impact_factor": "9.0", "tech_types": "metagenomics, small genome", "sample_size": "未提及（僅說明使用了半連續反應器進行對照組與實驗組比較，未明確列出具體檢體數量）", "country": "China", "has_fulltext": false, "abstract": "This study investigated how ethanol pretreatment (EP) enhances the resilience of high-solid anaerobic digestion against rapid organic loading shocks. Semi-continuous reactors fed with either untreated or EP-treated food waste were compared, and the underlying mechanisms were elucidated by integrating thermodynamic calculations with metagenomic analyses. At an organic loading rate of 6.0 g VS/(Lˑd), the control group (untreated) collapsed due to the accumulation of propionate and other longer-chain volatile fatty acids (VFAs), resulting in a methane yield decrease exceeding 70%. In contrast, the EP group maintained stability, exhibiting a methane yield decrease of less than 5%, with VFAs dominated by readily degradable acetate. Thermodynamic analysis confirmed that EP significantly lowered the energy barriers for VFA degradation. Metagenomic analysis revealed that both propionate/butyrate activation pathways (with lower energy cost or independence from acetyl-CoA) and syntrophic acetate oxidation were activated in the EP group, thereby avoiding the VFA metabolic stress observed in the control group. Furthermore, higher abundances of conductive type IV pili genes, Complex II, and archaeal V/A-type ATPase were detected in the EP group, suggesting the establishment of direct interspecies electron transfer and enhanced electron flux and energy capture efficiency. Moreover, under high loading conditions, only a few high-abundance metagenome-assembled genomes (MAGs) were detected in the control group, while multiple MAGs carrying identical VFA-degrading enzyme systems were identified in the EP group. The functionally redundant microbiota, unobstructed VFA metabolic pathways, and efficient electron transfer and energy supply collectively sustained the stability of the EP group under loading shocks.", "zh_summary": "本研究探討乙醇預處理（EP）如何提升高固體厭氧消化系統在面對快速有機負荷衝擊時的穩定性。研究發現，未經處理的對照組因丙酸及其他長鏈揮發性脂肪酸（VFA）累積而導致系統崩潰，甲烷產量大幅下降；反之，EP組則展現高度穩定性。透過總體基因體學分析顯示，乙醇預處理降低了VFA降解的能量壁壘，並活化了丙酸/丁酸活化路徑及共營產乙酸氧化作用。此外，EP組表現出更豐富的直接種間電子傳遞基因及與能量代謝相關的酶系統，且擁有功能高度冗餘的微生物菌群（MAGs）。這些機制共同確保了系統在極端負荷衝擊下，仍能有效代謝VFA並維持高效的產甲烷效率，為高固體食物廢棄物處理提供了重要的科學依據與優化策略。", "date": "2026-09-07", "url": "https://pubmed.ncbi.nlm.nih.gov/42705487/"}, {"pmid": "42705234", "title": "ON-Time enables rapid microbiome sequencing and analysis for precision medicine.", "journal": "Cell reports methods", "impact_factor": "4.5", "tech_types": "metagenomics", "sample_size": "未提及", "country": "Canada", "has_fulltext": false, "abstract": "Clinical application of microbiome-guided therapies in the intensive care unit (ICU) requires a method to rapidly analyze patient microbiomes to guide urgent treatment decisions. Conventional microbiome sequencing and analysis methods require long turnaround times, methodological complexity, and high costs that are barriers to clinical application. Here, we describe a method for rapid (<5 h turnaround from sample to results) and accurate metagenomic sequencing and taxonomic analysis of microbiomes in individual patient fecal samples, called ON-Time. ON-Time uses a simplified and rapid wet-lab workflow coupled with point-and-click data analysis. Accuracy and precision of ON-Time data were validated using defined mock microbial communities and head-to-head comparison with conventional shotgun metagenomics of ICU patient samples. Key limitations include stochastic identification of functional genes such as antimicrobial resistance and virulence factors. Taken together, ON-Time offers a rapid, accurate, and cost-effective method to analyze individual patient samples for clinically actionable microbiome features to guide personalized therapeutics.", "zh_summary": "本研究開發了一項名為「ON-Time」的新型宏基因組定序與分析技術，旨在解決加護病房（ICU）中微生物體導向治療因傳統檢測耗時而受限的問題。ON-Time 透過簡化的實驗流程與自動化數據分析，成功將從樣本處理到獲得分析結果的時間縮短至 5 小時以內。研究團隊透過模擬微生物群落及與傳統宏基因組定序的對比，驗證了該方法的準確性與精確度。儘管該技術在抗藥性與毒力因子等功能性基因識別上仍有局限，但 ON-Time 提供了一種高效、低成本且精準的臨床工具，有助於實現即時性的微生物體精準醫療，為 ICU 患者制定個人化治療決策提供了極具價值的技術支援。", "date": "2026-09-07", "url": "https://pubmed.ncbi.nlm.nih.gov/42705234/"}, {"pmid": "42704537", "title": "Do Multi-Omics Approaches Improve the Diagnosis of Microbial Overgrowth Syndromes?", "journal": "Current gastroenterology reports", "impact_factor": "N/A", "tech_types": "metagenomics, metatranscriptomics, others (transcriptomics, proteomics)", "sample_size": "未提及", "country": "USA", "has_fulltext": false, "abstract": "This review investigates how advances in breath testing (BT), small bowel (SB) culture, metagenomics, metatranscriptomics, transcriptomics and proteomics are reshaping the definition and diagnosis of small intestinal bacterial overgrowth (SIBO). It also discusses whether SIBO should be redefined as part of a larger group of microbial overgrowth syndromes. Recent studies identify distinct hydrogen-, methane-, and hydrogen sulfide-associated overgrowth phenotypes, termed SIBO, intestinal methanogen overgrowth (IMO), and intestinal sulfide overproduction (ISO). SB sampling shows that these conditions involve different microbial patterns and functional activity, symptoms, and host responses. Quantitative shotgun metagenomics provides greater taxonomic and functional resolution than culture, while metatranscriptomics reveals active microbial pathways. On top of that, host transcriptomics and proteomics contribute to the better understanding of the predominant microbial effects in host cellular mechanisms in each of the distinct small bowel overgrowth types. SIBO has been increasingly identified as a disorder of microbial ecology and function rather than bacterial quantity alone. Integrating BT with SB sampling and multi-omics approaches may improve classification, clarify symptom mechanisms, and support a more individualized treatment, although standardized methods and further clinical validation remain necessary.", "zh_summary": "本文探討多體學（Multi-omics）技術如何重新定義小腸細菌過度增生（SIBO）的診斷架構。研究指出，SIBO 現已演變為涵蓋小腸細菌過度增生、腸道產甲烷菌過度增生（IMO）及腸道硫化氫過度產生（ISO）等組成的「微生物過度增生症候群」。傳統培養法受限，而總體基因體學（Metagenomics）提供了更高的分類解析度，總體轉錄體學（Metatranscriptomics）則揭示了菌群的活性功能。結合宿主轉錄體與蛋白質體學，研究顯示此類症候群不僅是菌量問題，更是微生物生態與功能失調。透過整合呼氣測試與多體學分析，未來有望實現更精準的臨床分類與個人化治療策略。", "date": "2026-09-07", "url": "https://pubmed.ncbi.nlm.nih.gov/42704537/"}, {"pmid": "42706609", "title": "Farming reshapes the gut resistome, virulome, and mobilome of Cervidae.", "journal": "Virulence", "impact_factor": "5.4", "tech_types": "metagenomics", "sample_size": "89個新定序糞便總體基因體與599個公開總體基因組數據集（包含285個圈養與370個野生鹿科樣本），共建構出15,494個非冗餘總體基因組組裝基因體（MAGs）", "country": "China", "has_fulltext": false, "abstract": "The rapid expansion of cervid farming raises concerns about antimicrobial resistance (AMR) dissemination, yet its impact on the Cervidae gut microbiome remains poorly characterized. We integrated 89 newly sequenced fecal metagenomes with 599 publicly available datasets, comprising 285 metagenomes from farmed cervids and 370 from wild cervids, to construct a catalog of 15,494 non-redundant metagenome-assembled genomes (MAGs) representing 2,401 species. Our analysis demonstrates that farming profoundly reshapes the gut microbiome's functional composition. Specifically, farmed cervids exhibited significantly higher relative abundance, diversity, and heterogeneity of antimicrobial resistance genes (ARGs) compared to wild counterparts. We observed a robust synergistic relationship between ARGs, virulence factor genes, and mobile genetic element (MGE)-associated genes, identifying 70 ARG-MGE combinations as evidence of potential horizontal gene transfer. Plasmid profiling further suggested that a subset of ARGs may be associated with conjugative plasmids, with plasmid-associated ARGs being significantly more abundant in farmed than in wild cervids. Virome analyses indicated that bacteriophages, particularly Siphoviridae, may serve as mobile reservoirs for ARGs. Notably, Cervidae shared 268 ARG types with humans, including 23 high-risk genes associated with resistance to clinically important antibiotics (e.g. tetX1, vanRD, and bla-CTX-M-178), with Escherichia coli as a key cross-host carrier. These findings highlight that human-impacted cervid gut microbiomes are significant environmental reservoirs of clinically relevant AMR, underscoring the necessity for enhanced antibiotic stewardship and resistance surveillance in managed wildlife within a One Health framework.", "zh_summary": "本研究旨在探討人工圈養對鹿科動物腸道微生物體、抗藥性基因（ARGs）、毒力因子及可移動遺傳元件（MGEs）的影響。研究整合分析688個糞便總體基因體，發現圈養顯著改變了菌相功能，圈養鹿隻體內的ARGs豐度、多樣性及與MGEs的協同水平顯著高於野生個體，質體與噬菌體亦扮演抗藥性傳播的媒介。值得注意的是，鹿科與人類共享268種ARG類型，包含23種高風險抗藥性基因（以大腸桿菌為主要載體）。本研究證實受人類活動影響的鹿科腸道是臨床關鍵抗藥性的重要環境儲存庫，強調在「健康一體」框架下加強野生動物抗藥性監測的必要性。", "date": "2026-09-07", "url": "https://pubmed.ncbi.nlm.nih.gov/42706609/"}, {"pmid": "42710166", "title": "Melioribacter sulfuriphilus sp. nov., facultatively anaerobic thermophilic sulfur- and thiosulfate-respiring bacterium from Karmadon hot springs of North Ossetia (Russian Federation).", "journal": "Systematic and applied microbiology", "impact_factor": "4.2", "tech_types": "16S, small genome, metagenomics", "sample_size": "2 個菌株 (OK-6-MeT 和 OK-1-Me)", "country": "Russia", "has_fulltext": false, "abstract": "Novel facultatively anaerobic moderately thermophilic bacteria, strains OK-6-MeT and OK-1-Me, were isolated from the hot springs of Karmadon (North Ossetia, Russian Federation). Gram-stain-negative, motile rods were present singly, in rosettes, and formed biofilms. Both strains grew optimally at 55 °C, pH 7.0 and did not require sodium chloride. They were chemoorganoheterotrophs, growing on mono-, di- and polysaccharides (cellulose, xylan, lichenan, xyloglucan, mannan, locust bean gum, pectin) as well as proteinaceous substrates (gelatin, casein). Growth under anaerobic conditions was observed both in the presence and absence of external electron acceptors (sulfur, thiosulfate, nitrite, arsenate, Fe-citrate, ferrihydrite). Major cellular fatty acids of both strains were iso-C15:0, anteiso-C15:0, and anteiso-C17:0. The size of the genomes were 3.3 and 3.2 Mb for strain OK-6-MeT and OK-1-Me, respectively. Genomic DNA G + C content was 37% for both strains. According to the 16S rRNA gene sequence and conserved protein sequences phylogenies, the strains represented a new species of the genus Melioribacter of family Melioribacteraceae within the class Ignavibacteria, for which the name Melioribacter sulfuriphilus sp. nov. is proposed, with type strain OK-6-MeT (= B-3972T = CGMCC 1.18264 T = BIM B-2154T = UQM 41932T). Analysis of OK-1 and OK-6 metagenomes revealed presence of various genes involved in carbon (CO2 fixation, carbohydrate hydrolysis, hydrocarbons degradation, fermentation), nitrogen (nitrate, nitrite, NO and N2O reduction) and sulfur cycles (sulfate reduction, sulfur or thiosulfate reduction, oxidation of sulfur compounds). MAGs OK-1-035 and OK-6-024 almost identical to genomes of strain OK-1-Me and OK-6-MeT presumably are integral part of these complex trophic chains.", "zh_summary": "本研究從俄羅斯北奧塞梯的卡馬頓（Karmadon）溫泉中，分離出兩種嗜熱、兼性厭氧的新型細菌菌株（OK-6-MeT 與 OK-1-Me）。透過 16S rRNA 序列分析與基因體定序，證實其屬於 Ignavibacteria 綱下 Melioribacteraceae 科的新物種，並命名為 *Melioribacter sulfuriphilus* sp. nov.。研究顯示該菌具備多樣的碳水化合物代謝能力及利用多種無機電子受體（如硫、硝酸鹽、砷酸鹽等）的能力。基因體分析揭示了其在碳、氮、硫循環中的功能潛力，強調了該物種在極端環境營養代謝鏈中的重要生態角色，並為理解熱泉微生物群落的代謝多樣性提供了新的科學依據。", "date": "2026-09-06", "url": "https://pubmed.ncbi.nlm.nih.gov/42710166/"}, {"pmid": "42710127", "title": "Microalgal-bacterial sludge enhances dimethyl phthalate (DMP) biodegradation beyond adsorption: Metabolic pathways, microbial responses, and adaptive mechanisms.", "journal": "Journal of hazardous materials", "impact_factor": "11.3", "tech_types": "metagenomics", "sample_size": "未提及", "country": "China", "has_fulltext": false, "abstract": "Phthalate acid esters (PAEs), as typical environmental endocrine disruptors, pose severe threats to ecosystems and human health due to their persistence in aquatic environments, while conventional wastewater treatment processes exhibit low removal efficiency and risk secondary pollution. This study constructed microalgal-bacterial sludge (MABS) to systematically investigate its removal efficiency and the degradation mechanisms of dimethyl phthalate (DMP). The results demonstrate that, compared to conventional activated sludge (AS), DMP MABS exhibited greater tolerance to DMP and higher DMP removal efficiency, reaching 96.9%, with biodegradation rather than adsorption becoming the dominant removal route, improved settling performance (SVI decreased to 51.19 mL/g), increased biomass, and stimulated secretion of extracellular polymeric substances (EPS, up to 40.00 mg/g VSS) to form a protective barrier against toxicity. Microbial analysis revealed that Pseudomonadota dominated the microbial community and was strongly associated with metabolic functions, while MAG-based metagenomic binning identified Burkholderiales as the largest order-level contributor to DMP-related functional genes. Integrating EPS characterization with metagenomic evidence, we further hypothesize an EPS-mediated microalgal-bacterial interaction model in which LB-EPS enriches DMP at the aggregate interface, TB-EPS stabilizes oxic-anoxic microzones, and microalgal-derived oxygen and carbon sources, signaling, chemotaxis, biofilm formation, and vitamin-associated functions collectively support bacterial DMP catabolism. Qualitatively assigned intermediates together with metagenomic annotations proposing a putative DMP biodegradation pathway involve de-esterification to monomethyl phthalate and phthalic acid (lip, gnl, and pgl, etc.), followed by aerobic dioxygenase-catalyzed or anaerobic decarboxylation to protocatechuic acid (pht3, pht4, and pht5, etc.) or benzoic acid (benA-xylX and benB-xylY), ultimately entering the tricarboxylic acid cycle (pcaG, pcaF, ligK, and galD, etc.). This technology integrates high-efficiency degradation, energy conservation, and resource recovery potential, providing theoretical and technical foundations for wastewater treatment plants to address emerging pollutants.", "zh_summary": "本研究旨在解決環境內分泌干擾物鄰苯二甲酸二甲酯（DMP）造成的汙染問題。研究團隊構建了微藻-細菌汙泥（MABS）系統，證實其對DMP的去除效率高達96.9%，且主要機制為生物降解而非吸附。MABS系統表現出優異的沈降性能與生物量，並透過分泌胞外聚合物（EPS）形成防護屏障以減輕DMP毒性。宏基因組分析顯示，Pseudomonadota菌群在代謝功能中佔主導地位，特別是Burkholderiales目提供了關鍵的降解基因。研究進一步提出了EPS介導的交互作用模型，闡明微藻與細菌如何透過微環境共享、信號傳遞與化學趨向性共同促進DMP降解，並推導了從鄰苯二甲酸酯去酯化至進入三羧酸循環的完整代謝途徑。此發現為汙水處理廠處理新興汙染物提供了理論基礎與節能環保的技術方案。", "date": "2026-09-04", "url": "https://pubmed.ncbi.nlm.nih.gov/42710127/"}, {"pmid": "42706541", "title": "Large-scale benchmarking of prokaryotic annotation tools across thousands of species.", "journal": "Genome biology", "impact_factor": "9.4", "tech_types": "small genome", "sample_size": "156,033 個基因體", "country": "Germany", "has_fulltext": false, "abstract": "Genome annotation is an important step in deriving functional meaning from prokaryotic sequencing data, yet systematic evaluations guiding tool selection are lacking. We present the first large-scale investigation of four prominent open-source annotation tools (Prokka, Bakta, EggNOG-mapper, and PGAP) across 156,033 diverse genomes. This includes Escherichia coli strains for baseline performance, thousands of archaea and bacteria genomes, as well as frameshifted and metagenome-assembled genomes. Bakta excels in annotating high-quality bacterial genomes, while PGAP was better for archaeal genomes and challenging bacterial assemblies, including metagenome-assembled, fragmented, or contaminated samples. For Gene Ontology annotation, PGAP consistently provides broader term coverage, whereas EggNOG-mapper offers more terms per feature. Our findings highlight tool-specific strengths crucial for selecting optimal solutions based on genome quality, taxonomy, and origin (e.g. MAGs). This study provides an evidence-based guide for users and informs future tool development.", "zh_summary": "本研究針對四種主要的開放原始碼原核生物基因體註解工具（Prokka、Bakta、EggNOG-mapper 與 PGAP）進行了大規模基準評估。研究人員分析了超過 15 萬個涵蓋細菌與古菌的多樣化基因體，旨在確立各工具在不同基因體品質、分類單元及來源（如組裝後的宏基因體，MAGs）下的效能表現。結果顯示，Bakta 在高品質細菌基因體註解表現優異；PGAP 則在古菌及組裝品質較差（如碎片化或受污染）的樣本中更具優勢。此外，本研究亦分析了基因本體（Gene Ontology）的註解覆蓋率差異。此成果為生物資訊研究者提供了基於實證的工具選擇指南，協助研究人員根據數據特性選擇最佳方案，並為未來基因體註解工具的開發奠定基礎。", "date": "2026-09-04", "url": "https://pubmed.ncbi.nlm.nih.gov/42706541/"}, {"pmid": "42705723", "title": "Enzyme-driven synthesis and metabolic mechanism of ferulic acid in strong-flavor Daqu: pathway elucidation and microbial drivers.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "metagenomics", "sample_size": "D0-D90 發酵過程中的多個時間點檢體（具體樣本數未提及）", "country": "China", "has_fulltext": false, "abstract": "Ferulic acid (FA) is a bioactive phenolic compound in strong-flavor Baijiu with important health functions. Its microbial synthesis and metabolic mechanisms in strong-flavor Daqu remain unclear, limiting the understanding of its production. This study explored FA synthesis and metabolic dynamics during Daqu fermentation from D0-D90 using physicochemical detection, feruloyl esterases (FAEs) activity assay, and metagenomic sequencing. Results indicated that FA content fluctuated dynamically throughout fermentation, reaching a final level of 4.39 ± 0.17 mg/kg, and FAEs activity was significantly positively correlated with FA content. Genera significantly associated with FA dynamics were identified. High-abundance genera including Lichtheimia, Saccharopolyspora, Aspergillus, Byssochlamys and Rasamsonia exhibited significantly positive correlations with FA accumulation at respective fermentation stages. This phenomenon may be attributed to their capacity to secrete FAEs, thereby promoting the release of FA. The dynamic change of free FA content was also associated with the expression of ferulic acid decarboxylase, a key enzyme potentially involved in free FA degradation. A comprehensive FA metabolic network in Daqu was constructed, including the cell wall release pathway and the shikimate biosynthesis pathway. A metabolic association model was established based on the phasic succession of fungal and bacterial communities and their coupling with FA metabolic enzyme systems, which suggested a potential division of labor. Fungi are likely to participate in free FA release through secretion of FAEs and auxiliary degrading enzymes, while bacteria may mainly participate in the metabolic turnover and consumption of free FA. This study expands the current understanding of phenolic acid metabolism in strong-flavor Daqu, and provides a theoretical basis for interpreting FA metabolic characteristics during Daqu fermentation.", "zh_summary": "本研究探討了濃香型大曲發酵過程中阿魏酸（FA）的生物合成與代謝機制。透過整合生理化檢測、阿魏酸酯酶（FAEs）活性分析與宏基因體定序，研究發現 FA 含量與 FAEs 活性呈顯著正相關。研究識別出如根毛黴屬（Lichtheimia）、糖多孢菌屬（Saccharopolyspora）及麴黴屬（Aspergillus）等關鍵微生物，這些菌屬透過分泌 FAEs 促進 FA 的釋放。此外，研究揭示了細菌在 FA 代謝消耗中的角色，並建構了包含細胞壁釋放與莽草酸合成途徑的完整代謝網絡。此研究確立了真菌負責 FA 釋放、細菌參與代謝轉換的分工模式，為優化大曲發酵工藝與提升白酒功能性成分提供了科學理論基礎。", "date": "2026-08-20", "url": "https://pubmed.ncbi.nlm.nih.gov/42705723/"}, {"pmid": "42705725", "title": "Effects of extraction methodologies on structural characterization and gut microbiota fermentation properties of Apocynum venetum polysaccharides.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "metagenomics", "sample_size": "未提及", "country": "China", "has_fulltext": false, "abstract": "Apocynum venetum L. polysaccharides are classified into neutral-to-acidic heteropolysaccharides rich in glucuronic acid, exhibiting antioxidant, immunomodulatory, and potential prebiotic activities. Different extraction methods have a significant impact on the structural characterization and biological activity of polysaccharides. This study aims to compare the structural characteristics and in vitro prebiotic activity of the Apocynum venetum L. polysaccharides BAC and CEL-U obtained via Bacillus velezensis fermentation and the combined ultrasonic-cellulase method, respectively. The results showed that BAC and CEL-U were acidic heteropolysaccharides composed of rhamnose, arabinose, galactose, glucose and galacturonic acid, and they all showed linear branching structure. Compared with CEL-U, BAC had lower molecular weight (17.51 kDa), higher uronic acid content (27.27%) and typical triple helix structure. In vitro fermentation showed that BAC can produce more propionic acid and butyric acid, maintain a lower pH, promote the proliferation of beneficial bacteria (Segatella and Prevotella), and inhibit potentially harmful bacteria. Metagenome analysis further revealed that BAC played a prebiotic role by activating specific glycosidase-mediated degradation pathways and enriching functional pathways related to carbohydrate metabolism. These findings clarify the structure-activity relationship of Apocynum venetum polysaccharide and provide a theoretical basis for its targeted application in the field of intestinal health.", "zh_summary": "本研究探討羅布麻（Apocynum venetum L.）多醣經由不同提取方式（微生物發酵法 BAC 與超音波-纖維素酶法 CEL-U）後的結構特徵及腸道益生元活性差異。結果顯示，BAC 多醣具有較低的分子量與較高的糖醛酸含量，且呈現三股螺旋結構。體外發酵實驗證實，BAC 能顯著促進腸道益生菌（如 Segatella 與 Prevotella）增殖並增加丙酸、丁酸的產量。宏基因組（Metagenome）分析進一步揭示，BAC 主要透過活化特異性醣苷酶降解路徑及豐富碳水化合物代謝功能基因，發揮其調節腸道菌群的益生元功能。此研究釐清了羅布麻多醣的結構與功能關係，為其在腸道健康領域的開發與應用提供了理論依據。", "date": "2026-08-18", "url": "https://pubmed.ncbi.nlm.nih.gov/42705725/"}, {"pmid": "42705715", "title": "Integrated electronic nose, GC-MS, and metagenomic analyses reveal volatile flavor and microbial community differences in heap-fermented grains of Jiangxiangxing Baijiu across different fermentation degrees.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "metagenomics, metabolomics", "sample_size": "未提及（摘要中僅提及分析了不同發酵程度的樣品，未具體標註檢體總數）", "country": "China", "has_fulltext": false, "abstract": "The fermentation degree of heap-fermented grains in Jiangxiangxing Baijiu production is a critical factor influencing base Baijiu quality. However, conventional assessment methods largely rely on empirical experience and therefore suffer from limited objectivity and accuracy. In this study, integrated volatile profiling and metagenomic approaches were employed to investigate volatile characteristics and microbial functional potential differentiation in fermented grains with different fermentation degrees (under-fermented, normally fermented, and over-fermented). Significant differences in physicochemical properties were observed among fermentation degrees, particularly in acidity and reducing sugar content. Electronic nose analysis revealed distinct sensor response patterns among different fermentation degrees, indicating differences in overall volatile odor fingerprint patterns. A total of 81 volatile compounds were identified by HS-SPME-GC-MS, with aldehydes, ketones, and pyrazines showing pronounced variations among fermentation degrees, and acetaldehyde exhibiting strong discriminatory potential. LEfSe analysis identified 18 microbial taxa as potential biomarkers associated with different fermentation degrees, including Pichia kudriavzevii, Lentibacillus daiqui, and Acetobacter pasteurianus. Correlation analysis revealed significant positive associations between acetaldehyde levels and Acetobacter abundance. Furthermore, KEGG, CAZy, and eggNOG analyses revealed differentiated functional potentials among fermentation degrees, providing insights into the potential metabolic basis associated with flavor differentiation. Overall, these findings highlight that fermentation degree differentiation is closely associated with coordinated changes in physicochemical conditions, microbial communities, and functional potentials, providing ecological insights into flavor differentiation and theoretical support for objective fermentation degree evaluation and quality control of Jiangxiangxing Baijiu production.", "zh_summary": "本研究針對醬香型白酒堆積發酵過程中，發酵程度（欠發酵、適度發酵、過發酵）對酒醅品質的影響進行探討。研究結合電子鼻（E-nose）、氣相層析質譜儀（GC-MS）及宏基因組學技術，系統性分析了不同發酵程度下的揮發性香氣成分與微生物群落結構。結果顯示，酸度與還原糖含量在不同發酵程度間存在顯著差異，共鑑定出81種揮發性化合物。透過生物標記分析，研究識別出如皮氏畢赤酵母（*Pichia kudriavzevii*）及巴斯德醋桿菌（*Acetobacter pasteurianus*）等關鍵菌種，並揭示了乙醛與醋桿菌豐度間的強相關性。此外，功能基因組分析（KEGG、CAZy等）解析了微生物代謝與風味形成的內在機制。本研究不僅闡明了微生物與理化指標的協同變化對白酒品質的影響，亦為白酒工業的發酵品質控制與客觀評估提供了科學理論基礎。", "date": "2026-08-17", "url": "https://pubmed.ncbi.nlm.nih.gov/42705715/"}, {"pmid": "42705761", "title": "Spatially resolved multi-omics analysis of indigenous Bacillus-fortified high-temperature Daqu.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metagenomics, metabolomics", "sample_size": "4 種處理組（CK, QH4, QH5, QH6）x 3 個層級（上、中、下層）共 12 組樣本", "country": "China", "has_fulltext": false, "abstract": "Layer-dependent patterns associated with indigenous Bacillus fortification on high-temperature Daqu remain unclear. Here, six indigenous functional Bacillus strains were combined to fortify Daqu at three inoculation levels (QH4, QH5, QH6), with non-fortified as the control (CK). Upper, middle, and lower shelf-layer samples were profiled by physicochemical measurements, volatilomics, organic acid analysis, untargeted metabolomics, 16S/ITS amplicon sequencing, and metagenomics. PERMANOVA showed significant effects of treatment, spatial layer, and their interaction on physicochemical, volatile, bacterial, and fungal profiles (P = 0.001). Among the three inoculation levels, QH5 showed the most balanced performance: QH5_M exhibited the highest observed mean peak temperature (63.3 °C; +4.5 °C relative to CK_M), and its group-mean temperature remained ≥ 60 °C for seven consecutive days. Multi-omics analyses indicated coordinated, non-linear, and layer-dependent differences associated with indigenous Bacillus fortification, with QH5_M showing the most pronounced combined thermal, pyrazine, substrate, microbial, and predicted functional profile. These findings indicate that moderate indigenous Bacillus fortification was associated with distinct layer-dependent thermal and flavor profiles and coordinated microbial, metabolic, and predicted functional differences.", "zh_summary": "本研究旨在探討添加本土芽孢桿菌（Bacillus）對高溫大麴品質的影響。透過多體學方法（包括擴增子定序、總體基因體學、非標靶代謝體學及揮發物分析），研究人員分析了不同添加量與層級下的理化特性、微生物群落與風味代謝路徑。結果顯示，芽孢桿菌的添加對大麴的熱力學過程、微生物組成及風味物質（如吡嗪類）產生了顯著且具空間依賴性的影響。其中，QH5 處理組表現最為均衡，其核心層在發酵期間達到了更高的平均峰值溫度並維持高溫狀態。此研究揭示了芽孢桿菌強化發酵的協同調控機制，證明適度添加可優化微生物結構與代謝功能，為提升傳統發酵產品的品質控制提供科學依據。", "date": "2026-08-16", "url": "https://pubmed.ncbi.nlm.nih.gov/42705761/"}, {"pmid": "42705740", "title": "Intestinal content accelerates muscle protein degradation in red shrimp (Solenocera crassicornis) during refrigeration: Insights from metagenomics and metabolomics.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "metagenomics, metabolomics", "sample_size": "未提及", "country": "China", "has_fulltext": false, "abstract": "This study systematically explored the effects of intestinal components on muscle quality deterioration and protein degradation of red shrimp during refrigerated storage. The results demonstrated that refrigeration induced continuous quality degradation and muscle protein breakdown in red shrimp, whereas eliminating intestinal tissues effectively retarded muscle spoilage and protein degradation, and optimized muscle texture. The intestinal microorganisms could secrete extracellular proteases to promote muscle protein degradation were primarily Vibrio, Bacillus, Pseudomonas, Photobacterium, and Shewanella. These microorganisms promote protein degradation by secreting zinc proteases, serine proteases, and aspartyl proteases. This study elucidates the molecular mechanisms of intestinal microbial metabolism influences the muscle protein degradation of red shrimp during refrigeration. The findings provide a theoretical foundation for precise regulation of intestinal-targeted microorganisms, thereby maintaining optimal quality of shrimps during refrigeration.", "zh_summary": "本研究探討冷藏期間紅管鞭蝦腸道內容物對肌肉品質劣變與蛋白質降解的影響。結果顯示，冷藏會導致蝦肉蛋白質持續分解，而去除腸道組織能有效延緩腐敗並改善質地。透過總體基因體學與代謝組學分析，發現腸道中的弧菌屬（Vibrio）、芽孢桿菌屬（Bacillus）和假單胞菌屬（Pseudomonas）等微生物，會分泌鋅蛋白酶、絲胺酸蛋白酶與天門冬胺酸蛋白酶以促進肌肉蛋白降解。此研究闡明了腸道菌群代謝影響蝦肉質量的分子機制，為冷藏期間精準調控腸道微生物、維持蝦肉品質提供了理論依據。", "date": "2026-08-14", "url": "https://pubmed.ncbi.nlm.nih.gov/42705740/"}, {"pmid": "42705742", "title": "Mechanistic insights into flavor deterioration in bitter sturgeon caviar: Evidence from lipidomics and metagenomics.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "metagenomics, metabolomics", "sample_size": "未提及", "country": "China", "has_fulltext": false, "abstract": "This study systematically compared the flavor and multi-omics differences between normal caviar and bitter caviar based on quantitative descriptive analysis (QDA), volatile compounds (VOCs) analysis, untargeted lipidomics, and metagenomics. The results showed that bitter caviar was characterized not only by increased bitterness, but also by decreased positive sensory attributes, including buttery, nutty, and marine fresh. VOCs analysis indicated that the volatile profile of bitter caviar was reorganized. Compounds such as 3-hydroxy-2-butanone, 1-octen-3-ol, and (E, Z)-2,6-nonadienal showed higher relative odor activity values (rOAVs); however, these changes did not improve its overall sensory experience. Untargeted lipidomics identified 492 differential lipids. These changes were mainly characterized by decreased PC and increased DG and LPC in bitter caviar. KEGG pathways analysis showed that these differential lipids were mainly associated with glycerophospholipid metabolism, choline metabolism in cancer, and retrograde endocannabinoid signaling. Metagenomic analysis showed that bacteria dominated the microbial community of caviar. Among them, Bacillus and Micromonospora showed relatively high abundance in the caviar microbiota. They were also closely associated with lipid metabolic changes involving PC, DG, and LPC, suggesting their potential as candidate targets for future microbiota-directed regulation of caviar quality. These findings provide new insights into the mechanisms underlying sensory deterioration and flavor formation in bitter caviar, and offer a theoretical basis for improving caviar quality in industrial production.", "zh_summary": "本研究旨在探討鱘魚魚子醬產生苦味及風味劣化的機制。研究團隊透過量化描述分析（QDA）、揮發性物質檢測（VOCs）、非標靶脂質體學及總體基因體學（Metagenomics），比較了正常魚子醬與苦味魚子醬的差異。結果顯示，苦味魚子醬不僅苦味增加，且奶油、堅果及海洋鮮味等正向風味指標顯著下降。脂質體學分析發現 492 種差異脂質，主要涉及甘油磷脂與膽鹼代謝異常。微生物組學分析指出，魚子醬中以芽孢桿菌（*Bacillus*）與小單孢菌（*Micromonospora*）為優勢菌種，且這些微生物與脂質代謝變化（如 PC、DG、LPC 的變動）具有高度相關性。本研究揭示了微生物群落對魚子醬風味形成與劣化的關鍵調控作用，為改善產業生產中的產品品質提供了重要的理論依據與微生物標靶方向。", "date": "2026-08-14", "url": "https://pubmed.ncbi.nlm.nih.gov/42705742/"}, {"pmid": "42705727", "title": "Depth-dependent microbial succession and interspecies hydrogen transfer drive pit mud maturation in Chinese strong-flavor baijiu fermentation.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "16S, metagenomics", "sample_size": "未提及", "country": "China", "has_fulltext": false, "abstract": "Microbial communities in fermentation pit mud play a key role in determining the quality of Chinese strong-flavor baijiu (CSFB). However, the ecological processes underlying pit mud maturation across spatial and temporal scales remain unclear. In this study, amplicon sequencing and metagenomic analyses were employed to investigate the taxonomic succession, community assembly, and metabolic functions of bacterial and archaeal communities during the transition from fresh pit mud (FPM) to new pit mud (NPM) and old pit mud (OPM). A pronounced depth-dependent succession pattern was observed, with 4 cm representing a critical ecological boundary separating distinct community structures and maturation trajectories. During surface-layer maturation, community assembly shifted from stochastic to deterministic processes, accompanied by homogeneous selection and increasing network complexity. In contrast, stochastic processes remained dominant throughout deep-layer maturation. Metagenomic analyses revealed a functional transition from lactate and acetate production, primarily associated with Lactobacillus in FPM and NPM, to butyrate and caproate production associated with Clostridium and Caproiciproducens in OPM. This functional transition was accompanied by enhanced amino acid metabolism, which was associated with the enrichment of Proteiniphilum and Aminobacterium. Notably, methanogen-mediated interspecies hydrogen transfer (IHT) emerged as a key ecological feature during pit mud maturation. In OPM, IHT networks primarily involving Methanobacterium and Methanosarcina linked methanogenesis with reverse β-oxidation through diverse hydrogen-transfer pathways, reinforcing metabolic interactions underlying caproate production. These findings provide new insights into the ecological mechanisms underlying pit mud maturation and offer a theoretical basis for the directed cultivation of high-quality pit mud in CSFB production.", "zh_summary": "本研究探討中國濃香型白酒窖泥（pit mud）在發酵成熟過程中的微生物演替機制。研究發現窖泥微生物具備顯著的深度依賴演替模式，以4公分深度為臨界點，形成不同的群落結構與成熟軌跡。隨着窖泥從新泥轉向老泥，微生物群落從乳酸菌主導的代謝功能，轉向以梭菌屬（Clostridium）與己酸菌屬（Caproiciproducens）為主的丁酸與己酸生產功能。此外，研究發現甲烷菌介導的種間氫轉移（IHT）對於促進己酸合成至關重要。這些發現揭示了窖泥成熟過程中的生態裝配與功能轉變機制，為調控高品質窖泥的培育及優化白酒生產提供了重要的科學理論基礎。", "date": "2026-08-11", "url": "https://pubmed.ncbi.nlm.nih.gov/42705727/"}, {"pmid": "42705729", "title": "Phocaeicola vulgatus alleviates obesity through cross-species arginine production and hepatic retinoic acid signaling.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": "N/A", "tech_types": "metagenomics, metabolomics", "sample_size": "一個臨床隊列（含肥胖與非肥胖個體，具體人數未詳列）、人類化大鼠模型", "country": "China", "has_fulltext": false, "abstract": "Fecal microbiota transplantation (FMT) shows inconsistent clinical efficacy in treating obesity, and the specific microbial determinants dictating its success remain poorly characterized. Our previous clinical FMT trial identified Phocaeicola vulgatus as a key microbe contributing to the therapeutic efficacy of obesity treatment. Here, to investigate its role in obesity, we established an independent clinical cohort comprising obese and lean individuals, revealing that the P. vulgatus-centered network and ornithine synthesis are impaired in the obese group. We then confirmed causality by utilizing a humanized rat model carrying microbiota from a P. vulgatus-deficient obese patient, demonstrating that P. vulgatus supplementation significantly mitigates HFD-induced obesity, including reductions in body weight and serum total cholesterol levels, as well as the alleviation of hepatic steatosis. To further explore the functional mechanisms of P. vulgatus, integrated metagenomic and metabolomic analyses revealed a potential functional association between P. vulgatus and Phascolarctobacterium faecium that is associated with enhanced intestinal arginine biosynthesis and systemic availability. Furthermore, hepatic transcriptomics linked these elevated circulating arginine levels to the upregulation of retinoic acid (RA) signaling. Taken together, our findings outline a potential microbial-host network wherein P. vulgatus mitigates obesity via the arginine-RA axis, providing a valuable scientific basis for exploring this strain as a probiotic candidate for metabolic health.", "zh_summary": "本研究旨在探討腸道共生菌 *Phocaeicola vulgatus* 對肥胖的改善作用及其分子機制。研究發現，肥胖個體體內的 *P. vulgatus* 網絡及鳥胺酸合成功能顯著受損。透過人類化大鼠模型，證實補充 *P. vulgatus* 可顯著減輕高脂飲食誘導的肥胖、降低血清總膽固醇並緩解肝脂肪變性。整合宏基因體與代謝體學分析顯示，*P. vulgatus* 與 *Phascolarctobacterium faecium* 存在協同作用，能增強腸道精胺酸的生物合成。進一步的肝臟轉錄體學證實，循環中增加的精胺酸可上調肝臟視黃酸（Retinoic acid, RA）訊息傳導路徑。本研究揭示了「腸道菌-精胺酸-視黃酸」這一關鍵代謝軸，確立了 *P. vulgatus* 作為抗肥胖益生菌候選株的科學依據。", "date": "2026-08-11", "url": "https://pubmed.ncbi.nlm.nih.gov/42705729/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        let itemsPerPage = 20;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 計算目前收錄多少屬 Taiwan 的文章
            const taiwanCount = rawArticlesData.filter(art => {
                const countryStr = String(art.country || "").toLowerCase();
                return countryStr.includes("taiwan");
            }).length;
            document.getElementById("taiwan-db-count").textContent = taiwanCount;

            // 事件監聽
            document.getElementById("filter-taiwan-only").addEventListener("change", applyFilters);
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const taiwanOnly = document.getElementById("filter-taiwan-only").checked;
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // Taiwan 專屬勾選篩選
                if (taiwanOnly) {
                    const countryStr = String(art.country || "").toLowerCase();
                    if (!countryStr.includes("taiwan")) return false;
                }

                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract + (art.country || "")).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;
                const countryBadge = `<span class="badge-country">🌐 ${art.country || '未知國家'}</span>`;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${countryBadge}
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("total-pages-text").textContent = totalPages || 1;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);

            // 更新頁碼選單
            const pageSelect = document.getElementById("page-select");
            pageSelect.innerHTML = "";
            for (let i = 1; i <= totalPages; i++) {
                const opt = document.createElement("option");
                opt.value = i;
                opt.textContent = i;
                if (i === currentPage) opt.selected = true;
                pageSelect.appendChild(opt);
            }

            document.getElementById("jump-page-input").max = totalPages;
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 切換每頁筆數 (20 / 50 / 100)
        function changePageSize() {
            const select = document.getElementById("page-size-select");
            itemsPerPage = parseInt(select.value, 10);
            currentPage = 1;
            renderArticles();
        }

        // 從選單動態跳轉頁碼
        function jumpToSelectedPage() {
            const select = document.getElementById("page-select");
            currentPage = parseInt(select.value, 10);
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 輸入頁碼跳轉
        function jumpToInputPage() {
            const input = document.getElementById("jump-page-input");
            const targetPage = parseInt(input.value, 10);
            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage) || 1;

            if (targetPage >= 1 && targetPage <= totalPages) {
                currentPage = targetPage;
                renderArticles();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                alert(`請輸入有效的頁碼 (1 ~ ${totalPages})`);
            }
            input.value = "";
        }

        function resetFilters() {
            document.getElementById("filter-taiwan-only").checked = false;
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
