ayed excessive bladder inflammation, elevated placental and decidual cytokines, higher proportions of male fetuses, and lower maternal serum interleukin-10 (IL-10) compared with nonlaboring dams. Exogenous IL-10 or lymph node sequestration of T cells reduced placental type 17 T helper cells (TH17 cells) and abrogated preterm birth. In a human pregnancy cohort, we correlated urinary cytokines with birth outcomes and urine culture status. These analyses yielded an exploratory, noninvasive culture-agnostic system for evaluating preterm birth risk, implicating T cell-related cytokines including IL-10, IL-15, GM-CSF, and RANTES. These findings demonstrate that our murine model provides a platform to investigate immunological and microbial factors governing UTI-associated preterm birth and, coupled with patient samples, may be used to identify candidate biomarkers and mechanistic targets for future investigation.", "zh_summary": "本研究旨在探討孕婦尿路感染（UTI）導致早產的免疫機制。研究團隊建立尿路致病性大腸桿菌（UPEC）感染的孕鼠模型，發現發生早產的母鼠伴隨更嚴重的膀胱發炎、胎盤細胞激素升高及血清IL-10降低；給予外源性IL-10或抑制T細胞，能減少胎盤TH17細胞並預防早產。此外，人類佇列研究證實，尿液中T細胞相關細胞激素（如IL-10、IL-15等）與早產風險密切相關。本研究結合動物模型與臨床樣本，揭示了UTI引發早產的免疫關鍵，並為未來篩檢及治療提供了潛在的非侵入性生物標誌物與機制標靶。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647600/"}, {"pmid": "42647084", "title": "Diet quality, gut microbiome, and inflammatory signatures in Puerto Rican adults with Crohn disease: a multidimensional analysis.", "journal": "Inflammatory bowel diseases", "impact_factor": 4.3, "tech_types": "metagenomics", "sample_size": "60位患有克隆氏症的成年人 (60 adults with CD)", "has_fulltext": false, "abstract": "Diet is increasingly recognized as a modifiable factor influencing gut microbiome and outcomes in Crohn disease (CD), yet data in underrepresented populations remain limited. We evaluated diet quality, dietary patterns, gut microbiome composition, inflammatory markers, and patient-reported outcomes in adults with CD from Puerto Rico. We conducted a cross-sectional analysis of 60 adults with CD enrolled prior to dietary intervention in a parent study. Dietary intake was assessed using 24-hour recalls and evaluated using the Healthy Eating Index-2015 (HEI-2015), Alternative Healthy Eating Index-2010 (AHEI-2010), and exploratory dietary pattern analysis. The gut microbiome was assessed by shotgun metagenomic sequencing. Clinical outcomes included fecal calprotectin, C-reactive protein (CRP), a 96-cytokine panel, short Crohn Disease Activity Index (sCDAI), and short Inflammatory Bowel Disease Questionnaire (sIBDQ). Associations were evaluated using unadjusted and adjusted models with false discovery rate (FDR) correction. Overall diet quality was poor and characterized by low intake of fruits, vegetables, whole grains, and fiber, alongside high intake of saturated fat, added sugars, and animal-derived protein. Four dietary patterns were identified: vegetable-rich, dairy-rich, fruit-rich, and coffee/sweetener-rich. Participants adhering to the fruit-rich pattern exhibited the highest diet quality scores. Higher HEI-2015 scores were associated with greater gut microbial diversity and differences in overall microbiome composition. Participants with greater adherence to the vegetable-rich pattern showed modest increases in microbial diversity. Exploratory analyses suggested that higher fruit intake and adherence to a fruit-rich dietary pattern were associated with lower fecal calprotectin and CRP levels, whereas adherence to a vegetable-rich pattern was associated with better health-related quality of life (HRQoL) and adherence to a coffee/sweetener-rich pattern was associated with a worse symptom burden. However, no associations between dietary metrics and inflammatory markers, cytokines, or clinical outcomes remained significant after FDR correction. Most participants were in clinical remission despite substantial impairment in HRQoL. Adults with CD in Puerto Rico exhibited poor diet quality that was associated with gut microbial diversity and exploratory differences in clinical outcomes. While these findings support the influence of diet on the microbiome and clinical outcomes, larger longitudinal studies are needed to determine whether dietary improvements can influence disease outcomes this underrepresented population.", "zh_summary": "本研究探討波多黎各克隆氏症（CD）成年患者的飲食品質、腸道菌相與發炎指標的關係。研究發現，受試者普遍飲食品質不佳，而較高的飲食品質（特別是富含水果的飲食模式）與較高的腸道菌群多樣性顯著相關。探索性分析顯示，多攝取水果與較低的發炎指標（鈣衛蛋白和C反應蛋白）相關，而蔬菜為主的飲食與較佳的生活品質相關（但經FDR校正後未達顯著）。本研究首次揭示了該少數受關注族群中飲食對菌相與臨床症狀的影響，為未來透過飲食干預管理CD及改善患者預後提供了科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42647084/"}, {"pmid": "42648293", "title": "Defined human Clostridia consortia reverse colitis via dual effects of tryptophan metabolites on microbiota and immunity.", "journal": "Cell host & microbe", "impact_factor": 18.7, "tech_types": "metagenomics, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Microbial dysbiosis and disrupted mucosal immune homeostasis are integrally involved in the pathogenesis of inflammatory bowel diseases (IBDs). Live biotherapeutic products (LBPs) offer a potential therapeutic strategy to restore beneficial microbes and mitigate disease. We investigated the therapeutic efficacy of 2 LBPs, human Clostridia consortia 17-mix and 11-mix, by treating established colitis in murine models. Both LBPs exhibited therapeutic effects in T cell-mediated chronic colitis models induced by human microbiota and in pathobiont-driven gnotobiotic colitis models established with combinations of IBD-relevant human-derived strains. Metagenomic and metabolomic analyses elucidated mechanisms that go beyond established functions driven by short-chain fatty acids (SCFAs) and interleukin (IL)-10-producing regulatory T cells. Notably, LBPs exerted therapeutic effects by directly inhibiting resident pathobionts and through IL-10-independent activation of host anti-inflammatory aryl hydrocarbon receptor (AhR) pathways by bacterial tryptophan metabolites. These results elucidate SCFA- and IL-10-independent protective mechanisms exerted by defined resident bacterial strains that are depleted in IBD dysbiosis.", "zh_summary": "本研究探討了兩種由人類梭狀芽孢桿菌組成的活體生物藥物（LBP，分別為 17-mix 和 11-mix）治療小鼠結腸炎的療效與機制。研究發現，這些菌群能有效緩解小鼠的慢性與特定病原體誘導的結腸炎。宏基因組學與代謝組學分析顯示，除了傳統的短鏈脂肪酸（SCFA）和 IL-10 途徑外，LBP 還能直接抑制共生病原菌，並透過細菌色胺酸代謝物，以不依賴 IL-10 的方式激活宿主的芳香烴受體（AhR）抗炎途徑。此發現揭示了腸道有益菌保護腸道的新機制，為發炎性腸道疾病（IBD）的微生態療法提供了重要科學依據。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42648293/"}, {"pmid": "42669226", "title": "Preparation and chemical characterization of polyphenol-rich extract from Tsaoko Fructus: alleviation of ulcerative colitis in mice by modulating gut microbiota and suppressing the JNK1-cJun signaling.", "journal": "Phytomedicine : international journal of phytotherapy and phytopharmacology", "impact_factor": "N/A", "tech_types": "metagenomics, metabolomics, others", "sample_size": "未提及（僅說明使用 DSS 誘導之潰瘍性結腸炎小鼠模型）", "has_fulltext": false, "abstract": "Tsaoko Fructus, a traditional Chinese medicinal herb, has long been used to alleviate gastritis and enteritis. Nevertheless, the active constituents and underlying anti-inflammatory mechanisms remain insufficiently characterized. This study aims to optimize a polyphenol-rich fraction (3CB) from Tsaoko Fructus, evaluate its effects against ulcerative colitis (UC), and reveal the underlying mechanisms of action. The preparation of 3CB was optimized using response surface methodology (RSM), and its major constituents were identified by LC-PDA-MS analysis. A murine UC model was established by administering dextran sulfate sodium (DSS). To evaluate the effects of 3CB on UC mice, metagenomic sequencing of the intestinal microbiome and RNA sequencing of colon tissues were conducted. The anti-inflammatory activity of 3CB and its principal constituents was further verified by quantitative real-time PCR (qPCR), Enzyme linked immunosorbent assay (ELISA), Western blotting, immunohistochemical staining, and histopathological analysis. Network pharmacology, molecular docking, and surface plasmon resonance (SPR) assays were employed to elucidate the molecular mechanisms underlying the anti-inflammatory effects of 3CB. 3CB significantly alleviated UC symptoms in DSS-induced mice, reshaped the gut microbiota with reducing pathogenic Pseudomonadota and Deferribacterota while enriching beneficial Bacteroidota, and restored microbial amino sugar and nucleotide sugar metabolism pathways of intestinal flora. Additionally, 3CB preserved colonic oxidative phosphorylation, protected the mucus barrier, and suppressed inflammatory cell infiltration and the expression of cytokines. Seven major polyphenols were identified in 3CB, with epicatechin (3) and epiafzelechin (6) being the most abundant. Mechanistic investigation revealed that the anti-inflammatory effect of 3CB was partially dependent on the JNK1-modulated MAPK signaling pathway. JNK1 was identified as a direct target of 3CB, with epiafzelechin (6) exhibiting a high binding affinity (Kd = 10.4 μM). 3CB ameliorates UC potentially through modulation of gut microbiota, protection of the mucus barrier, and JNK1-targeted anti-inflammatory effects, highlighting its potential as a protective intervention for inflammatory bowel disease (IBD).", "zh_summary": "本研究旨在優化草果富含多酚成分（3CB）並探討其對DSS誘導之小鼠潰瘍性結腸炎（UC）的緩解機制。結果顯示，3CB能顯著減輕小鼠UC症狀、保護腸黏膜屏障並抑制發炎。此外，3CB顯著重塑腸道菌群，減少有害的變形菌門與脫鐵桿菌門，增加有益的擬桿菌門，並恢復其代謝途徑。化學分析鑑定出7種主要多酚，其中表阿福兒茶素（epiafzelechin）對JNK1展現高親和力。機制研究證實，3CB主要透過靶向JNK1並抑制MAPK信號通路發揮抗炎作用。本研究表明草果多酚具有作為發炎性腸道疾病保護性干預藥物的潛力。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42669226/"}, {"pmid": "42644751", "title": "Soil amelioration impacts viral ecology in saline-alkali lands.", "journal": "The ISME journal", "impact_factor": NaN, "tech_types": "metagenomics", "sample_size": "未提及（僅說明樣品來自中國4個主要鹽鹼地區，各包含「鹽鹼」與「改良後」兩種狀態之土壤）", "has_fulltext": false, "abstract": "The continuous expansion of saline-alkali lands under climate change threatens food security and reduces soil carbon stocks. A common mitigation strategy is soil amelioration, which converts degraded soils back into an arable state. Microbes play critical roles in soil health and recovery. However, the viruses that infect these microbial communities, and their potential impacts during saline-alkali soil restoration, remain largely unknown. Here, we combined total soil metagenomics and viromics to investigate host-linked viral ecology across four major saline-alkali regions in China, each encompassing two soil amelioration statuses: saline-alkali and reclaimed. We found that viral community structure was shaped by both geography and soil amelioration status, with salinity and alkalinity emerging as key environmental factors. Viral populations were sensitive to soil restoration, showing strong amelioration-status endemism with functional adaptations. Virus-host dynamics ranged from reduced temperate viruses to abundance mismatches in those infecting key carbon-cycling microorganisms, including carbohydrate degraders. 13C-cellulose DNA-SIP experiments provided further support for this mismatch by tracing assimilated carbon transfer between active host and virus populations. Compared with saline-alkali soils, the relative abundance of hosts in restored soils increased from 39.0% to 61.0%, whereas the linked viruses decreased from 60.6% to 39.4%. Together, these findings reveal an underappreciated role of viruses in shaping saline-alkali soil amelioration trajectories, and could improve management strategies for degraded land recovery and carbon storage.", "zh_summary": "本研究旨在探討鹽鹼地改良過程中，病毒對土壤微生物生態與碳循環的影響。研究結合總體基因體與病毒體學，分析中國四大鹽鹼區。結果顯示，土壤改良狀態、鹽度與鹼度是塑造病毒社群的關鍵。在改良土壤中，宿主微生物相對豐度顯著上升（39.0%至61.0%），而關聯病毒減少（60.6%至39.4%），且溫和病毒比例降低，碳循環關鍵微生物的病毒與宿主出現豐度失衡。13C-纖維素DNA-SIP實驗證實了兩者間的活性碳轉移。此發現揭示了病毒在鹽鹼地恢復中的關鍵作用，有助優化土地改良與碳儲存策略。", "date": "2026-08-26", "url": "https://pubmed.ncbi.nlm.nih.gov/42644751/"}, {"pmid": "42642836", "title": "Microbiome-mediated regulation of pathogen virulence: Molecular mechanisms and clinical implications.", "journal": "Virulence", "impact_factor": 5.4, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The human microbiome profoundly influences pathogen virulence and disease susceptibility through diverse molecular mechanisms. This review, focused on literature from 2016 to 2026, synthesizes knowledge on microbiome-mediated regulation examining major pathogens including Vibrio cholerae, enterohemorrhagic Escherichia coli, Salmonella species, Clostridioides difficile, and Staphylococcus aureus. A triangular interaction model is presented, linking host immunity, resident microbiome, and invading pathogen to frame infection outcomes. Commensal bacteria regulate pathogen behavior through quorum sensing interference, metabolite-mediated regulation via short-chain fatty acids and bile acids, competitive exclusion, immune response modulation, and direct antimicrobial production. Key species-Lactobacillus spp. Bifidobacterium spp. Bacteroides thetaiotaomicron, and Faecalibacterium prausnitzii-employ distinct molecular strategies against these pathogens. Organ-on-chip platforms and multi-omics advances reveal context-dependent interactions. Clinical applications including rationally designed probiotics, fecal microbiota transplantation, and precision microbiome engineering show promise despite challenges of inter-individual microbiome variability, representing a paradigm shift toward ecosystem-based infectious disease management.", "zh_summary": "本研究綜述了2016年至2026年間關於腸道微生物群調控病原體毒力（如霍亂弧菌、大腸桿菌、沙門氏菌等）的分子機制。作者提出了一個結合宿主免疫、共生菌群與入侵病原體的「三角交互模型」，闡述了共生菌如何透過群體感應干擾、代謝產物（如短鏈脂肪酸、膽汁酸）調節、競爭性排斥及免疫調節來抑制病原體。研究強調了乳酸桿菌、雙歧桿菌及普拉梭菌等關鍵菌種的保護機制，並探討了器官晶片與多體學技術在揭示交互作用上的貢獻。此研究主張從生態系統角度管理傳染病，指出益生菌設計、糞便菌群移植及精準微生物組工程是未來治療的關鍵方向，雖面臨個體差異挑戰，但為臨床感染控制提供了典範轉移。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642836/"}, {"pmid": "42648179", "title": "Simultaneous removal of nitrogen, Cu2+, and bisphenol A in a hydrogel-biochar-AQDS immobilized bioreactor with added bicarbonate: Performance and metagenomic insights.", "journal": "Journal of hazardous materials", "impact_factor": 11.3, "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "As the complexity of industrial wastewater pollution continues to increase, the simultaneous removal of nitrogen, metal contaminants, and persistent organic pollutants under low carbon conditions has become a key challenge for biological treatment systems. To address the operational instability and dependence on carbon sources observed in immobilized systems when exposed to copper (Cu2+) and bisphenol A (BPA), the Pseudoalteromonas japonicus strain LY0623 was integrated into a hydrogel-biochar-AQDS composite carrier to construct a multifunctional immobilized biofilm system. Notably, under conditions containing only NaHCO3, the R4 system achieved an NH4+-N removal rate of 89%. Under conditions where Cu2+ and BPA coexist, the R4 system achieved removal of NH4+-N (89%), NO3--N (100%), Cu2+ (85%), and BPA (88%). Sediment characterization confirmed that Cu2+ was immobilized through adsorption, complexation, and microbiologically induced carbonate precipitation (MICP). Metagenomic analysis further indicated that the Pseudomonadota phylum remained the dominant phylum, while functional pathways associated with inorganic carbon assimilation, HNAD nitrogen metabolism, endogenous carbon transformation, biomineralization, electron transfer, and aromatic compound degradation were preserved. By combining ammonia oxidation driven energy production, inorganic carbon utilization, redox mediated processes, and biomineralization, this study provides a highly promising low carbon strategy for treating industrial wastewater containing mixed pollutants.", "zh_summary": "本研究旨在解決低碳條件下，工業廢水中氮、重金屬（Cu2+）與雙酚A（BPA）等混合污染物難以同時高效生物降解的挑戰。研究人員將日本假交替單胞菌（*Pseudoalteromonas japonicus*）LY0623菌株整合至水凝膠-生物炭-AQDS複合載體中，構建出新型固定化生物膜系統（R4系統）。\n\n研究發現，在僅添加碳酸氫鈉（無機碳源）的條件下，該系統成功實現了NH4+-N（89%）、NO3--N（100%）、Cu2+（85%）和BPA（88%）的高效同時去除。總體基因體學分析證實，變形菌門（Pseudomonadota）為優勢菌群，且系統中與無機碳同化、異營硝化-好氧反硝化（HNAD）、生物礦化及芳香族化合物降解相關的功能通路均得到有效維持。本研究結合了氨氧化產能與生物礦化等機制，為混合污染廢水處理提供了一種具前景的低碳生物修復策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42648179/"}, {"pmid": "42642466", "title": "Empirical evidence for gut microbial influence on human brain neurochemistry via the gut-brain axis.", "journal": "Molecular psychiatry", "impact_factor": 10.1, "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "The gut microbiome produces metabolites with potential neuroactive properties, many of which act locally within the gut. While preclinical studies suggest these microbial pathways can influence cognitive and emotional processes, human evidence remains limited. This study investigates associations between gut microbiome-derived neuroactive functional potential and in vivo brain neurotransmitter concentrations in healthy young females. Using proton magnetic resonance spectroscopy (¹H-MRS), we quantified GABA and glutamate levels in the dorsolateral prefrontal cortex (dlPFC), anterior cingulate cortex (ACC), and inferior occipital gyrus (IOG). Parallel metagenomic profiling characterised microbial functional potential for pathways related to the synthesis and degradation of GABA, glutamate, short-chain fatty acids (SCFAs), p-cresol, and inositol. Region-specific associations were observed between these microbial pathways and cortical GABA and glutamate levels, including excitatory/inhibitory (E/I) balance, a key marker of neuroplasticity and mental health. Notably, microbial glutamate degradation and inositol synthesis potential were associated with IOG E/I balance, while additional pathways including GABA metabolism, p-cresol production, and SCFA synthesis showed distinct associations across regions. Exploratory analyses also identified links between microbial functional potential and anxiety, depressive symptoms, and sleep quality. Together, these findings provide new human evidence that variation in microbial functional potential corresponds with regional cortical neurochemistry and psychological wellbeing, highlighting the gut-brain axis as a promising avenue for mechanistically informed microbiome-based- interventions.", "zh_summary": "本研究旨在探討健康女性的腸道菌群功能潛力與大腦活體神經傳導物質（GABA與麩胺酸）濃度的關聯。研究結合腦部質子磁共振波譜（¹H-MRS）與總體基因體學分析，發現微生物中參與GABA、麩胺酸、短鏈脂肪酸、對甲酚及肌醇代謝的通路，與大腦特定區域（如背外側前額葉、前扣帶迴與下枕葉）的神經傳導物質水平及興奮/抑制平衡（E/I）具有區域特異性關聯。探索性分析亦顯示微生物功能與焦慮、抑鬱及睡眠品質相關。本研究為腸道菌群影響人類大腦神經化學與心理健康提供了直接的人體實證，為未來開發以微生物為基礎的腦腸軸臨床干預奠定基礎。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642466/"}, {"pmid": "42640624", "title": "Gut microbial diversity at baseline conditions the clinical, microbiome, and metabolic response to paraprobiotic Lactiplantibacillus plantarum LRCC5282 in overweight adults.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "16S, metabolomics", "sample_size": "120 位過重成人", "has_fulltext": false, "abstract": "The gut microbiota is increasingly recognized as a target for obesity management; however, whether baseline gut microbial diversity conditions responsiveness to microbiota-targeted interventions remains unclear. We aimed to investigate whether baseline gut microbial diversity is associated with responsiveness to a paraprobiotic derived from Lactiplantibacillus plantarum LRCC5282 (LP5282-P) in overweight adults. In a 12-week, randomized, double-blind, placebo-controlled, multicenter trial of 120 overweight adults, LP5282-P produced no significant between-group differences in any clinical outcome across the overall per-protocol population. However, in the low-diversity subgroup, LP5282-P was associated with significant reductions in body weight, body mass index, and circulating leptin levels. These clinical changes were accompanied by compositional shifts in the gut microbiota, including higher relative abundances of Christensenellaceae, Faecalibacterium, and Alistipes. Fecal metabolite profiles showed elevated acetate and butyrate concentrations and altered bile acid composition. Within the low-diversity subgroup, changes in the relative abundances of Akkermansia and Eubacterium were inversely correlated with changes in body weight, body fat mass, and leptin levels. In contrast, the high-diversity subgroup exhibited no consistent response across the outcome domains examined. Overall, baseline gut microbial diversity was associated with differential responsiveness to LP5282-P, supporting its potential use as a stratification variable in future microbiota-targeted intervention trials. Further studies integrating direct measures of microbial activity and host response are warranted to elucidate the biological pathways underlying this diversity-dependent responsiveness. Trial registration: Clinical Research Information Service (CRIS), KCT0008119.", "zh_summary": "本研究旨在探討基準線腸道微生物多樣性，是否會影響過重成人對副乾酪乳桿菌（LP5282-P）介入的臨床、菌群及代謝反應。在一項為期12週、納入120位過重成人的臨床試驗中，整體人群並未展現顯著差異；然而，在「低多樣性」亞群中，LP5282-P顯著降低了受試者的體重、BMI與血清瘦素水平，並促使腸道有益菌（如 *Faecalibacterium* 與 *Alistipes*）豐度上升，同時提升糞便中乙酸與丁酸濃度並改變膽汁酸組成。相反地，「高多樣性」亞群則無一致反應。此研究證實基準線菌群多樣性是預測益生菌療效的重要關鍵，可作為未來精準微生態介入與體重管理的分層依據。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640624/"}, {"pmid": "42642622", "title": "Deployable high-fidelity metagenome binning at scale with QuickBin.", "journal": "Communications biology", "impact_factor": 5.1, "tech_types": "metagenomics", "sample_size": "297 個真實總體基因體數據集 (297 real metagenomes)", "has_fulltext": false, "abstract": "Reconstructing genomes from metagenomic assemblies is foundational to microbiome research, yet binning faces a persistent trade-off between fidelity and throughput. Many high-accuracy methods rely on GPU-intensive workflows, marker-gene postprocessing, or heavy computational resources, limiting reproducible use at scale. Here, we present QuickBin, a CPU-native, marker-free binning algorithm designed to recover near-complete, ultra-low-contamination metagenome-assembled genomes (MAGs) efficiently. QuickBin pairs a GC-coverage spatial index (BinMap) with an early-exit Oracle cascade of similarity tests (scalar composition/coverage filters and SIMD-accelerated k-mer comparisons), reserving a compact neural network exclusively for ambiguous merges. Across synthetic communities, evaluated by marker-based and contig-origin ground truth, QuickBin maximizes high-fidelity sequence recovery. In benchmarking 297 diverse real metagenomes, QuickBin completed all runs, recovering more high-quality MAGs (≥95% completeness, ≤1% contamination) than resource-intensive alternatives that frequently failed. QuickBin provides a practical path to reproducible, genome-resolved metagenomics at scale for downstream comparative analyses. Open-source at: https://github.com/bbushnell/BBTools .", "zh_summary": "本研究開發了 QuickBin，這是一種無需標記基因且僅需 CPU 運行的總體基因體分箱（binning）演算法，旨在高效重建高完整度且極低污染的總體基因體組裝基因體（MAGs）。QuickBin 結合了 GC 含量與覆蓋度的空間索引及快速相似性過濾機制，僅在處理模糊合併時使用輕量級神經網路。在 297 個真實總體基因體數據集的基準測試中，QuickBin 成功完成所有運行，且重建的高品質 MAGs 數量超越了其他耗費資源或容易失敗的現有工具。此技術為大規模、可重複的基因體解析總體基因體學研究提供了實用的解決方案。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642622/"}, {"pmid": "42640100", "title": "Revisiting gut microbiota-driven ammonia metabolism: from disease burden to physiological adaptation.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Ammonia homeostasis is governed by interconnected host and microbial pathways, including hepatic ureagenesis, glutamine synthesis, and gut microbiota-mediated urea hydrolysis, proteolysis, and amino acid deamination. Ammonia has historically been viewed primarily as a nitrogenous waste product and neurotoxic molecule, a concept strongly supported by studies of hyperammonemia and hepatic encephalopathy. Impaired hepatic clearance, portosystemic shunting, and enhanced gut-derived ammonia input increase systemic ammonia burden and are linked to neurological dysfunction, muscle wasting, immune dysregulation, and progression of liver disease. In the gut lumen and mucosal environment, however, gut microbes not only generate ammonia but can also reuse ammonia-derived nitrogen for amino acid synthesis, microbial biomass formation, and community nitrogen exchange. Evidence from selected physiological and preclinical models indicates that microbiota-derived ammonia may contribute to nitrogen recycling, microbial community maintenance, enteric neural regulation, or metabolic adaptation under defined conditions. These roles are more context-specific and less broadly established than the pathological effects of systemic hyperammonemia. When epithelial barrier integrity is compromised, hepatic clearance declines, or host buffering reserves are depleted, elevated ammonia can increase epithelial exposure, portal ammonia input, or peripheral blood ammonia. Conversely, evidence that reduced microbiota-derived ammonia contributes to disease remains limited and currently comes mainly from selected animal models. This review re-examines ammonia metabolism from a gut microbiota-centered perspective. We discuss the ecological origins, spatial distribution, exposure characteristics, host-interface effects, and context-specific outcomes of microbiota-derived ammonia in physiology and disease, and discuss how ammonia should be measured, stratified, and targeted in microbial nitrogen metabolism.", "zh_summary": "本綜述重新審視了腸道菌群驅動的氨代謝，探討其從疾病負擔到生理適應的雙重角色。傳統上，氨被視為具神經毒性的代謝廢物，與高氨血症、肝性腦病及肝病惡化密切相關。然而，在腸道微環境中，微生物不僅產生氨，亦能利用氨源氮進行氨基酸合成與群落氮循環，展現出維持腸道神經與代謝適應等生理功能。文章強調，氨的病理與生理效應高度取決於上皮屏障、肝臟清除能力及宿主緩衝儲備。本研究為腸道微生物氮代謝提供了新的生態與臨床視角，並討論了未來如何精確測量及標靶氨代謝的策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42640100/"}, {"pmid": "42642834", "title": "Glycosylation in gut-brain communication: from the intestinal barrier and microbiota to immune and neural signaling.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The gut-brain axis is a complex bidirectional communication network linking the gastrointestinal tract and the central nervous system. Its dysregulation is closely associated with a wide range of gastrointestinal, metabolic, and neuropsychiatric disorders. Glycosylation, one of the most prevalent and structurally diverse post-translational modifications of proteins and lipids, is increasingly recognized as a regulator of multiple processes within the gut-brain axis. In this review, we summarize evidence that glycosylation influences several steps of gut-brain communication, including intestinal barrier function, microbial glycan metabolism, immune signaling, enteric and vagal pathways, blood-brain barrier integrity, and neural responses. We distinguish direct mechanistic findings from associative observations and discuss the more limited evidence for brain-to-gut regulation of intestinal glycosylation. In addition, we discuss the potential of glycosylation-targeted nutritional and microbiota-based interventions and highlight emerging opportunities to integrate glycomics with other omics approaches to dissect the complex regulatory networks underlying the gut-brain axis. In conclusion, elucidating how glycosylation shapes signaling along the gut-brain axis may open new avenues for understanding disease pathogenesis and for developing targeted therapeutic strategies.", "zh_summary": "本文探討「腸-腦軸線」（Gut-Brain Axis）中醣基化（Glycosylation）修飾的關鍵調節角色。醣基化作為蛋白質與脂質重要的轉譯後修飾，深刻影響腸道屏障功能、微生物聚醣代謝、免疫訊息傳遞及血腦屏障完整性。研究重點解析了醣基化如何調控腸道與中樞神經系統間的溝通，並區分了機制性證據與相關性觀察。本文不僅強調了醣基化在維繫軸線穩定中的核心地位，更提出透過營養干預與微生物調節，結合多體學（Omics）分析醣基化網絡，將有望為神經精神疾病與代謝性障礙提供創新的診斷與治療策略。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42642834/"}, {"pmid": "42641146", "title": "Engineered bacterial therapeutics from synthetic biology to clinical translation: A multi-database scientometric analysis, 2000-2026.", "journal": "Human vaccines & immunotherapeutics", "impact_factor": 3.5, "tech_types": "others", "sample_size": "1,730 篇學術文章與評論", "has_fulltext": false, "abstract": "Engineered bacterial therapeutics integrate programmable strain engineering with biomedical functions such as sensing, delivery, immune modulation, microbiome intervention, and disease management. This study conducted a multi-database bibliometric analysis to map the knowledge structure, collaboration patterns, and translational direction of this field. Bibliographic records were retrieved from Web of Science Core Collection, Scopus, and PubMed for publications from 1 January 2000 to 1 June 2026. After document-type filtering, time restriction, deduplication, language screening, and manual eligibility assessment, 1,730 English-language articles and reviews were included. CiteSpace 6.4.R1, VOSviewer 1.6.20, and the bibliometrix R package were used to analyze publication trends, collaboration networks, journal co-citation, dual-map citation trajectories, citation bursts, keyword co-occurrence, and thematic evolution. Publication output increased steadily, with faster growth after 2020; 2025 was the highest-output complete year, while 2026 represented a partial retrieval year. China and the United States were the leading contributors, although institutional collaboration remained regionally clustered. Co-citation, citation-burst, and keyword analyses showed a shift from bacterial chassis construction and circuit design toward engineered probiotics, gut microbiota-related therapy, cancer immunotherapy, drug delivery, live biotherapeutic products, and clinical translation. Persistent translational priorities include controllability, safety, manufacturing consistency, and regulatory alignment.", "zh_summary": "本研究透過文獻計量學方法，系統性分析 2000 年至 2026 年間有關「工程化細菌治療」的 1,730 篇學術文獻。研究旨在釐清該領域的知識結構、國際合作模式及臨床轉化趨勢。分析顯示，該領域自 2020 年後顯著加速發展，中國與美國為主要貢獻國。核心研究主軸已由早期的細菌底盤構建與基因電路設計，轉向工程化益生菌、癌症免疫治療、藥物遞送及活體生物藥物（LBP）的開發。科學意義在於確立了該領域從實驗室轉向臨床應用的優先議題，即解決控制力、生物安全性、生產一致性與法規調適等挑戰，為未來工程化細菌作為精準醫療工具的發展提供關鍵決策參考。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42641146/"}, {"pmid": "42635406", "title": "Separating extracellular from intracellular fecal metabolites exposes cross-feeding architecture in the gut: exploring metabolite partitioning and ecological associations.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "metagenomics, metabolomics", "sample_size": "63 個糞便檢體（來自 63 位健康受試者）", "has_fulltext": false, "abstract": "The gut microbiota forms a complex ecosystem through metabolic interdependence (cross-feeding). However, conventional fecal metabolomics typically quantifies only total metabolite pools, making it difficult to distinguish extracellular-enriched metabolite pools from predominantly cell-associated ones, and thus limiting reconstruction of in situ metabolic networks. Here, we quantified fecal metabolites in paired fractions from the same specimen: an undisrupted fraction representing the extracellular pool and a strongly bead-beaten fraction representing the total pool; the intracellular pool was defined as the difference between total and extracellular measurements. Stool samples from 63 healthy individuals were analyzed for short-chain fatty acids, polyamines, and water-soluble vitamins, and the results were integrated with shotgun metagenomic profiles of species composition and functional genes. Vitamins exhibited two distinct behaviors. Adenosylcobalamin (a vitamin B12 coenzyme) was detectable only after disruption, and together with thiamine (B1) and niacin (B3) was classified as an intracellular-retained type (Type 1). In contrast, biotin (B7) and pantothenate (B5) showed higher extracellular proportions (Type 2). Integrative analyses further indicated that Type 1 thiamine was negatively associated with Blautia, consistent with intensive microbial utilization, whereas Type 2 biotin was strongly positively associated with Alistipes, suggesting links to ecological niches shaped by luminal pH and fermentation modes (carbohydrate vs protein fermentation). Fraction-resolved quantification provides a practical operational framework to differentiate extracellular from cell-associated metabolite pools, helping reconcile metagenomic potential with metabolomic reality and enabling deeper inference of cross-feeding structure in the gut ecosystem.", "zh_summary": "本研究針對腸道微生物的代謝互營機制（cross-feeding）進行探討。傳統糞便代謝組學僅能分析總代謝物，無法區分細胞外與細胞內代謝池，限制了對代謝網絡的解析。研究團隊透過對比未破碎（代表細胞外池）與強力破碎（代表總代謝池）的糞便樣本，成功推算出細胞內代謝物的分佈。針對短鏈脂肪酸、多胺與水溶性維生素的分析顯示，維生素呈現兩類分佈：B12、B1 與 B3 傾向保留於細胞內（Type 1），而 B7 與 B5 則富集於細胞外（Type 2）。結合宏基因組分析發現，Type 1 代謝物與特定細菌（如 *Blautia*）的利用模式顯著相關，Type 2 代謝物則與 *Alistipes* 及腸道生態位特徵（如 pH 值、發酵類型）相關。此方法為區分代謝物空間分佈提供了實用架構，有助於更精確地將宏基因組功能潛力與代謝體現實連結，深入理解腸道微生物的互營生態結構。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635406/"}, {"pmid": "42635403", "title": "Baseline gut microbiome ecology predicts long-term fat mass loss after bariatric surgery: evidence for a thrifty Bifidobacterium phenotype.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "16S, metabolomics", "sample_size": "85 位重度肥胖患者及 21 位健康對照組（共 106 名受試者）", "has_fulltext": false, "abstract": "Bariatric surgery (BS) induces weight loss, but long-term success involves complex host-microbiome interactions. We evaluated the longitudinal impact of BS, microbiome resilience, and Mediterranean Diet (MedDiet) adherence up to 24 months. This prospective observational study included 85 patients with severe obesity undergoing BS and 21 normal-weight healthy controls (HC). MedDiet adherence (PREDIMED) was assessed before surgery. Fecal microbiota (16S-rRNA sequencing) and metabolomics (1H-NMR spectroscopy) were analyzed at baseline and at 1-, 6-, and 12-months post-BS. Clinical outcomes and fat mass, evaluated by bioimpedanciometry, were tracked up to 24 months. At baseline, patients exhibited higher microbial Shannon diversity than controls (p = 0.041), alongside a dysfunctional microbiome and metabolome characterized by a higher Firmicutes/Bacteroidetes ratio and elevated levels of branched-chain amino acids (p < 0.0001). Ordinary Least Squares (OLS) regression analysis revealed that MedDiet adherence and type 2 diabetes status significantly modulated baseline diversity. At 12 months post-BS, the gut ecosystem underwent profound remodeling, characterized by depletion of Bifidobacterium spp. and an increase in butyrate levels (p < 0.0001), establishing a novel adaptive state distinct from HC. Baseline gut ecology significantly conditioned long-term BS outcomes: patients in the highest quartile of baseline Bifidobacterium spp. lost significantly less fat mass at 24 months than those in the lowest (6.6% vs. 13.2%, p = 0.010). High baseline Bifidobacterium abundance paradoxically acts as a \"thrifty microbiome,\" potentially maximizing energy harvest and limiting surgery-induced fat loss. Overall, BS induces adaptive microbiome restoration rather than true normalization, highlighting the potential for precision interventions prior to surgery.", "zh_summary": "本研究探討減重手術（BS）後腸道微生物群與長期減脂效果的關聯。研究追蹤 85 名患者於術前及術後長達 24 個月的變化，分析發現手術顯著重塑了腸道菌相與代謝環境，特別是雙歧桿菌（*Bifidobacterium*）的耗竭與丁酸鹽的增加。關鍵發現指出，術前高豐度的雙歧桿菌反而成為一種「節儉型表型」，會增加能量攝取效率，導致術後 24 個月的脂肪減少量顯著較少（6.6% 對比 13.2%）。這顯示減重手術並非使微生物組回歸常態，而是引發一種適應性重組。此研究凸顯了術前腸道生態作為預測手術成效生物標記的潛力，對於未來制定精準的術前介入策略具有重要的臨床指導意義。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635403/"}, {"pmid": "42659434", "title": "Blechomonas campbelli from Ctenocephalides felis: in vitro development, thermotolerance, and phylogenetic insights.", "journal": "Memorias do Instituto Oswaldo Cruz", "impact_factor": 2.5, "tech_types": "metagenomics, others", "sample_size": "340 隻跳蚤（每 4 隻混合為一組，共 85 組檢體），最終獲得 1 個分離株（FL-1）", "has_fulltext": false, "abstract": "Blechomonas spp. are flea-specific monoxenous trypanosomatids, whose biology, host range, and geographic distribution remain poorly understood, even for species inhabiting ubiquitous cat and dog fleas. To isolate and characterise blechomonads from fleas of domestic dogs in Brazil, focusing on culture growth, morphology, and phylogenetic relationships. Fleas collected from dogs in Sabará, Brazil, were morphologically identified and screened by cultivation. The isolate FL-1 was analysed for temperature-dependent growth, morphology, and phylogeny using 18S rRNA and gGAPDH sequences, including those mined from public metagenomic datasets. Of 340 fleas (four per pool), only one culture tested positive. Growth was optimal at 25ºC, reduced at 30ºC, and absent at 35ºC. Four cell types were revealed, including a predominant \"uromonad\" stage specialised for attachment and aggregation. Phylogenetic analyses placed the isolate within Blechomonas campbelli and indicated that this species and Blechomonas lauriereadi occur in Ctenocephalides spp. from multiple continents. Blechomonas campbelli exhibits developmental adaptations to the flea gut and limited tolerance to elevated temperatures, constraining its potential to persist in warm-blooded hosts. These findings highlight the value of combining culture-based and in silico approaches to investigate flea-associated trypanosomatids.", "zh_summary": "本研究旨在分離並鑑定巴西犬隻跳蚤中的隱鞭蟲（*Blechomonas*），探討其生長、形態與系統發育。研究從340隻跳蚤中成功分離出FL-1株，經鑑定為 *Blechomonas campbelli*。該菌最適生長溫度為25°C，在35°C下無法存活，並具有四種細胞形態（含利於附著的uromonad階段）。系統發育分析證實該物種廣泛分佈於全球的櫛頭蚤屬中。此發現表明其具有適應跳蚤腸道的發育特徵，但因耐熱性差，難以在溫血宿主體內存活。本研究證實了結合傳統培養與公共總體基因體數據挖掘在研究跳蚤相關寄生蟲上的重要價值。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42659434/"}, {"pmid": "42635401", "title": "Fecal filtrate transplantation as salvage therapy for fulminant Clostridioides difficile infection in adult hematological patients during chemotherapy-induced aplasia: a pilot experience.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "16S, metagenomics", "sample_size": "3 位成人血液腫瘤患者", "has_fulltext": false, "abstract": "Fulminant Clostridioides difficile infection (CDI) in patients with hematologic malignancies during chemotherapy-induced aplasia carries high mortality and limited treatment options. Our objective was to evaluate fecal filtrate transplantation (FFT) as a salvage therapy for fulminant CDI during aplasia, and to explore whether donor-recipient phage dynamics may contribute to clinical response. We conducted a single-center, prospective, protocol-defined pilot case series study including consecutive adults with hematologic malignancies, chemotherapy-induced grade-4 aplasia and fulminant CDI, refractory to ≥5 d of high-dose oral vancomycin plus intravenous metronidazole and tigecycline. FFT was prepared from a single unrelated donor using sequential centrifugation and filtration, and administered via nasogastric tube in two doses. The primary outcome was sustained clinical cure, secondary outcomes included survival and adverse events, assessed at +14 and +30 d post-FFT. 16S rRNA gene sequencing was used to assess microbiome compositions, while viral metagenomics and in vitro propagation assays were employed to characterize donor-recipient phageome interactions. Three patients with adverse-risk acute myeloid leukemia and fulminant CDI caused by genetically distinct C. difficile strains received FFT. All patients achieved clinical resolution by day +14, accompanied by improvements in abdominal distension and inflammatory markers. By day +30, one patient died from Pseudomonas aeruginosa septic shock, while two maintained remission with confirmatory follow-up. FFT was well tolerated, with no procedure-related immediate complications or FFT-attributable adverse events. Microbiome and phage profiling revealed heterogeneous responses, including shifts in bacterial community composition, with no clear evidence for a general role of donor-derived phages in CDI resolution. In contrast, we observed induction of prophages harbored by recipient-associated Clostridium species, which may have contributed to decolonization through stress-induced entry into the lytic cycle. FFT was feasible, with rapid sustained CDI resolution in hematologic patients with chemotherapy-induced aplasia. ClinicalTrials.gov identifier NCT07172191. Prospective single-center pilot study of fecal filtrate transplantation (FFT) for fulminant-refractory C. difficile infection in three aplastic adult hematologic patients. FFT was well tolerated, achieved rapid clinical cure, and showed heterogeneous microbiome and phageome modulation, potentially contributing to therapeutic effects.", "zh_summary": "本研究旨在評估糞便濾液移植（FFT）作為挽救療法，治療化療致免疫不全之血液腫瘤患者合併難治猛爆性艱難梭菌感染（CDI）的療效，並探討供受體間噬菌體的動力學關係。此臨床先導試驗納入3位患者，結果顯示FFT耐受性良好，所有患者在接受治療後14天內均達到臨床緩解。微生態與噬菌體體學分析顯示，臨床症狀的改善並非源於供體噬菌體的直接轉移，而是FFT可能誘發了受體腸道內艱難梭菌的原噬菌體進入溶菌週期，進而促進病原菌清除。本研究證實FFT在此高風險族群中具安全性與可行性，為難治性CDI提供了創新的機制見解與治療選擇。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42635401/"}, {"pmid": "42668680", "title": "Proximity-ligation metagenomics reveals differential plasmid and chromosomal antimicrobial resistance gene carriage in disrupted gut ecosystems.", "journal": "iScience", "impact_factor": "4.1", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Distinct ecological pressures shape accumulation of antimicrobial resistance genes (ARGs) and virulence genes in the gut microbiome. In this study, we used proximity ligation shotgun metagenomics to characterize bacterial host-mobilome relationships associated with antimicrobial resistance and virulence genes in two disease cohorts with microbiome dysbiosis: recurrent Clostridioides difficile infection (rCDI) and cirrhosis. Microbiome dysbiosis in patients with rCDI is primarily driven by prolonged antibiotic exposure, whereas dysbiosis in patients with cirrhosis results from altered gut physiology. We found an increased relative abundance of chromosomally linked antibiotic resistance determinants in both disease cohorts compared with healthy controls. The rCDI cohorts additionally exhibited increased relative abundance of plasmid-mediated ARGs.", "zh_summary": "本研究旨在利用鄰近連接總體基因體學（proximity-ligation metagenomics）技術，解析腸道菌相失衡下，抗藥性基因（ARGs）與毒力基因在宿主染色體及質體（可移動遺傳因子）上的分佈特徵。研究對比了兩種因不同機制引發腸道失衡的臨床族群：長期抗生素暴露的復發性困難梭菌感染（rCDI）患者，以及生理結構改變的肝硬化患者。\n\n結果顯示，與健康對照組相比，兩組患者體內染色體連結的抗藥性基因豐度均顯著增加；然而，唯有rCDI組另外展現出質體媒介抗藥性基因的增加。此發現揭示了不同的生態壓力會塑造獨特的耐藥基因分佈，對於評估腸道耐藥性傳播具有重要臨床與科學價值。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42668680/"}, {"pmid": "42634246", "title": "Natural microbiota confer life-long protection against obesity via an early-life, immune-mediated effect on brown adipocytes.", "journal": "Gut microbes", "impact_factor": 11.0, "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Obesity, a major risk factor for metabolic disease, has increased in industrialized nations alongside a reduction in gut microbiota diversity. Reconstituting laboratory mice with complex, natural microbiota and commensals from wild mice resulted in protection against diet-induced obesity. These natural microbiota reduced weight gain in both male and female mice of different genetic backgrounds throughout their life and increased energy expenditure. Single-nuclei RNA sequencing identified a dominant adipocyte population in brown adipose tissue (BAT) with a transcriptional signature of increased thermogenic activity, while white adipose tissue mass and beiging were reduced. Protection against diet-induced obesity was transferable to adult germ-free mice via exposure to natural microbiota, indicating an association with the timing of immune response induction rather than BAT developmental programming. However, protection against diet-induced obesity did not require type 2 immune signaling, as shown in STAT6 knockout mice. Rather, it was associated with increased levels of chemokines and monocytes in BAT in early life, pointing to a role of infiltrating myeloid cells. Indeed, CCR2-deficient mice with natural microbiota lacked the BAT transcriptional signature of increased thermogenic activity, increased energy expenditure, and protection against diet-induced obesity that wild-type mice with natural microbiota exhibited. The latter was restored upon injection with wild-type bone marrow. Taken together, these findings identify a novel microbiota‒immune‒adipose tissue axis that results in increased BAT thermogenesis and improved energy balance throughout life.", "zh_summary": "本研究旨在探討野生小鼠的天然腸道菌相如何預防飲食引起的肥胖。研究發現，移植天然菌相能終生保護不同遺傳背景的實驗小鼠免於肥胖，並顯著增加能量消耗。單細胞核RNA定序（snRNA-seq）顯示，這與褐色脂肪組織（BAT）中產熱活性增強的脂肪細胞亞群有關。此保護機制並非透過第二型免疫信號，而是依賴於早期生命階段骨髓源性細胞（特別是CCR2+單核細胞）向BAT的浸潤與免疫調節。本研究首次揭示了一條全新的「腸道菌群—免疫—脂肪組織」軸，證實早期菌相暴露能透過免疫介導促進褐色脂肪產熱，為肥胖及代謝性疾病的防治提供了新穎的科學依據與治療靶點。", "date": "2026-08-23", "url": "https://pubmed.ncbi.nlm.nih.gov/42634246/"}, {"pmid": "42644084", "title": "Viral metagenomics of synanthropic urban bats: A surveillance strategy for uncovering potentially zoonotic viruses.", "journal": "One health (Amsterdam, Netherlands)", "impact_factor": NaN, "tech_types": "metagenomics", "sample_size": "2,422 隻蝙蝠中篩選出的 150 對肺與腸道檢體", "has_fulltext": false, "abstract": "Bats are natural reservoirs for diverse viruses, including coronaviruses, filoviruses, and paramyxoviruses, several of those known to be involved in zoonotic spillover events and demanding an integrated surveillance. Here, we present a framework that leverages Brazil's rabies passive surveillance programme to detect bat-borne viruses. Using an algorithm to select representative specimens from 2422 bats collected across São Paulo state, we submitted 150 paired lung and intestine samples to nanopore metagenomic sequencing. We detected 98 viral contigs from 12 families of public health relevance, including Arenaviridae, Coronaviridae, and Paramyxoviridae. Notably, the approach identified a previously unknown filovirus in bats in the Americas, validating the framework's capacity for epidemic preparedness. These findings reveal an undetected viral diversity and demonstrate how existing animal surveillance can monitor pathogen threats. Crucially, in a workshop involving multisectoral One Health experts in Brazil, this framework was validated as a scalable model for national expansion, adapted for low- and middle-income countries (LMICs).", "zh_summary": "本研究旨在建立一個結合巴西現有狂犬病被動監測計畫的病毒總體基因體學監測架構，以偵測都市蝙蝠所攜帶的潛在人畜共通病毒。研究團隊從聖保羅州收集的 2,422 隻蝙蝠中，篩選出 150 對肺部與腸道檢體進行奈米孔定序。結果成功偵測到 12 個與公共衛生密切相關病毒科的 98 個病毒基因片段（包括沙狀、冠狀與副黏液病毒科等），更首次在美洲蝙蝠中發現一種未知絲狀病毒。此研究不僅揭示了未曾被發現的病毒多樣性，證實利用現有動物監測系統預防流行病的可行性，更為中低收入國家提供了一個具備「健康一體」（One Health）共識、可擴展至全國的傳染病監測模型。", "date": "2026-08-17", "url": "https://pubmed.ncbi.nlm.nih.gov/42644084/"}, {"pmid": "42668212", "title": "Correlation between microbial communities, metabolites, and bioactivities in fermented mare's milk revealed by metagenomics and metabolomics.", "journal": "Food microbiology", "impact_factor": "4.6", "tech_types": "metagenomics, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Koumiss exhibits various functional properties, including antioxidant, hypoglycemic, and antihypertensive effects; however, natural fermentation is characterized by an uncontrollable microbial community structure, significant fluctuations in product quality, and a lack of specialized fermentation agents. The mechanisms underlying the links between microbial communities, functional metabolites, and bioactivity in natural and inoculated fermentation systems remain unclear. Therefore, this study employed bioactivity assays, metagenomics, and non-targeted metabolomics to systematically analyze differences in microbial communities, metabolite composition, and functional activities of mare's milk under different fermentation regimes. The results indicated that, compared with natural fermentation, inoculated fermentation with a mixed lactic acid bacteria (LAB) culture significantly enhanced the antioxidant, α-glucosidase, α-amylase inhibitory activities, and ACE inhibitory activity of mare's milk; microbial diversity in fermented samples was significantly reduced, with a more pronounced decrease in the inoculated group. Metabolomic analysis revealed that inoculated fermentation significantly enriched functional metabolites, including lipids and organic acids. Correlation analysis indicated that the abundance of Lactiplantibacillus and Limosilactobacillus was significantly positively correlated with beneficial metabolites (e.g., linoleic acid, α-linolenic acid) and functional activities. The lipid and amino acid metabolic pathways are closely associated with the differences in in vitro biological activity of inoculated fermented mare's milk. This study provides a fermentation starter that can improve the in vitro functional activity of mare's milk and reveals the potential metabolic links between LAB fermentation and the altered functional traits of mare's milk, thereby providing a theoretical basis and technical support for the development of high-value-added fermented mare's milk products.", "zh_summary": "本研究旨在探討馬奶在天然與接種發酵過程中，微生物群落、功能性代謝物與生物活性之間的關聯。研究發現，相較於天然發酵，接種混合乳酸菌（LAB）發酵雖顯著降低了微生物多樣性，但能顯著提升馬奶的抗氧化、降血糖及降血壓等體外生物活性，並富集脂質和有機酸等功能代謝物。分析顯示，植物乳桿菌屬與限制乳桿菌屬的豐度與亞麻酸等有益代謝物及活性呈顯著正相關。此研究揭示了乳酸菌發酵提升馬奶功能特性的潛在代謝機制，為開發高附加價值的發酵馬奶產品提供了發酵劑選擇與理論支持。", "date": "2026-08-17", "url": "https://pubmed.ncbi.nlm.nih.gov/42668212/"}, {"pmid": "42666298", "title": "Multi-layer gut microbiome variation in type 2 diabetes despite preserved higher-order community structure.", "journal": "Frontiers in microbiology", "impact_factor": "4.5", "tech_types": "metagenomics", "sample_size": "82 位受試者的糞便檢體（包含 41 位第二型糖尿病患者與 41 位年齡、性別及 BMI 匹配的健康對照者）", "has_fulltext": false, "abstract": "Type 2 diabetes (T2D) has been consistently associated with alterations in the gut microbiome, although disease, treatment, diet, and other host factors may contribute to the observed patterns. How these associations are organized across different biological levels of the microbial ecosystem remains incompletely understood. We performed shotgun metagenomic sequencing of fecal samples from 82 individuals, including 41 patients with T2D and 41 age-, sex-, and body mass index-matched healthy controls. Taxonomic profiling, functional pathway analysis, enterotype characterization, ecological network inference, and interpretable machine-learning approaches were integrated to characterize microbiome variation across multiple organizational levels. Despite clear clinical differences between groups, particularly fasting blood glucose, the overall ecological architecture of the gut microbiome remained broadly preserved. Dominant phylum-level composition and enterotype structure were maintained, whereas variation became apparent at finer biological scales. Species-level analyses identified 42 differentially abundant taxa. Community diversity analysis showed reduced Chao1 richness (P = 0.024), increased Simpson diversity (P = 0.024), unchanged Shannon diversity (P = 0.126), and a modest shift in community composition (PERMANOVA, R 2 = 0.040, P = 0.006). Functional profiling showed no pathway-level significance after multiple-testing correction but directional trends across several metabolic modules. Exploratory Spearman-based networks differed in topology between groups; because relative-abundance data are compositional, these differences cannot be interpreted as direct ecological interactions or definitive network rewiring. Machine-learning models achieved a within-cohort cross-validated AUC of up to 0.91, but lacked independent external validation. These findings provide a multi-layer description of T2D-associated gut microbiome variation within this cohort. The data are consistent with preserved higher-order community organization accompanied by finer-scale differences in species composition, functional potential, community-state occupancy, statistical co-occurrence, and within-cohort discriminative features. Medication confounding, compositional effects, technical artifacts, and the absence of external validation limit causal, ecological, and diagnostic interpretation. Larger longitudinal, multi-site, medication-resolved, and independently validated studies are required.", "zh_summary": "本研究旨在探討第二型糖尿病（T2D）患者腸道菌相在不同生物層級的變異。透過對82名受試者進行糞便總體基因體定序，發現儘管兩組臨床指標差異顯著，腸道菌群的宏觀生態結構（如門級組成與腸型）仍大致維持。然而，在細微層級則展現顯著變異，包括鑑定出42種豐度差異物種，且T2D組的Chao1豐富度顯著降低。機器學習模型在組內預測T2D的AUC達0.91。此研究揭示了T2D中腸道菌相「宏觀穩定、微觀失衡」的多層次特徵，但亦指出藥物混雜與缺乏外部驗證等限制，未來仍需更大規模的縱向研究。", "date": "2026-08-14", "url": "https://pubmed.ncbi.nlm.nih.gov/42666298/"}, {"pmid": "42666306", "title": "Ecological assembly of mucosal and fecal microbiomes in ulcerative colitis across genes, functions, and species.", "journal": "Frontiers in microbiology", "impact_factor": "4.5", "tech_types": "metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Inflammatory bowel disease (IBD) is associated with gut microbial dysbiosis, yet the ecological processes underlying community assembly remain unclear. Here, we applied Sloan's neutral community model to examine the relative contributions of stochastic and deterministic processes across multiple ecological layers, including metagenomic genes (MGs), molecular functions (MFs), and microbial species (archaea, bacteria, fungi, and viruses), in fecal and mucosal microbiota from healthy controls and ulcerative colitis (UC) patients. Across all layers, most MGs, MFs, and species conformed to neutral expectations, indicating a dominant role of stochastic processes in community assembly. However, UC was consistently associated with an increased proportion of neutral MFs and species, accompanied by a reduction in non-neutral components, suggesting weakened selective constraints under disease conditions. Ecological niche further modulated these patterns. Fecal communities harbored significantly higher proportions of non-neutral MFs and species compared to mucosal communities, indicating stronger deterministic processes in feces. Analysis of selection-state transitions revealed extensive changes in selection status in UC, particularly in mucosal environments, where both functional and taxonomic profiles showed marked transition. These changes were primarily driven by the gain and loss of selection rather than directional switching, indicating that UC alters the strength and presence of selection rather than reversing its direction. Together, these findings provide a multi-layered ecological framework for understanding UC-associated dysbiosis, highlighting increased neutrality and selection rewiring as key features of microbial community assembly under disease conditions.", "zh_summary": "本研究旨在探討潰瘍性結腸炎（UC）患者與健康對照組在糞便及黏膜微生物群中，基因、功能和物種層面的生態組裝機制。研究發現，隨機性過程在群落組裝中占主導地位，但UC患者表現出更高比例的中性特徵，顯示疾病狀態下選擇壓力減弱。此外，糞便群落比黏膜群落受到更強的確定性選擇。UC主要藉由改變選擇壓力的強度與存在（而非改變其方向）來重塑微生物群，且此現象在黏膜中尤為顯著。本研究為理解UC相關的菌群失調提供了多維生態框架，指出中性增加與選擇重組為其核心特徵。", "date": "2026-08-14", "url": "https://pubmed.ncbi.nlm.nih.gov/42666306/"}, {"pmid": "42666371", "title": "HPV vaccination associates with Lactobacillus crispatus-dominant vaginal microbiota in women with cervical lesions: a metagenomic study.", "journal": "Frontiers in microbiology", "impact_factor": "4.5", "tech_types": "metagenomics", "sample_size": "59位患有子宮頸病變的停經前女性陰道檢體（其中26位未接種HPV疫苗，33位已接種疫苗）", "has_fulltext": false, "abstract": "Human papillomavirus (HPV) vaccination provides high-level protection against cervical cancer through type-specific antibodies, although breakthrough and persistent high-risk HPV (hrHPV) infections may still occur in some vaccinated women. In addition to neutralizing antibodies, vaccination elicits other immune mechanisms that may influence viral persistence and disease progression. Because mucosal immunity is closely linked to the vaginal microbiota, microbial composition may also play an important role in HPV susceptibility, with Lactobacillus crispatus dominance associated with protection, and dysbiosis with impaired mucosal immunity. Whether HPV vaccination is associated with favorable microbiota signatures in women with confirmed cervical cancer-related conditions remains unknown. We analyzed vaginal samples via shotgun metagenomic sequencing from a cross-sectional study of 59 pre-menopausal women (<50 years) with confirmed cervical lesions (HPV-unvaccinated n = 26, vaccinated n = 33). Alpha diversity (Shannon and Inverse Simpson indices) did not differ significantly by vaccination status, suggesting within-sample microbial diversity between the groups, but Bray-Curtis-based PERMANOVA indicated a statistically significant difference in overall community composition between groups (p = 0.042). Among women with CST I, 90.9% were vaccinated, whereas among women with CST IV, 60.0% were unvaccinated. At the species level, L. crispatus relative abundance was higher in vaccinated women in the unadjusted analysis; however, this association was attenuated and was not statistically significant after multivariable adjustment. HPV vaccination status was associated with a higher prevalence of L. crispatus-dominant, health-associated vaginal microbiota among women with cervical lesions. These findings support the hypothesis that HPV vaccination status is associated with L. crispatus dominance in this population, but mechanistic pathways remain to be elucidated.", "zh_summary": "本研究旨在探討HPV疫苗接種是否與子宮頸病變女性的健康陰道菌相（特別是卷曲乳桿菌 *L. crispatus* 優勢）相關。研究利用總體基因體定序分析59位子宮頸病變女性的陰道檢體。結果顯示，已接種與未接種疫苗者的整體菌落結構有顯著差異：在健康型陰道狀態（CST I）中，90.9%為已接種者；而在菌相失衡型（CST IV）中，則有60%為未接種者，且接種疫苗者體內卷曲乳桿菌相對豐度較高。此發現顯示HPV疫苗接種可能與維持健康、乳桿菌為主的陰道微生態相關，為評估疫苗對黏膜免疫與病變預後的影響提供了新視角。", "date": "2026-08-14", "url": "https://pubmed.ncbi.nlm.nih.gov/42666371/"}, {"pmid": "42666411", "title": "Aztreonam-avibactam therapy following surgical source control for bla NDM -positive carbapenem-resistant Klebsiella pneumoniae intra-abdominal infection in an infant: a case report.", "journal": "Frontiers in pharmacology", "impact_factor": "4.8", "tech_types": "metagenomics", "sample_size": "1名2個月大的男嬰 (n=1)", "has_fulltext": false, "abstract": "Treating carbapenem-resistant Klebsiella pneumoniae (CRKP) is challenging, particularly when resistance is mediated by New Delhi metallo-β-lactamase (NDM). Clinical experience with fixed-combination aztreonam-avibactam (ATM-AVI) in young infants remains extremely limited. Here, we report a case of a 2-month-old boy who underwent emergency laparotomy for intestinal obstruction owing to small bowel volvulus with segmental necrosis, followed by bowel resection and reanastomosis. His postoperative course was complicated by respiratory failure, coagulopathy, septic shock, recurrent abdominal distension, and massive ascites. Blood cultures were negative, whereas metagenomic next-generation sequencing of blood detected K. pneumoniae and Enterococcus faecium. Owing to the worsening of his condition, diagnostic paracentesis and repeat laparotomy were performed, revealing an anastomotic leak. Intraoperative pus culture yielded bla NDM -positive CRKP. The isolate was resistant to carbapenems and ceftazidime-AVI but was susceptible to ATM-AVI, with a minimum inhibitory concentration of ≤4 mg/L. ATM-AVI was administered at 30 mg/kg every 8 h, based on the aztreonam component, for 14 days; linezolid and fluconazole were co-administered as part of the broader anti-infective regimen. The combination of definitive surgical source control, targeted antimicrobial therapy, and comprehensive intensive care successfully controlled the infection and stabilized his hemodynamics. The patient defervesced within 24 h of the first ATM-AVI dose. Inflammatory markers declined rapidly, allowing safe extubation. Follow-up abdominal cultures remained negative. No hepatic or renal toxicity was observed during treatment. This case suggests that, when combined with adequate surgical source control, ATM-AVI may represent a valuable mechanism- and susceptibility-guided pharmacological component in a multidisciplinary treatment paradigm for severe bla NDM -positive CRKP infections in selected infants.", "zh_summary": "本病例報告描述了一名2個月大男嬰在腸道手術後，因攜帶 $bla_{NDM}$ 基因的耐碳青黴烯肺炎克雷伯菌（CRKP）引發嚴重腹腔感染與敗血性休克。透過血液總體基因體次世代定序（mNGS）與手術膿液培養確立診斷。在進行外科手術源頭控制的基礎上，給予目標性氨曲南-阿維巴坦（ATM-AVI）治療14天。患者在用藥24小時內退燒，發炎指標迅速下降並順利拔管，且未出現肝腎毒性。此案例顯示，結合外科清除與藥敏導向的ATM-AVI聯合療法，對嬰幼兒嚴重 $bla_{NDM}$ 陽性CRKP感染具有臨床安全性與療效，為極低齡患者提供了重要的診療參考。", "date": "2026-08-14", "url": "https://pubmed.ncbi.nlm.nih.gov/42666411/"}, {"pmid": "42665791", "title": "Presumably recurrent Ureaplasma parvum infection in a female peritoneal dialysis patient: a case report and literature review.", "journal": "BMC nephrology", "impact_factor": "2.4", "tech_types": "metagenomics", "sample_size": "1 位 35 歲女性腹膜透析患者（個案報告）", "has_fulltext": false, "abstract": "Peritoneal dialysis-associated peritonitis (PDAP) caused by Ureaplasma parvum (U. parvum) is exceedingly rare, and its diagnosis is particularly challenging due to the organism's biological characteristics and the limitations of conventional detection methods. To date, only sporadic case reports are available, but the diagnostic processes and clinical characteristics of PDAP caused by U. parvum infection have not been comprehensively reported yet. We report a 35-year-old female patient undergoing continuous ambulatory peritoneal dialysis (CAPD) who experienced three episodes of peritonitis within a six-month period. Despite empirical antibiotic therapy leading to clinical improvement, routine microbiological cultures of the dialysate remained negative during each episode. During the third episode, metagenomic next-generation sequencing (mNGS) of the peritoneal dialysis (PD) effluent finally detected U. parvum as the causative pathogen. Following removing a potential risk factor, an intrauterine device (IUD), and adjusting the antimicrobial therapy to intraperitoneal (IP) levofloxacin and oral azithromycin, the patient achieved complete recovery and successfully resumed PD. Based on this experience, we documented the characteristic clinical profile of such infections and proposed an exploratory clinical diagnosis and treatment flowchart. Patients with recurrent culture-negative PDAP, especially female with an IUD, should be evaluated for U. parvum infection as a potential pathogen. mNGS facilitates the rapid detection of pathogens that traditional methods may fail to identify. Effective management of such infections necessitates not only targeted antimicrobial therapy guided by precise pathogen identification, but also the removal of potential risk factors such as the IUD.", "zh_summary": "本研究旨在探討由微小脲原體（*Ureaplasma parvum*）引起的罕見反覆性腹膜透析相關腹膜炎（PDAP）診治。研究報導了一名35歲女性患者在六個月內經歷三次腹膜炎，傳統培養均呈陰性，最終透過腹膜透析液的宏基因組二代定序（mNGS）成功偵測出微小脲原體。在移除潛在風險因子（子宮內避孕器）並給予針對性抗生素治療後，患者完全康復。此案例證實了mNGS在診斷傳統方法難以檢出的病原體時的關鍵作用，並指出對於培養陰性的反覆性腹膜炎患者（特別是裝有避孕器的女性），應警惕微小脲原體感染，並據此提出臨床診斷與治療流程。", "date": "2026-08-03", "url": "https://pubmed.ncbi.nlm.nih.gov/42665791/"}, {"pmid": "42637484", "title": "Insights into the analysis of microbial communities in fermented foods from the perspective of DNA-based techniques.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metagenomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "The quality, flavor, and stability of fermented foods depend on the microbial community. However, microbial dynamics are difficult to observe directly, leading to limited control over fermentation. High-throughput sequencing is a revolutionary tool for microbial characterization, among which DNA-based amplicon and metagenomic sequencing are core techniques. Nevertheless, the related data processing workflows in the context of fermented foods have not yet been systematically summarized, hindering the translation of research findings into fermentation practices. This review clarifies the applications of amplicon and metagenomic sequencing in fermented foods. For amplicon sequencing, the impacts of target regions, data preprocessing, and reference databases are addressed. For metagenomic sequencing, sequencing strategies, read-based and binning-based analytical methods, functional annotation, and species-specific databases are discussed. In addition, major strategies for downstream analysis of community data are summarized, including microbial diversity, co-occurrence networks, niche and community assembly, key environmental drivers, and machine learning-based prediction. Amplicon sequencing efficiently reveals microbial succession during fermentation but has limitations in functional annotation. Metagenomic sequencing is notable for functional annotation, enabling the linkage between microbial communities and metabolic potential alongside community characterization. Standardized data preprocessing and specific databases are critical for improving characterization. For community data, integrated analysis allows uncovering the driving factors of microbial succession, thereby helping to regulate fermentation. Notably, the compositional nature of the data must be considered and validated to avoid spurious associations. In summary, the exponential growth of sequencing data will propel the era of precision fermentation.", "zh_summary": "本文為一篇綜述性研究，旨在探討以 DNA 為基礎的高通量定序技術（包含擴增子定序與宏基因組學）在發酵食品微生物群落分析中的應用。研究指出，儘管高通量定序技術已成為解析微生物動態的革命性工具，但目前缺乏系統性的數據處理框架，限制了科學發現向產業實踐的轉化。本文詳細梳理了從目標區域選擇、數據預處理、參考數據庫建立到下游生物資訊分析（如共現網絡、生態棲位構建及機器學習預測）的標準化流程。研究強調，擴增子定序雖能有效揭示群落演替，但在功能註解上存在限制；而宏基因組學則具備更強的功能解析潛力，能將微生物組成與代謝功能聯繫起來。透過標準化數據處理流程並考慮數據的組成特性，這些先進技術將精準調控發酵過程，引領精密發酵時代的到來。", "date": "2026-07-27", "url": "https://pubmed.ncbi.nlm.nih.gov/42637484/"}, {"pmid": "42637478", "title": "Effects of sorghum variety on fermentation microecology and flavor characteristics of sesame-flavor Baijiu.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "3 種高粱品種（Hongyingzi, Hei'e, G），於 2 輪發酵週期中，在 3 個時間點（0、15、50 天）採集發酵酒醅檢體（樣本總數依實驗設計推算為 18 組發酵樣品）", "has_fulltext": false, "abstract": "Sorghum, the principal raw material for Baijiu fermentation, plays a key role in shaping fermentation microecology and flavor formation. However, the effects of sorghum varietal differences on sesame-flavor Baijiu fermentation remain insufficiently understood. In this study, three sorghum varieties, Hongyingzi (R), Hei'e (B), and a domestic cultivar (G), were compared over two consecutive fermentation rounds. Fermented grain (Jiupei) samples collected at 0, 15, and 50 days were analyzed for physicochemical properties, enzyme activities, microbial communities, volatile compounds in Jiupei and base liquor, and the taste characteristics of the corresponding base liquor. Despite showing similar overall fermentation trends, the three sorghum varieties differed in acid accumulation, starch utilization, microbial succession, and volatile composition. Fungal communities shifted from early Pichia dominance to multi-genus coexistence, whereas bacterial communities progressively converged toward Lactobacillus dominance. A total of 218 and 258 volatile compounds were identified in Jiupei and 176 and 192 in base liquor from the first and second rounds, respectively. Esters were the dominant differential class, and volatile-marker profiles varied among sorghum varieties and fermentation rounds, with no single variety showing consistent enrichment across all sesame-flavor-related compounds. These results indicate that sorghum variety is an important factor associated with microbial assembly and flavor formation during sesame-flavor Baijiu fermentation, and provide a basis for raw material selection and flavor-oriented process optimization.", "zh_summary": "本研究旨在探討不同高粱品種對芝麻香型白酒發酵過程中，微生物群落結構與風味代謝物質形成的影響。研究比較了紅纓子（R）、黑鵝（B）與國內品種（G）三種高粱，分析其在發酵過程中的理化特性、微生物演替及揮發性化合物組成。研究發現，儘管各品種發酵趨勢相似，但在酸度累積、澱粉利用率及微生物群落演替上存在顯著差異；真菌群落由早期的畢赤酵母（*Pichia*）主導轉變為多菌屬共存，細菌群落則趨向於乳桿菌（*Lactobacillus*）主導。分析鑑定出上百種揮發性化合物，其中酯類是導致風味差異的主要代謝物。本研究證實了高粱品種是決定白酒發酵微生物群落組裝與最終風味品質的關鍵因子，為白酒產業的原料選擇與製程最佳化提供了重要的科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637478/"}, {"pmid": "42637476", "title": "A Shenling Baizhu San polysaccharide fraction (SLP-2)-based synbiotic alleviates lactose-induced gut dysfunction via a microbiota-metabolite-barrier axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Lactose intolerance (LI) is a common digestive disorder, and its management still relies largely on dietary restriction. Because gut microbial fermentation and barrier dysfunction contribute to LI-related symptoms, microbiota-targeted prebiotic or synbiotic strategies may provide complementary approaches. However, the active plant-polysaccharide fractions and their microbial partners remain unclear. This study aimed to identify the bioactive polysaccharide fraction from Shenling Baizhu San and evaluate its pairing with responder bacteria for alleviating high-lactose diet (HLD)-induced intestinal dysfunction. Stepwise ethanol precipitation yielded SLP-2, which was subsequently identified as the principal bioactive fraction through human fecal fermentation, monoculture assays, and an HLD rat model. SLP-2 enriched Eubacterium-associated taxa and supported the growth of Akkermansia muciniphila in monoculture and in vivo. Building on this, a synbiotic combining SLP-2 with A. muciniphila and E. rectale alleviated HLD-induced gut dysfunction; the antibiotic-matched comparison with the probiotics-only group supported an SLP-2-associated contribution. The synbiotic intervention was associated with increased tight junction proteins, MUC2 expression, improved intestinal architecture, and thicker mucus layers. Multi-omics analysis linked co-metabolites, including intestinal 6-MGG and HTy-Ac and systemic DHPV-G, with barrier restoration and an immune profile characterized by increased IL-10 and lower TLR4 expression. These findings suggest that SLP-2-based synbiotic intervention alleviates HLD-induced intestinal dysfunction through microbiota-metabolite-barrier modulation, providing preclinical evidence for future functional-food strategies pending human validation.", "zh_summary": "本研究旨在探討參苓白朮散多醣活性組分（SLP-2）結合特定菌株，對高乳糖飲食（HLD）引發之腸道功能障礙的緩解作用。研究發現，SLP-2能促進*A. muciniphila*與真桿菌屬相關菌群生長。以SLP-2搭配益生菌的合生元配方，能顯著改善HLD大鼠的腸道屏障，包含增加緊密連接蛋白與MUC2表達、增厚黏液層。多體學分析顯示，其保護作用與腸道及全身性代謝物（如6-MGG、DHPV-G）的調節，以及抗發炎反應（提升IL-10、降低TLR4）密切相關。此發現為開發防治乳糖不耐症的功能性食品提供了臨床前依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637476/"}, {"pmid": "42637471", "title": "Fucoidan from giant kelp alleviates postmenopausal osteoporosis by regulating the betaine-OPG/RANKL/RANK signaling axis.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Postmenopausal osteoporosis (PMOP), characterized by excessive bone resorption and impaired bone remodeling, remains a significant global health challenge. This study investigated the protective effects of fucoidan from giant kelp (GKP) against PMOP and its underlying mechanisms in ovariectomized mice. GKP supplementation attenuated bone loss by preserving trabecular microarchitecture, normalizing systemic mineral homeostasis, and suppressing osteoclastogenesis, as evidenced by the downregulation of osteoclast-related genes. 16S rRNA gene sequencing revealed that GKP reshaped the gut microbiota by decreasing the Bacteroidota/Firmicutes ratio and enriching beneficial taxa, which promoted short-chain fatty acid production. Targeted metabolomics revealed that GKP induced profound systemic metabolic reprogramming, particularly amino acid metabolism, and identified betaine as a key systemic metabolite effector upregulated following GKP treatment. In vitro assays demonstrated that betaine suppressed receptor activator of nuclear factor-κB ligand (RANKL)-induced osteoclast differentiation and mitigated inflammation. In vivo validation demonstrated that betaine intervention recapitulated the osteoprotective phenotype observed in GKP-treated mice, which was associated with regulation of the osteoprotegerin/RANKL/RANK signaling axis. These results indicate that GKP exerts anti-osteoporotic effects in association with changes in gut microbiota and systemic metabolism, while betaine-mediated regulation of the OPG/RANKL/RANK signaling may contribute to its osteoprotective activity.", "zh_summary": "本研究探討巨藻褐藻醣膠（GKP）對去卵巢小鼠更年期後骨質疏鬆症（PMOP）的保護機制。結果顯示，補充GKP能有效減少骨質流失並抑制破骨細胞生成。16S定序顯示GKP重塑了腸道菌群（降低擬桿菌門/厚壁菌門比例），促進短鏈脂肪酸產生。代謝組學分析發現，GKP顯著提升了系統性代謝物甜菜鹼（betaine）的含量。體內外實驗進一步證實，甜菜鹼透過調控OPG/RANKL/RANK信號軸，能抑制破骨細胞分化並緩解骨質流失。本研究證實GKP具備透過「腸道菌群-代謝物」軸抗骨質疏鬆的潛力，為PMOP防治提供了科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637471/"}, {"pmid": "42637450", "title": "Highland barley polysaccharides promoted lactose intestinal fermentation in vitro: Unveiling the dynamic response of gut microbiota and polysaccharide structure.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "乳糖不耐症患者的糞便檢體（未提及具體數量）", "has_fulltext": false, "abstract": "Lactose intolerance affects over 70% of the global population due to the untimely metabolism of lactose in the colon. To accelerate lactose metabolism, we innovatively employed highland barley polysaccharides (HBP) to modulate the colonic fermentation efficiency of lactose using an in vitro fermentation model and fecal samples from lactose intolerant patients. With the addition of HBP, the consumption efficiency of lactose began to increase after 6 h of fermentation. At 48 h, lactose consumption increased by 29%, surpassing the effect of commercial prebiotics. Meanwhile, HBP with lower molecular weight (HBP-L, 8.69 × 104 g/Mol) exhibited more effective impacts than HBP with high molecular weight (HBP-H, 1.22 × 105 g/Mol), which was particularly evident during the 12-48 h of fermentation. More importantly, HBP, particularly HBP-L, substantially enriched Segatella, Bifidobacterium, and Ligilactobacillus in a time-dependent manner and was positively correlated with decreased lactose levels and elevated bacterial lactase activity, resulting in significant conversion of lactose to lactic acid and short-chain fatty acids. During the first 12 h of fermentation, HBP-L underwent more significant degradation than HBP-H. Meanwhile, the xylose residues and Glcp glycosidic bonds in HBP-L were preferentially utilized, while it was glucose residue in HBP-H. Thus, it indicated that HBPs were degraded and altered the composition of the gut microbiota, thereby enhancing the fermentation efficiency of lactose. Our findings provide a theoretical basis for developing targeted prebiotic foods to manage lactose intolerance.", "zh_summary": "本研究旨在探討青稞多醣（HBP）如何調控乳糖不耐症患者的腸道菌群，以促進體外乳糖發酵與代謝。研究發現，添加 HBP（特別是低分子量的 HBP-L）能在發酵 48 小時後提升乳糖消耗效率達 29%，效果顯著優於商業益生元。機制上，HBP-L 在發酵初期降解更為顯著，並能隨時間特異性富集 *Segatella*、雙歧桿菌屬（*Bifidobacterium*）及 *Ligilactobacillus*，進而提升細菌乳糖酶活性，將乳糖轉化為乳酸與短鏈脂肪酸。本研究證實了青稞多醣能透過重塑腸道菌群結構來加速乳糖代謝，為開發緩解乳糖不耐症的標靶益生元食品提供了重要科學依據。", "date": "2026-07-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637450/"}, {"pmid": "42662912", "title": "Insights into antibiotic resistomes from gut meta-genome-assembled genomes of the free-range chickens.", "journal": "Veterinary and animal science", "impact_factor": 2.2, "tech_types": "metagenomics", "sample_size": "120 個放養雞糞便檢體（重建出 2,146 個宏基因組組裝基因組/MAGs）", "has_fulltext": false, "abstract": "Antibiotic resistance is a growing global threat, and the chicken gut microbiome is a significant reservoir of antibiotic resistance genes (ARGs). To investigate the presence of ARGs in free-range chickens, which are in closer contact with humans and live in closer proximity to human settlements. In this study, we used metagenomic sequencing to characterize the resistome of the chicken gut. We collected 120 fecal samples from free-range chickens across four Chinese provinces and constructed both metagenome-assembled genomes (MAGs) and comprehensive gene catalogs to investigate microbial community structures and ARG distributions. A total of 2,146 MAGs were reconstructed, encompassing 660 species from 26 phyla, forming a comprehensive genomic catalog of the chicken gut microbiota. We identified 254,316 ARGs representing 159 unique resistance genes across 35 antibiotic classes, with multidrug, tetracycline, glycopeptide, and peptide resistance being most prevalent. Notably, ARG distribution showed strong regional variation, influenced by environmental factors and local farming practices. Mobile genetic elements (MGEs), averaging 33.8 per MAG, were positively correlated with ARG abundance (R = 0.77), underscoring their role in facilitating resistance gene dissemination. Specific MAGs-including strains of Escherichia coli and Klebsiella pneumoniae-harbored hundreds of ARGs and virulence factors, highlighting potential high-risk vectors for resistance spread. Our findings reveal a diverse and regionally dynamic antibiotic resistome in the chicken gut, shaped by microbial composition, environment, and host factors. This study provides a valuable genomic resource and emphasizes the need for targeted interventions and surveillance strategies to mitigate antibiotic resistance in poultry production systems.", "zh_summary": "本研究旨在探討放養雞腸道菌群中的抗生素抗藥性基因（ARGs）分布。研究團隊分析了中國四省的120個放養雞糞便檢體，重建出2,146個宏基因組組裝基因組（MAGs）。結果共鑑定出254,316個ARGs，以多重抗藥性與四環黴素抗性最為普遍。ARGs分布具顯著地域差異，且與行動遺傳元件（MGEs）呈強正相關（R=0.77），證實其高傳播潛力。此外，大腸桿菌和肺炎克雷伯氏菌等特定菌株被發現攜帶多種ARGs與毒力因子，為潛在的高風險傳播媒介。本研究建立的基因組資源，對制定禽類抗藥性監控與防治策略具有重要科學價值。", "date": "2026-07-22", "url": "https://pubmed.ncbi.nlm.nih.gov/42662912/"}, {"pmid": "42637441", "title": "Microbial succession drives quality deterioration in refrigerated golden pompano (Trachinotus ovatus): regulatory network of dominant spoilage microbiota on characteristic biomarkers.", "journal": "Food research international (Ottawa, Ont.)", "impact_factor": NaN, "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Elucidating the quality deterioration mechanisms of refrigerated golden pompano (Trachinotus ovatus), this study integrated 16S rRNA gene sequencing and untargeted metabolomics to systematically dissect how microbial ecological succession drives metabolic changes. As critical spoilage indicators, total volatile basic nitrogen (TVB-N) and thiobarbituric acid reactive substances (TBARS) continuously increased during storage, indicating significant deterioration by day 6. Microbial community succession analysis revealed that Psychrobacter, Shewanella, and Pseudomonas gradually became the dominant microbiota in the late storage stage. Metabolite enrichment analysis further demonstrated that this shift redirected the metabolic focus from early-stage nucleotide degradation to late-stage protein hydrolysis and amino acid metabolism. Moreover, multivariate statistical analysis identified 50 potential spoilage biomarkers, among which biogenic amines (histamine, tyramine, and phenylethylamine) were recognized as key indicators reflecting spoilage progression. Correlation network analysis revealed positive correlations between Pseudomonas and Shewanella abundances and the accumulation of these biogenic amines. This suggests that these two genera act as the core functional microbiota, driving spoilage metabolite generation and subsequent quality deterioration. Pathway analysis of potential spoilage biomarker generation indicates that amino acid and nucleotide metabolism constitute the core spoilage pathways, with lipid oxidation serving as a complementary mechanism. Overall, this study elucidates the spoilage mechanisms of refrigerated golden pompano, providing chemical targets for early biomarker detection and targeted antibacterial strategies.", "zh_summary": "本研究旨在探討冷藏金鯧魚品質劣化的機制。研究結合 16S rRNA 基因定序與非靶向代謝組學，分析微生物群落演替如何驅動代謝變化。結果顯示，金鯧魚冷藏至第 6 天時顯著腐敗。在貯藏後期，*Psychrobacter*、*Shewanella* 與 *Pseudomonas* 逐漸成為優勢菌群，使代謝焦點自初期的核苷酸降解轉向後期的蛋白質水解與氨基酸代謝。研究鑑定出 50 個潛在腐敗生物標誌物（如組胺、酪胺等生物胺），並發現 *Pseudomonas* 和 *Shewanella* 的豐度與這些生物胺的累積呈正相關，為驅動腐敗的核心菌群。本研究闡明了金鯧魚的腐敗機制，為食品早期變質
