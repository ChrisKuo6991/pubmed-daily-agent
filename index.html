    <script>
        // 載入完整歷史資料庫 (JSON 格式注入)
        const rawArticlesData = [{"pmid": "42638587", "title": "Valorization of spent black tea polyphenols as a functional coating for probiotic protection and colitis alleviation.", "journal": "Food & function", "impact_factor": "5.4", "tech_types": "16S", "sample_size": "未提及", "has_fulltext": false, "abstract": "Excessive reactive oxygen species (ROS) play a central role in the development of inflammatory bowel disease (IBD). A promising therapeutic strategy involves delivering probiotics alongside polyphenolic antioxidants, which can protect the probiotics while scavenging ROS. Although biomass is a versatile source of polyphenols, abundant agro-industrial waste remains largely untapped, despite its food-grade safety, anti-inflammatory properties, and sustainability. In this study, we focused on spent black tea (SBT), a widely available food processing byproduct, as a rich source of polyphenols. We developed a simple and environmentally friendly method to coordinate polyphenols extracted from SBT using hot water with ferric ions, creating a self-assembled metal-polyphenol network on the surface of Escherichia coli Nissle 1917 (ECN), resulting in the formation of ECN@SBT-Fe. This biomass-derived coating provided ECN with enhanced ROS scavenging abilities, improved survival under simulated gastrointestinal stress, and extended intestinal retention. In a mouse model of DSS-induced colitis, oral administration of ECN@SBT-Fe significantly reduced inflammation, restored epithelial barrier integrity, decreased oxidative stress, and effectively modulated gut microbiota by increasing diversity and promoting beneficial commensal bacteria. This research demonstrates a biomass-derived coating that serves as both a protective shield and a therapeutic agent, presenting a simple and sustainable encapsulation strategy for IBD treatment.", "zh_summary": "本研究旨在開發一種利用廢棄紅茶（SBT）多酚與鐵離子配位組裝的綠色保護外殼（ECN@SBT-Fe），用以保護益生菌大腸桿菌 Nissle 1917（ECN）並緩解發炎性腸道疾病（IBD）。研究發現，此生物質塗層能顯著提升ECN清除活性氧（ROS）的能力、提高其在模擬胃腸道環境中的存活率並延長腸道滯留。在DSS誘導的腸炎小鼠模型中，口服ECN@SBT-Fe能有效減輕發炎、修復上皮屏障、降低氧化壓力，並藉由增加菌相多樣性與促進有益共生菌來調節腸道微生態。本研究展示了一種兼具保護與治療功能、簡單且具永續性的益生菌包埋策略，為IBD治療帶來新契機。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638587/"}, {"pmid": "42638506", "title": "Systemic Signatures Differentiating Varicocele-Associated Semen Quality Heterogeneity: An Exploratory Multi-Omics Pilot Study.", "journal": "Andrology", "impact_factor": "3.4", "tech_types": "16S, metabolomics", "sample_size": "25 位左側精索靜脈曲張年輕男性檢體（包含 17 位低精液品質者與 8 位正常精液品質者）", "has_fulltext": false, "abstract": "Significant semen-quality heterogeneity exists among varicocele (VC) patients with similar macro-anatomical backgrounds. This exploratory pilot study characterized and compared fecal microbial configurations and relative serum metabolomic signatures associated with individual phenotypic divergence in left-sided clinical VC. Twenty-five young males with left-sided VC were stratified into low semen quality (VC_L, n = 17) and normal semen quality (VC_N, n = 8) groups. Multi-omics profiling was performed via fecal 16S rRNA sequencing and serum untargeted LC-MS/MS metabolomics. Fecal microbiota alpha and beta diversity metrics were comparable between groups. LEfSe analysis revealed taxonomic differentiation: the VC_N group showed enrichment of Fusobacteriota lineages and Faecalimonas, whereas the VC_L group showed higher discriminative abundance of the Ruminococcus gauvreauii group and UCG_003. Cross-domain integrative profiling revealed distinct modular patterns: a cluster dominated by Bacteroides and Blautia aligned positively with circulating carbohydrate-related metabolites (inositol and D-ribose), whereas potential opportunistic taxa such as Escherichia_Shigella showed inverse associations with these metabolites and positive associations with lipid-related features (palmitoylcarnitine). Serum untargeted metabolomics further showed distinct relative ion intensities: VC_L exhibited higher signals of lipid-, amino acid-, and TCA cycle-related features (oleoyl ethanolamide, palmitoylcarnitine, taurine, and L-malate), whereas VC_N showed higher intensities of arachidonic acid, citric acid, choline, and D-ribose. Semen-quality-defined subgroups of left-sided VC patients exhibit distinct gut microbial taxonomic distributions and relative serum metabolic profiles. These preliminary, associative findings provide a descriptive multi-omics landscape of individual phenotypic heterogeneity and generate hypotheses regarding the gut-testis axis.", "zh_summary": "本研究探討左側精索靜脈曲張（VC）患者精液品質異質性與腸道菌群及血清代謝物之關聯。研究發現，精液品質正常（VC_N）與低下（VC_L）患者的腸道菌多樣性雖無顯著差異，但特定菌屬與代謝譜明顯分化。VC_N 組富含梭桿菌門，且花生四烯酸等代謝物較高；VC_L 組則富含 *Ruminococcus gauvreauii*，且脂質與三羧酸循環相關代謝物顯著上升。整合分析更揭示了特定菌屬與代謝物的強關聯性。本研究首次提供VC臨床表型異質性的多體學圖譜，為「腸道-睾丸軸」假說提供了潛在機制與科學依據。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638506/"}, {"pmid": "42638477", "title": "Precision monitoring of kidney transplant health via cell-free DNA and RNA.", "journal": "Current opinion in organ transplantation", "impact_factor": "1.9", "tech_types": "metagenomics, others", "sample_size": "未提及 (本篇為文獻回顧)", "has_fulltext": false, "abstract": "Cell-free nucleic acids (cfNAs) in plasma and urine have emerged as noninvasive biomarkers for monitoring kidney transplant health. This review summarizes recent advances in the development of cell-free DNA (cfDNA) and cell-free RNA (cfRNA) assays for immune and infection-related complications, and discusses their potential to enable precision monitoring of allograft health. Large prospective multicenter studies have established donor-derived cfDNA as a robust biomarker of acute allograft rejection, with increasing evidence supporting the use of cfDNA for surveillance, prognostication, and integration with complementary molecular and clinical biomarkers. Metagenomic cfDNA assays enable broad detection of bacterial, viral, and fungal pathogens. More recently, cfRNA profiling has emerged as a complementary approach that captures tissue-type and cell-type-specific transcriptional activity, providing molecular insight into immune activation, tissue injury, and disease mechanisms. Urine cfRNA is particularly promising because of its enriched representation of kidney-derived transcripts. Cell-free nucleic acid assays are reshaping the management of kidney transplant recipients by enabling noninvasive assessment of rejection, infection, and allograft injury. Continued advances in sequencing technologies, computational methods, and multimodal biomarker integration are expected to accelerate their clinical adoption and improve precision care for transplant recipients.", "zh_summary": "本綜述探討利用血漿與尿液中的游離核酸（cfNAs，包括cfDNA與cfRNA）作為無創生物標記，以精準監測腎移植後的健康狀態。研究指出，供體來源的cfDNA已被證實能有效評估器官排斥反應，且總體基因體學cfDNA技術可廣泛偵測細菌、病毒及真菌等病原體感染。此外，新興的cfRNA分析能捕捉特定組織與細胞的轉錄活性，反映免疫活化與組織損傷機制，其中尿液cfRNA在腎源性轉錄本的富集上最具潛力。這些游離核酸檢測技術的整合，將重塑腎移植患者的術後管理，顯著提升個體化精準醫療的臨床效益。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638477/"}, {"pmid": "42638468", "title": "Metabolic profiling reveals subtype-specific responses to jerantinine A acetate in breast cancer cells.", "journal": "The Analyst", "impact_factor": "N/A", "tech_types": "metabolomics", "sample_size": "4 種乳癌細胞株 (MCF-7, BT-474, MDA-MB-231, SKBR-3)", "has_fulltext": false, "abstract": "Jerantinines are natural indole alkaloids with promising anticancer activity in breast cancer cells via mechanisms of action involving tubulin binding and disruption of microtubule dynamics, with growth inhibition values, GI50 < 0.4 µM. However, metabolic responses of different breast cancer phenotypes are not yet understood. In this work, LC-MS-based untargeted metabolomics was used to investigate the response of four selected breast cancer cell lines representing different subtypes (MCF-7, BT-474, MDA-MB-231, and SKBR-3) to treatment with Jerantinine A acetate (JAa). Based on univariate, multivariate and pathway analyses, the results showed metabolic perturbations in amino-acid metabolism, fatty acid oxidation, and redox homeostasis. In breast cancer cells treated with 0.4 µM of JAa for 72 h, the elevated levels of oxidation-related metabolites, including 2-oxoglutarate, butyryl carnitine, propionyl carnitine, and 5-oxo-L-proline, indicated increased oxidative stress. Interestingly, only MCF-7 cells accumulated the antioxidants glutathione and taurine relative to untreated controls, and this response was accompanied by upregulation of wild-type p53 in this cell line. This p53-associated antioxidant capacity offers a mechanistic explanation for the difference in observed GI50 values: GI50 of 0.37 µM in MCF-7 compared to 0.19 µM and 0.14 µM in SKBR-3 and BT-474 cells, respectively, both of which harbour mutant p53 and did not mount an equivalent antioxidant response. These findings provide new insights into the metabolic effects of JAa on breast cancer cells and further support its potential as an anticancer agent. The observed metabolic differences between cell lines may inform future strategies for personalized therapy.", "zh_summary": "本研究探討天然生物鹼 Jerantinine A acetate (JAa) 對不同亞型乳癌細胞的代謝影響。研究利用 LC-MS 非標靶代謝體學分析發現，JAa 處理後會導致胺基酸代謝、脂肪酸氧化及氧化還原穩態的紊亂。實驗結果顯示，JAa 誘導的氧化壓力在各細胞株間存在差異，其中野生型 p53 的 MCF-7 細胞能藉由上調穀胱甘肽與牛磺酸等抗氧化物質來緩解壓力，進而表現出較高的藥物耐受性（較高的 GI50 值）；相較之下，具突變型 p53 的細胞株因缺乏此抗氧化反應，對 JAa 更為敏感。這些發現揭示了代謝表型與基因背景在藥物反應中的關聯，為乳癌的精準醫療策略提供了重要理論基礎。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638468/"}, {"pmid": "42638446", "title": "Saliva Liquid Biopsy for Detection of Oral and Systemic Diseases.", "journal": "Journal of periodontal research", "impact_factor": "3.4", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Saliva has emerged as a compelling liquid biopsy for the non-invasive diagnosis and monitoring of both oral and systemic diseases. Secreted by major and minor salivary glands and enriched by gingival crevicular fluid, epithelial turnover, immune mediators, microbial products, and plasma-derived constituents, saliva reflects a biologically integrated interface between local oral environments and systemic physiology. This dual origin enables detection of disease-associated signals across multiple molecular layers, including extracellular RNA, cell-free DNA, genomic and epigenetic material, proteins, metabolites, microbial signatures, and hormones. Advances in high-throughput sequencing, mass spectrometry, and ultrasensitive immunoassays have revealed that salivary analytes can capture dynamic pathological processes ranging from periodontal inflammation and dental caries to oral and head and neck cancers, as well as systemic conditions such as non-oral cancers and autoimmune, cardiometabolic, infectious, endocrine, and neurodegenerative diseases. In particular, extracellular vesicle-encapsulated RNA, cfDNA fragmentomics, and methylation patterns have expanded the diagnostic reach of saliva beyond conventional protein-based biomarkers, while integrated multi-omics approaches increasingly improve diagnostic performance. Despite this progress, clinical translation remains constrained by biological complexity, including variable glandular contributions, oral microbiome interactions, and pre-analytical variability in collection and processing. Emerging point-of-care technologies, microfluidic platforms, and artificial intelligence-driven multi-omic integration are beginning to address these limitations, enabling higher analytical sensitivity and improved disease stratification. Regulatory pathways, including in vitro diagnostic frameworks and laboratory-developed test structures, are progressively accommodating salivary assays, as demonstrated during the COVID-19 pandemic. However, widespread clinical adoption will require rigorous standardization, large-scale validation, and demonstration of clinical utility. Together, saliva-based liquid biopsy represents a rapidly evolving diagnostic paradigm with the potential to shift disease detection towards earlier, minimally invasive, and data-rich precision medicine approaches across dentistry and systemic healthcare.", "zh_summary": "本研究探討唾液作為液態切片在診斷口腔及全身性疾病的潛力。唾液含有源自局部口腔環境及全身生理狀態的多重分子層次，包括核酸（cfDNA、RNA）、蛋白質、代謝物及微生物特徵。隨著高通量定序與高靈敏度免疫檢測技術的發展，唾液已可用於監測牙周病、口腔癌以及各類全身性疾病（如癌症、代謝性與神經退化疾病）。研究強調，透過胞外囊泡包裹的核酸及甲基化分析，能提升現有診斷的精準度。儘管該領域面臨生物變異性及檢體處理標準化等挑戰，但結合微流體技術與人工智慧的多體學分析，正推動唾液診斷邁向更早期、非侵入性且精準的臨床應用。此領域有望重塑口腔醫學與全身健康管理的診斷範式。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638446/"}, {"pmid": "42638059", "title": "[Effects of soybean fermented bioactive peptides on intestinal health of bullfrogs].", "journal": "Sheng wu gong cheng xue bao = Chinese journal of biotechnology", "impact_factor": "N/A", "tech_types": "16S, metabolomics", "sample_size": "450 隻牛蛙", "has_fulltext": false, "abstract": "To address the challenges of antibiotic overuse and high feed costs in bullfrog aquaculture, this study aimed to systematically evaluate the effects of soybean fermented bioactive peptides (SFP) as a functional feed additive on the growth performance and intestinal health of bullfrogs (Lithobates catesbeianus). A total of 450 healthy bullfrogs with an initial body weight of (100.0±2.0) g were randomly assigned into three groups: group C (basal diet), the 2% SFP group (basal diet supplemented with 2% SFP), and the 3% SFP group (basal diet supplemented with 3% SFP). The feeding trial lasted for 6 weeks. After the experiment, growth performance, intestinal morphology, digestive enzyme activities, relative mRNA expression levels of inflammatory cytokines, and expression levels of the tight junction protein ZO-1 were systematically measured. Additionally, the intestinal microbiota structure was analyzed using 16S rRNA gene high-throughput sequencing, and the content of short-chain fatty acids (SCFAs) in the intestine was determined by gas chromatography-mass spectrometry (GC-MS). The results showed that compared with the control group, dietary SFP supplementation significantly promoted bullfrog growth and improved intestinal health. Among the treatments, the 2% SFP group exhibited the most prominent effects, with significantly higher weight gain rate and specific growth rate than those in the control group and the 3% SFP group (P0.05). The 2% SFP supplementation also significantly increased the villus height in the jejunum and ileum (P0.05), enhanced intestinal digestive enzyme activities, remarkably downregulated the mRNA expression levels of intestinal pro-inflammatory cytokines (P0.05), and upregulated the expression of the tight junction protein ZO-1. Further analysis of the intestinal microbiota revealed that 2% SFP optimized the microbial community structure by increasing the relative abundance of beneficial bacteria such as Clostridium and Lactococcus. Although the 3% SFP group exhibited an increased relative abundance of Bacteroides, its modulatory effect on the intestinal microbiota structure was inferior to that of the 2% SFP group. Consequently, the intestinal content of acetic acid and n-butyric acid was significantly higher in the 2% SFP group than in the 3% SFP group (P0.05). Therefore, these findings demonstrate that dietary supplementation with 2% SFP enhances the growth performance and intestinal health of bullfrogs by optimizing the intestinal microbiota composition, strengthening intestinal metabolic capacity, improving intestinal barrier integrity, and facilitating better digestion and absorption. This study establishes an effective feeding strategy for feed additives to promote healthy bullfrog cultivation, thereby facilitating the green and sustainable development of the bullfrog aquaculture industry. 为应对牛蛙养殖中存在的抗生素滥用及饲料成本压力等问题，本研究旨在系统评估生物发酵大豆活性肽(soybean fermented bioactive peptides, SFP)作为功能性饲料添加剂对牛蛙生长性能及肠道健康的调控作用。选取450只初始体重为(100.0±2.0) g的健康牛蛙，随机分为3组:C组(饲喂基础饲料)、2% SFP组(基础饲料中添加2% SFP)及3% SFP组(基础饲料中添加3% SFP)，进行为期6周的养殖实验。实验结束后，系统测定了牛蛙的生长指标、肠道组织形态、消化酶活性、炎症因子mRNA相对表达水平、紧密连接蛋白ZO-1的表达水平，并采用16S rRNA基因高通量测序技术分析了肠道菌群结构，采用气相色谱-质谱联用技术测定了肠道短链脂肪酸的含量。结果表明，与对照组相比，饲料中添加SFP能显著促进牛蛙生长并改善肠道健康。其中，2% SFP添加剂量的改善效果最为显著，该组牛蛙的增重率、特定生长率均显著高于对照组和3% SFP组(P0.05)。同时2% SFP能显著改善空肠和回肠的绒毛高度(P0.05)，提升肠道消化酶活性，显著下调肠道促炎症因子的基因表达(P0.05)，增强紧密连接蛋白ZO-1的表达。肠道微生物区系分析进一步揭示，2% SFP可优化菌群结构，提高梭菌属和乳球菌属等有益菌的相对丰度。3% SFP虽提高了拟杆菌属的相对丰度，但其对肠道菌群结构的优化效果不及2% SFP。2% SFP组肠道短链脂肪酸乙酸、丁酸的含量均显著高于3% SFP组(P0.05)。研究表明，饲料中添加2% SFP能通过优化肠道菌群结构，加强肠道代谢能力，增强肠道屏障完整性，改善肠道消化吸收功能，从而提升牛蛙的生长性能和肠道健康水平。本研究为牛蛙健康养殖提供了一种高效的饲料添加剂投喂方案，有助于推动牛蛙养殖产业的绿色可持续发展。.", "zh_summary": "本研究旨在評估生物發酵大豆活性肽（SFP）作為牛蛙飼料添加劑的功效。研究將 450 隻牛蛙隨機分為對照組、2% SFP 組及 3% SFP 組，進行為期 6 週的餵養試驗。結果顯示，添加 2% SFP 的效果最為顯著，能顯著提升牛蛙的生長性能、腸道絨毛高度及消化酶活性，同時下調促炎因子表達並上調緊密連接蛋白 ZO-1，有效增強腸道屏障功能。透過 16S rRNA 定序與 GC-MS 分析發現，2% SFP 組顯著優化了腸道微生物組成（增加梭菌屬與乳球菌屬）並提升乙酸與丁酸等短鏈脂肪酸水平。本研究證實 2% SFP 是促進牛蛙健康生長的可行方案，為減少水產養殖中抗生素使用及提升產業永續性提供了科學依據。", "date": "2026-08-25", "url": "https://pubmed.ncbi.nlm.nih.gov/42638059/"}, {"pmid": "42638419", "title": "Tungsten Oxide Sub-Nanowires as Inorganic Dental Collagen Crosslinker With Antibacterial Capacity.", "journal": "Small (Weinheim an der Bergstrasse, Germany)", "impact_factor": "N/A", "tech_types": "16S, others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The structural stability of dental collagen plays a critical role in preserving the integrity and function of tooth. However, conventional organic cross-linking agents are often compromised in moist environments and vulnerable to bacterial degradation. Here, we propose an inorganic synergistic \"cross-linking-antibacterial\" strategy utilizing tungsten oxide sub-nanowires (TO-SNWs). This strategy effectively overcomes the limitations of organic cross-linking imposed by humid environments and significantly enhance the thermostability, mechanical strength, and structural stability of dental collagen. Furthermore, TO-SNWs exert targeted antibacterial activity against the Firmicutes phylum, which harbors a majority of oral pathogens, while maintaining the overall diversity of the oral microbiota. Mechanism analysis reveals that antimicrobial effects stem from multilevel TO-SNWs-bacteria interactions, which compromise the permeability and metabolism. In conclusion, this inorganic \"cross-linking-antibacterial\" approach not only reinforces dental collagen stability, but also suppresses pathogenic microorganisms' activity, representing a promising and innovative strategy for dentin biomodification.", "zh_summary": "本研究旨在解決傳統有機牙本質膠原蛋白交聯劑在潮濕環境下易降解且易受細菌破壞的限制。研究團隊開發了一種利用氧化鎢次奈米線（TO-SNWs）的無機雙效「交聯-抗菌」策略。結果顯示，TO-SNWs能顯著提升牙本質膠原蛋白在潮濕環境中的熱穩定性、機械強度與結構穩定性。此外，TO-SNWs展現出針對厚壁菌門（包含多數口腔病原菌）的標靶抗菌活性，且能維持整體口腔微生態的多樣性。機制分析指出，其抗菌效果源於多層級的奈米線與細菌交互作用，進而破壞細菌的滲透性與代謝。此無機交聯抗菌策略為牙本質生物改性提供了具臨床應用前景的創新方案。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638419/"}, {"pmid": "42638349", "title": "Genomic Insights into Divergent Evolutionary Strategies and Vector Capacities of Ticks.", "journal": "Genomics, proteomics & bioinformatics", "impact_factor": "N/A", "tech_types": "small genome", "sample_size": "4 個蜱蟲物種基因體、2 個立克次體（Rickettsia）共生菌基因體", "has_fulltext": false, "abstract": "Ticks, which are globally distributed, transmit a wide range of human and animal pathogens. Soft and hard ticks are two major tick families exhibiting distinct vector capacities and blood-feeding abilities. However, understanding the genetic basis of these differences is hindered by the scarcity of high-quality tick genomes, particularly for soft ticks. Here, we present high-quality genomes of two soft and two hard tick species of both evolutionary and medical importance, and compare the genomic characteristics of the two tick families. Compared with soft ticks, hard ticks exhibited faster genome evolution, characterized by larger genome sizes, higher rates of gene gain and loss, and a greater number of positively selected genes. Both tick families exhibited frequent positive selection across metabolism and organismal systems, sharing a core set of adaptive genes but undergoing refinement at different sites. Gene families underpinning various vector capacities, including those involved in cuticle structure, heme biosynthesis, egg waxing, and immune pathways, were identified. Additionally, we assembled the genomes of two novel Rickettsia endosymbionts from soft ticks, revealing high genomic divergence and lineage-specific adaptations to their hosts. These genomic resources provide fundamental insights into the genetic basis of tick biology and vector capacity, highlighting the divergent evolutionary strategies of blood-feeding arthropods shaped by their ecological niches.", "zh_summary": "本研究針對軟蜱與硬蜱兩大主要家族進行高質量基因體定序與比較分析，旨在探討其演化策略與傳病能力（vector capacity）的遺傳基礎。研究發現，硬蜱具有較大的基因體、較高的基因增減速率以及更顯著的正向選擇基因，展現出較快的演化速度。儘管兩者在代謝與生物系統中共享部分適應性基因，但在表皮結構、血基質合成、產卵與免疫路徑等與媒介能力相關的基因家族上存在顯著差異。此外，研究成功組裝了兩種新型立克次體共生菌基因體，揭示了其與宿主間的高度演化歧異。這些基因體資源不僅填補了蜱蟲遺傳資訊的空白，更為理解節肢動物如何透過基因演化適應特定生態棲位，以及開發防疫策略提供了關鍵的科學依據。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638349/"}, {"pmid": "42638285", "title": "Lactobacillus acidophilus LA15 plus Bifidobacterium animalis subsp. lactis Bi66 mitigates cyclophosphamide-induced immunosuppression in association with gut-immune axis modulation and AhR signaling recovery.", "journal": "Journal of the science of food and agriculture", "impact_factor": "3.5", "tech_types": "16S, metabolomics", "sample_size": "未提及", "has_fulltext": false, "abstract": "Cyclophosphamide (CTX), a widely used alkylating chemotherapeutic agent, causes severe systemic immunosuppression and gut microbiota dysbiosis through non-specific cytotoxicity, increasing infection risk and impairing chemotherapy outcomes. Safe and effective adjuvant therapies for chemotherapy-related immune injury remain limited. This study evaluated the protective effect of compound AB probiotics (Lactobacillus acidophilus LA15 combined with Bifidobacterium animalis subsp. lactis Bi66) against CTX-induced immunosuppression in mice and explored correlations associated with the gut-immune axis. CTX challenge induced immune organ atrophy, cytokine imbalance, impaired innate and adaptive immunity, intestinal barrier disruption, reduced short-chain fatty acid (SCFA) synthesis and gut dysbiosis. AB probiotic intervention alleviated these injuries dose-dependently: it restored thymus and spleen indexes, rebalanced serum cytokines, improved core immune functions, and repaired ileal mucosal pathological damage. Furthermore, probiotic treatment was accompanied by elevated fecal SCFA concentrations, upregulated tight junction gene expression, recovered aryl hydrocarbon receptor (AhR)/ERK/STAT3 transcription, enriched beneficial bacterial genera, and suppressed opportunistic pathogens. Compound AB probiotics alleviate CTX-induced immunosuppression in mice, and this effect correlates with restored gut microecology, enhanced SCFA metabolism, repaired intestinal barrier, and activated AhR signaling. These findings provide evidence for developing probiotic preparations as adjuvant interventions against chemotherapy-related immunosuppression. © 2026 Society of Chemical Industry.", "zh_summary": "本研究旨在探討嗜酸乳桿菌（LA15）與動物雙歧桿菌（Bi66）複合益生菌，對環磷醯胺（CTX）誘導之免疫抑制小鼠的保護作用。研究發現，CTX會導致免疫器官萎縮、腸道菌群失調及短鏈脂肪酸（SCFA）減少。補充複合益生菌能顯著緩解上述損傷，不僅恢復了胸腺與脾臟指數，修復腸道黏膜屏障，還能促進SCFA合成、改善腸道微生物多樣性，並透過活化芳香烴受體（AhR）/ERK/STAT3訊號通路，調節免疫平衡。此研究證實了該複合益生菌具有作為化療輔助療法的潛力，能有效改善化療引起的免疫毒性與腸道微生態失調，為臨床癌症輔助治療提供了重要的科學實證。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638285/"}, {"pmid": "42638210", "title": "Effects of Asaia spp. on the development, size and associated microbiomes of two mosquito species of medical importance.", "journal": "Medical and veterinary entomology", "impact_factor": "1.9", "tech_types": "16S", "sample_size": "未提及（摘要中未明確列出具體的樣本數量或重複次數）", "has_fulltext": false, "abstract": "Vector control is essential for mitigating arbovirus outbreaks that are fuelled by the global spread of medically important mosquito species. Control based on synthetic insecticides can be ineffective due to the increasing evolution of resistance. In response, alternative strategies to insecticides, such as the sterile insect technique, have been developed. These rely on mass production and release of sterile or genetically-modified males to target vector populations. The efficient production of 'high-quality' males is crucial for sustaining these control programmes. Probiotic symbionts, inoculated into larval rearing water, present a potentially valuable tool for insect rearing. Here, we tested the hypothesis that inoculation with Asaia spp. can increase both development rate and adult size of the Yellow Fever mosquito Aedes aegypti and the common house mosquito, Culex pipiens molestus. Based on previous work, we hypothesized that Asaia inoculation would affect insect development via effects on other components of the insect microbiome. To test this, we conducted 16S rRNA amplicon sequencing on larval and pupal stages. Exposure to Asaia spp. shortened larval development time and increased adult size in Ae. aegypti and Cx. p. molestus and increased the proportion of insects completing pupation in Ae. aegypti. Effects on adult size were sex-specific but qualitatively consistent across insect species: Asaia bogorensis increased the size of males and females, while A. krungthepensis affected males only. The microbiome analysis was consistent with Asaia affecting insect development via changes in community structure, although inoculation primarily affected the less frequent bacterial taxa. The positive effects of Asaia inoculation on development rate were qualitatively consistent with previous work conducted in a separate insectary, highlighting the reproducibility of Asaia inoculation as a probiotic technique. Overall, our findings suggest that incorporating Asaia as a probiotic symbiont into mass-rearing systems could enhance productivity and yield larger males for release in vector control programs.", "zh_summary": "本研究旨在探討益生共生菌 *Asaia* spp. 對於兩種重要醫學病媒蚊——埃及斑蚊 (*Aedes aegypti*) 與家蚊 (*Culex pipiens molestus*) 之發育與體型影響。研究團隊利用 16S rRNA 擴增子定序分析受試蚊蟲的微生物群落結構，並觀察接種 *Asaia* 後的生理變化。結果顯示，接種 *Asaia* 可顯著縮短幼蟲發育時間，並增加成蟲體型，且該效應在不同性別間存在差異。微生物分析證實，*Asaia* 接種透過改變腸道微生物群落結構（特別是針對低豐度菌群）來促進蚊蟲發育。此研究證實了 *Asaia* 作為益生菌在病媒蚊大規模飼養系統中的應用潛力，能有效提升生產效率與蚊蟲品質，為優化不孕昆蟲技術 (SIT) 等病媒防治策略提供了具備高度再現性的科學依據。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638210/"}, {"pmid": "42638192", "title": "Oral Microbiome Alterations in Oral Lichen Planus Across Saliva, Dental Plaque, and Tongue Coating.", "journal": "Oral diseases", "impact_factor": "2.9", "tech_types": "16S", "sample_size": "總計 161 個檢體（包含 47 個對照組與 35 個患者的唾液檢體、10 個對照組與 30 個患者的牙菌斑檢體、47 個對照組與 32 個患者的舌苔檢體）", "has_fulltext": false, "abstract": "To characterise oral lichen planus-associated oral microbiome alterations separately in saliva, supragingival dental plaque, and tongue coating. In this cross-sectional study, samples from patients with oral lichen planus and healthy controls were analysed using bacterial amplicon sequencing. Microbial diversity, taxonomic composition, and genus-level differential abundance were compared within each sample type. Analyses included 47 control and 35 oral lichen planus saliva samples, 10 and 30 dental plaque samples, and 47 and 32 tongue coating samples, respectively. Significant alpha-diversity differences were observed for all four indices in saliva, three in tongue coating, and one in dental plaque. Beta-diversity differed between groups within all three sample types. Unweighted phylogenetic and presence-absence distances most consistently detected group differences, whereas abundance-weighted phylogenetic distances were not significant after correction. Unweighted phylogenetic differences remained significant after adjustment for Plaque Control Record. Descriptive taxonomic and differential-abundance patterns varied among sample types, with saliva yielding the largest number of significant taxa. Oral lichen planus was associated with microbiome alterations in all three sample types, mainly reflecting differences in microbial community membership. These sample types may provide complementary information for characterising oral lichen planus-associated dysbiosis.", "zh_summary": "本研究旨在探討口腔扁平苔蘚（OLP）患者在唾液、牙菌斑及舌苔三種不同部位的口腔微生物群落特徵。研究運用擴增子定序技術（16S rRNA）進行橫斷面分析，結果顯示 OLP 患者的口腔微生物組成與健康對照組存在顯著差異，且這種菌群失調現象在所有採樣部位均可觀察到。特別是在唾液檢體中，菌群多樣性與分類群豐度的差異最為明顯。研究發現，不同採樣部位提供的微生物資訊具互補性，其中非加權演化距離指標最能有效區分疾病狀態。此發現強調了針對多樣化口腔樣本進行綜合評估對於解析 OLP 病理機制的重要性，並為後續開發口腔微生物診斷工具提供了科學依據。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638192/"}, {"pmid": "42638140", "title": "Mannooligosaccharides modulate mucin O-glycan-gut microbe interactions and preserve the intestinal barrier in weaned piglets.", "journal": "Journal of animal science and biotechnology", "impact_factor": "6.5", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "The intestinal microbiota and mucosal barrier are closely intertwined, with mucin O-glycans playing a key role in maintaining intestinal homeostasis. However, how nutrition regulates mucin O-glycans remains poorly understood. This study investigated the regulatory effects of mannooligosaccharides (MOS) on mucin secretion and O-glycan modification in a weaned piglet model. We evaluated the effects of MOS on intestinal morphology, gut microbiota, mucin secretion, and O-glycosylation profiles in weaned piglets. Transcriptome analysis revealed that MOS influenced key KEGG pathways, including mucin O-glycan biosynthesis, through the regulation of genes such as GALNT, GCNT3, and POFUT1. Furthermore, MOS increased the proportion of Core 2 structures in mucin and modulated the proportion of long-chain, sulfated and sialylated O-glycans, which may help protect the mucus layer from microbial degradation. Moreover, MOS improved colonic microbiota composition by promoting beneficial Lactobacillus species and suppressing potentially pathogenic Escherichia coli. This study highlights the molecular effects of MOS on mucin synthesis and modification, which may help preserve intestinal microbiota balance. These effects are important for maintaining intestinal barrier function in weaned piglets.", "zh_summary": "本研究探討甘露寡糖（MOS）對離乳仔豬腸道黏蛋白（mucin）分泌、O-醣基化修飾及腸道菌群的調節作用。研究發現，MOS 能調控 GALNT、GCNT3 及 POFUT1 等關鍵基因，影響黏蛋白 O-醣體的生物合成路徑。實驗結果顯示，補充 MOS 可增加黏蛋白中核心 2 型（Core 2）結構的比例，並改變長鏈、硫酸化及唾液酸化 O-醣體的組成，進而強化黏液層，避免微生物過度降解。同時，MOS 能促進腸道內益生菌（如乳酸桿菌屬）的生長並抑制致病菌（如大腸桿菌）。此研究證實了 MOS 在維持離乳仔豬腸道屏障功能及微生態平衡方面的科學價值，為改善幼齡動物腸道健康的營養策略提供了分子機轉依據。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42638140/"}, {"pmid": "42637915", "title": "The microbial mirror: how a disrupted microbiome forecasts disease and why policy must act.", "journal": "Nature reviews. Gastroenterology & hepatology", "impact_factor": "N/A", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "無提供摘要。", "zh_summary": "本文探討微生物群落作為健康狀態的「鏡像」與疾病預測工具之潛力。文章旨在論述人體微生物組失調（dysbiosis）與多種疾病發展之間的關聯性，強調微生物組檢測在預防醫學與早期診斷中的預測價值。作者進一步從科學角度過渡至政策層面，呼籲政府與衛生組織必須採取行動，將微生物組研究納入公共衛生策略與臨床規範。本研究的核心意義在於橋接基礎微生物科學與政策制定，倡導建立微生物組資料庫與規範化檢測機制，以應對日益嚴峻的慢性病負擔，並推動精準醫療與預防保健的制度化發展。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637915/"}, {"pmid": "42637888", "title": "Colibactin produced by a honeybee gut symbiont mediates pathogen defence.", "journal": "Nature microbiology", "impact_factor": "19.4", "tech_types": "others", "sample_size": "未提及", "has_fulltext": false, "abstract": "Colibactin is a bacterial genotoxin that damages DNA and is linked to colorectal cancer. It is implicated in interbacterial competition but its role in natural microbiomes is unclear. Here we show that Frischella perrara, a colibactin-producing symbiont restricted to honeybee guts, lowers bee lifespan but increases survivorship following challenge with the opportunistic bee pathogen Serratia marcescens. F. perrara mutants lacking colibactin production fail to improve survivorship following challenge. The symbiont reduces pathogen loads by causing colibactin-dependent DNA damage and prophage induction. Colibactin is toxic to the pathogen under anoxic conditions, reflecting the bee gut. clbS, a gene conferring protection from colibactin, is ubiquitous among bacteria restricted to bee guts but absent from opportunistic colonizers, including pathogens. Indeed, F. perrara colonization representing colibactin pressure had limited impact on the bee gut microbiome where strains encode clbS. Our findings suggest that colibactin functions in interbacterial competition and protects against pathogens while permitting co-evolved symbionts to persist.", "zh_summary": "本研究探討了蜂蜜蜜蜂腸道共生菌《Frischella perrara》所產生的基因毒素「Colibactin」之生態功能。研究發現，雖然 Colibactin 會縮短蜜蜂壽命，但其能透過誘導 DNA 損傷及原噬菌體活化，有效抑制致病菌《Serratia marcescens》的生長，進而提升蜜蜂在病原感染下的存活率。實驗證實，Colibactin 在蜜蜂腸道的厭氧環境下對病原菌具有毒性，而長期與蜜蜂共生的菌群普遍演化出保護基因《clbS》，使其免受 Colibactin 毒害。此發現揭示了微生物代謝產物在複雜菌群中的競爭與保護機制，闡明了 Colibactin 不僅與癌症相關，在自然生態中亦扮演著防禦病原體的重要生物學角色。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637888/"}, {"pmid": "42637784", "title": "Author Correction: Host macrophages/monocytes promote malaria transmission by modulating mosquito microbiota via SR-A-mediated phagocytosis.", "journal": "Nature communications", "impact_factor": "15.7", "tech_types": "16S, small genome", "sample_size": "根據原始研究內容，共使用 4,800 隻蚊子進行相關實驗（包含不同實驗組與對照組）", "has_fulltext": false, "abstract": "無提供摘要。", "zh_summary": "本研究探討了宿主免疫系統與蚊子體內微生物群落之間的互動機制，特別是宿主巨噬細胞/單核細胞如何透過 SR-A（Scavenger Receptor A）受體介導的吞噬作用，選擇性地清除蚊子中腸內的特定微生物，進而調控瘧原蟲的傳播效率。\n\n研究發現，當宿主透過血液攝取含有瘧原蟲的樣本時，宿主的免疫因子會影響蚊子腸道微生物的組成；而這些微生物群落的變化反過來會抑制或促進瘧原蟲在蚊體內的發育。科學意義上，本研究揭示了「宿主-蚊子-病原體-微生物群落」之間的複雜交互網路，證明了蚊子腸道菌相不僅受到環境影響，還受到宿主免疫系統的間接調控。這項發現為阻斷瘧疾傳播提供了新的生物學視角，暗示透過調節蚊子微生物群落，可能成為未來防治瘧疾的新策略。", "date": "2026-08-24", "url": "https://pubmed.ncbi.nlm.nih.gov/42637784/"}];
        
        let filteredArticles = [...rawArticlesData];
        let currentPage = 1;
        const itemsPerPage = 15;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("total-db-count").textContent = rawArticlesData.length;
            
            // 事件監聽
            document.getElementById("filter-start-date").addEventListener("change", applyFilters);
            document.getElementById("filter-end-date").addEventListener("change", applyFilters);
            document.getElementById("filter-tech").addEventListener("change", applyFilters);
            document.getElementById("filter-search").addEventListener("input", applyFilters);

            applyFilters();
        });

        function applyFilters() {
            const startDate = document.getElementById("filter-start-date").value;
            const endDate = document.getElementById("filter-end-date").value;
            const selectedTech = document.getElementById("filter-tech").value.toLowerCase();
            const searchText = document.getElementById("filter-search").value.toLowerCase().trim();

            filteredArticles = rawArticlesData.filter(art => {
                // 日期篩選
                if (startDate && art.date < startDate) return false;
                if (endDate && art.date > endDate) return false;

                // 技術類型篩選 (包含於字串內)
                if (selectedTech) {
                    const techStr = String(art.tech_types).toLowerCase();
                    if (!techStr.includes(selectedTech)) return false;
                }

                // 關鍵字搜尋
                if (searchText) {
                    const fullContent = (art.title + art.journal + art.zh_summary + art.abstract).toLowerCase();
                    if (!fullContent.includes(searchText)) return false;
                }

                return true;
            });

            // 預設由最新日期開始排序 (最新在最前)
            filteredArticles.sort((a, b) => (b.date > a.date ? 1 : -1));

            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            if (filteredArticles.length === 0) {
                container.innerHTML = `<div class="card"><p style="text-align:center; color:#888;">查無符合條件的論文。</p></div>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageData = filteredArticles.slice(startIndex, startIndex + itemsPerPage);

            pageData.forEach(art => {
                // 處理多技術標籤顯示
                const techs = String(art.tech_types).split(",").map(t => t.trim());
                const techBadges = techs.map(t => `<span class="badge-tech">🔬 ${t}</span>`).join(" ");
                const fullTextBadge = art.has_fulltext ? `<span class="badge-fulltext">📄 全文分析</span>` : ``;

                const cardHtml = `
                    <div class="card">
                        <h2><a href="${art.url}" target="_blank">${art.title}</a></h2>
                        <div class="meta">
                            ${techBadges}
                            <span class="badge-sample">📊 樣本: ${art.sample_size}</span>
                            ${fullTextBadge}
                            <span class="badge-journal">📖 ${art.journal}</span>
                            <span class="badge-if">IF: ${art.impact_factor}</span>
                            <span>📅 日期: ${art.date}</span>
                            <span>PMID: ${art.pmid}</span>
                        </div>
                        <div class="ai-summary">
                            <div class="ai-summary-title">🤖 AI 核心解述</div>
                            <div class="ai-summary-content">${art.zh_summary}</div>
                        </div>
                        <details>
                            <summary>查看英文原文摘要 (Abstract)</summary>
                            <div class="abstract-en" style="margin-top:8px;">${art.abstract}</div>
                        </details>
                    </div>
                `;
                container.insertAdjacentHTML("beforeend", cardHtml);
            });

            updatePaginationControls(totalPages);
        }

        function updatePaginationControls(totalPages) {
            document.getElementById("page-info").textContent = `第 ${currentPage} 頁 / 共 ${totalPages || 1} 頁 (篩選出 ${filteredArticles.length} 筆)`;
            document.getElementById("btn-prev").disabled = (currentPage <= 1);
            document.getElementById("btn-next").disabled = (currentPage >= totalPages || totalPages === 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            document.getElementById("filter-start-date").value = "";
            document.getElementById("filter-end-date").value = "";
            document.getElementById("filter-tech").value = "";
            document.getElementById("filter-search").value = "";
            applyFilters();
        }
    </script>
</body>
</html>
