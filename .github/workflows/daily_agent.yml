name: Run PubMed Daily Agent

on:
  schedule:
    # 調整為每天 UTC 00:15 執行（台灣時間 08:15），可大幅減少佇列排隊時間
    - cron: '15 0 * * *'
  # 允許在 GitHub 介面上手動按下按鈕觸發執行
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. 下載專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 修正：已縮排對齊 with

      # 2. 安裝 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安裝需要的套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 執行 Python 腳本產生 index.html 與 papers_database.xlsx
      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 5. 一次性提交並推送所有更新檔案 (index.html + papers_database.xlsx)
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 將 index.html 與 Excel 資料庫同時加入暫存區
          git add index.html papers_database.xlsx
          
          # 檢查是否有任何變更，有的話才進行 Commit 與 Push
          if git status --porcelain | grep -E "index.html|papers_database.xlsx"; then
            git commit -m "chore: auto update pubmed report & database [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "✅ 已成功將最新的 index.html 與 papers_database.xlsx 推送至 GitHub！"
          else
            echo "ℹ️ 檔案無任何變化，跳過 Commit。"
          fi
