name: Run PubMed Daily Agent

on:
  schedule:
    # 每天 UTC 時間 00:00 執行（等於台灣時間早上 08:00）
    - cron: '0 0 * * *'
  # 允許在 GitHub 介面上手動按下按鈕觸發執行
  workflow_dispatch: # 支援手動觸發

# 賦予 Actions 修改 Repository 檔案的權限
# permissions:
  # contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # 關鍵：賦予 GitHub Actions 寫入 Git 儲存庫的權限
    permissions:
      contents: write

    steps:
      # 1. 下載專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
        fetch-depth: 0 # 確保抓取完整 Commit 歷史，避免 Git Push 衝突

      # 2. 安裝 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安裝需要的套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 執行 Python 腳本產生 index.html
      - name: Run Python script
        env:
          # 將 GitHub Secrets 帶入環境變數中供 Python 讀取
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 5. 自動將最新的 index.html 提交 (Commit) 並推送 (Push) 回 Git 儲存庫
      # 將產生的 papers_database.xlsx 自動 Commit 並 Push 回 main/master 分支
      - name: Commit and Push index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update pubmed report [skip ci]" && git push)

          if git status --porcelain | grep -q "papers_database.xlsx"; then
            git add papers_database.xlsx
            git commit -m "chore: auto-update papers_database.xlsx [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "✅ 已成功將最新的 papers_database.xlsx 推送至 GitHub！"
          else
            echo "ℹ️ Excel 檔案無變化，跳過 Commit。"  
          fi
