name: Run PubMed Range Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日期 (格式 YYYY/MM/DD)'
        required: true
        default: '2026/01/01'
      end_date:
        description: '結束日期 (格式 YYYY/MM/DD)'
        required: true
        default: '2026/01/31'
      max_fetch:
        description: '最多抓取筆數'
        required: true
        default: '100'

jobs:
  backfill:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 執行補抓歷史資料腳本
      - name: Run Backfill Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          MAX_FETCH: ${{ github.event.inputs.max_fetch }}
        run: |
          python backfill.py

      # 重新執行 main.py 產生包含歷史資料的新 index.html
      - name: Regenerate HTML Website
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 將更新後的 Excel 與 index.html 存回 GitHub
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add index.html papers_database.xlsx
          
          if git status --porcelain | grep -E "index.html|papers_database.xlsx"; then
            git commit -m "chore: backfill pubmed papers (${{ github.event.inputs.start_date }} ~ ${{ github.event.inputs.end_date }}) [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "✅ 歷史資料已成功補抓並推送至 GitHub！"
          else
            echo "ℹ️ 無新資料變動。"
          fi
