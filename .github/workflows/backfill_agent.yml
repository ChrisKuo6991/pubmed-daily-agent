name: Run PubMed Range Backfill

on:
  schedule:
    # 每日 UTC 00:00 (台灣時間 08:00) 自動執行一次
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: '起始日期 (預設 2026/01/01，手動輸入可覆蓋全域設定)'
        required: false
        default: '2026/01/01'
      end_date:
        description: '結束日期 (預設 2026/03/01，手動輸入可覆蓋全域設定)'
        required: false
        default: '2026/03/01'

jobs:
  backfill:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 執行單次 5 天區間的搜尋與進度更新
      - name: Run Backfill Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          python backfill.py

      # 重新執行 main.py 產生包含歷史資料的新 index.html
      - name: Regenerate HTML Website
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 將更新後的 Excel、State 紀錄檔與 index.html 存回 GitHub
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 將紀錄檔 backfill_state.json 一併加入版控
          git add index.html papers_database.xlsx backfill_state.json
          
          if git status --porcelain | grep -E "index.html|papers_database.xlsx|backfill_state.json"; then
            git commit -m "chore: auto backfill pubmed papers progress [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "✅ 歷史資料與進度已成功更新並推送至 GitHub！"
          else
            echo "ℹ️ 無新資料變動。"
          fi
